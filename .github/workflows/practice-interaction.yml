name: Mathematics page family

# The behavioural gates for the Mathematics Practice page family.
#
# Why this workflow exists at all: Stage B shipped a Type workspace whose response payload was provably
# correct — verify-response-store, verify-workbook and verify-corpus-identity were all green — while the
# student could not construct the sentence they intended. An equation went to the end of the page whatever
# the caret was doing, Insert sat below the fold on a 13-inch laptop, and the equation editor could not be
# left by keyboard. None of those are visible to a gate that inspects stored state. So the rendered
# interaction is part of the Practice contract, not a local diagnostic, and it runs here.
#
# verify-type-interaction presses keys and reads focus in a real browser: caret placement, keyboard entry
# and exit, arrow-key ownership, repeated editor use, short-laptop reachability, ARIA naming and state, and
# the isolation of the Type-only CSS. verify-workbook is its companion — the same page family's state,
# layout and modality rules — and runs alongside it.
#
# NOT a required check, on the same reasoning as measure-surface.yml and figure-container.yml: `validate`
# is the only required check and deliberately installs no dependencies, while these need Playwright and a
# real render at several viewports. Making one required is branch protection, which is the maintainer's
# call (CLAUDE.md: ask before changing the CI/auto-merge setup). Until then, a red result here does not
# block merge — read it.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'lesson-studio.html'
      - 'scripts/verify-type-interaction.mjs'
      - 'scripts/verify-workbook.mjs'
      - 'scripts/verify-notes-examples.mjs'
      - 'scripts/verify-composition-grid.mjs'
      - 'scripts/verify-mx-authoring.mjs'
      - 'scripts/verify-quadratics-authoring.mjs'
      - 'scripts/verify-skill-page.mjs'
      - 'docs/atlas/lesson/factorising-skills.app.json'
      - 'docs/atlas/lesson/quadratics.app.json'
      - 'docs/atlas/composition/src/grid.json'
      - 'docs/atlas/composition/src/patterns.json'
      - 'docs/atlas/worked-examples/src/atlas.json'
      - 'tests/visual/lessons/mathematics-shell.json'
      - 'tests/visual/lessons/mathematics-wide-table.json'
      - 'lessons/closing-the-gap-geolearn.json'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mathematics-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # The app's copy of the approved composition numbers against the catalogue that owns them. Reads
      # files only, so it runs before the browser install and fails in seconds when the two have drifted.
      - run: node scripts/verify-composition-grid.mjs
      - run: npx playwright install --with-deps chromium
      # What a student can DO with keyboard, pointer and focus in the rendered page.
      - run: node scripts/verify-type-interaction.mjs
      # The same page family's state, layout, table and Write/Type modality rules.
      - run: node scripts/verify-workbook.mjs
      # Stage C: Notes and Worked Examples are driven by the lesson JSON, and the flat output carries all
      # of it rather than whichever tab was open. Same reasoning — a page that renders is not a page that
      # is data-driven, and only a control that changes the JSON can tell the two apart.
      - run: node scripts/verify-notes-examples.mjs
      # Stage D: the mathematics pages can be AUTHORED, not only rendered — created from the palette,
      # edited through the inspector, exported, reopened from the file and edited again. Every other
      # mathematics gate asserts that authored JSON renders; only this one asserts the JSON can be made.
      - run: node scripts/verify-mx-authoring.mjs
      # Stage 3C: the whole quadratics lesson is REBUILT through the inspector from an empty mathematics
      # lesson — four groups, seven worked examples, nineteen steps, the table of values, both graphs and
      # every piece of explanatory prose — then exported, reopened and edited again. The rebuilt lesson is
      # compared with the committed one twice: structurally, where every tolerated difference is named,
      # and by rendering both and comparing every word, every table cell and every painted path.
      - run: node scripts/verify-quadratics-authoring.mjs
      # Stage 6: a SKILL is one instructional section — notes, video, worked examples and practice on one
      # scrolling surface — and the lesson's `meta.responseMode` decides how a student answers, with no
      # student-facing choice. This gate is the only one that asserts the skill's ORDER and the absence of
      # the response controls on paper; every other mathematics gate reads pages that have neither.
      - run: node scripts/verify-skill-page.mjs
