name: Deploy to GitHub Pages

# Publishes the repo root (the app + lessons/) to GitHub Pages.
# One-time setup: Settings → Pages → Source = GitHub Actions.
#
# Note: PRs are auto-merged by github-actions[bot] (GITHUB_TOKEN), and GitHub does NOT
# fire workflows on GITHUB_TOKEN-driven pushes — so the push trigger below will not run
# on auto-merged commits. Use the workflow_dispatch trigger to publish the current main:
#   gh workflow run "Deploy to GitHub Pages" --ref main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
