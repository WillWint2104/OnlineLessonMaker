const GRAPH_STROKE_TOOLS   = ['pen','highlight','marker','brush','dotted','dashed','eraser'];
const GRAPH_COLORS         = ['#4531d4','#79e6ff','#ffd97d','#ff716c','#b08cff','#5afcd3'];
const GRAPH_SIZE_PRESETS   = ['small','medium','large','custom'];
const GRAPH_SIZE_PX        = { small: 420, medium: 560, large: 760 };
                                   // Round B #6 (CR round-6): sizes raised so
                                   // every preset clears the two-column
                                   // minimum (sidebar 180 + gap 8 + plot 200
                                   // + padding 16 = 404px). Narrower panels
                                   // would let the plot column overflow or
                                   // clip the sidebar on small preset.
const GRAPH_POSITIONS      = ['topLeft','topRight','bottomLeft','bottomRight','center'];
const GRAPH_POINT_STYLES   = ['filled','open','square','triangle'];
                                   // Round B #6a: square + triangle added for
                                   // teacher-chosen marker variety.
const GRAPH_ARC_MODES      = ['standard','twoRays','threePoints'];
                                   // Round B #6g:
                                   // - 'standard'     — single angle from +x axis
                                   // - 'twoRays'      — between two ray angles
                                   // - 'threePoints'  — A-B-C, arc at vertex B
const GRAPH_ARC_STYLES     = ['single','double','triple','hash'];
const GRAPH_QUADRANTS      = ['all','q1','q12','q13','q14','custom'];
const GRAPH_ANGLE_MODES    = ['deg','rad'];
const GRAPH_ASPECTS        = ['stretch','equal'];
const GRAPH_WIDTH_MIN      = 404;   // Round B #6 (CR round-6): matches the
                                    // two-column layout's floor. Anything
                                    // narrower would clip the plot or
                                    // overflow the sidebar.
const GRAPH_WIDTH_MAX      = 1100;  // Round B #6: upper bound raised to give
                                    // headroom for sidebar + plot on a wide
                                    // resize.
const GRAPH_RANGE_MIN      = -1000;
const GRAPH_RANGE_MAX      =  1000;
const GRAPH_GRID_STEP_MIN  = 0.01;
const GRAPH_GRID_STEP_MAX  = 500;

function _defaultGraphPanel(){
  return {
    enabled:        false,
    xMin:           -10,
    xMax:            10,
    yMin:           -10,
    yMax:            10,
    xStep:           1,          // math units between vertical gridlines
    yStep:           1,          // math units between horizontal gridlines
    // Retained gridStep as a back-compat alias; normalize bridges
    // old snapshots (gridStep only) onto the new per-axis xStep/yStep.
    gridStep:        1,
    showGrid:        true,
    showMinorGrid:   true,       // Round B #6e
    showAxes:        true,
    showAxisLabels:  true,
    showLegend:      false,      // Round B #6e — off by default, teacher toggles
    // Per-widget light-mode toggle. Scope is graph only — the rest of
    // the app stays on the dark theme. Applied as a .gp-light class on
    // the runtime panel root; CSS overrides scoped under that class
    // swap surface / text / accent tokens locally (no global theme
    // pollution). Default off; teacher opts in via the STYLE card.
    lightMode:       false,
    quadrant:        'all',      // Round B #6b
    angleMode:       'deg',      // Round B #6e
    aspect:          'stretch',  // Round B #6e — 'equal' locks aspect 1:1
    // PR-6 (feedback #1): teacher-drawn strokes on the graph panel's
    // interior canvas are now persisted as vectors on `strokes`
    // instead of an opaque bitmap. Each stroke is
    // { tool, color, size, points:[[x,y,p],...], w, h } in canvas-
    // pixel coordinates at stroke-time; w/h are captured so a later
    // resize replay can scale the points into the new canvas size.
    // strokes pushed here flow through scheduleAutosave (no
    // skipHistory) so Ctrl+Z walks back one stroke at a time —
    // fixing the "undo doesn't revert the last drawing" bug.
    strokes:         [],
    // Round B #6a — points array expanded to support labels and more styles.
    functions:       [],         // [{id, expr, color, visible, domainMin?, domainMax?, showDerivative?}]
    points:          [],         // [{id, x, y, label, style, color?, showCoords?}]
    showAllCoords:   true,       // Round B #6a — master toggle for coord labels
    arcs:            [],         // Round B #6g — [{id, mode, ...args, radius, style, showMeasure, color, visible}]
    // Calculus readouts (Round B #6c). Kept as a compact sub-object
    // so future calculus extensions (higher derivatives, normal line,
    // area between curves, volume of revolution) can add fields
    // without reshaping the top level.
    calc: {
      integral: null,           // null | { fnId, a, b }  — shaded region + area readout
      tangent:  null            // null | { fnId, x, showAngle }  — tangent line at x
    },
    // Selected points for readouts (Round B #6d). Array of two point
    // ids for distance/midpoint/slope panels. Cleared when points
    // they reference are deleted.
    selectedPointIds: [],
    sizePreset:      'medium',
    customWidthPx:   520,
    position:        'bottomRight',
    sidebarCollapsed: false,    // Round B #6 — sidebar fold state
    // Round B #6 (CR round-6): persisted sentinel that suppresses
    // the first-open sin(x) auto-seed. Set true once the teacher
    // edits the graph in any way (adding or deleting) so an
    // intentionally-empty graph stays empty across reloads.
    seedDismissed:   false,
    // Batch 4E — Coordinate Trace teaching mode. When `enabled` is
    // true, an arrow-key-controlled crosshair cursor on the plot
    // visually decomposes its (x, y) into x-arrow + y-arrow from
    // the origin, with animated draw-out for live demonstration.
    // x/y store the cursor's current math-coord position so the
    // teacher's last cursor location persists across renders within
    // the same session. Reset to origin on widget close.
    coordTrace: {
      enabled: false,
      x: 0,
      y: 0
    },
    /* fix/graph-unit-circle-toggle: bidirectional preset state.
     * unitCircleActive flips when the user toggles the preset on/
     * off. unitCirclePresetIds records the ids of the entries
     * appended on enable so disable can remove them precisely
     * (preserves any user-added entries made between toggles).
     * Both default cleanly on older snapshots — false / empty
     * arrays — so a graph saved before this PR loads as if the
     * preset has never been toggled. */
    unitCircleActive:    false,
    unitCirclePresetIds: { functions: [], points: [], arcs: [] },
    /* feat/graph-point-selection-beta: id of the point selected
     * on the plot, or null. Transient — the normalizer always
     * resets this to null on restore so a stale reference from
     * a prior session can't ride into the new one. */
    selectedPointId:     null
  };
}

/** @type {Object} WIDGET_STATE — master widget configuration */
const WIDGET_STATE = {
  calculator: { enabled: true,  mode: 'basic' },
  coinFlip:   { enabled: true,  showStats: true },
  imagePanel: _defaultImagePanel(),
  graphPanel: _defaultGraphPanel(),
  timer:      { enabled: false },
  // Home for the bespoke host panel's customPosition (wireWidgetDrag
  // writes it under stateKey:'bespoke'). Plain position — rides the
  // main autosave snapshot via the existing Object.assign restore, so
  // no normalizer is needed.
  bespoke:    { enabled: true }
};

function _grClampNum(n, lo, hi, fallback){
  const v = Number(n);
  if(!Number.isFinite(v)) return fallback;
  return Math.max(lo, Math.min(hi, v));
}

function _grValidColor(c){
  return typeof c === 'string' && /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c);
}

function _grNewId(prefix){
  return prefix + '-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e6).toString(36);
}

/* PR-stroke-undo Fix B prerequisite: customPosition validation for
 * normalize*State to pass through. Pre-fix, normalizeGraphPanelState
 * and normalizeImagePanelState dropped cp entirely on every restore
 * — they built `out` from defaults + a whitelist, and cp was never
 * in the whitelist. Effect: dragging graph or image and reloading
 * lost the position (separate pre-existing bug), AND made undo's
 * cp-preservation unreachable (the normalizer wiped it after the
 * preservation ran). Validate cp fields and pass through when
 * plausible so both reload and undo keep the widget where the
 * teacher put it. x/y required numerics; w/h optional numerics.
 * Returns `undefined` for invalid input so the caller can omit the
 * key rather than store a half-valid object. */
function _grValidCustomPosition(raw){
  if(!raw || typeof raw !== 'object') return undefined;
  // CR: Number() coerces '', whitespace strings, false, and null to
  // a finite 0, which would let garbage cp payloads resolve to a
  // real (0,0) position instead of being rejected. Strict pre-check
  // rules those out before Number() sees them.
  const toFinite = v => {
    if(v == null || typeof v === 'boolean') return undefined;
    if(typeof v === 'string' && v.trim() === '') return undefined;
    const n = Number(v);
    return Number.isFinite(n) ? n : undefined;
  };
  const x = toFinite(raw.x);
  const y = toFinite(raw.y);
  if(x === undefined || y === undefined) return undefined;
  const out = { x, y };
  const w = toFinite(raw.w);
  const h = toFinite(raw.h);
  if(w !== undefined && w > 0) out.w = w;
  if(h !== undefined && h > 0) out.h = h;
  return out;
}

/** Normalizes a raw graphPanel object against the current schema.
 *  Clamps viewport bounds, filters invalid functions/points, caps
 *  array lengths, and stamps missing ids. Called from persistence
 *  restore so a tampered or pre-PR snapshot can't inject out-of-
 *  range viewport values, unknown point styles, or huge arrays. */
function normalizeGraphPanelState(raw){
  const d = _defaultGraphPanel();
  if(!raw || typeof raw !== 'object') return d;
  const out = Object.assign({}, d, {
    enabled:        typeof raw.enabled        === 'boolean' ? raw.enabled        : d.enabled,
    showGrid:       typeof raw.showGrid       === 'boolean' ? raw.showGrid       : d.showGrid,
    showMinorGrid:  typeof raw.showMinorGrid  === 'boolean' ? raw.showMinorGrid  : d.showMinorGrid,
    showAxes:       typeof raw.showAxes       === 'boolean' ? raw.showAxes       : d.showAxes,
    showAxisLabels: typeof raw.showAxisLabels === 'boolean' ? raw.showAxisLabels : d.showAxisLabels,
    showLegend:     typeof raw.showLegend     === 'boolean' ? raw.showLegend     : d.showLegend,
    lightMode:      typeof raw.lightMode      === 'boolean' ? raw.lightMode      : d.lightMode,
    showAllCoords:  typeof raw.showAllCoords  === 'boolean' ? raw.showAllCoords  : d.showAllCoords,
    sidebarCollapsed: typeof raw.sidebarCollapsed === 'boolean' ? raw.sidebarCollapsed : d.sidebarCollapsed,
    seedDismissed:  typeof raw.seedDismissed  === 'boolean' ? raw.seedDismissed  : d.seedDismissed,
    /* fix/graph-unit-circle-toggle: normalize the new preset
     * tracking fields. unitCircleActive is a plain boolean.
     * unitCirclePresetIds must be an object with three string-
     * array slots; any malformed input degrades to empty arrays
     * (the preset is not in a known state, but neither path
     * crashes — disable cleanly no-ops, enable freshly seeds). */
    unitCircleActive: typeof raw.unitCircleActive === 'boolean' ? raw.unitCircleActive : d.unitCircleActive,
    unitCirclePresetIds: (function(){
      const r = raw.unitCirclePresetIds;
      if(!r || typeof r !== 'object' || Array.isArray(r)) return { functions: [], points: [], arcs: [] };
      const filterIds = (arr, cap) => Array.isArray(arr)
        ? arr.filter(x => typeof x === 'string' && x.length > 0).slice(0, cap)
        : [];
      return {
        functions: filterIds(r.functions, GRAPH_FUNCTION_LIMIT),
        points:    filterIds(r.points,    GRAPH_POINT_LIMIT),
        arcs:      filterIds(r.arcs,      GRAPH_ARC_LIMIT)
      };
    })(),
    // Batch 4E: coordTrace sub-object. Tolerate missing/malformed
    // raw input — older snapshots predate this field, and a
    // tampered value shouldn't crash the renderer. Position is
    // clamped to the validated viewport AFTER xMin/xMax/yMin/yMax
    // are normalized below, since those bounds aren't known yet
    // at this point in the Object.assign.
    coordTrace: (raw.coordTrace && typeof raw.coordTrace === 'object') ? {
      enabled: typeof raw.coordTrace.enabled === 'boolean' ? raw.coordTrace.enabled : false,
      x: Number.isFinite(Number(raw.coordTrace.x)) ? Number(raw.coordTrace.x) : 0,
      y: Number.isFinite(Number(raw.coordTrace.y)) ? Number(raw.coordTrace.y) : 0,
    } : { enabled: false, x: 0, y: 0 },
    quadrant:    GRAPH_QUADRANTS.includes(raw.quadrant)       ? raw.quadrant    : d.quadrant,
    angleMode:   GRAPH_ANGLE_MODES.includes(raw.angleMode)    ? raw.angleMode   : d.angleMode,
    aspect:      GRAPH_ASPECTS.includes(raw.aspect)           ? raw.aspect      : d.aspect,
    sizePreset:  GRAPH_SIZE_PRESETS.includes(raw.sizePreset)  ? raw.sizePreset  : d.sizePreset,
    position:    GRAPH_POSITIONS.includes(raw.position)       ? raw.position    : d.position
  });
  out.xMin = _grClampNum(raw.xMin, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, d.xMin);
  out.xMax = _grClampNum(raw.xMax, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, d.xMax);
  out.yMin = _grClampNum(raw.yMin, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, d.yMin);
  out.yMax = _grClampNum(raw.yMax, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, d.yMax);
  // Ensure non-empty ranges — flipped or equal bounds fall back to
  // defaults for that axis. Saves downstream code from divide-by-
  // zero on viewport math.
  if(out.xMax <= out.xMin){ out.xMin = d.xMin; out.xMax = d.xMax; }
  if(out.yMax <= out.yMin){ out.yMin = d.yMin; out.yMax = d.yMax; }
  // Now that the viewport is finalized, clamp the coordTrace
  // cursor into bounds. A snapshot saved on a wide viewport that
  // is then resized inward could otherwise carry an out-of-range
  // cursor through to the renderer (defensive clamping there too,
  // but better to normalize at the persistence boundary).
  if(out.coordTrace){
    out.coordTrace.x = Math.max(out.xMin, Math.min(out.xMax, out.coordTrace.x));
    out.coordTrace.y = Math.max(out.yMin, Math.min(out.yMax, out.coordTrace.y));
  }
  // Per-axis steps (Round B #6b). Legacy snapshots only have gridStep;
  // fall through onto both xStep/yStep so older saved graphs still
  // read correctly without manual migration.
  const legacyStep = _grClampNum(raw.gridStep, GRAPH_GRID_STEP_MIN, GRAPH_GRID_STEP_MAX, d.gridStep);
  out.gridStep = legacyStep;
  out.xStep = _grClampNum(raw.xStep, GRAPH_GRID_STEP_MIN, GRAPH_GRID_STEP_MAX, legacyStep);
  out.yStep = _grClampNum(raw.yStep, GRAPH_GRID_STEP_MIN, GRAPH_GRID_STEP_MAX, legacyStep);
  out.customWidthPx = Math.round(_grClampNum(raw.customWidthPx, GRAPH_WIDTH_MIN, GRAPH_WIDTH_MAX, d.customWidthPx));
  // Functions (Round B #6: added domainMin/domainMax + showDerivative fields).
  const fns = Array.isArray(raw.functions) ? raw.functions : [];
  out.functions = [];
  for(const rawEntry of fns){
    if(out.functions.length >= GRAPH_FUNCTION_LIMIT) break;
    // Bare-string form is a still-older legacy shape: `functions: ['x^2']`
    // predating the per-entry object wrapper. The runtime list renderer
    // already has a string-fallback branch (`typeof f === 'string' ? f : …`),
    // so these snapshots used to load and display; we preserve the same
    // tolerance here by lifting the string into a minimal object before
    // the rest of the normalizer runs. Without this, any teacher with a
    // truly ancient lesson file would silently lose their functions on
    // next load.
    const f = (typeof rawEntry === 'string') ? { expr: rawEntry } : rawEntry;
    if(!f || typeof f !== 'object') continue;
    if(typeof f.expr !== 'string' || !f.expr.trim()) continue;
    // Dual-notation support: `raw` is the user's literal typed string
    // (shown in function lists, loaded back into the edit input);
    // `expr` is the stripped RHS the eval path uses. Legacy snapshots
    // predate `raw` — migrate by defaulting it to `expr` so old lessons
    // render identically to what they rendered before this field
    // existed. A legacy `x^2` entry will display as `x^2`; a legacy
    // entry the teacher now edits to `y = x^2` will update `raw` and
    // display as `y = x^2`.
    const expr = f.expr.slice(0, 200);
    const raw  = (typeof f.raw === 'string' && f.raw.trim())
      ? f.raw.slice(0, 200)
      : expr;
    const entry = {
      id:      typeof f.id === 'string' && f.id ? f.id : _grNewId('fn'),
      expr,
      raw,
      color:   _grValidColor(f.color) ? f.color : GRAPH_COLORS[out.functions.length % GRAPH_COLORS.length],
      visible: typeof f.visible === 'boolean' ? f.visible : true,
      showDerivative: typeof f.showDerivative === 'boolean' ? f.showDerivative : false
    };
    // fix/graph-unit-circle-leftover-disk: preserve defensive
    // cleanup marker on restore. Only writes the field when
    // explicitly true so non-preset functions don't gain a
    // falsy marker that pollutes future filter checks.
    if(f.fromUnitCirclePreset === true) entry.fromUnitCirclePreset = true;
    // Domain restriction is optional — only apply if both sides parse
    // as valid numbers and lo < hi. A partial { domainMin: 0 } without
    // a max is dropped silently to avoid half-applied clamps.
    const dMin = _grClampNum(f.domainMin, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    const dMax = _grClampNum(f.domainMax, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    if(dMin !== null && dMax !== null && dMin < dMax){
      entry.domainMin = dMin;
      entry.domainMax = dMax;
    }
    out.functions.push(entry);
  }
  // Points (Round B #6a — added color + showCoords + extra styles)
  const pts = Array.isArray(raw.points) ? raw.points : [];
  out.points = [];
  for(const p of pts){
    if(out.points.length >= GRAPH_POINT_LIMIT) break;
    if(!p || typeof p !== 'object') continue;
    const px = _grClampNum(p.x, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    const py = _grClampNum(p.y, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    if(px === null || py === null) continue;
    const pt = {
      id:         typeof p.id === 'string' && p.id ? p.id : _grNewId('pt'),
      x:          px,
      y:          py,
      label:      typeof p.label === 'string' ? p.label.slice(0, 24) : '',
      style:      GRAPH_POINT_STYLES.includes(p.style) ? p.style : 'filled',
      color:      _grValidColor(p.color) ? p.color : null,
      showCoords: typeof p.showCoords === 'boolean' ? p.showCoords : true
    };
    // fix/graph-unit-circle-leftover-disk: preserve marker.
    if(p.fromUnitCirclePreset === true) pt.fromUnitCirclePreset = true;
    out.points.push(pt);
  }
  // Arcs (Round B #6g)
  const arcs = Array.isArray(raw.arcs) ? raw.arcs : [];
  out.arcs = [];
  for(const a of arcs){
    if(out.arcs.length >= GRAPH_ARC_LIMIT) break;
    if(!a || typeof a !== 'object') continue;
    if(!GRAPH_ARC_MODES.includes(a.mode)) continue;
    const arc = {
      id:          typeof a.id === 'string' && a.id ? a.id : _grNewId('arc'),
      mode:        a.mode,
      style:       GRAPH_ARC_STYLES.includes(a.style) ? a.style : 'single',
      showMeasure: typeof a.showMeasure === 'boolean' ? a.showMeasure : true,
      visible:     typeof a.visible === 'boolean' ? a.visible : true,
      // Batch 3B: default radius bumped from 1.0 → 1.2 so the label
      // inside the sector at 60% radius has more room to breathe at
      // typical graph zoom. Teachers can still shrink individual
      // arcs via manual state edit; the sidebar doesn't expose
      // radius yet.
      radius:      _grClampNum(a.radius, 0.2, GRAPH_RANGE_MAX, 1.2),
      color:       _grValidColor(a.color) ? a.color : GRAPH_COLORS[out.arcs.length % GRAPH_COLORS.length],
      // Batch 3B: direction toggle (standard mode only). 'ccw' =
      // counterclockwise (positive, math-convention default), 'cw' =
      // clockwise (negative). twoRays / threePoints derive direction
      // from the underlying angles/points and ignore this field.
      direction:   (a.direction === 'cw') ? 'cw' : 'ccw'
    };
    // Per-mode args. Validation rejects the whole arc if required
    // args are missing/malformed — prevents a half-configured arc
    // from breaking the renderer.
    //
    // Round B #6g (CR round-4): arc angles are stored as canonical
    // RADIANS. Bounds clamp to ±4π (covers two full revolutions
    // either way, which is the sane upper bound for a teaching
    // demonstration). Legacy snapshots predating this PR may have
    // stored raw-degree values — we can't auto-distinguish a 90°
    // value from a 90rad value (both valid numbers), but 90rad
    // ≈ 14 revolutions which the renderer would collapse via mod
    // anyway. The clamp below simply rejects the pathological
    // extremes rather than silently rewriting legacy data.
    // Batch 3B: raised to ±20 revolutions so teachers can enter
    // angles like 1080° (3 rev) and see them rendered with the
    // spiral-cap-at-2-turns behavior plus numeric label. The old
    // ±4π cap rejected >2 rev outright.
    const ANGLE_BOUND = 40 * Math.PI;
    // Range-CHECK (not clamp) against ±20 rev. _grClampNum saturates
    // to bounds, which would silently rewrite a pre-radian snapshot's
    // degree value like `90` into the cap — the user would see a
    // completely wrong arc. Reject instead so the dropped arc is
    // obvious in the UI list.
    const inAngleRange = v => Number.isFinite(v) && v >= -ANGLE_BOUND && v <= ANGLE_BOUND;
    if(a.mode === 'standard'){
      // Batch 3B: `angle` is now an UNSIGNED MAGNITUDE in radians
      // (always ≥ 0). Direction is carried in arc.direction so the
      // input UI can treat sign as a direction override without
      // losing the user's intended magnitude. Legacy snapshots that
      // stored a signed `angle` are auto-migrated: the negative
      // sign is consumed into direction='cw', magnitude is stored
      // as |angle|. An explicit a.direction in the raw snapshot
      // wins over the sign inference (in case a newer save round-
      // trips through an older reader).
      const angleRaw = Number(a.angle);
      if(!inAngleRange(angleRaw)) continue;
      if(a.direction === 'cw' || a.direction === 'ccw'){
        // Already in new schema — trust direction field, store magnitude.
        arc.angle = Math.abs(angleRaw);
      } else if(angleRaw < 0){
        // Legacy signed angle — migrate sign into direction.
        arc.direction = 'cw';
        arc.angle = Math.abs(angleRaw);
      } else {
        arc.angle = angleRaw;
      }
    } else if(a.mode === 'twoRays'){
      const angleA = Number(a.angleA);
      const angleB = Number(a.angleB);
      if(!inAngleRange(angleA) || !inAngleRange(angleB)) continue;
      arc.angleA = angleA;
      arc.angleB = angleB;
      // Origin for the two rays (default: 0, 0). Useful for arcs at
      // a non-origin vertex, e.g. "angle at intersection of two lines".
      arc.vx = _grClampNum(a.vx, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, 0);
      arc.vy = _grClampNum(a.vy, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, 0);
    } else { // threePoints (A-B-C, arc at B)
      const ax = _grClampNum(a.ax, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      const ay = _grClampNum(a.ay, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      const bx = _grClampNum(a.bx, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      const by = _grClampNum(a.by, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      const cx = _grClampNum(a.cx, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      const cy = _grClampNum(a.cy, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
      if([ax, ay, bx, by, cx, cy].some(v => v === null)) continue;
      arc.ax = ax; arc.ay = ay;
      arc.bx = bx; arc.by = by;
      arc.cx = cx; arc.cy = cy;
    }
    // fix/graph-unit-circle-leftover-disk: preserve marker on
    // restore so the disable filter catches preset arcs even if
    // S.unitCirclePresetIds.arcs drifts.
    if(a.fromUnitCirclePreset === true) arc.fromUnitCirclePreset = true;
    out.arcs.push(arc);
  }
  // Calculus sub-object (Round B #6c)
  const rawCalc = (raw.calc && typeof raw.calc === 'object') ? raw.calc : {};
  out.calc = { integral: null, tangent: null };
  if(rawCalc.integral && typeof rawCalc.integral === 'object'){
    const a = _grClampNum(rawCalc.integral.a, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    const b = _grClampNum(rawCalc.integral.b, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    const fnId = typeof rawCalc.integral.fnId === 'string' ? rawCalc.integral.fnId : null;
    if(a !== null && b !== null && a < b && fnId){
      out.calc.integral = { fnId, a, b };
    }
  }
  if(rawCalc.tangent && typeof rawCalc.tangent === 'object'){
    const tx = _grClampNum(rawCalc.tangent.x, GRAPH_RANGE_MIN, GRAPH_RANGE_MAX, null);
    const fnId = typeof rawCalc.tangent.fnId === 'string' ? rawCalc.tangent.fnId : null;
    if(tx !== null && fnId){
      out.calc.tangent = {
        fnId, x: tx,
        showAngle: typeof rawCalc.tangent.showAngle === 'boolean' ? rawCalc.tangent.showAngle : false
      };
    }
  }
  // Selected points — keep up to two valid ids, drop references to
  // points that aren't in the normalized array.
  const validPointIds = new Set(out.points.map(p => p.id));
  const sel = Array.isArray(raw.selectedPointIds) ? raw.selectedPointIds : [];
  out.selectedPointIds = [];
  for(const id of sel){
    if(out.selectedPointIds.length >= 2) break;
    if(typeof id === 'string' && validPointIds.has(id)){
      out.selectedPointIds.push(id);
    }
  }
  // PR-6 (feedback #1): strokes — per-stroke shape is
  // { tool, color, size, points:[[x,y,p],...], w, h }. Validated
  // defensively so a tampered snapshot (huge points array, unknown
  // tool, NaN coordinates) can't crash the renderer or balloon
  // memory. Capped at GRAPH_STROKE_LIMIT entries with each stroke's
  // point list capped at GRAPH_STROKE_POINT_LIMIT to keep snapshot
  // JSON size bounded — a teacher drawing continuously for 30s at
  // 60Hz would otherwise produce ~1800 points per stroke, which
  // serializes but bloats localStorage. 2000 is well past any
  // useful teaching stroke and strikes a balance with caps.
  const strokes = Array.isArray(raw.strokes) ? raw.strokes : [];
  out.strokes = [];
  for(const s of strokes){
    if(out.strokes.length >= GRAPH_STROKE_LIMIT) break;
    if(!s || typeof s !== 'object') continue;
    if(!GRAPH_STROKE_TOOLS.includes(s.tool)) continue;
    const color = _grValidColor(s.color) ? s.color : '#4531d4';
    const size  = _grClampNum(s.size, 1, 64, 4);
    const w     = _grClampNum(s.w, 1, 4096, 0);
    const h     = _grClampNum(s.h, 1, 4096, 0);
    if(w === 0 || h === 0) continue;
    const rawPts = Array.isArray(s.points) ? s.points : [];
    const pts = [];
    for(const p of rawPts){
      if(pts.length >= GRAPH_STROKE_POINT_LIMIT) break;
      if(!Array.isArray(p) || p.length < 2) continue;
      const x = Number(p[0]);
      const y = Number(p[1]);
      if(!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const pr = Number(p[2]);
      pts.push([x, y, Number.isFinite(pr) && pr > 0 ? Math.min(1, pr) : 0.5]);
    }
    // Zero-point strokes are dropped — a phantom record from a
    // canceled pointerdown shouldn't survive restore.
    if(pts.length === 0) continue;
    out.strokes.push({ tool: s.tool, color, size, points: pts, w, h });
  }
  // Preserve user-dragged customPosition across restore. Pre-fix,
  // the normalize loop built `out` from defaults + a whitelist and
  // cp was never whitelisted, so drags were lost on every reload
  // AND history-undo's cp-preservation was undone by this very
  // function. Validation in _grValidCustomPosition — invalid input
  // (non-finite coords, wrong shape) resolves to undefined so the
  // key is omitted rather than stored half-valid.
  const cp = _grValidCustomPosition(raw.customPosition);
  if(cp) out.customPosition = cp;
  /* feat/graph-point-selection-beta: selection is transient
   * session state. Even if a snapshot has a value, treat it as
   * untrustworthy — the referenced point may have been deleted
   * between sessions. Hard reset to null on every load; the
   * render-init sanitize in applyGraphPanelFromState handles
   * mid-session staleness. */
  out.selectedPointId = null;
  return out;
}

/** Normalizes a raw imagePanel object (e.g. from a restored snapshot)
 *  against the current schema. Fills missing fields with defaults,
 *  clamps numeric ranges, and rejects unknown enum values back to
 *  their defaults. Called from persistence.js after Object.assign so
 *  old snapshots or tampered JSON can't inject surprising values. */
function normalizeImagePanelState(raw){
  const d = _defaultImagePanel();
  if(!raw || typeof raw !== 'object') return d;
  const out = Object.assign({}, d, {
    enabled: typeof raw.enabled === 'boolean' ? raw.enabled : d.enabled,
    assetId: typeof raw.assetId === 'string' && raw.assetId ? raw.assetId : null,
    caption: typeof raw.caption === 'string' ? raw.caption.slice(0, 240) : '',
    captionPosition: IMG_PANEL_CAP_POSITIONS.includes(raw.captionPosition) ? raw.captionPosition : d.captionPosition,
    sizePreset:      IMG_PANEL_SIZE_PRESETS.includes(raw.sizePreset)       ? raw.sizePreset      : d.sizePreset,
    border: typeof raw.border === 'boolean' ? raw.border : d.border,
    shadow: typeof raw.shadow === 'boolean' ? raw.shadow : d.shadow,
    position: IMG_PANEL_POSITIONS.includes(raw.position) ? raw.position : d.position
  });
  const cw = Number(raw.customWidthPx);
  out.customWidthPx = Number.isFinite(cw)
    ? Math.max(IMG_PANEL_WIDTH_MIN, Math.min(IMG_PANEL_WIDTH_MAX, Math.round(cw)))
    : d.customWidthPx;
  const cr = Number(raw.cornerRadius);
  out.cornerRadius = Number.isFinite(cr)
    ? Math.max(IMG_PANEL_RADIUS_MIN, Math.min(IMG_PANEL_RADIUS_MAX, Math.round(cr)))
    : d.cornerRadius;
  // Preserve drag-set customPosition (see graph-normalizer rationale).
  const cp = _grValidCustomPosition(raw.customPosition);
  if(cp) out.customPosition = cp;
  return out;
}

/**
 * Toggle a widget's enabled state and update the runtime launcher.
 * @param {string} key — widget key in WIDGET_STATE (e.g. 'calculator')
 */
function toggleWidget(key){
  if(!WIDGET_STATE[key]) return;
  WIDGET_STATE[key].enabled = !WIDGET_STATE[key].enabled;
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
  // Close open panels when disabling (use same .on class as togCalc/togCoin)
  if(!WIDGET_STATE[key].enabled){
    if(key === 'calculator'){
      document.getElementById('calc-p')?.classList.remove('on');
      document.getElementById('wl-c')?.classList.remove('on');
    }
    if(key === 'coinFlip'){
      document.getElementById('coin-p')?.classList.remove('on');
      document.getElementById('wl-co')?.classList.remove('on');
    }
    if(key === 'imagePanel'){
      document.getElementById('img-p')?.classList.remove('on');
      document.getElementById('wl-img')?.classList.remove('on');
    }
    if(key === 'graphPanel'){
      document.getElementById('graph-p')?.classList.remove('on');
      document.getElementById('wl-graph')?.classList.remove('on');
    }
  }
  updateWidgetLauncher();
}

/** Resets WIDGET_STATE to defaults and syncs both state and live widgets. */
function resetWidgetState(){
  WIDGET_STATE.calculator = { enabled: true, mode: 'basic' };
  WIDGET_STATE.coinFlip   = { enabled: true, showStats: true };
  WIDGET_STATE.imagePanel = _defaultImagePanel();
  WIDGET_STATE.graphPanel = _defaultGraphPanel();
  WIDGET_STATE.timer       = { enabled: false };
  // Push to live runtime widgets — legacy setCalcMode only safe when the
  // legacy basic/sci DOM is still present. Skip it if the ClassWiz UI has
  // replaced the panel, otherwise we'd throw on missing #cm-b / #cg-sci.
  const calcPanel = document.getElementById('calc-p');
  const classWizMounted = !!calcPanel?.querySelector('.calc-wrap');
  if(!classWizMounted && typeof setCalcMode === 'function') setCalcMode('basic');
  // Reset ClassWiz calc state (PR #10). PR-4 (feedback #8): reset to
  // 'home' so "New Session" lands on the mode selector consistently
  // with togCalc's on-open force. Rendering in 'calculate' here
  // would drop a teacher into Calculate mid-reset when their next
  // action (reopening the calc) would send them straight to Home
  // anyway — inconsistent.
  if(typeof CALC_STATE !== 'undefined'){
    CALC_STATE.history = [];
    CALC_STATE.mode = 'home';
    CALC_STATE.current = '';
    CALC_STATE.shift = false;
    CALC_STATE.alpha = false;
    CALC_STATE.angle = 'deg';
    CALC_STATE.fractions = true;
    CALC_STATE.fullscreen = false;
    CALC_STATE.vars = { A:0,B:0,C:0,D:0,E:0,F:0,x:0,y:0,z:0,M:0, Ans:0 };
    if(typeof calcInputClear === 'function') calcInputClear();
    // Exit fullscreen wrapper if it was active
    if(calcPanel) calcPanel.classList.remove('calc-fs-wrap');
    // Re-render if the ClassWiz UI is currently mounted
    if(classWizMounted && typeof calcRenderUI === 'function') calcRenderUI();
  }
  // Reset Statistics and Distribution mode state (PR #11) via the shared
  // helpers in calc-stats.js / calc-dist.js so defaults stay aligned with
  // persistence restore and can't drift between the two paths.
  if(typeof resetCalcStatsState   === 'function') resetCalcStatsState();
  if(typeof resetCalcDistState    === 'function') resetCalcDistState();
  if(typeof resetCalcTableState   === 'function') resetCalcTableState();
  if(typeof resetCalcComplexState === 'function') resetCalcComplexState();
  if(typeof resetCalcVectorState     === 'function') resetCalcVectorState();
  if(typeof resetCalcSheetState      === 'function') resetCalcSheetState();
  if(typeof resetCalcInequalityState === 'function') resetCalcInequalityState();
  // Reset coin flip runtime state
  if(typeof cH !== 'undefined') cH = 0;
  if(typeof cT !== 'undefined') cT = 0;
  const coin = document.getElementById('coin');
  const coinRes = document.getElementById('coin-res');
  const coinStat = document.getElementById('coin-stat');
  if(coin){ coin.className = 'coin h'; coin.textContent = 'H'; }
  if(coinRes) coinRes.textContent = 'HEADS';
  if(coinStat){ coinStat.style.display = ''; coinStat.textContent = 'H: 0 | T: 0'; }
  updateWidgetLauncher();
  renderWidgetsScreen();
}

/**
 * Set calculator default mode and update UI.
 * @param {string} mode — 'basic' or 'sci'
 */
function setWidgetCalcMode(mode){
  const valid = ['basic', 'sci'];
  if(!valid.includes(mode)) return;
  WIDGET_STATE.calculator.mode = mode;
  if(typeof setCalcMode === 'function') setCalcMode(mode);
}

/**
 * Toggle coin flip stats visibility.
 */
function toggleCoinStats(){
  WIDGET_STATE.coinFlip.showStats = !WIDGET_STATE.coinFlip.showStats;
  const stat = document.getElementById('coin-stat');
  if(stat) stat.style.display = WIDGET_STATE.coinFlip.showStats ? '' : 'none';
}

/**
 * Reset coin flip counters.
 */
function resetCoinCounters(){
  if(typeof cH !== 'undefined') cH = 0;
  if(typeof cT !== 'undefined') cT = 0;
  const stat = document.getElementById('coin-stat');
  if(stat) stat.textContent = 'H: 0 | T: 0';
  if(typeof showToast === 'function') showToast('Coin stats reset');
}

/**
 * Sync runtime widget launcher buttons with WIDGET_STATE.
 * Shows/hides calculator and coin flip buttons in the lesson toolbar.
 */
function updateWidgetLauncher(){
  const calcBtn = document.getElementById('wl-c');
  const coinBtn = document.getElementById('wl-co');
  const imgBtn  = document.getElementById('wl-img');
  if(calcBtn) calcBtn.style.display = WIDGET_STATE.calculator.enabled ? '' : 'none';
  if(coinBtn) coinBtn.style.display = WIDGET_STATE.coinFlip.enabled ? '' : 'none';
  if(imgBtn)  imgBtn.style.display  = WIDGET_STATE.imagePanel.enabled ? '' : 'none';
  const graphBtn = document.getElementById('wl-graph');
  if(graphBtn) graphBtn.style.display = WIDGET_STATE.graphPanel.enabled ? '' : 'none';
}

/**
 * Render the widgets screen config panel for a given widget.
 * @param {string} key — widget key
 */
function renderWidgetConfig(key){
  const panel = document.getElementById('widget-config-panel');
  if(!panel) return;

  const configs = {
    calculator: `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(190,255,220,.08);border:1px solid rgba(190,255,220,.11);display:flex;align-items:center;justify-content:center;color:var(--p);font-size:16px;"><span class="ms">calculate</span></div>
        <div><div style="font-family:Manrope,sans-serif;font-weight:800;font-size:13px;">Calculator</div></div>
      </div>
      <div style="margin-bottom:8px;">
        <div style="font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-bottom:4px;">Default Mode</div>
        <div style="display:flex;gap:3px;">
          <button type="button" class="qt-pill${WIDGET_STATE.calculator.mode==='basic'?' on':''}" onclick="setWidgetCalcMode('basic');renderWidgetConfig('calculator')">Basic</button>
          <button type="button" class="qt-pill${WIDGET_STATE.calculator.mode==='sci'?' on':''}" onclick="setWidgetCalcMode('sci');renderWidgetConfig('calculator')">Scientific</button>
        </div>
      </div>`,
    coinFlip: `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(190,255,220,.08);border:1px solid rgba(190,255,220,.11);display:flex;align-items:center;justify-content:center;color:var(--p);font-size:16px;"><span class="ms">casino</span></div>
        <div><div style="font-family:Manrope,sans-serif;font-weight:800;font-size:13px;">Coin Flip</div></div>
      </div>
      <div style="margin-bottom:8px;">
        <div style="font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-bottom:4px;">Show Stats</div>
        <button type="button" class="sw${WIDGET_STATE.coinFlip.showStats?' on':''}" role="switch" aria-checked="${WIDGET_STATE.coinFlip.showStats}" aria-label="Show coin flip stats" onclick="toggleCoinStats();renderWidgetConfig('coinFlip')"><div class="sw-t"></div></button>
      </div>
      <button type="button" class="btn btn-e btn-sm" style="width:100%;justify-content:center;font-size:10px;" onclick="resetCoinCounters()"><span class="ms" style="font-size:10px;">restart_alt</span>Reset Counters</button>`,
    imagePanel: (typeof renderImagePanelConfig === 'function')
      ? renderImagePanelConfig()
      : '<div style="color:var(--fg3);font-size:11px;text-align:center;padding:20px;">Image panel module not loaded</div>',
    graphPanel: (typeof renderGraphPanelConfig === 'function')
      ? renderGraphPanelConfig()
      : '<div style="color:var(--fg3);font-size:11px;text-align:center;padding:20px;">Graph panel module not loaded</div>'
  };

  panel.innerHTML = configs[key] || '<div style="color:var(--fg3);font-size:11px;text-align:center;padding:20px;">Select a widget to configure</div>';
  // Pickers need a post-render pass to wire delegated handlers. Both
  // image + graph wire*Config functions are idempotent (they remove
  // their handlers before re-adding) so repeated renderWidgetConfig
  // calls don't stack listeners.
  if(key === 'imagePanel' && typeof wireImagePanelConfig === 'function') wireImagePanelConfig();
  if(key === 'graphPanel' && typeof wireGraphPanelConfig === 'function') wireGraphPanelConfig();
}

/**
 * Sync widgets screen card states with WIDGET_STATE.
 * Toggles .on class and switch state on each widget card.
 */
function renderWidgetsScreen(){
  const keys = ['calculator','coinFlip','imagePanel','graphPanel','timer'];
  keys.forEach(key => {
    const card = document.getElementById('wc-' + key);
    if(!card) return;
    const enabled = WIDGET_STATE[key]?.enabled;
    card.classList.toggle('on', !!enabled);
    const sw = card.querySelector('.sw');
    if(sw){
      sw.classList.toggle('on', !!enabled);
      if(sw.getAttribute('role') === 'switch') sw.setAttribute('aria-checked', String(!!enabled));
    }
  });
  updateWidgetLauncher();
}

/* ==== src/js/features/graphPanel.js ==== */
/* features/graphPanel.js — Graph Panel widget (PR-Widget-Graph-A)
   A teaching-oriented function plotter. Configure in Widget Studio,
   toggle on during a lesson, drag to reposition. Each panel can
   show up to 6 labeled function curves (y = f(x)) with distinct
   colors, plus up to 12 plotted points with filled (closed-interval)
   or open (open-interval) markers. Axes, gridlines, and axis labels
   are toggled independently.

   Expression handling is done by a SAFE evaluator (no eval()):
   tokenizer → shunting-yard to RPN → reverse-Polish eval per x
   sample. Supported vocabulary:
     - numbers (1, 2.5, .5, 1e-3)
     - variable x
     - constants: pi, e
     - operators: + - * / ^ (and unary minus)
     - functions: sin cos tan asin acos atan sinh cosh tanh
                  log (base-10) ln sqrt cbrt abs exp floor ceil round
                  sign

   Rendering:
     - SVG mounted inside #graph-p, sized from WIDGET_STATE.graphPanel
       .sizePreset / .customWidthPx
     - Grid + axes + axis-tick labels drawn in dim strokes
     - Each function sampled at ~N points across xMin..xMax; the
       polyline has explicit path breaks at asymptotes (detected by
       a large y-jump relative to the viewport height) so 1/x or
       tan(x) don't draw a fake vertical line across discontinuities
     - Points drawn as circles with filled or hollow stroke; label
       text offset to the upper-right of each marker

   Public API:
     togGraph()                 — lesson-screen launcher handler
     applyGraphPanelFromState() — render runtime panel from state
     renderGraphPanelConfig()   — widgets-screen config HTML
     wireGraphPanelConfig()     — attach delegated handlers */

function _gpEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ══════════════════════════════════════════════════════════════
   SAFE MATH EXPRESSION PARSER
   Tokenize → shunting-yard RPN → evaluator.
   Returns { eval: (x) => Number, error: string | null } from
   graphCompile(expr). Invalid operations inside eval() return NaN
   rather than throw — the renderer treats NaN as a path break.
   ══════════════════════════════════════════════════════════════ */

const _GP_FNS = {
  sin:  Math.sin,  cos:  Math.cos,  tan:  Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  log:  Math.log10 || (x => Math.log(x) / Math.LN10),
  ln:   Math.log,
  sqrt: Math.sqrt, cbrt: Math.cbrt || (x => Math.sign(x) * Math.pow(Math.abs(x), 1/3)),
  abs:  Math.abs,  exp:  Math.exp,
  floor:Math.floor,ceil: Math.ceil, round:Math.round,
  sign: Math.sign || (x => x > 0 ? 1 : x < 0 ? -1 : 0)
};

const _GP_CONSTS = { pi: Math.PI, e: Math.E };

const _GP_PREC = { '+':1, '-':1, '*':2, '/':2, 'u-':3, '^':4 };
const _GP_RIGHT_ASSOC = { '^': true, 'u-': true };

/** Unicode→ASCII aliases applied BEFORE whitespace strip + tokenize.
 *  Students paste expressions from PDFs where '-' is rendered as the
 *  Unicode minus (U+2212), '×' / '·' show up instead of '*', etc.
 *  Normalizing these up front turns opaque "unexpected character"
 *  tokenizer errors into working parses. Superscript digits map to
 *  '^2' / '^3' so x² → x^2 follows the same path as the keyboard form.
 *  π stays here as a Unicode alias for the ASCII 'pi' constant — the
 *  tokenizer's identifier branch then resolves it via _GP_CONSTS.
 *  Pre-tokenize string replace is chosen (over extra branches) because
 *  most aliases are single chars mapping to ASCII chars the tokenizer
 *  already handles — the transform is a one-line declarative table. */
const _GP_UNICODE_ALIASES = [
  ['−', '-'],   // U+2212 minus
  ['×', '*'],   // U+00D7 multiplication sign
  ['·', '*'],   // U+00B7 middle dot
  ['÷', '/'],   // U+00F7 division sign
  ['²', '^2'],  // U+00B2 superscript 2
  ['³', '^3'],  // U+00B3 superscript 3
  /* π (U+03C0) is NOT aliased to the string 'pi' — that would make
   * "2πx" normalize to "2pix", and the tokenizer's identifier
   * regex would greedily grab "pix" as one unknown identifier (same
   * case as a teacher typing the ambiguous "pix" directly). Instead
   * π gets a dedicated tokenizer branch that emits a num token with
   * Math.PI, forming a token boundary that lets implicit-mult
   * injection see π as a distinct value. So "2πx" → num(2), num(π),
   * var(x) with implicit '*' between each = 2*pi*x, while "pix"
   * still correctly rejects as unknown. */
];
function _gpUnicodeNormalize(src){
  let out = String(src || '');
  for(const [from, to] of _GP_UNICODE_ALIASES){
    if(out.indexOf(from) !== -1) out = out.split(from).join(to);
  }
  return out;
}

/** Tokenizer. Emits {type, value} tokens. Handles unary minus by
 *  peeking the previous emitted token — if the minus follows an
 *  operator, an open paren, a function, or nothing, it's unary.
 *
 *  Implicit-multiplication injection: before emitting a num, var,
 *  fn, or '(' token, we peek the last emitted token. If it's a
 *  value-type (num, var, or ')'), we synthesize an '*' op token
 *  first. Covers: 3x, 2sin(x), (x+1)(x-1), 3(x+1), x(x+1),
 *  sin(x)cos(x), 3pi. Because the tokenizer classifies identifiers
 *  as fn vs var vs const BEFORE looking at the next char, sin(x)
 *  still emits fn+'(' with no '*' between — the implicit-mult rule
 *  sees prev=fn (not a value) and doesn't inject. No extra
 *  known-function list is needed; _GP_FNS itself is the source of
 *  truth. Whitespace is stripped up front, so "3 x", "3\tx", and
 *  "3x" all take the same adjacency path. */
function _gpTokenize(src){
  const tokens = [];
  const s = _gpUnicodeNormalize(src).replace(/\s+/g, '');
  if(!s) return tokens;
  /* Peek the last emitted token and inject an implicit '*' if the
   * incoming token starts an adjacency. Safe to call before emitting
   * any num/var/fn/'(' — rule degenerates to a no-op at the start of
   * the expression or after an op/',' /'(' /fn. */
  const maybeImplicitMult = () => {
    const prev = tokens[tokens.length - 1];
    if(!prev) return;
    if(prev.type !== 'num' && prev.type !== 'var' && prev.type !== ')') return;
    tokens.push({ type: 'op', value: '*' });
  };
  let i = 0;
  while(i < s.length){
    const c = s[i];
    // Unicode π — dedicated branch so it forms a token boundary
    // (see _GP_UNICODE_ALIASES note above for why it isn't a string
    // alias).
    if(c === 'π'){
      maybeImplicitMult();
      tokens.push({ type: 'num', value: Math.PI });
      i++;
      continue;
    }
    // Number (handles 1, 2.5, .5, 1e-3, 2E+4)
    if(/[0-9.]/.test(c)){
      const m = s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
      if(!m) throw new Error('malformed number at ' + i);
      maybeImplicitMult();
      tokens.push({ type: 'num', value: parseFloat(m[0]) });
      i += m[0].length;
      continue;
    }
    // Identifier (variable / function / constant)
    if(/[A-Za-z_]/.test(c)){
      const m = s.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/);
      const id = m[0];
      i += id.length;
      if(id === 'x' || id === 'X'){
        maybeImplicitMult();
        tokens.push({ type: 'var', value: 'x' });
      } else if(_GP_CONSTS.hasOwnProperty(id)){
        // Constants tokenize as num — the implicit-mult check still
        // runs because prev=num and new=num IS a real adjacency when
        // the "new num" is a const expansion (e.g. 3pi → 3*pi).
        maybeImplicitMult();
        tokens.push({ type: 'num', value: _GP_CONSTS[id] });
      } else if(_GP_FNS.hasOwnProperty(id)){
        maybeImplicitMult();
        tokens.push({ type: 'fn', value: id });
      } else {
        throw new Error('unknown identifier "' + id + '"');
      }
      continue;
    }
    if(c === '('){
      maybeImplicitMult();
      tokens.push({ type: '(', value: '(' });
      i++; continue;
    }
    if(c === ')' || c === ','){
      tokens.push({ type: c, value: c });
      i++; continue;
    }
    if('+-*/^'.indexOf(c) !== -1){
      // Decide unary vs. binary minus by looking at the previous
      // token. Unary minus is allowed at start, after an operator,
      // after a left paren, or after a comma.
      const prev = tokens[tokens.length - 1];
      const prevIsValue = prev && (prev.type === 'num' || prev.type === 'var' || prev.type === ')');
      if(c === '-' && !prevIsValue){
        tokens.push({ type: 'op', value: 'u-' });
      } else {
        tokens.push({ type: 'op', value: c });
      }
      i++; continue;
    }
    throw new Error('unexpected character "' + c + '" at ' + i);
  }
  return tokens;
}

/** Shunting-yard: infix tokens → RPN array. */
function _gpToRPN(tokens){
  const out = [], stack = [];
  for(const t of tokens){
    if(t.type === 'num' || t.type === 'var'){
      out.push(t);
    } else if(t.type === 'fn'){
      stack.push(t);
    } else if(t.type === ','){
      while(stack.length && stack[stack.length - 1].type !== '('){
        out.push(stack.pop());
      }
      if(!stack.length) throw new Error('misplaced comma');
    } else if(t.type === 'op'){
      // Prefix unary minus binds tighter than any binary operator
      // it MIGHT appear between — `x^-2` must compile as
      // `x ^ (-2)`, not `(x ^) -2`. If we let the default
      // precedence-compare loop run, `u-` (prec 3) would pop a
      // previously-pushed `^` (prec 4) from the stack because
      // `4 > 3` triggers the "pop higher precedence" branch —
      // even though `u-` is PREFIX and has no left operand for
      // `^` to bind to. Short-circuit: always push `u-` without
      // popping. The matching pop happens at end-of-expression or
      // at a closing paren, when `u-` (right-associative) is
      // drained correctly.
      if(t.value === 'u-'){
        stack.push(t);
        continue;
      }
      while(stack.length){
        const top = stack[stack.length - 1];
        if(top.type !== 'op' && top.type !== 'fn') break;
        const topP = top.type === 'fn' ? 5 : _GP_PREC[top.value];
        const curP = _GP_PREC[t.value];
        const curRight = !!_GP_RIGHT_ASSOC[t.value];
        if(topP > curP || (topP === curP && !curRight)) out.push(stack.pop());
        else break;
      }
      stack.push(t);
    } else if(t.type === '('){
      stack.push(t);
    } else if(t.type === ')'){
      while(stack.length && stack[stack.length - 1].type !== '('){
        out.push(stack.pop());
      }
      if(!stack.length) throw new Error('unbalanced parentheses');
      stack.pop();  // discard the '('
      if(stack.length && stack[stack.length - 1].type === 'fn'){
        out.push(stack.pop());
      }
    }
  }
  while(stack.length){
    const top = stack.pop();
    if(top.type === '(' || top.type === ')') throw new Error('unbalanced parentheses');
    out.push(top);
  }
  return out;
}

/** Evaluates a compiled RPN against a given x value. Invalid math
 *  (divide by zero, sqrt of negative, etc.) produces NaN which the
 *  renderer turns into a path break. */
function _gpEvalRPN(rpn, x){
  const stack = [];
  for(const t of rpn){
    if(t.type === 'num') stack.push(t.value);
    else if(t.type === 'var') stack.push(x);
    else if(t.type === 'op'){
      if(t.value === 'u-'){ stack.push(-stack.pop()); continue; }
      const b = stack.pop(), a = stack.pop();
      switch(t.value){
        case '+': stack.push(a + b); break;
        case '-': stack.push(a - b); break;
        case '*': stack.push(a * b); break;
        case '/': stack.push(b === 0 ? NaN : a / b); break;
        case '^': stack.push(Math.pow(a, b)); break;
      }
    } else if(t.type === 'fn'){
      const arg = stack.pop();
      stack.push(_GP_FNS[t.value](arg));
    }
  }
  return stack.length === 1 ? stack[0] : NaN;
}

/** Walks the RPN simulating operand-stack depth so malformed
 *  expressions like `2^`, `x+`, `sin()` are rejected at compile
 *  time rather than silently evaluating to NaN at render time.
 *  - values (num, var) push 1
 *  - functions pop 1 and push 1 (all our fns are unary)
 *  - `u-` pops 1 pushes 1
 *  - binary ops pop 2 push 1
 *  - final depth must be exactly 1 for a single-expression result
 *  Any underflow or non-singleton final depth throws. */
function _gpValidateRPN(rpn){
  let depth = 0;
  for(const t of rpn){
    if(t.type === 'num' || t.type === 'var'){
      depth += 1;
    } else if(t.type === 'fn'){
      // Unary function: 1 in / 1 out. Most common underflow case
      // is the empty-call "sin()" — tokenizer produces [fn] with no
      // operand before it. Name the function so the teacher knows
      // which call is missing its argument.
      if(depth < 1) throw new Error('function "' + t.value + '" missing argument');
      // depth unchanged
    } else if(t.type === 'op'){
      if(t.value === 'u-'){
        if(depth < 1) throw new Error("unary '-' missing operand");
        // 1 in / 1 out
      } else {
        if(depth < 2) throw new Error("operator '" + t.value + "' missing operand");
        depth -= 1; // 2 in / 1 out
      }
    }
  }
  // depth 0 at end means we never produced a value (shouldn't happen
  // post-tokenize — empty expression is caught upstream in
  // graphCompile). depth > 1 means stray values with no operator
  // connecting them — rarer with implicit-mult enabled, but still
  // possible if a teacher types something like "3 4" that survives.
  if(depth === 0) throw new Error('empty expression');
  if(depth > 1)  throw new Error('extra operand (missing operator?)');
}

/** Strips a function-definition prefix from the user's typed string,
 *  returning the bare right-hand-side expression that graphCompile can
 *  consume. Accepts any of:
 *    - bare expression       →  x^2
 *    - letter = expression   →  y = x^2,  Y=x^2,  z = p*x,  p=3*x
 *    - letter(x) = expression→  f(x) = sin(x),  g(x)=cos(x),  H(x)=x^2
 *
 *  Any single ASCII letter EXCEPT x is accepted on the LHS, case-insensitive —
 *  teachers use f, g, h, y, z, p, etc. and we'd rather not hand-curate
 *  a whitelist. A malformed LHS like "f x) = x^2" matches neither
 *  regex and falls through to the bare-expression branch, where
 *  graphCompile will reject it naturally.
 *
 *  Explicit x= equations are unsupported: preserve their LHS so graphCompile
 *  can refuse them, rather than silently turning x=2 into the function y=2.
 *  Returns the RHS-only string for supported prefixes, otherwise the trimmed
 *  original input. The caller retains the raw
 *  user input separately (function entries carry both `raw` and `expr`
 *  so display preserves the typed notation). */
function _gpStripFnPrefix(raw){
  if(typeof raw !== 'string') return '';
  if(/^\s*x\s*=/i.test(raw)) return raw.trim();
  // Function notation first — must match before the plainer letter=…
  // rule, which would otherwise swallow the leading letter and leave
  // "(x) = x^2" as the RHS.
  const fn = raw.match(/^\s*[a-zA-Z]\s*\(\s*x\s*\)\s*=\s*(.*)$/i);
  if(fn) return fn[1].trim();
  const eq = raw.match(/^\s*[a-zA-Z]\s*=\s*(.*)$/i);
  if(eq) return eq[1].trim();
  return raw.trim();
}

/** Replaces word-standalone "pi" with the Unicode π character. Runs
 *  as a preprocessing step for strings coming from MathLive's
 *  ASCIIMath export (which serializes \pi as the literal characters
 *  "pi " with a trailing space). Our tokenizer handles π directly
 *  as a num token; by converting to the Unicode form we get correct
 *  implicit-multiplication adjacency ("2π x" → "2*π*x") AND preserve
 *  the unknown-identifier rejection of genuine letter sequences like
 *  "pix" / "pie" — those must stay rejected.
 *
 *  The letter-only lookbehind/ahead is intentional: digits are fine
 *  neighbors for pi (2pi → 2π), only letters on either side trigger
 *  greedy identifier capture that would hide pi's existence.
 *
 *  Introduced for the math-input arc (Batch 2B): MathLive renders
 *  `\pi` as the literal `pi` in ascii-math output, so the tokenizer
 *  would have treated "2pix" as one unknown identifier without this
 *  normalization. */
function _gpPreprocessPi(s){
  if(typeof s !== 'string') return '';
  return s.replace(/(?<![a-zA-Z])pi(?![a-zA-Z])/g, 'π');
}

/** Derives a parser-consumable expression from a string that is
 *  ALREADY in plain-text or ASCIIMath form. For inputs authored via
 *  MathLive, the caller is expected to convert LaTeX → ASCIIMath
 *  using the live math-field's getValue('ascii-math') before calling
 *  this helper — a transient unmounted MathfieldElement can't do the
 *  conversion reliably (MathLive's parser initializes lazily and
 *  getValue returns incomplete output on unmounted instances).
 *
 *  Pipeline: ASCIIMath-or-plain-text → preprocessPi → stripFnPrefix
 *  → expr that the existing parser can tokenize.
 *
 *  For legacy entries predating MathLive (plain text stored as raw),
 *  this is identical to the pre-2C behavior. For MathLive-authored
 *  entries, the caller handles the LaTeX → ASCIIMath step. */
function _gpExprFromRaw(raw){
  if(typeof raw !== 'string' || !raw.trim()) return '';
  return _gpStripFnPrefix(_gpPreprocessPi(raw));
}

/** Reads the parser-consumable expression from a math-field element.
 *  Calls getValue('ascii-math') on the live mounted element, then
 *  routes through the preprocess pipeline. Used by the input-change
 *  handlers (authoring-config edit + runtime add) so LaTeX authored
 *  via MathLive evaluates correctly end-to-end.
 *
 *  Falls back to plain-text reads when the element isn't a math-field
 *  (defensive — during a MathLive-failed-to-load scenario the old
 *  <input type="text"> path still produces a usable raw string). */
function _gpReadExprFromField(el){
  if(!el) return '';
  if(typeof el.getValue === 'function'){
    try {
      const ascii = el.getValue('ascii-math');
      return _gpStripFnPrefix(_gpPreprocessPi(String(ascii || '')));
    } catch(_){ /* fall through to plain-text read */ }
  }
  return _gpExprFromRaw(String(el.value || ''));
}

/** Wrap an angle difference into (-PI, PI] in CONSTANT TIME.
 *
 *  The obvious `while(d > PI) d -= 2*PI` is unbounded work on a large input and
 *  does not terminate at all once one ULP exceeds 2*PI — around 1e18, which a
 *  plain number input reaches easily. Callers should still reject absurd
 *  magnitudes; this makes the wrap itself safe regardless. */
function _gpWrapPi(d){
  if(!Number.isFinite(d)) return NaN;
  const TWO = 2 * Math.PI;
  const w = d - TWO * Math.round(d / TWO);
  /* Math.round is half-away-from-zero, so w lands in [-PI, PI]; the contract
     is (-PI, PI], which matters only on the exact boundary. */
  return w <= -Math.PI ? w + TWO : w;
}

/* ── intersections of plotted functions ───────────────────────────────────
 *
 * WHY THIS EXISTS AT ALL, and why it is this small. The Angle Arcs card can
 * now place an arc at an arbitrary vertex, and the vertex a teacher actually
 * wants is almost always where two plotted lines cross — which on real
 * examples is a coordinate like (7/3, 5/3). Typing that by hand mid-recording
 * is the thing the "Use an intersection" control exists to remove.
 *
 * Graph Panel had NO intersection calculation of any kind before this: no
 * solver, no root finder, nothing. So this is written from scratch, and it is
 * deliberately NUMERIC rather than symbolic. It reuses `graphCompile` — the
 * same evaluator the plotter uses, so an intersection is found on exactly the
 * function that was drawn — samples the difference of two functions across the
 * visible window, brackets each sign change and bisects it. That is the whole
 * algorithm. It is not, and must not grow into, a computer algebra system.
 *
 * WHAT IT REFUSES, because a wrong vertex is worse than no vertex:
 *   - a pole is not a root. 1/x and 0 change sign across x = 0 and never meet;
 *     the bisection converges on the pole, where |f - g| is enormous rather
 *     than tiny, and the residual test below throws it out.
 *   - two copies of the same function meet everywhere, so "the intersection"
 *     is meaningless. Detected and reported, never returned as a point.
 *   - a crossing outside the visible window is not offered, because the
 *     teacher cannot see it to confirm it.
 *   - a tangency with no sign change is NOT found, and that is a stated
 *     limitation rather than a silent approximation.
 *
 * COST: functions are capped at GRAPH_FUNCTION_LIMIT (6), so at most 15 pairs,
 * each sampled GP_INTERSECT_SAMPLES times — about 12k evaluations of an
 * already-compiled RPN expression, once, on a button press. */

const GP_INTERSECT_SAMPLES = 800;   // matches the plotter's own sample ceiling
const GP_INTERSECT_BISECT  = 80;    // bisection steps: far past double precision
const GP_INTERSECT_MAX     = 24;    // cap on how many are offered at once

/** Every crossing of the visible plotted functions inside the visible window.
 *
 *  @param {object} S the graphPanel state
 *  @returns {{points: Array<{x:number,y:number,a:string,b:string}>, notes: string[]}}
 *    `points` are exact enough to use as an arc vertex; `notes` explain what
 *    was deliberately not returned, and are meant to be SHOWN, not swallowed. */
function _gpIntersections(S){
  const notes = [];
  const points = [];
  /* THE SAME PREDICATE THE RENDERER USES, character for character. `_gpBuildSvg`
     skips on `if(!f.visible) continue`, i.e. TRUTHY-visible; this read
     `f.visible !== false`, which additionally admits `visible: undefined`. A
     function in that state would have contributed intersections while not being
     drawn at all.

     It is not reachable today — both runtime pushes set `visible: true` and the
     normalizer coerces it to a boolean (widgetState.js:368) — so this is a
     latent divergence rather than a live defect. It is fixed anyway because two
     predicates for one concept is exactly what drifts, and `test/
     graphPanelIntersections.test.js` now pins the two together so a third
     writer cannot reopen the gap. Raised in review on #236; the first fix took
     only the domain half of that finding. */
  const fns = (S.functions || []).filter(f => f && f.visible && !f.error && f.expr);
  if(fns.length < 2){
    notes.push(fns.length === 1
      ? 'Only one function is plotted — an intersection needs two.'
      : 'No functions are plotted.');
    return { points, notes };
  }
  const xMin = S.xMin, xMax = S.xMax, yMin = S.yMin, yMax = S.yMax;
  if(!(xMax > xMin) || !(yMax > yMin)){
    notes.push('The viewing window has no extent.');
    return { points, notes };
  }
  const compiled = fns.map(f => {
    const c = graphCompile(f.expr);
    return c.error ? null : c;
  });
  /* A scale for "is this residual actually zero". Absolute epsilons are wrong
     here: y values on a teaching plot range over orders of magnitude, so the
     test is relative to the window's own height. */
  const yScale = Math.abs(yMax - yMin);
  const RESIDUAL = yScale * 1e-6;
  const span = xMax - xMin;

  for(let i = 0; i < fns.length; i++){
    for(let j = i + 1; j < fns.length; j++){
      const ci = compiled[i], cj = compiled[j];
      if(!ci || !cj) continue;
      const h = (x) => ci.eval(x) - cj.eval(x);
      const label = (f) => String(f.expr);

      /* ONLY WHERE BOTH ARE ACTUALLY DRAWN. A function may carry
         domainMin/domainMax, and `_gpBuildSvg` clips its curve to them — so
         sampling the whole viewport can offer a crossing at an x where one of
         the two curves is not on screen at all. The teacher would be asked to
         confirm a point on a line that visibly stops before it. Raised in
         review on #236. */
      const lo = Math.max(xMin,
        Number.isFinite(fns[i].domainMin) ? fns[i].domainMin : xMin,
        Number.isFinite(fns[j].domainMin) ? fns[j].domainMin : xMin);
      const hi = Math.min(xMax,
        Number.isFinite(fns[i].domainMax) ? fns[i].domainMax : xMax,
        Number.isFinite(fns[j].domainMax) ? fns[j].domainMax : xMax);
      if(!(hi > lo)) continue;
      const pairSpan = hi - lo;

      /* Sample once, then work from the samples. */
      const xs = [], hs = [];
      for(let k = 0; k <= GP_INTERSECT_SAMPLES; k++){
        const x = lo + (k / GP_INTERSECT_SAMPLES) * pairSpan;
        xs.push(x); hs.push(h(x));
      }
      const finite = hs.filter(v => Number.isFinite(v));
      if(!finite.length) continue;
      const zeroAt = hs.map(v => Number.isFinite(v) && Math.abs(v) <= RESIDUAL);

      /* COINCIDENT, WHOLLY OR IN PART. The first version only caught FULL
         coincidence across the window, and partial overlap was the worse case:
         `abs(x)` and `x` agree for every x >= 0, so half the samples had
         h === 0 exactly, each one sat 0.025 apart — far beyond the duplicate
         threshold — and each became its own "crossing". Measured: 24 points at
         (0,0), (0.025,0.025), ... filling GP_INTERSECT_MAX, whereupon the outer
         loops broke and the real crossing at (1, 3) was never offered at all.
         A teacher plotting a modulus function lost every genuine intersection
         on the graph and was handed two dozen fabricated ones.

         So a RUN of adjacent zero samples is an overlapping SEGMENT, not a list
         of crossings: it is reported and its samples are skipped. An isolated
         zero sample is still a real touching crossing and is kept. Raised in
         review on #236. */
      const inRun = hs.map(() => false);
      let runs = 0;
      for(let k = 0; k <= GP_INTERSECT_SAMPLES; k++){
        if(!zeroAt[k]) continue;
        let e = k;
        while(e + 1 <= GP_INTERSECT_SAMPLES && zeroAt[e + 1]) e++;
        if(e > k){ for(let q = k; q <= e; q++) inRun[q] = true; runs++; }
        k = e;
      }
      if(runs){
        const whole = zeroAt.every((z, k) => z || !Number.isFinite(hs[k]));
        notes.push('y = ' + label(fns[i]) + ' and y = ' + label(fns[j])
          + (whole ? ' are the same line here, so they have no single intersection.'
                   : ' overlap along a whole segment here, so that stretch has no single intersection.'));
        if(whole) continue;
      }

      let found = 0;
      for(let k = 1; k <= GP_INTERSECT_SAMPLES; k++){
        const h0 = hs[k - 1], h1 = hs[k];
        if(!Number.isFinite(h0) || !Number.isFinite(h1)) continue;
        if(inRun[k - 1] || inRun[k]) continue;   /* inside an overlapping segment */
        /* An exact zero at a sample is a crossing in its own right. */
        let xr = null;
        if(h0 === 0) xr = xs[k - 1];
        else if(h1 === 0) xr = xs[k];
        else if((h0 < 0) !== (h1 < 0)){
          let lo = xs[k - 1], hi = xs[k], flo = h0;
          for(let b = 0; b < GP_INTERSECT_BISECT; b++){
            const mid = (lo + hi) / 2;
            const fm = h(mid);
            if(!Number.isFinite(fm)) break;
            if((fm < 0) === (flo < 0)){ lo = mid; flo = fm; } else { hi = mid; }
          }
          xr = (lo + hi) / 2;
        }
        if(xr === null) continue;

        /* A POLE IS NOT A ROOT. The sign changed, so the bracket looked like a
           crossing; if the functions genuinely meet there the difference is
           tiny, and if it is an asymptote it is enormous. This is the whole
           guard against offering a vertex where nothing intersects. */
        const resid = h(xr);
        if(!Number.isFinite(resid) || Math.abs(resid) > RESIDUAL) continue;
        const yr = ci.eval(xr);
        if(!Number.isFinite(yr)) continue;
        /* Offered only if the teacher can see it. */
        if(xr < xMin || xr > xMax || yr < yMin || yr > yMax) continue;
        /* Two functions can be sampled into the same crossing twice near a
           tangency; one point per location. */
        const dup = points.some(pt => Math.abs(pt.x - xr) < pairSpan * 1e-9
                                   && Math.abs(pt.y - yr) < yScale * 1e-9);
        if(dup) continue;
        points.push({ x: xr, y: yr, a: label(fns[i]), b: label(fns[j]) });
        found++;
        if(points.length >= GP_INTERSECT_MAX) break;
      }
      if(!found && !runs && !notes.length && fns.length === 2){
        notes.push('y = ' + label(fns[i]) + ' and y = ' + label(fns[j])
          + ' do not cross inside the current window.');
      }
      if(points.length >= GP_INTERSECT_MAX) break;
    }
    if(points.length >= GP_INTERSECT_MAX) break;
  }
  points.sort((p, q) => p.x - q.x || p.y - q.y);
  return { points, notes };
}

/** Compiles an expression string into a {eval(x)} function. Returns
 *  { eval, error } where error is a human-readable parse-failure
 *  message or null on success. */
function graphCompile(expr){
  try {
    if(/^\s*x\s*=/i.test(expr)){
      throw new Error('Unsupported equation: x=... cannot be plotted. Enter y=... or a bare expression.');
    }
    const tokens = _gpTokenize(expr);
    if(!tokens.length) return { eval: () => NaN, error: 'empty expression' };
    const rpn = _gpToRPN(tokens);
    _gpValidateRPN(rpn);
    return { eval: x => _gpEvalRPN(rpn, x), error: null };
  } catch(e){
    return { eval: () => NaN, error: e.message || String(e) };
  }
}

/** Stable, whitespace-free error ID, including for imported function IDs. */
function _gpFnErrorId(id){
  return 'gp-fn-err-' + Array.from(String(id), c => c.codePointAt(0).toString(16)).join('-');
}

        <div><div style="font-family:Manrope,sans-serif;font-weight:800;font-size:13px;">Graph Panel</div></div>

/* ── Wire config-panel interactions ──────────────────────────── */

function wireGraphPanelConfig(){
  const panel = document.getElementById('widget-config-panel');
  if(!panel) return;
  // Idempotent — same guard pattern as imagePanel.
  panel.removeEventListener('click',  _gpConfigClick);
  panel.removeEventListener('input',  _gpConfigInput);
  panel.removeEventListener('change', _gpConfigChange);
  panel.addEventListener('click',     _gpConfigClick);
  panel.addEventListener('input',     _gpConfigInput);
  panel.addEventListener('change',    _gpConfigChange);
}

function _gpConfigClick(ev){
  if(!WIDGET_STATE || !WIDGET_STATE.graphPanel) return;
  const S = WIDGET_STATE.graphPanel;

  // Add function
  if(ev.target.closest('#gp-fn-add')){
    if(S.functions.length >= GRAPH_FUNCTION_LIMIT) return;
    // Pick from the theme-appropriate palette so new functions are
    // readable against the current plot backdrop. _gpRtPalette(S)
    // returns dark-palette or light-palette based on S.lightMode.
    const pal = _gpRtPalette(S);
    const color = pal[S.functions.length % pal.length];
    S.functions.push({ id: _grNewId('fn'), expr: 'x', raw: 'x', color, visible: true });
    return _gpAfterChange({ label: 'add-graph-function' });
  }
  // Add point
  if(ev.target.closest('#gp-pt-add')){
    if(S.points.length >= GRAPH_POINT_LIMIT) return;
    S.points.push({ id: _grNewId('pt'), x: 0, y: 0, label: '', style: 'filled' });
    return _gpAfterChange({ label: 'add-graph-point' });
  }
  // Remove function
  const rmFn = ev.target.closest('[data-gp-fn-remove]');
  if(rmFn){
    const id = rmFn.dataset.gpFnRemove;
    S.functions = S.functions.filter(f => f.id !== id);
    return _gpAfterChange({ label: 'delete-graph-function' });
  }
  // Toggle function visibility
  const vis = ev.target.closest('[data-gp-fn-visible]');
  if(vis){
    const id = vis.dataset.gpFnVisible;
    const fn = S.functions.find(f => f.id === id);
    if(fn){ fn.visible = !fn.visible; _gpAfterChange({ label: 'toggle-function-visibility' }); }
    return;
  }
  // Remove point
  const rmPt = ev.target.closest('[data-gp-pt-remove]');
  if(rmPt){
    const id = rmPt.dataset.gpPtRemove;
    S.points = S.points.filter(p => p.id !== id);
    return _gpAfterChange();
  }
  // Toggle point style (filled / open)
  const ps = ev.target.closest('[data-gp-pt-style]');
  if(ps){
    const id = ps.dataset.gpPtStyle;
    const pt = S.points.find(p => p.id === id);
    if(pt){ pt.style = pt.style === 'filled' ? 'open' : 'filled'; _gpAfterChange({ label: 'toggle-point-style' }); }
    return;
  }
  // Boolean toggles (grid / axes / labels)
  const tog = ev.target.closest('[data-gp-toggle]');
  if(tog){
    const f = tog.dataset.gpToggle;
    if(f === 'showGrid' || f === 'showAxes' || f === 'showAxisLabels'){
      S[f] = !S[f];
      _gpAfterChange();
    }
    return;
  }
  // Size preset
  const sz = ev.target.closest('[data-gp-size]');
  if(sz){
    S.sizePreset = sz.dataset.gpSize;
    return _gpAfterChange();
  }
  // Position preset
  const pos = ev.target.closest('[data-gp-position]');
  if(pos){
    S.position = pos.dataset.gpPosition;
    return _gpAfterChange();
  }
  /* feat/graph-point-selection-beta: sidebar row click selects
   * the point. Placed last so all specific data-attr handlers
   * (× remove, style toggle, visibility, swatch, etc.) fire
   * via their own early-returns first. Only triggers when the
   * click landed in row chrome (label cell, idx cell, etc.) —
   * not on an interactive control inside the row. */
  const ptRow = ev.target.closest('.gp-pt-row');
  if(ptRow && !ev.target.closest('button, input, math-field, [data-gp-pt-remove], [data-gp-pt-style]')){
    const id = ptRow.getAttribute('data-gp-pt-id');
    if(id && id !== S.selectedPointId){
      S.selectedPointId = id;
      _gpAfterChange({ selection: true });    // selecting a row is not an edit
    }
  }
}

/** Apply authoring edits and refresh validation without replacing the focused field. */
function _gpConfigInput(ev){
  if(!WIDGET_STATE || !WIDGET_STATE.graphPanel) return;
  const S = WIDGET_STATE.graphPanel;
  const t = ev.target;
  if(!t) return;
  // Viewport numeric inputs — clamp but keep in-range edits live.
  const numId = { 'gp-xmin':'xMin', 'gp-xmax':'xMax', 'gp-ymin':'yMin', 'gp-ymax':'yMax', 'gp-gridstep':'gridStep' }[t.id];
  if(numId){
    const v = parseFloat(t.value);
    if(Number.isFinite(v)){
      if(numId === 'gridStep'){
        // The widgets-screen config exposes only a single gridStep
        // control, but the renderer reads S.xStep / S.yStep
        // per-axis. Mirror the gridStep edit into both axis keys
        // so the authoring panel still drives what's drawn. The
        // runtime sidebar's per-axis xStep/yStep inputs take
        // precedence once the teacher diverges them.
        const clamped = Math.max(GRAPH_GRID_STEP_MIN, Math.min(GRAPH_GRID_STEP_MAX, v));
        S.gridStep = clamped;
        S.xStep = clamped;
        S.yStep = clamped;
      }
      else S[numId] = Math.max(GRAPH_RANGE_MIN, Math.min(GRAPH_RANGE_MAX, v));
      _gpAfterChange({ skipReRender: true, continuous: true });
    }
    return;
  }
  if(t.id === 'gp-width-input'){
    const v = parseInt(t.value, 10);
    if(Number.isFinite(v)){
      S.customWidthPx = Math.max(GRAPH_WIDTH_MIN, Math.min(GRAPH_WIDTH_MAX, v));
      const lbl = document.getElementById('gp-width-val');
      if(lbl) lbl.textContent = S.customWidthPx + 'px';
      _gpAfterChange({ skipReRender: true, continuous: true });
    }
    return;
  }
  // Function expression — update WITHOUT re-rendering the config UI
  // so the input keeps focus and the caret position mid-typing.
  // Batch 2C: t may be either <math-field> (canonical) or a legacy
  // <input>. raw stores LaTeX (canonical form for display + edit);
  // expr derives from the live math-field's ASCIIMath export via
  // _gpReadExprFromField so the existing parser continues to consume
  // a bare expression.
  const expr = t.dataset.gpFnExpr;
  if(expr){
    const fn = S.functions.find(f => f.id === expr);
    if(fn){
      let raw;
      if(typeof t.getValue === 'function'){
        try { raw = String(t.getValue('latex') || '').slice(0, 200); }
        catch(_){ raw = String(t.value || '').slice(0, 200); }
      } else {
        raw = String(t.value || '').slice(0, 200);
      }
      fn.raw  = raw;
      // Read expr via the live math-field (it does the LaTeX →
      // ASCIIMath conversion internally). Falls back to the plain-
      // text path when `t` isn't a math-field.
      fn.expr = _gpReadExprFromField(t).slice(0, 200);
      // This path deliberately keeps the field mounted while typing. Refresh
      // its existing inline validation without replacing it (and its caret).
      const row = t.closest('.gp-fn-row');
      if(row){
        const error = graphCompile(fn.expr).error;
        const errId = _gpFnErrorId(fn.id);
        row.classList.toggle('gp-fn-err', !!error);
        t.setAttribute('aria-invalid', String(!!error));
        if(error){
          t.setAttribute('data-gp-fn-err', '1');
          t.setAttribute('aria-errormessage', errId);
        } else {
          t.removeAttribute('data-gp-fn-err');
          t.removeAttribute('aria-errormessage');
        }
        let message = row.querySelector('.gp-fn-err-msg');
        if(error){
          if(!message){
            message = document.createElement('div');
            message.className = 'gp-fn-err-msg';
            message.setAttribute('role', 'status');
            message.id = errId;
            row.appendChild(message);
          }
          if(message.textContent !== error) message.textContent = error;
        } else if(message) message.remove();
      }
      _gpAfterChange({ skipReRender: true, continuous: true });
    }
    return;
  }
  // Point coordinates / label
  if(t.dataset.gpPtX || t.dataset.gpPtY || t.dataset.gpPtLabel){
    const id = t.dataset.gpPtX || t.dataset.gpPtY || t.dataset.gpPtLabel;
    const pt = S.points.find(p => p.id === id);
    if(!pt) return;
    if(t.dataset.gpPtX){
      const v = parseFloat(t.value);
      if(Number.isFinite(v)) pt.x = Math.max(GRAPH_RANGE_MIN, Math.min(GRAPH_RANGE_MAX, v));
    } else if(t.dataset.gpPtY){
      const v = parseFloat(t.value);
      if(Number.isFinite(v)) pt.y = Math.max(GRAPH_RANGE_MIN, Math.min(GRAPH_RANGE_MAX, v));
    } else if(t.dataset.gpPtLabel){
      pt.label = String(t.value || '').slice(0, 24);
    }
    _gpAfterChange({ skipReRender: true, continuous: true });
    return;
  }
}

// 'change' fires on commit (blur, Enter) — use it to normalize any
// invalid/empty values and do the full config-UI re-render then.
function _gpConfigChange(ev){
  if(!WIDGET_STATE || !WIDGET_STATE.graphPanel) return;
  const t = ev.target;
  if(!t) return;
  const numId = { 'gp-xmin':'xMin', 'gp-xmax':'xMax', 'gp-ymin':'yMin', 'gp-ymax':'yMax', 'gp-gridstep':'gridStep' }[t.id];
  if(numId){
    const S = WIDGET_STATE.graphPanel;
    // If someone typed a flipped range, swap on commit.
    if(S.xMax <= S.xMin){ const d = _defaultGraphPanel(); S.xMin = d.xMin; S.xMax = d.xMax; }
    if(S.yMax <= S.yMin){ const d = _defaultGraphPanel(); S.yMin = d.yMin; S.yMax = d.yMax; }
    // continuous: the blur/Enter tail of the typing _gpConfigInput was tracking.
    // A discrete entry here would duplicate the state that burst already holds
    // and leave a Ctrl+Z press that does nothing.
    _gpAfterChange({ continuous: true });
    return;
  }
  // Point coordinate commit — rerender so an invalid/empty edit
  // snaps the DOM input back to the stored numeric value. The
  // input handler's clamping logic only writes pt.x/pt.y when
  // parseFloat succeeds, so without a commit-time rerender the
