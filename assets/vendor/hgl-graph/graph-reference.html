  const pickEl = addRow.querySelector('.gp-arc-pick');
  /* A REFUSAL THE TEACHER CAN SEE. Every rejection below goes through here.
     The old add silently `return`ed on a non-numeric angle, which on camera is
     indistinguishable from a dead button — and for the two new modes the
     degenerate cases (a zero-length ray, three points that are not an angle)
     are easy to enter by accident and impossible to diagnose from a plot where
     nothing appeared. */
  const showErr = (m) => { errEl.textContent = m; errEl.hidden = false; };
  const clearErr = () => { errEl.textContent = ''; errEl.hidden = true; };
  const syncMode = () => {
    const m = readAddMode();
    addRow.querySelectorAll('.gp-arc-mode-btn').forEach(btn => {
      const on = btn.getAttribute('data-arc-mode') === m;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-checked', String(on));
    });
    addRow.querySelectorAll('[data-arc-fields]').forEach(el => {
      el.hidden = el.getAttribute('data-arc-fields') !== m;
    });
    pickEl.hidden = true;
    clearErr();
  };
  addRow.querySelectorAll('.gp-arc-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => { writeAddMode(btn.getAttribute('data-arc-mode')); syncMode(); });
  });
  addRow.querySelectorAll('.gp-arc-style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      writeAddStyle(btn.getAttribute('data-arc-style'));
      addRow.querySelectorAll('.gp-arc-style-btn').forEach(o => {
        const on = o.getAttribute('data-arc-style') === readAddStyle();
        o.classList.toggle('on', on); o.setAttribute('aria-checked', String(on));
      });
    });
  });
  const measureBtn = addRow.querySelector('.gp-arc-measure-btn');
  measureBtn.addEventListener('click', () => {
    writeAddMeasure(!readAddMeasure());
    measureBtn.classList.toggle('on', readAddMeasure());
    measureBtn.setAttribute('aria-pressed', String(readAddMeasure()));
  });

  /* ── "Use an intersection" ───────────────────────────────────────────────
     Reads the crossings of the plotted functions and writes ONE of them into
     whichever vertex fields the current mode uses. It changes no function and
     no arc: it fills two number inputs, and the teacher still presses +.
     Full double precision goes into the field — the whole point is that
     (7/3, 5/3) does not have to be typed or rounded. */
  const vertexFields = () => (readAddMode() === 'threePoints'
    ? [addRow.querySelector('.gp-arc-bx'), addRow.querySelector('.gp-arc-by')]
    : [addRow.querySelector('.gp-arc-vx'), addRow.querySelector('.gp-arc-vy')]);
  const useIntersection = (pt) => {
    const [fx, fy] = vertexFields();
    if(fx) fx.value = String(pt.x);
    if(fy) fy.value = String(pt.y);
    pickEl.hidden = true;
    clearErr();
  };
  addRow.querySelectorAll('.gp-arc-useint').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = _gpIntersections(S);
      pickEl.textContent = '';
      if(!found.points.length){
        pickEl.hidden = true;
        /* NEVER a nearby approximation. If there is nothing to offer, the
           reason is shown and the fields are left exactly as they were. */
        showErr(found.notes.length ? found.notes.join(' ')
          : 'No intersection of the plotted functions is visible in this window.');
        return;
      }
      clearErr();
      if(found.points.length === 1){ useIntersection(found.points[0]); return; }
      /* MORE THAN ONE, so the teacher chooses rather than the code guessing.
         Each button names the coordinate and the two functions it came from. */
      found.points.forEach((pt) => {
        const b2 = document.createElement('button');
        b2.type = 'button';
        b2.className = 'gp-arc-pick-btn';
        b2.textContent = '(' + _gpFmtNum(pt.x) + ', ' + _gpFmtNum(pt.y) + ')';
        b2.title = 'y = ' + pt.a + '  and  y = ' + pt.b;
        b2.setAttribute('aria-label', 'Use the intersection at ' + _gpFmtNum(pt.x) + ', ' + _gpFmtNum(pt.y));
        b2.addEventListener('click', () => useIntersection(pt));
        pickEl.appendChild(b2);
      });
      if(found.notes.length) showErr(found.notes.join(' '));
      pickEl.hidden = false;
    });
  });

  /* The angle unit the two new modes' ray fields are typed in follows the
     panel, exactly as the Standard angle box does. */
  const toRad = (v) => (S.angleMode === 'rad' ? v : v * Math.PI / 180);
  const fieldNum = (cls) => {
    const el = addRow.querySelector(cls);
    if(!el) return NaN;
    const t = String(el.value).trim();
    return t === '' ? NaN : Number(t);
  };
  const clearFields = () => {
    addRow.querySelectorAll('.gp-arc-n').forEach(el => { el.value = ''; });
  };
  const commonProps = () => ({
    radius: 1.2, style: readAddStyle(), showMeasure: readAddMeasure(), visible: true,
    color: _gpRtPalette(S)[S.arcs.length % _gpRtPalette(S).length],
  });

  const pushTwoRays = () => {
    const vx = fieldNum('.gp-arc-vx'), vy = fieldNum('.gp-arc-vy');
    const r1 = fieldNum('.gp-arc-ray1'), r2 = fieldNum('.gp-arc-ray2');
    if(![vx, vy, r1, r2].every(Number.isFinite)){
      showErr('Two rays needs a vertex and both ray directions.'); return false;
    }
    const a1 = toRad(r1), a2 = toRad(r2);
    /* BOUNDED BEFORE ANYTHING WRAPS IT, and this is a hang rather than a
       cosmetic guard. These fields are unbounded number inputs, and the wrap
       below used to be `while(d > PI) d -= 2*PI`. At 1e20 degrees d is about
       1.7e18, where one ULP is 256 — larger than 2*PI — so the subtraction
       does not change the double and the loop CANNOT terminate. Measured: at
       1e20 the value was unchanged after the first iteration; at 1e17 it was
       still unwrapped after five million. Either freezes the tab mid-lesson.
       The ±40π ceiling is the normalizer's own (widgetState.js), so an angle
       this path accepts is one a saved graph would also accept. Raised in
       review on #236. */
    const ANGLE_BOUND = 40 * Math.PI;
    if(Math.abs(a1) > ANGLE_BOUND || Math.abs(a2) > ANGLE_BOUND){
      showErr('Ray directions must be within ' + (S.angleMode === 'rad' ? '\u00b1' + (40 * Math.PI).toFixed(0) + ' rad' : '\u00b17200\u00b0') + '.');
      return false;
    }
    /* DEGENERATE: the same ray twice, or two rays 180 apart, is not an angle
       the renderer can draw a sector for. Refused rather than drawn as a
       zero-width or straight sliver the teacher would have to notice.
       Wrapped in CONSTANT TIME — no loop to not terminate. */
    const d = _gpWrapPi(a2 - a1);
    if(Math.abs(d) < 1e-9){
      showErr('Both rays point the same way, so there is no angle between them.'); return false;
    }
    S.arcs.push(Object.assign({
      id: _grNewId('arc'), mode: 'twoRays', vx, vy, angleA: a1, angleB: a2,
    }, commonProps()));
    return true;
  };

  const pushThreePoints = () => {
    const ax = fieldNum('.gp-arc-ax'), ay = fieldNum('.gp-arc-ay');
    const bx = fieldNum('.gp-arc-bx'), by = fieldNum('.gp-arc-by');
    const cx = fieldNum('.gp-arc-cx'), cy = fieldNum('.gp-arc-cy');
    if(![ax, ay, bx, by, cx, cy].every(Number.isFinite)){
      showErr('Three points needs all six coordinates. B is the vertex.'); return false;
    }
    /* DEGENERATE: a ray of zero length has no direction, so atan2 would return
       0 and the arc would be drawn from an angle nobody asked for. */
    if(ax === bx && ay === by){
      showErr('A is the same point as B, so there is no first ray.'); return false;
    }
    if(cx === bx && cy === by){
      showErr('C is the same point as B, so there is no second ray.'); return false;
    }
    /* atan2 is already in (-PI, PI], so this pair cannot reach the unbounded
       case above — the shared helper is used anyway so there is one wrap. */
    const a1 = Math.atan2(ay - by, ax - bx), a2 = Math.atan2(cy - by, cx - bx);
    const d = _gpWrapPi(a2 - a1);
    if(Math.abs(d) < 1e-9){
      showErr('A and C lie in the same direction from B, so there is no angle at B.'); return false;
    }
    S.arcs.push(Object.assign({
      id: _grNewId('arc'), mode: 'threePoints', ax, ay, bx, by, cx, cy,
    }, commonProps()));
    return true;
  };

  const pushArc = () => {
    clearErr();
    if(!Array.isArray(S.arcs)) S.arcs = [];
    if(S.arcs.length >= GRAPH_ARC_LIMIT){
      showErr('This graph already has the maximum of ' + GRAPH_ARC_LIMIT + ' angle arcs.');
      return;
    }
    const mode = readAddMode();
    if(mode === 'twoRays'){ if(pushTwoRays()){ clearFields(); _gpAfterChange(); } return; }
    if(mode === 'threePoints'){ if(pushThreePoints()){ clearFields(); _gpAfterChange(); } return; }
    const userVal = parseFloat(addRow.querySelector('.gp-arc-angle').value);
    if(!Number.isFinite(userVal)){ showErr('Enter an angle.'); return; }
    // Convert to canonical radians (see comment on round B #6g —
    // storage is always radians, display unit is per-panel).
    let valRad = S.angleMode === 'rad' ? userVal : userVal * Math.PI / 180;
    // Sign-wins direction override: a negative number always means
    // clockwise, regardless of which pill is currently lit. Teachers
    // who type "-45" mean clockwise 45° — not "the opposite of
    // whatever the pill says". Pill updates to reflect the stored
    // direction so subsequent unsigned inputs behave predictably.
    let direction = readAddDir();
    if(valRad < 0){
      direction = 'cw';
      valRad = Math.abs(valRad);
      writeAddDir('cw');
      renderAddDir();
    }
    // Match the normalizer's ±20-rev bound. Magnitude only, since
    // direction is carried separately now.
    const ANGLE_BOUND = 40 * Math.PI;
    if(valRad > ANGLE_BOUND){
      showErr('That angle is larger than this graph can draw.');
      return;
    }
    S.arcs.push(Object.assign({
      id: _grNewId('arc'), mode: 'standard', angle: valRad, direction,
    }, commonProps()));
    addRow.querySelector('.gp-arc-angle').value = '';
    _gpAfterChange();
  };
  addRow.querySelector('.gp-arc-addbtn').addEventListener('click', pushArc);
  // Enter triggers pushArc only when the focused element is the
  // angle input itself. Previously bound on the whole addRow, so
  // pressing Enter on a focused direction pill would commit a
  // probably-empty add. Scoped via target check so the pill's
  // native Enter-to-click behavior still toggles direction.
  addRow.addEventListener('keydown', ev => {
    if(ev.key !== 'Enter') return;
    if(!ev.target || !ev.target.classList || !ev.target.classList.contains('gp-arc-angle')) return;
    ev.preventDefault();
    pushArc();
  });
  body.appendChild(addRow);
  body.addEventListener('click', ev => {
    /* EDITING AN ARC THAT ALREADY EXISTS. Style cycles through the four the
       renderer supports; measure toggles. Both go through _gpAfterChange so
       they undo and persist exactly like every other arc edit. */
    const st = ev.target.closest('.gp-arc-row-style');
    if(st){
      const i = parseInt(st.dataset.idx, 10);
      const arc = Array.isArray(S.arcs) ? S.arcs[i] : null;
      if(arc){
        const at = GRAPH_ARC_STYLES.indexOf(arc.style);
        arc.style = GRAPH_ARC_STYLES[(at < 0 ? 0 : at + 1) % GRAPH_ARC_STYLES.length];
        _gpAfterChange({ label: 'graph-arc-style' });
      }
      return;
    }
    const ms = ev.target.closest('.gp-arc-row-measure');
    if(ms){
      const i = parseInt(ms.dataset.idx, 10);
      const arc = Array.isArray(S.arcs) ? S.arcs[i] : null;
      if(arc){
        arc.showMeasure = arc.showMeasure === false;
        _gpAfterChange({ label: 'graph-arc-measure' });
      }
      return;
    }
    const del = ev.target.closest('.gp-arc-del');
    if(del){
      const i = parseInt(del.dataset.idx, 10);
      if(Number.isFinite(i) && Array.isArray(S.arcs)){ S.arcs.splice(i, 1); _gpAfterChange({ label: 'delete-graph-arc' }); }
      return;
    }
    // Per-row direction toggle — flip direction on the targeted arc.
    const dirBtn = ev.target.closest('.gp-arc-dir-btn');
    if(dirBtn && dirBtn.hasAttribute('data-arc-dir')){
      const i = parseInt(dirBtn.dataset.idx, 10);
      const nextDir = (dirBtn.getAttribute('data-arc-dir') === 'cw') ? 'cw' : 'ccw';
      if(Number.isFinite(i) && Array.isArray(S.arcs) && S.arcs[i]){
        S.arcs[i].direction = nextDir;
        _gpAfterChange();
      }
    }
  });
  return card;
}

function _gpBuildViewportCard(S){
  const { card, body } = _gpMakeCard({
    id: 'gp-vp-card', icon: 'crop_free', title: 'Viewport',
    collapsed: _gpResolveCardCollapsed(S, 'gp-vp-card', true)
  });
  // Range inputs.
  const range = document.createElement('div');
  range.className = 'gp-card-grid gp-vp-range';
  range.innerHTML = `
    <label>x min<input type="number" data-k="xMin" value="${S.xMin}"></label>
    <label>x max<input type="number" data-k="xMax" value="${S.xMax}"></label>
    <label>y min<input type="number" data-k="yMin" value="${S.yMin}"></label>
    <label>y max<input type="number" data-k="yMax" value="${S.yMax}"></label>
    <label>x step<input type="number" data-k="xStep" value="${S.xStep}" min="0.01" step="0.1"></label>
    <label>y step<input type="number" data-k="yStep" value="${S.yStep}" min="0.01" step="0.1"></label>`;
  body.appendChild(range);
  range.addEventListener('change', ev => {
    const inp = ev.target;
    if(inp.tagName !== 'INPUT' || !inp.dataset.k) return;
    const v = parseFloat(inp.value);
    const key = inp.dataset.k;
    if(!Number.isFinite(v)){
      // Invalid edit (empty field, text, NaN). Restore the visible
      // input to the stored value so the user sees the correct
      // state instead of an empty box diverging from what the
      // renderer will actually use.
      inp.value = String(S[key]);
      return;
    }
    // Step keys clamp to the grid-step range; everything else
    // (xMin/xMax/yMin/yMax) clamps to the coordinate range.
    if(key === 'xStep' || key === 'yStep'){
      const lo = (typeof GRAPH_GRID_STEP_MIN === 'number') ? GRAPH_GRID_STEP_MIN : 0.01;
      const hi = (typeof GRAPH_GRID_STEP_MAX === 'number') ? GRAPH_GRID_STEP_MAX : 500;
      S[key] = Math.max(lo, Math.min(hi, v));
      // Keep legacy gridStep in sync with the runtime per-axis step
      // so the widgets-screen config UI (which still exposes only a
      // single gridStep field) doesn't display a stale value.
      // Mirrors the mirror-down direction in _gpConfigInput above.
      // When xStep === yStep, gridStep tracks them. When diverged
      // (teacher set xStep=0.5 yStep=1), gridStep shows whichever
      // axis was touched most recently — no perfect answer there,
      // but tracking the most recent edit is the least surprising.
      S.gridStep = S[key];
    } else {
      const lo = (typeof GRAPH_RANGE_MIN === 'number') ? GRAPH_RANGE_MIN : -1000;
      const hi = (typeof GRAPH_RANGE_MAX === 'number') ? GRAPH_RANGE_MAX :  1000;
      S[key] = Math.max(lo, Math.min(hi, v));
      // Self-heal flipped/zero-width viewport ranges so the user
      // doesn't drop _gpBuildSvg into its "invalid viewport" fallback
      // while mid-edit. Reset the full pair to defaults rather than
      // auto-swapping so the teacher sees a clean known state
      // instead of silently-reordered inputs.
      const d = (typeof _defaultGraphPanel === 'function') ? _defaultGraphPanel() : {
        xMin:-10, xMax:10, yMin:-10, yMax:10
      };
      if(S.xMax <= S.xMin){ S.xMin = d.xMin; S.xMax = d.xMax; }
      if(S.yMax <= S.yMin){ S.yMin = d.yMin; S.yMax = d.yMax; }
    }
    _gpAfterChange();
  });
  // Quadrant dropdown.
  const qRow = document.createElement('label');
  qRow.className = 'gp-card-row';
  qRow.innerHTML = `<span>Quadrant</span>
    <select class="gp-vp-quadrant">
      <option value="all">All quadrants</option>
      <option value="q1">Q1 only</option>
      <option value="q12">Q1 + Q2 (y ≥ 0)</option>
      <option value="q14">Q1 + Q4 (x ≥ 0)</option>
      <option value="q13">Q1 + Q3 (diagonal)</option>
      <option value="custom">Custom</option>
    </select>`;
  qRow.querySelector('select').value = S.quadrant || 'all';
  qRow.querySelector('select').addEventListener('change', e => {
    const q = e.target.value;
    S.quadrant = q;
    // Preset-to-viewport mapping. 'custom' leaves user range alone.
    if(q === 'all')       { S.xMin = -10; S.xMax = 10; S.yMin = -10; S.yMax = 10; }
    else if(q === 'q1')   { S.xMin =   0; S.xMax = 10; S.yMin =   0; S.yMax = 10; }
    else if(q === 'q12')  { S.xMin = -10; S.xMax = 10; S.yMin =   0; S.yMax = 10; }
    else if(q === 'q14')  { S.xMin =   0; S.xMax = 10; S.yMin = -10; S.yMax = 10; }
    else if(q === 'q13')  { S.xMin = -10; S.xMax = 10; S.yMin = -10; S.yMax = 10; }
    _gpAfterChange();
  });
  body.appendChild(qRow);
  // Angle mode + aspect ratio toggles.
  const modeRow = document.createElement('div');
  modeRow.className = 'gp-card-row gp-card-pills';
  modeRow.innerHTML = `
    <span>Angle</span>
    <button type="button" class="gp-pill${S.angleMode === 'deg' ? ' on' : ''}" data-angle="deg">deg</button>
    <button type="button" class="gp-pill${S.angleMode === 'rad' ? ' on' : ''}" data-angle="rad">rad</button>
    <span class="gp-pill-spacer">·</span>
    <span>Aspect</span>
    <button type="button" class="gp-pill${S.aspect === 'stretch' ? ' on' : ''}" data-aspect="stretch">auto</button>
    <button type="button" class="gp-pill${S.aspect === 'equal' ? ' on' : ''}" data-aspect="equal">equal</button>`;
  modeRow.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-angle], button[data-aspect]');
    if(!btn) return;
    if(btn.dataset.angle) S.angleMode = btn.dataset.angle;
    if(btn.dataset.aspect) S.aspect   = btn.dataset.aspect;
    _gpAfterChange();
  });
  body.appendChild(modeRow);
  // Grid / minor / axes / labels toggles.
  const togRow = document.createElement('div');
  togRow.className = 'gp-card-row gp-card-toggles';
  togRow.innerHTML = `
    <label><input type="checkbox" data-t="showGrid"       ${S.showGrid        ? 'checked' : ''}> Grid</label>
    <label><input type="checkbox" data-t="showMinorGrid"  ${S.showMinorGrid   ? 'checked' : ''}> Minor</label>
    <label><input type="checkbox" data-t="showAxes"       ${S.showAxes        ? 'checked' : ''}> Axes</label>
    <label><input type="checkbox" data-t="showAxisLabels" ${S.showAxisLabels  ? 'checked' : ''}> Labels</label>`;
  togRow.addEventListener('change', ev => {
    const inp = ev.target;
    if(inp.tagName !== 'INPUT' || !inp.dataset.t) return;
    S[inp.dataset.t] = !!inp.checked;
    _gpAfterChange();
  });
  body.appendChild(togRow);
  return card;
}

function _gpBuildPresetsCard(S){
  const { card, body } = _gpMakeCard({
    id: 'gp-preset-card', icon: 'stars', title: 'Presets',
    collapsed: _gpResolveCardCollapsed(S, 'gp-preset-card', true)
  });
  /* P0b: unit-circle preset control disabled pending the parametric rebuild
   * — see SCENE_STAGE_DESIGN §6 Phase 4.
   *
   * The button and its description are withheld rather than deleted: the
   * enable/disable function is left intact directly below, because
   * applyGraphPanelFromState still calls its disable branch to migrate any
   * snapshot saved while the preset was on. Restoring the control is a matter
   * of removing this guard.
   *
   * The note is replaced too, not just the button — leaving the original
   * paragraph would have the card advertise a control that is no longer
   * there. This matches _gpBuildStubCard, the shape already used for the
   * Calculus and Readouts placeholders. */
  const UNIT_CIRCLE_ENABLED = false;
  if(UNIT_CIRCLE_ENABLED){
    const unitBtn = document.createElement('button');
    unitBtn.type = 'button';
    /* fix/graph-unit-circle-toggle: visual .on state when the
     * preset is active. _gpAfterChange re-renders the whole
     * sidebar including this card, so the class follows the flag
     * naturally on each toggle without needing a manual classList
     * mutation in the click handler. */
    unitBtn.className = 'gp-preset-btn' + (S.unitCircleActive ? ' on' : '');
    unitBtn.setAttribute('aria-pressed', S.unitCircleActive ? 'true' : 'false');
    unitBtn.innerHTML = '<span class="ms">panorama_fish_eye</span> Unit Circle';
    unitBtn.addEventListener('click', () => { _gpToggleUnitCirclePreset(S); _gpAfterChange({ label: 'toggle-unit-circle' }); });
    body.appendChild(unitBtn);
    const note = document.createElement('div');
    note.className = 'gp-card-stub';
    note.textContent = 'Unit Circle seeds a trig demonstration: the unit circle plotted as two semicircle functions, 16 labeled points at standard angles with (cos θ, sin θ) coordinates, and a full-revolution arc. Viewport and aspect remain editable.';
    body.appendChild(note);
  } else {
    const note = document.createElement('div');
    note.className = 'gp-card-stub';
    note.textContent = 'Unit circle returns in the Circles update, rebuilt on the new parametric engine.';
    body.appendChild(note);
  }
  return card;
}

/** Bidirectional unit-circle preset toggle (fix/graph-unit-
 *  circle-toggle).
 *
 *  ENABLE (S.unitCircleActive false → true):
 *    Appends preset functions, points, and arcs to the user's
 *    existing entries (does NOT replace). Records the new IDs
 *    in S.unitCirclePresetIds for later cleanup. Applies the
 *    preset's viewport / aspect / angleMode / quadrant /
 *    showAllCoords / seedDismissed adjustments.
 *
 *  DISABLE (S.unitCircleActive true → false):
 *    Removes entries whose IDs match S.unitCirclePresetIds
 *    (preserves any user-added entries made while enabled).
 *    Does NOT revert viewport / aspect / etc. — user may have
 *    adjusted them intentionally after enabling.
 *
 *  Preset is idempotent under repeated toggling: each enable
 *  mints fresh IDs, each disable removes only those IDs. User
 *  entries are never wiped. */
function _gpToggleUnitCirclePreset(S){
  if(S.unitCircleActive){
    // ── DISABLE PATH ──
    const ids = S.unitCirclePresetIds || { functions: [], points: [], arcs: [] };
    const fnIds  = new Set(Array.isArray(ids.functions) ? ids.functions : []);
    const ptIds  = new Set(Array.isArray(ids.points)    ? ids.points    : []);
    const arcIds = new Set(Array.isArray(ids.arcs)      ? ids.arcs      : []);
    // Filter by tracked IDs AND by defensive preset marker.
    // Either condition triggers removal — robust against ID drift
    // caused by snapshot restore, normalizer ID regeneration, or
    // any path where unitCirclePresetIds and actual entry IDs
    // diverge. Without the marker fallback, drifted preset
    // entries (notably the full-2π arc rendering as a green disc
    // at origin) would persist after disable.
    // See fix/graph-unit-circle-leftover-disk.
    if(Array.isArray(S.functions)) S.functions = S.functions.filter(f => !fnIds.has(f.id)  && !f.fromUnitCirclePreset);
    if(Array.isArray(S.points))    S.points    = S.points   .filter(p => !ptIds.has(p.id)  && !p.fromUnitCirclePreset);
    if(Array.isArray(S.arcs))      S.arcs      = S.arcs     .filter(a => !arcIds.has(a.id) && !a.fromUnitCirclePreset);
    S.unitCirclePresetIds = { functions: [], points: [], arcs: [] };
    S.unitCircleActive = false;
    // Deliberately not reverting viewport / xStep / yStep /
    // gridStep / aspect / angleMode / quadrant / showAllCoords /
    // seedDismissed — these are convenience settings and the
    // user may have adjusted them after enabling.
    return;
  }

  // ── ENABLE PATH ──
  // Viewport + scaling + flag mutations (same values as the
  // pre-toggle preset). Applied unconditionally on enable; the
  // user can adjust afterward and disable will leave their
  // adjustments in place.
  S.xMin = -1.5; S.xMax = 1.5;
  S.yMin = -1.5; S.yMax = 1.5;
  S.xStep = 0.5; S.yStep = 0.5;
  S.gridStep = 0.5;
  S.aspect = 'equal';
  S.angleMode = 'rad';
  S.quadrant = 'all';
  S.showAllCoords = true;
  // Functions: unit circle via y = ±√(1 − x²) as two curves so the
  // existing single-valued plotter renders both halves cleanly.
  // Theme-aware palette so the preset is readable against the
  // teacher's current light/dark backdrop.
  const presetPal = _gpRtPalette(S);
  /* fromUnitCirclePreset marker: defensive cleanup hook for the
   * disable path. Filter on disable removes entries with EITHER
   * a matching tracked ID OR this marker — robust against ID
   * drift from state restoration. See
   * fix/graph-unit-circle-leftover-disk. */
  const newFns = [
    { id: _grNewId('fn'), fromUnitCirclePreset: true, expr: 'sqrt(1 - x*x)',  color: presetPal[0], visible: true, showDerivative: false },
    { id: _grNewId('fn'), fromUnitCirclePreset: true, expr: '-sqrt(1 - x*x)', color: presetPal[0], visible: true, showDerivative: false }
  ];
  // Standard angles (rad) and their (cos, sin) coordinates.
  const standard = [
    [0,            '0',      1,              0            ],
    [Math.PI/6,    'π/6',    Math.sqrt(3)/2, 0.5          ],
    [Math.PI/4,    'π/4',    Math.sqrt(2)/2, Math.sqrt(2)/2],
    [Math.PI/3,    'π/3',    0.5,            Math.sqrt(3)/2],
    [Math.PI/2,    'π/2',    0,              1            ],
    [2*Math.PI/3,  '2π/3',  -0.5,            Math.sqrt(3)/2],
    [3*Math.PI/4,  '3π/4',  -Math.sqrt(2)/2, Math.sqrt(2)/2],
    [5*Math.PI/6,  '5π/6',  -Math.sqrt(3)/2, 0.5          ],
    [Math.PI,      'π',     -1,              0            ],
    [7*Math.PI/6,  '7π/6',  -Math.sqrt(3)/2,-0.5          ],
    [5*Math.PI/4,  '5π/4',  -Math.sqrt(2)/2,-Math.sqrt(2)/2],
    [4*Math.PI/3,  '4π/3',  -0.5,           -Math.sqrt(3)/2],
    [3*Math.PI/2,  '3π/2',   0,             -1            ],
    [5*Math.PI/3,  '5π/3',   0.5,           -Math.sqrt(3)/2],
    [7*Math.PI/4,  '7π/4',   Math.sqrt(2)/2,-Math.sqrt(2)/2],
    [11*Math.PI/6,'11π/6',   Math.sqrt(3)/2,-0.5          ]
  ];
  // First tuple element (the radian angle) is kept in the `standard`
  // table for future use (tangent/derivative demo wiring, arc pairing)
  // but not referenced here — underscore-prefix the destructured slot
  // to mark it intentional for future readers + linters.
  const newPts = standard.map(([_ang, lbl, cx, cy]) => ({
    id: _grNewId('pt'), fromUnitCirclePreset: true,
    x: cx, y: cy, label: lbl,
    style: 'filled', color: null, showCoords: true
  }));
  // One full revolution arc as a visual reminder of sweep.
  const newArcs = [
    { id: _grNewId('arc'), fromUnitCirclePreset: true,
      mode: 'standard', angle: 2*Math.PI, radius: 0.4,
      style: 'single', showMeasure: false, visible: true,
      color: presetPal[2] }
  ];
  // APPEND, not replace — preserves any user-added entries.
  // Defensive Array.isArray guards: a fresh state with empty
  // defaults will already have arrays, but a malformed snapshot
  // restored without the normalizer pass shouldn't crash here.
  const existingFns  = Array.isArray(S.functions) ? S.functions : [];
  const existingPts  = Array.isArray(S.points)    ? S.points    : [];
  const existingArcs = Array.isArray(S.arcs)      ? S.arcs      : [];
  /* CR feedback: atomic capacity check before any mutation.
   * Without this, enabling with already-near-limit state could
   * push the lists past GRAPH_*_LIMIT; the next normalize/restore
   * would silently truncate the tail (tracked-by-IDs preset
   * entries get partially dropped), leaving unitCircleActive
   * true with the preset only partly applied — disable would
   * then no-op for the dropped IDs, wedging the state.
   *
   * Bail early when any axis can't fit. Toast surfaces the why
   * so the user can free up space and retry. */
  if(existingFns.length  + newFns.length  > GRAPH_FUNCTION_LIMIT ||
     existingPts.length  + newPts.length  > GRAPH_POINT_LIMIT    ||
     existingArcs.length + newArcs.length > GRAPH_ARC_LIMIT){
    if(typeof showToast === 'function'){
      showToast('Unit Circle needs room for 2 functions, 16 points, and 1 arc — clear some entries first');
    }
    return;
  }
  S.functions = existingFns.concat(newFns);
  S.points    = existingPts.concat(newPts);
  S.arcs      = existingArcs.concat(newArcs);
  // Record fresh IDs for the matching disable path.
  S.unitCirclePresetIds = {
    functions: newFns.map(f => f.id),
    points:    newPts.map(p => p.id),
    arcs:      newArcs.map(a => a.id)
  };
  // Mark as seeded so first-render doesn't also try to plant sin(x).
  S.seedDismissed = true;
  S.unitCircleActive = true;
}

/* ── Runtime expression input ──────────────────────────────────────
   During a lesson the teacher can type f(x)=… and hit Enter to add a
   curve. Parse errors surface inline (red border + helper message)
   without toast spam. Each added function gets a swatch-colored pill
   in the function list with a × button to remove it.

   Leading `y=` or `f(x)=` is stripped so teachers can type the way
   they'd write on a board ("y = sin(x)") instead of a bare expression.
   Colors cycle through a 6-step palette so consecutive functions
   differ visibly. The state shape matches the authoring UI so a
   runtime-added function appears in the config panel next time the
   teacher opens the Widgets screen.                                  */

/* Dark-theme palette: saturated pastels tuned for the mid-dark plot backdrop,
 * which is --s5 = #242624 (src/styles/tokens.css) — painted twice, as the
 * .gp-svg background and the .gp-bg rect fill (src/styles/graph-panel.css).
 *
 * Index 0 is the canonical brand accent --p (#4531d4), so the first
 * auto-assigned function lands on brand mint.
 *
 * Two properties are enforced by scripts/check-palette.js, not just intended:
 *   - every entry clears WCAG AA-normal (4.5:1) on #242624 —
 *     13.45, 8.36, 11.23, 5.68, 8.20, 8.59 respectively;
 *   - the entries are far enough apart to TELL APART at stroke width, not
 *     merely compliant: minimum pairwise CIE76 dE is 29.9.
 *
 * History: index 0 held the LEGACY mint accent that CLAUDE.md bans in favour of
 * --p (the hex is deliberately not repeated here, so a grep for the banned
 * value stays meaningful), and indices 0/1/4 were three pale mint-cyans only
 * dE 14.9-16.1 apart — so the 5th auto-assigned curve read as a repeat of the
 * 1st. Slots 0, 1 and 4 were respread across mint / cyan / magenta; --gold and
 * --err at 2 and 3 and the periwinkle at 5 were already distinct and are
 * unchanged. */
const _GP_RT_PALETTE_DARK = ['#beffdc','#79e6ff','#ffd97d','#ff716c','#f0a6e6','#a0c4ff'];
/* Light-theme palette (Math Studio build): index 0 is rethemed to the
 * Math Studio indigo #4531d4 by scripts/build-graph.js; indices 1-5 are
 * the suite values, kept multi-hue so several plotted functions stay
 * distinguishable. Contrast and pairwise-distance figures for the shipped
 * arrays are verified by scripts/check-palette.js against the real --s5
 * backdrop token, so no ratios are quoted here to go stale. */
const _GP_RT_PALETTE_LIGHT = ['#4531d4','#0b6d85','#8a5f1c','#c63528','#6b3fa0','#3b5bdb'];
/* Back-compat alias — any external code (none in tree) referring
 * to the pre-light-mode name gets the dark palette. Everything
 * in-tree should pick based on S.lightMode via _gpRtPalette(). */
const _GP_RT_PALETTE = _GP_RT_PALETTE_DARK;

/** Returns the active palette based on the graph's lightMode state.
 *  Called at add-function time (both authoring-config and runtime
 *  paths) so new functions land on palette entries that are readable
 *  against the current theme. Existing functions keep their own
 *  f.color — no auto-remap on theme toggle. */
function _gpRtPalette(S){
  return (S && S.lightMode) ? _GP_RT_PALETTE_LIGHT : _GP_RT_PALETTE_DARK;
}

/** Allow only a small, safe set of color-literal shapes before we inline
 *  a persisted color into a style="background:…" attribute. The data is
 *  teacher-owned and persisted via autosave, but snapshot files can be
 *  edited by hand or shared between installs, so we don't want a tampered
 *  "color" to break out of the swatch element or inject extra CSS
 *  declarations. Accepts #RGB / #RGBA / #RRGGBB / #RRGGBBAA, rgb(...) /
 *  rgba(...), hsl(...) / hsla(...), and plain lowercase name tokens. */
function _gpIsSafeColor(c){
  if(typeof c !== 'string') return false;
  if(c.length > 64) return false;
  if(/^#[0-9a-fA-F]{3,8}$/.test(c)) return true;
  if(/^rgb\s*\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)$/i.test(c)) return true;
  if(/^rgba\s*\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*(?:0|1|0?\.\d+)\s*\)$/i.test(c)) return true;
  if(/^hsl\s*\(\s*\d+\s*,\s*\d+%\s*,\s*\d+%\s*\)$/i.test(c)) return true;
  if(/^hsla\s*\(\s*\d+\s*,\s*\d+%\s*,\s*\d+%\s*,\s*(?:0|1|0?\.\d+)\s*\)$/i.test(c)) return true;
  if(/^[a-z]{3,24}$/i.test(c)) return true; // css named colors ('red', 'transparent', …)
  return false;
}

function _gpBuildRuntimeInput(S){
  const wrap = document.createElement('div');
  wrap.className = 'gp-rt-wrap';
  const fns = (S && Array.isArray(S.functions)) ? S.functions : [];
  const listHtml = fns.map((f, i) => {
    // Prefer raw (user's typed notation) for display; fall back to
    // expr for legacy entries predating the raw field. String form
    // (typeof f === 'string') is from even older snapshots — treat
    // the whole string as both raw and expr.
    const expr = typeof f === 'string' ? f : (f.raw || f.expr || '');
    const activePalette = _gpRtPalette(S);
    const fallback = activePalette[i % activePalette.length];
    // Validate-then-fallback: never inline an unvetted color into a
    // style attribute even though we control the palette source, because
    // WIDGET_STATE can be persisted / restored from disk between sessions.
    const rawColor = (f && f.color) || fallback;
    const color = _gpIsSafeColor(rawColor) ? rawColor : fallback;
    return `<li class="gp-rt-item" data-idx="${i}">
      <span class="gp-rt-swatch" style="background:${color}" aria-hidden="true"></span>
      <span class="gp-rt-expr-lbl" data-gp-rt-expr-idx="${i}">${_gpEsc(expr)}</span>
      <button type="button" class="gp-rt-del" data-idx="${i}" aria-label="Remove function">×</button>
    </li>`;
  }).join('');
  /* Batch 2C: MathLive <math-field> replaces the text input as the
   * canonical authoring surface. Teachers type LaTeX-ish input
   * directly or click palette templates for structure (fraction,
   * radical, subscript/superscript, etc.). getValue('latex') is the
   * canonical raw form stored on the function entry; the parser
   * pipeline routes raw → ASCIIMath → preprocessPi → stripPrefix
   * via _gpExprFromRaw defined earlier in this file.
   *
   * MathLive attributes used:
   * — the virtual keyboard
   *     shows via the field's keyboard toggle button rather than
   *     auto-popping on mobile. Keeps desktop behavior conservative.
   *   placeholder — displayed when empty, same copy as the old
   *     text input for continuity.
   * Theming overrides live in graph-panel.css (see the MATHLIVE
   * THEME block near the bottom of that file). */
  wrap.innerHTML = `
    <div class="gp-rt-input">
      <input type="text" class="gp-rt-expr" placeholder="Type f(x)=… or tap palette">
      <button type="button" class="gp-rt-add" aria-label="Add function">+</button>
    </div>
    <div class="gp-rt-err" hidden></div>
    <ul class="gp-rt-list">${listHtml}</ul>`;

  // KaTeX typeset each runtime-list entry's label. Mirror of the
  // sidebar Functions card integration in _gpBuildFunctionsCard —
  // both lists show the same function data, both should render as
  // typeset math. Iterate after innerHTML set so the spans exist.
  if(typeof katex !== 'undefined'){
    wrap.querySelectorAll('.gp-rt-expr-lbl[data-gp-rt-expr-idx]').forEach(span => {
      const i = parseInt(span.dataset.gpRtExprIdx, 10);
      const f = fns[i];
      if(!f) return;
      const src = (typeof f === 'string') ? f : (f.raw || f.expr || '');
      try {
        katex.render(src, span, {
          throwOnError: false,
          displayMode: false,
          errorColor: 'var(--err)',
        });
      } catch(_){ /* keep pre-render span content on unexpected failure */ }
    });
  }

  const input = wrap.querySelector('.gp-rt-expr');
  const err   = wrap.querySelector('.gp-rt-err');
  const clearErr = () => { err.hidden = true; err.textContent = ''; input.classList.remove('gp-rt-bad'); };
  const showErr  = m => { err.hidden = false; err.textContent = m; input.classList.add('gp-rt-bad'); };

  /* input can be either <input type="text"> (legacy path, during a
   * failure-to-load MathLive scenario) or <math-field>. Read from
   * getValue('latex') when available — that's the canonical LaTeX
   * string authored via MathLive's structure editor. Fall back to
   * .value for <input> compatibility (defensive; the current render
   * path above always emits <math-field>). */
  const readInputRaw = () => {
    if(typeof input.getValue === 'function'){
      // LaTeX is the canonical raw form. Not ASCIIMath — we want to
      // preserve structural authoring decisions (fractions,
      // radicals) verbatim for future edits and for KaTeX display.
      try { return input.getValue('latex') || ''; } catch(_){ return ''; }
    }
    return String(input.value || '');
  };
  const clearInput = () => {
    if(typeof input.setValue === 'function'){
      try { input.setValue(''); return; } catch(_){}
    }
    if('value' in input) input.value = '';
  };

  const addFn = () => {
    clearErr();
    // Preserve the teacher's literal typed string as `raw` for
    // display + edit. 200-char cap matches the normalizer and
    // authoring-edit paths so divergence across save/reload can't
    // sneak in.
    const typed = readInputRaw().slice(0, 200);
    if(!typed.trim()) return;
    // Read expr from the live math-field's ASCIIMath export when
    // available. Falls back to plain-text parsing when `input` is
    // a legacy <input>. `typed` above is the raw LaTeX stored on
    // the function entry for display + re-edit; `clean` is the
    // derived parser input. Both capped at 200 for save/reload
    // symmetry with the normalizer.
    const clean = _gpReadExprFromField(input).slice(0, 200);
    if(!clean){ showErr('Empty expression.'); return; }
    // graphCompile returns { eval: fn, error: string|null } — it does NOT
    // set an `ok` flag, so the original `!parse.ok` check was permanently
    // truthy and would have rejected every valid expression. We treat a
    // non-null `error` OR a missing `eval` as a parse failure.
    const parse = (typeof graphCompile === 'function')
      ? graphCompile(clean)
      : { eval: null, error: 'graphCompile missing' };
    if(parse.error || typeof parse.eval !== 'function'){
      showErr('Parse error: ' + (parse.error || 'bad expression'));
      return;
    }
    if(typeof WIDGET_STATE !== 'object' || !WIDGET_STATE) return;
    // Use the canonical default shape if state is missing entirely —
    // a hand-crafted { enabled:true, functions:[], points:[] } would
    // skip all the newer fields (arcs, calc, viewport defaults, …)
    // and force every downstream card to null-guard.
    if(!WIDGET_STATE.graphPanel){
      WIDGET_STATE.graphPanel = (typeof _defaultGraphPanel === 'function')
        ? _defaultGraphPanel()
        : { enabled: true, functions: [], points: [], arcs: [] };
      WIDGET_STATE.graphPanel.enabled = true;
    }
    const list = WIDGET_STATE.graphPanel.functions || (WIDGET_STATE.graphPanel.functions = []);
    // Enforce the 6-function cap (GRAPH_FUNCTION_LIMIT) — the runtime
    // input path was previously skipping this check and letting the
    // teacher pile on 10+ functions, which the authoring UI then
    // silently truncated on next normalize. Surface an inline error
    // instead so adds either succeed or tell the user why.
    const FN_LIMIT = (typeof GRAPH_FUNCTION_LIMIT === 'number') ? GRAPH_FUNCTION_LIMIT : 6;
    if(list.length >= FN_LIMIT){
      showErr(`Function limit reached (${FN_LIMIT}). Remove one first.`);
      return;
    }
    // Schema-compliant entry — id, color, visible, and the
    // showDerivative flag the Functions card + renderer expect.
    // Without the id, the widgets-screen config can't target this
    // function for edit/remove/toggle, and the normalizer on reload
    // would mint a fresh id breaking any prior _ui card references.
    const addPal = _gpRtPalette(WIDGET_STATE.graphPanel);
    list.push({
      id:             (typeof _grNewId === 'function') ? _grNewId('fn') : ('rt-' + Date.now()),
      expr:           clean,
      raw:            typed,
      color:          addPal[list.length % addPal.length],
      visible:        true,
      showDerivative: false
    });
    clearInput();
    applyGraphPanelFromState();
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  };

  wrap.querySelector('.gp-rt-add').addEventListener('click', addFn);
  /* <math-field> emits custom events 'input' (on every edit) and
   * 'change' (on commit / blur). It ALSO fires a native 'keydown'
   * that bubbles through the shadow DOM for keys it doesn't
   * intercept — Enter is one of them at the top level of the
   * expression tree. Handler listens for Enter to mean "add this
   * function". If Enter lands inside a fraction denominator, the
   * field consumes it for structural navigation — desired behavior. */
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); addFn(); }
  });
  // MathLive emits 'input' on value change; use it for err-clear
  // regardless of legacy/native input.
  input.addEventListener('input', clearErr);

  wrap.querySelectorAll('.gp-rt-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.idx, 10);
      if(typeof WIDGET_STATE !== 'object' || !WIDGET_STATE) return;
      const list = WIDGET_STATE.graphPanel && WIDGET_STATE.graphPanel.functions;
      if(!Array.isArray(list) || Number.isNaN(i)) return;
      list.splice(i, 1);
      applyGraphPanelFromState();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    });
  });

  return wrap;
}

// _gpEsc lives at the top of this module (see line ~37) — do not
// redefine it here. The earlier duplicate was an oversight from the
// widget-free-drag PR and would have shadowed the canonical definition.

function _applyGraphPanelPosition(panel, pos){
  panel.style.top = panel.style.right = panel.style.bottom = panel.style.left = '';
  panel.style.transform = '';
  switch(pos){
    case 'topLeft':     panel.style.top    = '9px'; panel.style.left  = '9px'; break;
    case 'topRight':    panel.style.top    = '9px'; panel.style.right = '9px'; break;
    case 'bottomLeft':  panel.style.bottom = '9px'; panel.style.left  = '9px'; break;
    case 'center':      panel.style.top    = '50%'; panel.style.left  = '50%';
                        panel.style.transform = 'translate(-50%, -50%)'; break;
    case 'bottomRight':
    default:            panel.style.bottom = '9px'; panel.style.right = '9px';
  }
  _gpKeepHeaderReachable(panel);
}

/** A panel that outgrows its host must not push its own header out of reach.
 *
 *  THE DEFECT, measured at 1024x768. The panel is bottom-anchored
 *  (`bottom: 9px`), so it grows UPWARD as its sidebar fills. .wb is only about
 *  568px tall there, being 16/9 off the viewport, and three functions plus one
 *  arc took the panel to 660.8px -- taller than its host. Its top edge walked
 *  up with every addition, 150 -> 75 -> 0.3, until the close button sat at
 *  y=33 against a lesson area starting at y=44: clipped behind the nav, with
 *  .wp being overflow:hidden. The panel could no longer be closed at all,
 *  mid-recording, with no way back short of a reload.
 *
 *  THE FIX is the trade Set 1 already made for the board: when a thing does
 *  not fit, keep its CONTROLS reachable and put the overflow where it can be
 *  scrolled or dragged. So the top edge is pinned into the host and the
 *  overflow goes off the bottom, where the drag bar can still move it.
 *
 *  Works from the MEASURED rect, not from which anchor was requested. The
 *  first version of this guard keyed off `style.top === '50%'` and never fired,
 *  because the default position is bottomRight rather than center -- a guard
 *  aimed at a case the defect does not occur in.
 *  @param {HTMLElement} panel
 *  @returns {void} */
function _gpKeepHeaderReachable(panel){
  if(!panel || !panel.offsetParent) return;
  const host = panel.offsetParent.getBoundingClientRect();
  const r = panel.getBoundingClientRect();
  if(!(host.height > 0 && r.height > 0)) return;
  /* Only act when the header has actually left the host. A panel that fits, or
     one the teacher has dragged somewhere deliberate, is left alone. */
  if(r.top >= host.top + 1) return;
  panel.style.top = '9px';
  panel.style.bottom = '';
  /* Preserve the horizontal half of a centred transform; drop the vertical
     half, which is what was lifting the header out of view. */
  panel.style.transform = (panel.style.transform || '').indexOf('translate(-50%') === 0
    ? 'translateX(-50%)' : '';
}

/* ── SVG build ───────────────────────────────────────────────── */

const _GP_SVG_NS = 'http://www.w3.org/2000/svg';
/* Safety ceiling for grid + tick rendering. With a permissive
 * GRAPH_GRID_STEP_MIN (0.01) and a broad viewport, the naive line
 * generator could emit hundreds of thousands of SVG <line> nodes
 * per axis. _gpBuildSvg caps per-axis line count to this number by
 * upscaling the effective step at render time; the stored gridStep
 * stays as the user authored it so shrinking the viewport later
 * restores the finer grid. */
const _GP_MAX_GRID_LINES = 200;

/** Computes the VISUAL gridline step for a given viewport + authored
 *  step. Doubles the authored step until neither axis would produce
 *  more than _GP_MAX_GRID_LINES lines. Returns the authored step
 *  unchanged for well-behaved viewports. Shared between the grid
 *  block and the tick-label block so they never drift out of sync. */
function _gpEffectiveGridStep(xRange, yRange, authoredStep){
  let s = authoredStep;
  while((xRange / s) > _GP_MAX_GRID_LINES || (yRange / s) > _GP_MAX_GRID_LINES){
    s *= 2;
    if(!Number.isFinite(s) || s <= 0) break;
  }
  return s;
}
function _svgEl(tag, attrs){
  const el = document.createElementNS(_GP_SVG_NS, tag);
  if(attrs) for(const k of Object.keys(attrs)) el.setAttribute(k, attrs[k]);
  return el;
}

/** Creates the coordinate axes' four arrowhead markers once per svg.
 *  Idempotent: _gpBuildSvg runs on every repaint, so this returns early when
 *  the defs are already present rather than appending a duplicate set.
 *
 *  Filled triangles rather than the trace heads' open polylines, because these
 *  read as part of the axis line rather than as a separate guide. Geometry, in
 *  an 8x8 viewBox, tip listed first in each comment; refX/refY put the TIP at
 *  the line's endpoint so the head extends past it rather than overlapping the
 *  stroke.
 *  @param {SVGElement} svg  the plot root
 *  @returns {void} */
function _gpEnsureAxisHeadDefs(svg){
  if(!svg || svg.querySelector('defs.gp-axis-defs')) return;
  const defs = _svgEl('defs', { class: 'gp-axis-defs' });
  const head = (id, refX, refY, points) =>
    '<marker id="' + id + '" viewBox="0 0 8 8" refX="' + refX + '" refY="' + refY + '"'
    + ' markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="0">'
    + '<polygon points="' + points + '" class="gp-axis-head"/></marker>';
  defs.innerHTML =
      head('gp-axis-head-x-right', 8, 4, '0,0 8,4 0,8')   // tip (8,4) — points +x
    + head('gp-axis-head-x-left',  0, 4, '8,0 0,4 8,8')   // tip (0,4) — points -x
    + head('gp-axis-head-y-up',    4, 0, '0,8 4,0 8,8')   // tip (4,0) — top of plot, +y
    + head('gp-axis-head-y-down',  4, 8, '0,0 4,8 8,0');  // tip (4,8) — bottom, -y
  svg.insertBefore(defs, svg.firstChild);
}

/** Builds the full SVG: background + grid + axes + curves + points.
 *  Coordinate math lives in the _gpMap* helpers so everything stays
 *  consistent when the viewport changes. */
function _gpBuildSvg(S, w, h){
  // Defensive guard against degenerate viewports. normalizeGraphPanel-
  // State + the commit-time swap in _gpConfigChange both prevent
  // xMax <= xMin / yMax <= yMin from landing in state, but a direct
  // state mutation (debug console, future write-path that skips the
  // normalizer) could still produce a zero-width range that divides
  // to Infinity / NaN in xToSvg / yToSvg. Bail with an empty SVG
  // rather than minting invalid path coords.
  if(S.xMax <= S.xMin || S.yMax <= S.yMin){
    return _svgEl('svg', {
      class: 'gp-svg',
      viewBox: `0 0 ${w} ${h}`,
      role: 'img',
      'aria-label': 'Graph unavailable: invalid viewport range'
    });
  }
  const pad = 4;  // inner drawable margin so strokes don't clip
  const plotW = w - pad * 2;
  const plotH = h - pad * 2;
  const xToSvg = x => pad + ((x - S.xMin) / (S.xMax - S.xMin)) * plotW;
  const yToSvg = y => pad + plotH - ((y - S.yMin) / (S.yMax - S.yMin)) * plotH;

  const svg = _svgEl('svg', {
    class: 'gp-svg',
    viewBox: `0 0 ${w} ${h}`,
    preserveAspectRatio: 'xMidYMid meet',
    role: 'img',
    'aria-label': 'Function graph'
  });

  // Backdrop
  svg.appendChild(_svgEl('rect', { class: 'gp-bg', x: 0, y: 0, width: w, height: h }));

  // Grid (Round B #6b: per-axis steps). xStep / yStep live in state
  // independently; _gpEffectiveGridStep caps each axis separately so
  // the fine axis can have its step auto-doubled without also
  // coarsening the other. Minor-gridline pass runs at half the
  // effective major step when enabled.
  const xRange = S.xMax - S.xMin;
  const yRange = S.yMax - S.yMin;
  const xStepAuthored = (typeof S.xStep === 'number' && S.xStep > 0) ? S.xStep : S.gridStep;
  const yStepAuthored = (typeof S.yStep === 'number' && S.yStep > 0) ? S.yStep : S.gridStep;
  const effX = _gpEffectiveGridStep(xRange, yRange, xStepAuthored);
  const effY = _gpEffectiveGridStep(xRange, yRange, yStepAuthored);
  if(S.showGrid){
    // Minor gridlines (half-step) first so majors render on top.
    if(S.showMinorGrid){
      const mx = effX / 2, my = effY / 2;
      const mxStart = Math.ceil(S.xMin / mx) * mx;
      for(let x = mxStart; x <= S.xMax + 1e-9; x += mx){
        const sx = xToSvg(x);
        svg.appendChild(_svgEl('line', { class: 'gp-grid gp-grid-minor', x1: sx, y1: pad, x2: sx, y2: h - pad }));
      }
      const myStart = Math.ceil(S.yMin / my) * my;
      for(let y = myStart; y <= S.yMax + 1e-9; y += my){
        const sy = yToSvg(y);
        svg.appendChild(_svgEl('line', { class: 'gp-grid gp-grid-minor', x1: pad, y1: sy, x2: w - pad, y2: sy }));
      }
    }
    const xStart = Math.ceil(S.xMin / effX) * effX;
    for(let x = xStart; x <= S.xMax + 1e-9; x += effX){
      const sx = xToSvg(x);
      svg.appendChild(_svgEl('line', { class: 'gp-grid', x1: sx, y1: pad, x2: sx, y2: h - pad }));
    }
    const yStart = Math.ceil(S.yMin / effY) * effY;
    for(let y = yStart; y <= S.yMax + 1e-9; y += effY){
      const sy = yToSvg(y);
      svg.appendChild(_svgEl('line', { class: 'gp-grid', x1: pad, y1: sy, x2: w - pad, y2: sy }));
    }
  }

  // Axes
  if(S.showAxes){
    /* ARROWHEADS AT BOTH ENDS OF BOTH AXES — the panel's OWN markers.
     *
     * Not the gp-trace-head-* markers. Those are trace-guide furniture: they
     * are stroked in the TRACE colours (.gp-trace-arrow-*-head), and they live
     * in `defs.gp-trace-defs`, which _gpkTraceAnim creates lazily and rebuilds
     * with the trace group — so reusing them would make the coordinate axes'
     * arrowheads appear only once a trace had run and vanish when one was
     * cleared. Axis furniture belongs to the axes.
     *
     * Explicit per-direction markers, NOT orient="auto-start-reverse". That is
     * the same choice the trace heads document a few hundred lines below, for
     * the reason recorded there: auto orientation relies on SVG's tangent
     * computation, which produced inconsistent results on vertical lines. The
     * four directions here are known at emit time, so nothing needs inferring.
     *
     * markerUnits="userSpaceOnUse" so the head keeps its size independent of
     * the 1.2 stroke-width on .gp-axis — the strokeWidth default would scale
     * every head by the axis weight and make them shift if that weight ever
     * changes. */
    _gpEnsureAxisHeadDefs(svg);
    // x-axis only when y=0 is inside the viewport
    if(S.yMin <= 0 && S.yMax >= 0){
      const ay = yToSvg(0);
      /* x1 is the LEFT (negative x) end and x2 the right, so start=left head,
         end=right head. Both point away from the origin. */
      svg.appendChild(_svgEl('line', { class: 'gp-axis', x1: pad, y1: ay, x2: w - pad, y2: ay,
        'marker-start': 'url(#gp-axis-head-x-left)', 'marker-end': 'url(#gp-axis-head-x-right)' }));
    }
    if(S.xMin <= 0 && S.xMax >= 0){
      const ax = xToSvg(0);
      /* SVG y grows DOWNWARD, so y1 = pad is the TOP of the plot, which is
         mathematically POSITIVE y. start therefore takes the up head and end
         the down head — reversing these is the easy mistake here. */
      svg.appendChild(_svgEl('line', { class: 'gp-axis', x1: ax, y1: pad, x2: ax, y2: h - pad,
        'marker-start': 'url(#gp-axis-head-y-up)', 'marker-end': 'url(#gp-axis-head-y-down)' }));
    }
  }

  /* Anchor coords for axis ticks + tick labels. Shared so ticks
   * and labels can never drift apart in the parked-edge case
   * (axis off-screen) — when y=0 is outside the viewport, both
   * x-axis ticks and x-axis labels park along the bottom plot
   * edge; when x=0 is outside the viewport, both y-axis ticks
   * and y-axis labels park along the left plot edge. fix/graph-
   * axis-ticks. */
  const xAxisInView   = S.yMin <= 0 && S.yMax >= 0;
  const yAxisInView   = S.xMin <= 0 && S.xMax >= 0;
  const xAxisAnchorY  = xAxisInView ? yToSvg(0) : (h - pad);
  const yAxisAnchorX  = yAxisInView ? xToSvg(0) : pad;

  /* Major tick marks at every labeled position. Implicit gate
   * on showAxes — no new state flag. Origin is skipped (mirrors
   * the label loop's origin skip; the standalone "0" label
   * already marks the crossing). 5px total length, centered on
   * the anchor row/column. Same effX / effY as grid + labels so
   * ticks line up with everything else. */
  if(S.showAxes){
    const TICK_HALF = 2.5;
    const xStartTick = Math.ceil(S.xMin / effX) * effX;
    for(let x = xStartTick; x <= S.xMax + 1e-9; x += effX){
      if(Math.abs(x) < 1e-9) continue;
      const sx = xToSvg(x);
      svg.appendChild(_svgEl('line', {
        class: 'gp-tick',
        x1: sx, y1: xAxisAnchorY - TICK_HALF,
        x2: sx, y2: xAxisAnchorY + TICK_HALF
      }));
    }
    const yStartTick = Math.ceil(S.yMin / effY) * effY;
    for(let y = yStartTick; y <= S.yMax + 1e-9; y += effY){
      if(Math.abs(y) < 1e-9) continue;
      const sy = yToSvg(y);
      svg.appendChild(_svgEl('line', {
        class: 'gp-tick',
        x1: yAxisAnchorX - TICK_HALF, y1: sy,
        x2: yAxisAnchorX + TICK_HALF, y2: sy
      }));
    }
  }

  // Axis tick labels — share the grid's effective step per-axis so
  // labels and major gridlines always line up. Anchor coords come
  // from the shared xAxisAnchorY / yAxisAnchorX above.
  if(S.showAxisLabels){
    const fmtTick = n => (Math.abs(n) < 1e-9 ? '0' : (Math.round(n * 100) / 100).toString());
    const xStart = Math.ceil(S.xMin / effX) * effX;
    for(let x = xStart; x <= S.xMax + 1e-9; x += effX){
      if(Math.abs(x) < 1e-9) continue;
      const sx = xToSvg(x);
      svg.appendChild(_svgEl('text', {
        class: 'gp-tick-label', x: sx, y: xAxisAnchorY + 11, 'text-anchor': 'middle'
      })).textContent = fmtTick(x);
    }
    const yStart = Math.ceil(S.yMin / effY) * effY;
    for(let y = yStart; y <= S.yMax + 1e-9; y += effY){
      if(Math.abs(y) < 1e-9) continue;
      const sy = yToSvg(y);
      svg.appendChild(_svgEl('text', {
        class: 'gp-tick-label', x: yAxisAnchorX - 4, y: sy + 3, 'text-anchor': 'end'
      })).textContent = fmtTick(y);
    }
    if(xAxisInView && yAxisInView){
      svg.appendChild(_svgEl('text', {
        class: 'gp-tick-label', x: xToSvg(0) - 4, y: yToSvg(0) + 11, 'text-anchor': 'end'
      })).textContent = '0';
    }
  }

  // Function curves
  const samples = Math.max(80, Math.min(800, Math.round(plotW * 1.5)));
  // Asymptote threshold — treat any y-jump bigger than 2× the
  // viewport Y span between adjacent samples as a discontinuity and
  // start a new path segment.
  const jumpThreshold = (S.yMax - S.yMin) * 2;
  const clampY = (S.yMax - S.yMin) * 10; // clamp stray huge y values to avoid pathological path coords
  const yMinClamp = S.yMin - clampY;
  const yMaxClamp = S.yMax + clampY;
  for(const f of S.functions){
    if(!f.visible) continue;
    const compiled = graphCompile(f.expr);
    if(compiled.error) continue;
    // Per-function domain restriction (Round B #6, CR round-5).
    // domainMin/domainMax are optional — if both are set by the
    // user (or by a future preset like piecewise-defined functions),
    // the curve only renders inside that interval. Intersect with
    // the viewport so we don't waste samples outside the plot AND
    // the curve doesn't leak past its own domain boundary.
    const xStart = Math.max(S.xMin, Number.isFinite(f.domainMin) ? f.domainMin : S.xMin);
    const xEnd   = Math.min(S.xMax, Number.isFinite(f.domainMax) ? f.domainMax : S.xMax);
    if(xStart >= xEnd) continue;  // fully outside viewport or empty interval
    let d = '';
    let prevY = null;
    let lastWasMove = true;
    for(let i = 0; i <= samples; i++){
      const x = xStart + (i / samples) * (xEnd - xStart);
      let y = compiled.eval(x);
      const defined = Number.isFinite(y);
      if(defined){
        if(y > yMaxClamp) y = yMaxClamp;
        if(y < yMinClamp) y = yMinClamp;
      }
      if(!defined){
        lastWasMove = true;
        prevY = null;
        continue;
      }
      const jump = prevY !== null && Math.abs(y - prevY) > jumpThreshold;
      if(jump){ lastWasMove = true; }
      const sx = xToSvg(x);
      const sy = yToSvg(y);
      d += (lastWasMove ? 'M' : 'L') + sx.toFixed(2) + ',' + sy.toFixed(2) + ' ';
      lastWasMove = false;
      prevY = y;
    }
    if(d){
      svg.appendChild(_svgEl('path', {
        class: 'gp-curve',
        d: d.trim(),
        stroke: f.color,
        fill: 'none'
      }));
    }
  }

  // Points (Round B #6a: expanded style set — filled / open / square
  // / triangle — and per-point coord labels that respect the global
  // showAllCoords master toggle).
  for(const p of S.points){
    if(p.x < S.xMin || p.x > S.xMax || p.y < S.yMin || p.y > S.yMax) continue;
    const cx = xToSvg(p.x);
    const cy = yToSvg(p.y);
    const style = p.style || 'filled';
    const color = (p.color && _gpIsSafeColor(p.color)) ? p.color : null;
    const fillAttr   = color || 'currentColor';
    const strokeAttr = color || 'currentColor';
    /* feat/graph-point-selection-beta: selection ring rendered
     * BEFORE the point so paint order places it behind. 10px
     * radius leaves a visible gap around the point (r=5 circle
     * + 5px gap; triangle r=6 + 4px gap; 9×9 square + ~4px from
     * corners). pointer-events:none on the ring CSS so clicks
     * on the ring fall through to the point underneath. */
    if(p.id === S.selectedPointId){
      svg.appendChild(_svgEl('circle', {
        class: 'gp-point-selection-ring',
        cx, cy, r: 10
      }));
    }
    if(style === 'square'){
      svg.appendChild(_svgEl('rect', {
        class: 'gp-point gp-point-square',
        x: cx - 4.5, y: cy - 4.5, width: 9, height: 9,
        fill: fillAttr, stroke: strokeAttr,
        'data-gp-pt-id': p.id
      }));
    } else if(style === 'triangle'){
      // Equilateral-ish triangle pointing up; side ≈ 10 px.
      const r = 6;
      const tri = `${cx},${cy - r} ${cx - r * 0.866},${cy + r * 0.5} ${cx + r * 0.866},${cy + r * 0.5}`;
      svg.appendChild(_svgEl('polygon', {
        class: 'gp-point gp-point-triangle',
        points: tri,
        fill: fillAttr, stroke: strokeAttr,
        'data-gp-pt-id': p.id
      }));
    } else {
      const open = style === 'open';
      const circle = _svgEl('circle', {
        class: 'gp-point' + (open ? ' open' : ''),
        cx, cy, r: 5,
        'data-gp-pt-id': p.id
      });
      if(color){
        circle.setAttribute(open ? 'stroke' : 'fill', color);
        if(!open) circle.setAttribute('stroke', 'rgba(0,0,0,.6)');
      }
      svg.appendChild(circle);
    }
    // Coordinate + label rendering. Per-point showCoords overrides
    // the master toggle when explicitly false; otherwise the master
    // controls visibility. The label line shows custom text (if any)
    // followed by the (x, y) pair; empty labels just show coords.
    const showCoords = p.showCoords !== false && S.showAllCoords !== false;
    const labelText = [];
    if(p.label) labelText.push(p.label);
    if(showCoords) labelText.push('(' + _gpFmtNum(p.x) + ', ' + _gpFmtNum(p.y) + ')');
    if(labelText.length){
      const t = _svgEl('text', {
        class: 'gp-point-label', x: cx + 8, y: cy - 6
      });
      t.textContent = labelText.join(' ');
      svg.appendChild(t);
    }
  }

  // Angle arcs (Round B #6g). Renders single/double/triple nested
  // arcs + optional measure label. threePoints mode computes the
  // arc at vertex B sweeping from ray BA to ray BC — handles both
  // obtuse and acute cases by picking the shorter sweep direction.
  if(Array.isArray(S.arcs)){
    for(const arc of S.arcs){
      if(arc.visible === false) continue;
      _gpRenderArc(svg, arc, S, xToSvg, yToSvg);
    }
  }

  // Batch 4E: Coordinate Trace overlay. Rendered AFTER arcs so the
  // cursor + arrows sit on top of any plotted geometry. The trace
  // group is named so subsequent arrow-key moves can update just
  // the trace without rebuilding the whole plot SVG.
  if(S.coordTrace && S.coordTrace.enabled){
    _gpRenderCoordTrace(svg, S, xToSvg, yToSvg, /*animate=*/false);
  }

  return svg;
}

/** Renders the Coordinate Trace overlay — cursor crosshair plus
 *  x-arrow + y-arrow + labels decomposing the cursor's (x, y)
 *  from the origin. Pedagogical aid for live demonstration.
 *
 *  Animation: when `animate` is true, x-arrow draws first
 *  (200ms), then y-arrow (200ms), then labels fade in (150ms).
 *  Total ~550ms — within the spec's 700ms cap. Implemented via
 *  CSS stroke-dasharray + dashoffset transitions plus opacity
 *  transitions on labels. The animation is keyed off classes
 *  added on the next frame so the browser commits the initial
 *  hidden state before transitioning to visible.
 *
 *  Structure: a single <g class="gp-trace"> wraps everything so
 *  _gpRedrawCoordTrace can replace just this subtree on cursor
 *  moves without rebuilding the whole plot.
 *
 *  Quadrant handling: arrows naturally reverse direction because
 *  we draw from origin (or from x-axis) to cursor; SVG doesn't
 *  care about sign. Label offsets flip per-quadrant so labels
 *  always sit on the OUTSIDE of the arrow (axis side) rather
 *  than inside the bounded angle. */
/* Module-level animation state for the coord trace. Tracks the
 * previously-rendered SVG-space cursor position so subsequent
 * moves animate from prev → new (segment persistence) instead of
 * replaying the from-origin draw-out on every step. animCancel
 * is invoked at the start of each redraw to stop any in-flight
 * RAF interpolation — rapid arrow-key presses interrupt cleanly
 * without queueing. */
const _gpkTraceAnim = {
  prevPx: null, prevPy: null, prevOx: null, prevOy: null,
  /* fix/coord-trace-polish CR follow-up: cache the LOGICAL trace
   * coordinates from the previous render so coordPosFor's FROM
   * call uses the previous quadrant when computing the starting
   * layout — without these, fromCoordPos would mix previous SVG
   * pixel positions with current logical (cx, cy) and quadrant
   * flips would pop the label to the destination side before the
   * tween started. */
  prevCx: null, prevCy: null,
  cancel: null,
};

/** Linearly interpolates an SVG attribute on `el` from `from` to
 *  `to` over `durMs` using ease-out-cubic. Multiple in-flight
 *  animations share the same cancel token — when any redraw
 *  cancels, all running interpolations exit on their next frame. */
function _gpkInterpAttr(el, attr, from, to, durMs, isCancelled){
  if(!el) return;
  // Skip near-zero deltas — under half a pixel the user can't see
  // motion anyway, and avoiding the RAF loop reduces overhead
  // during rapid-fire arrow presses.
  if(Math.abs(to - from) < 0.5){
    el.setAttribute(attr, to.toFixed(2));
    return;
  }
  const start = performance.now();
  const step = now => {
    if(isCancelled()) return;
    const t = Math.min(1, (now - start) / durMs);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    el.setAttribute(attr, (from + (to - from) * eased).toFixed(2));
    if(t < 1) requestAnimationFrame(step);
    else el.setAttribute(attr, to.toFixed(2));
  };
  requestAnimationFrame(step);
}

/* Coordinate trace is currently keyboard-only with a free
 * 2D cursor — no pointer interaction on the plot, no f(x)
 * snap to plotted functions. Tracked for a separate PR:
 * feat/coord-trace-pointer-and-fx. */
/* Magic numbers touched by fix/coord-trace-polish — declared at
 * function scope so the layout tunables read clearly when
 * scanning. Other constants in the trace block (180ms anim
 * duration, 0.5px skip threshold, 0.25/1 step sizes) are
 * intentionally NOT pulled out here — they live with their
 * specific call sites and aren't part of the polish fixes. */
const COLLISION_PX     = 30;  // y-label collision threshold near x-axis
const COORD_OFFSET_PX  = 8;   // coord label offset from cursor
const Y_LABEL_INSET_PX = 14;  // y-label horizontal inset from arrow line
const X_LABEL_BELOW_PX = 18;  // x-label vertical offset below x-arrow
const Y_LABEL_PARK_PX  = 18;  // y-label parked offset above/below cursor
const TRACE_LABEL_FONT_PX = 15; // matches .gp-trace-label CSS

function _gpRenderCoordTrace(svg, S, xToSvg, yToSvg, animate){
  const trace = S.coordTrace;
  if(!trace || !trace.enabled){
    // Trace turned off mid-session — cancel any in-flight tweens
    // first so pending RAF callbacks (including the deferred
    // setTimeout for the coord-label anchor swap) can't fire on
    // an already-removed .gp-trace subtree. Then clear stable
    // cache so the next enable starts a fresh from-origin draw-
    // out instead of animating from a stale position.
    if(typeof _gpkTraceAnim.cancel === 'function'){
      _gpkTraceAnim.cancel();
      _gpkTraceAnim.cancel = null;
    }
    _gpkTraceAnim.prevPx = null;
    _gpkTraceAnim.prevPy = null;
    _gpkTraceAnim.prevCx = null;
    _gpkTraceAnim.prevCy = null;
    return;
  }
  // Cancel any in-flight animation before rebuilding. Each redraw
  // produces a new cancel-flag; the previous flag is set to true
  // so its RAF closure exits on the next tick.
  if(typeof _gpkTraceAnim.cancel === 'function') _gpkTraceAnim.cancel();
  let cancelled = false;
  _gpkTraceAnim.cancel = () => { cancelled = true; };
  const isCancelled = () => cancelled;

  // Clear any existing trace group — rebuild fresh so the new
  // arrowhead direction (per-quadrant marker swap) is correct.
  const existing = svg.querySelector('.gp-trace');
  if(existing) existing.remove();
  const g = _svgEl('g', { class: 'gp-trace' });

  // Defs: four per-direction arrowhead markers. Each is a thin
  // line-style ">" (polyline, no fill), drawn with the matching
  // axis-color stroke at 2px to match the arrow shaft. Switching
  // to explicit per-direction markers eliminates the prior
  // auto-start-reverse rotation bug — markers no longer rely on
  // SVG's tangent computation, which produced inconsistent
  // results on vertical lines.
  let defs = svg.querySelector('defs.gp-trace-defs');
  if(!defs){
    defs = _svgEl('defs', { class: 'gp-trace-defs' });
    // Marker viewBox 0 0 8 8, refX=7 refY=4 puts the tip at the
    // line endpoint with a 1px gap so the head doesn't crowd the
    // stroke. polyline points form a 30° "<" shape: arms 7px long
    // from the tip out to (-7×cos30, ±7×sin30) ≈ (-6.06, ±3.5).
    // To draw "<" pointing left in viewBox: tip at (1,4), arms to
    // (7, 0) and (7, 8). Then the marker's natural orientation is
    // "tip points left in its own coord system"; we rotate per
    // direction below via orient="0|90|180|270".
    defs.innerHTML =
      // Right-pointing >: tip at (7,4), arms back to (1, 0) and (1, 8)
      '<marker id="gp-trace-head-x-right" viewBox="0 0 8 8" refX="7" refY="4"' +
        ' markerWidth="8" markerHeight="8" orient="0">' +
        '<polyline points="1,0 7,4 1,8" class="gp-trace-arrow-x-head"/>' +
      '</marker>' +
      // Left-pointing <: tip at (1,4), arms forward to (7, 0) and (7, 8)
      '<marker id="gp-trace-head-x-left" viewBox="0 0 8 8" refX="1" refY="4"' +
        ' markerWidth="8" markerHeight="8" orient="0">' +
        '<polyline points="7,0 1,4 7,8" class="gp-trace-arrow-x-head"/>' +
      '</marker>' +
      // Up-pointing ^ (in SVG y-down): tip at (4,1), arms to (0,7) (8,7)
      '<marker id="gp-trace-head-y-up" viewBox="0 0 8 8" refX="4" refY="1"' +
        ' markerWidth="8" markerHeight="8" orient="0">' +
        '<polyline points="0,7 4,1 8,7" class="gp-trace-arrow-y-head"/>' +
      '</marker>' +
      // Down-pointing v: tip at (4,7), arms to (0,1) (8,1)
      '<marker id="gp-trace-head-y-down" viewBox="0 0 8 8" refX="4" refY="7"' +
        ' markerWidth="8" markerHeight="8" orient="0">' +
        '<polyline points="0,1 4,7 8,1" class="gp-trace-arrow-y-head"/>' +
      '</marker>';
    svg.insertBefore(defs, svg.firstChild);
  }

  // Clamp to the current viewport before rendering so a tampered
  // or stale snapshot can't paint the trace off-canvas. Belt-and-
  // braces: the keydown handler + snap handler already clamp, but
  // a snapshot restored at a wider viewport then resized inward
  // could carry an out-of-range value through to here.
  const rawX = Number(trace.x);
  const rawY = Number(trace.y);
  const xMin = Number.isFinite(S.xMin) ? S.xMin : -10;
  const xMax = Number.isFinite(S.xMax) ? S.xMax :  10;
  const yMin = Number.isFinite(S.yMin) ? S.yMin : -10;
  const yMax = Number.isFinite(S.yMax) ? S.yMax :  10;
  const cx = Math.max(xMin, Math.min(xMax, Number.isFinite(rawX) ? rawX : 0));
  const cy = Math.max(yMin, Math.min(yMax, Number.isFinite(rawY) ? rawY : 0));
  const ox = xToSvg(0);
  const oy = yToSvg(0);
  const px = xToSvg(cx);
  const py = yToSvg(cy);

  // FROM positions for the segment-persistence animation. On the
  // first redraw after a toggle-on (prev cache is null), use the
  // origin so the trace appears with a from-origin draw-out
  // (preserves the "first appearance" effect from the prior PR).
  // On subsequent redraws, FROM is wherever the trace was last
  // painted — only the segments whose endpoints changed end up
  // visibly animating, while unchanged segments interpolate
  // zero-distance and instantly snap.
  const haveFrom = animate && _gpkTraceAnim.prevPx !== null;
  const fromOx = haveFrom ? _gpkTraceAnim.prevOx : ox;
  const fromOy = haveFrom ? _gpkTraceAnim.prevOy : oy;
  const fromPx = haveFrom ? _gpkTraceAnim.prevPx : ox;
  const fromPy = haveFrom ? _gpkTraceAnim.prevPy : oy;
  /* Logical FROM coords for the coord-label quadrant decision.
   * On the first redraw after toggle-on (haveFrom false) the
   * label appears at the destination quadrant immediately —
   * there's no prior layout to animate from. */
  const fromCx = haveFrom ? _gpkTraceAnim.prevCx : cx;
  const fromCy = haveFrom ? _gpkTraceAnim.prevCy : cy;

  /* fix/coord-trace-polish: plot box bounds in SVG pixel space.
   * Used by Fix 1 (y-label collision parking near x-axis) and
   * Fix 2 (coord-label edge-aware quadrant flip). Derived from
   * the same xToSvg/yToSvg the trace itself uses, so the bounds
   * track the live viewport without a second source of truth. */
  const plotLeft   = Math.min(xToSvg(xMin), xToSvg(xMax));
  const plotRight  = Math.max(xToSvg(xMin), xToSvg(xMax));
  const plotTop    = Math.min(yToSvg(yMin), yToSvg(yMax));
  const plotBottom = Math.max(yToSvg(yMin), yToSvg(yMax));

  /* Y-label vertical position helper. Default: midpoint of the
   * y-arrow segment. When the cursor is within COLLISION_PX of
   * the x-axis, that midpoint sits near the x-arrow and the two
   * labels visually overlap (Fix 1). Park above or below the
   * cursor instead, choosing the side with more vertical room
   * inside the plot box. */
  function yLabelYFor(svgPy, svgOy){
    const pxFromAxis = Math.abs(svgPy - svgOy);
    if(pxFromAxis >= COLLISION_PX) return (svgOy + svgPy) / 2;
    const roomAbove = svgPy - plotTop;
    const roomBelow = plotBottom - svgPy;
    return roomAbove >= roomBelow
      ? (svgPy - Y_LABEL_PARK_PX)
      : (svgPy + Y_LABEL_PARK_PX);
  }

  /* Coord-label position helper (Fix 2). Default direction is
   * quadrant-based per the original logic. Then test the
   * resulting label box against the plot bounds and flip whichever
   * axis would push the label past an edge. Label width is
   * approximated from font-size × char-count × 0.6 — close enough
   * for placement decisions; SVG would need getComputedTextLength
   * for exact metrics and that requires the element to be in DOM. */
  function coordPosFor(svgPx, svgPy, lcx, lcy, text){
    let dirX = lcx >= 0 ? 1 : -1;
    let dirY = lcy >= 0 ? -1 : 1; // SVG y-down: above-cursor for lcy≥0
    const labelW = Math.max(40, text.length * TRACE_LABEL_FONT_PX * 0.6);
    const labelH = TRACE_LABEL_FONT_PX * 1.2;
    // Tentative position with the quadrant-based direction.
    let lx = svgPx + COORD_OFFSET_PX * dirX;
    let ly = svgPy + COORD_OFFSET_PX * dirY;
    // Anchor point: 'start' = left edge at lx; 'end' = right edge at lx.
    let anchor = dirX > 0 ? 'start' : 'end';
    // X-axis flip: would the rightmost / leftmost extent clip past
    // the plot edge? Compute both edges from anchor + width.
    const leftExtent  = anchor === 'start' ? lx : (lx - labelW);
    const rightExtent = anchor === 'start' ? (lx + labelW) : lx;
    if(rightExtent > plotRight){ dirX = -1; }
    else if(leftExtent < plotLeft){ dirX = 1; }
    // Y-axis flip. Baseline 'auto' has the label rising above ly;
    // 'hanging' has it descending below ly. Compute both extents.
    let baseline = dirY < 0 ? 'auto' : 'hanging';
    let topExtent    = baseline === 'auto' ? (ly - labelH) : ly;
    let bottomExtent = baseline === 'auto' ? ly : (ly + labelH);
    if(bottomExtent > plotBottom){ dirY = -1; }
    else if(topExtent < plotTop){ dirY = 1; }
    // Re-derive position with the (possibly flipped) directions.
    lx = svgPx + COORD_OFFSET_PX * dirX;
    ly = svgPy + COORD_OFFSET_PX * dirY;
    anchor   = dirX > 0 ? 'start' : 'end';
    baseline = dirY < 0 ? 'auto' : 'hanging';
    return { x: lx, y: ly, anchor: anchor, baseline: baseline,
             dirX: dirX, dirY: dirY };
  }

  // X-arrow — rendered only when cx ≠ 0. Marker swaps based on
  // sign so the arrowhead always points outward from origin.
  let xLine = null;
  let xLabel = null;
  if(Math.abs(cx) > 1e-9){
    const headId = cx > 0 ? 'gp-trace-head-x-right' : 'gp-trace-head-x-left';
    xLine = _svgEl('line', {
      class: 'gp-trace-arrow gp-trace-arrow-x',
      x1: fromOx.toFixed(2), y1: fromOy.toFixed(2),
      x2: fromPx.toFixed(2), y2: fromOy.toFixed(2),
      'marker-end': 'url(#' + headId + ')'
    });
    g.appendChild(xLine);
    // X label below the x-arrow midpoint, consistent regardless of
    // y direction (per spec: "consistently below if simpler").
    xLabel = _svgEl('text', {
      class: 'gp-trace-label gp-trace-label-x',
      x: ((fromOx + fromPx) / 2).toFixed(2),
      y: (fromOy + X_LABEL_BELOW_PX).toFixed(2),
      'text-anchor': 'middle',
      'dominant-baseline': 'middle'
    });
    xLabel.textContent = 'x = ' + _gpFmtTrace(cx);
    g.appendChild(xLabel);
  }
  // Y-arrow — rendered only when cy ≠ 0. Marker swaps for up vs down.
  let yLine = null;
  let yLabel = null;
  if(Math.abs(cy) > 1e-9){
    // SVG y-down: cy > 0 means the cursor is ABOVE the x-axis,
    // i.e. py < oy, so the line goes UP visually → up-marker.
    const headId = cy > 0 ? 'gp-trace-head-y-up' : 'gp-trace-head-y-down';
    yLine = _svgEl('line', {
      class: 'gp-trace-arrow gp-trace-arrow-y',
      x1: fromPx.toFixed(2), y1: fromOy.toFixed(2),
      x2: fromPx.toFixed(2), y2: fromPy.toFixed(2),
      'marker-end': 'url(#' + headId + ')'
    });
    g.appendChild(yLine);
    // Y label position via yLabelYFor helper — handles Fix 1
    // (parking near x-axis) and the default midpoint case.
    yLabel = _svgEl('text', {
      class: 'gp-trace-label gp-trace-label-y',
      x: (fromPx + Y_LABEL_INSET_PX).toFixed(2),
      y: yLabelYFor(fromPy, fromOy).toFixed(2),
      'text-anchor': 'start',
      'dominant-baseline': 'middle'
    });
    yLabel.textContent = 'y = ' + _gpFmtTrace(cy);
    g.appendChild(yLabel);
  }

  // Cursor — refined "dot with ring" pattern: filled inner circle
  // (r=3) + outer stroked ring (r=5). Fix 3
  // (fix/coord-trace-polish): the inner dot gets a dark
  // var(--s5) stroke so it reads cleanly when the trace cursor
  // sits on a green function curve (default function color and
  // cursor fill are both var(--p), so without the outline the
  // dot disappears into the curve).
  const cursorInner = _svgEl('circle', {
    class: 'gp-trace-cursor-inner',
    cx: fromPx.toFixed(2), cy: fromPy.toFixed(2), r: '3',
    stroke: 'var(--s5)',
    'stroke-width': '1.5'
  });
  const cursorRing = _svgEl('circle', {
    class: 'gp-trace-cursor-ring',
    cx: fromPx.toFixed(2), cy: fromPy.toFixed(2), r: '5'
  });
  g.appendChild(cursorRing);
  g.appendChild(cursorInner);

  // Coordinate label "(x, y)". Fix 4 (fix/coord-trace-polish):
  // decoupled from S.showAllCoords. The trace coord IS the
  // trace's primary output; hiding it when the user toggles
  // "Show coordinates" off in the POINTS card was a coupling
  // bug. User-placed point coord labels remain governed by
  // showAllCoords (see _gpBuildPointsCard). Position via
  // coordPosFor helper which handles Fix 2 edge-aware quadrant
  // flipping.
  const coordText = '(' + _gpFmtTrace(cx) + ', ' + _gpFmtTrace(cy) + ')';
  const fromCoordPos = coordPosFor(fromPx, fromPy, fromCx, fromCy, coordText);
  const coord = _svgEl('text', {
    class: 'gp-trace-coord',
    x: fromCoordPos.x.toFixed(2),
    y: fromCoordPos.y.toFixed(2),
    'text-anchor': fromCoordPos.anchor,
    'dominant-baseline': fromCoordPos.baseline
  });
  coord.textContent = coordText;
  g.appendChild(coord);

  svg.appendChild(g);

  // Animate from FROM → final positions. Each interpAttr call
  // skips when delta is < 0.5px, so segments whose endpoints
  // didn't change snap instantly while changed segments
  // interpolate over 180ms (brief, doesn't queue on rapid keys).
  const DUR = animate ? 180 : 0;
  if(xLine){
    _gpkInterpAttr(xLine, 'x1', fromOx, ox, DUR, isCancelled);
    _gpkInterpAttr(xLine, 'y1', fromOy, oy, DUR, isCancelled);
    _gpkInterpAttr(xLine, 'x2', fromPx, px, DUR, isCancelled);
    _gpkInterpAttr(xLine, 'y2', fromOy, oy, DUR, isCancelled);
  }
  if(xLabel){
    _gpkInterpAttr(xLabel, 'x', (fromOx + fromPx) / 2, (ox + px) / 2, DUR, isCancelled);
    _gpkInterpAttr(xLabel, 'y', fromOy + X_LABEL_BELOW_PX, oy + X_LABEL_BELOW_PX, DUR, isCancelled);
  }
  if(yLine){
    _gpkInterpAttr(yLine, 'x1', fromPx, px, DUR, isCancelled);
    _gpkInterpAttr(yLine, 'y1', fromOy, oy, DUR, isCancelled);
