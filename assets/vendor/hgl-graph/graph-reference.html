/* ==== src/styles/tokens.css ==== */
/* styles/tokens.css — Design tokens, CSS custom properties, box-sizing reset, html/body base */

/* ═══ TOKENS ════════════════════════════════ */
:root{
  --p:#4531d4;--op:#1a4d35;--p2:#abebc9;--p3:#70ad8e;
  --err:#ff716c;--gold:#ffd97d;--info:#79e6ff;
  --s1:#0d0f0d;--s2:#121412;--s3:#181a18;--s4:#1e201e;--s5:#242624;--s6:#2a2d2a;
  --fg:#faf9f5;--fg2:#ababa8;--fg3:#949693;--ov:#474846;
  --wb-bg:#ffffff;--wb-major:rgba(0,0,0,0.10);--wb-minor:rgba(0,0,0,0.05);
  --wb-sz:52px;--wb-border:rgba(190,255,220,0.22);--wb-wm:0.035;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}

/* ==== src/styles/base.css ==== */
/* styles/base.css — Body, form elements, navigation, buttons, pills, builder layout, sidebar, context bar, cards, components */
body{background:var(--s1);color:var(--fg);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;}
button,select,input,textarea{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;}
button{cursor:pointer;border:none;background:none;}
button:active{transform:scale(.95);}
input,textarea,select{color:var(--fg);background:var(--s2);border:1px solid rgba(71,72,70,.35);border-radius:8px;padding:8px 11px;outline:none;font-size:13px;}
input:focus,textarea:focus,select:focus{border-color:rgba(190,255,220,.4);}
input::placeholder,textarea::placeholder{color:var(--fg3);}
.hf{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;}
.ms{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;line-height:1;display:inline-flex;align-items:center;user-select:none;vertical-align:middle;}
.ver{display:none;position:fixed;bottom:8px;right:12px;z-index:999;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);background:var(--s2);border:1px solid var(--ov);border-radius:999px;padding:3px 9px;pointer-events:none;}
/* screens */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--s1);opacity:0;pointer-events:none;transition:opacity .26s;}
.scr.on{opacity:1;pointer-events:all;}
.scroll{overflow-y:auto;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:rgba(190,255,220,.1);border-radius:4px;}
/* top-nav */
.top-nav{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;gap:10px;background:rgba(13,15,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(190,255,220,.08);position:relative;z-index:50;flex-shrink:0;}
.nav-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;}
.bl{height:23px;width:23px;object-fit:contain;}
.nav-title{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--fg);}
.nav-sub{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);}
.nav-links{display:flex;gap:2px;}
.nl{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg2);transition:all .15s;border:1px solid transparent;cursor:pointer;}
.nl:hover{color:var(--p);background:rgba(190,255,220,.05);}
.nl.on{color:var(--p);background:rgba(190,255,220,.09);border-color:rgba(190,255,220,.17);}
.nav-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.av{width:25px;height:25px;border-radius:50%;background:rgba(190,255,220,.08);border:1px solid rgba(190,255,220,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--p);font-size:12px;}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:all .15s;border:none;cursor:pointer;}
.btn:active{transform:scale(.95);}
.btn-p{background:var(--p);color:var(--op);}
.btn-p:hover{box-shadow:0 0 15px rgba(190,255,220,.26);}
.btn-g{background:rgba(26,28,26,.88);color:var(--fg2);border:1px solid rgba(71,72,70,.4);}
.btn-g:hover{color:var(--p);border-color:rgba(190,255,220,.22);}
.btn-e{background:rgba(255,113,108,.11);color:var(--err);border:1px solid rgba(255,113,108,.25);}
.btn-e:hover{background:rgba(255,113,108,.18);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-ghost{background:rgba(190,255,220,.07);color:var(--p);border:1px solid rgba(190,255,220,.18);}
.btn-ghost:hover{background:rgba(190,255,220,.13);}
.btn-silk{background:linear-gradient(135deg,var(--p),var(--p3));color:var(--op);}
.btn-silk:hover{box-shadow:0 0 18px rgba(190,255,220,.22);}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(22,24,22,.92);border:1px solid rgba(190,255,220,.11);font-size:8px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--p);}
.rbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,113,108,.1);border:1px solid rgba(255,113,108,.25);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--err);}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--err);animation:rp 1.2s ease-in-out infinite;flex-shrink:0;}
/* builder */
.bl-layout{display:flex;flex:1;min-height:0;overflow:hidden;}
.sidebar{width:200px;flex-shrink:0;background:var(--s2);border-right:1px solid rgba(190,255,220,.06);display:flex;flex-direction:column;padding:11px 9px;overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(190,255,220,.09);border-radius:4px;}
.sb-lbl{font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--fg3);padding:10px 7px 5px;}
.sbi{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--fg2);cursor:pointer;transition:all .13s;border:1px solid transparent;margin-bottom:1px;}
.sbi:hover{color:var(--fg);background:rgba(190,255,220,.05);}
.sbi.on{color:var(--p);background:rgba(190,255,220,.08);border-color:rgba(190,255,220,.13);}
.sbi.dim{opacity:.28;pointer-events:none;}
.sb-badge{font-size:7px;font-weight:700;padding:2px 5px;border-radius:999px;background:rgba(71,72,70,.5);color:var(--fg3);margin-left:auto;}
.sbi .ms{font-size:14px;}
/* context bar */
.ctx-bar{padding:12px 18px 0;border-bottom:1px solid rgba(71,72,70,.2);background:var(--s2);flex-shrink:0;}
.ctx-bar-lbl{font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--fg3);margin-bottom:9px;}
.ctx-tiles{display:flex;gap:5px;overflow-x:auto;padding-bottom:0;align-items:flex-end;}
.ctx-tiles::-webkit-scrollbar{height:2px;}
.ctx-tiles::-webkit-scrollbar-thumb{background:rgba(190,255,220,.1);border-radius:4px;}
.ctx-tile{display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;flex-shrink:0;position:relative;}
.ctx-thumb{width:76px;height:44px;border-radius:8px 8px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid rgba(71,72,70,.28);border-bottom:none;background:var(--s3);transition:all .14s;overflow:hidden;}
.ctx-thumb:hover{border-color:rgba(190,255,220,.28);background:var(--s4);}
.ctx-tile.sel .ctx-thumb{background:var(--s1);border-color:var(--p);border-bottom:1.5px solid var(--s1);}
.ctx-tile-icon{font-size:14px!important;}
.ctx-tile-name{font-size:7px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);}
.ctx-tile.sel .ctx-tile-name{color:var(--p);}
.ctx-tile.intro-tile.sel .ctx-thumb{border-color:var(--p);}
.ctx-tile.lesson-tile.sel .ctx-thumb{border-color:var(--info);}
.ctx-tile.lesson-tile.sel .ctx-tile-name{color:var(--info);}
.ctx-tile.outro-tile.sel .ctx-thumb{border-color:var(--p2);}
.ctx-tile.outro-tile.sel .ctx-tile-name{color:var(--p2);}
.ctx-strip{height:2.5px;width:100%;background:transparent;border-radius:999px 999px 0 0;}
.ctx-tile.sel.intro-tile .ctx-strip{background:var(--p);}
.ctx-tile.sel.lesson-tile .ctx-strip{background:var(--info);}
.ctx-tile.sel.outro-tile .ctx-strip{background:var(--p2);}
.ctx-add-btn{width:40px;height:44px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(190,255,220,.17);border-bottom:none;background:transparent;color:rgba(190,255,220,.28);transition:all .14s;font-size:14px;cursor:pointer;}
.ctx-add-btn:hover{border-color:var(--p);color:var(--p);}
/* context panels */
.ctx-panel-wrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--s1);}
.ctx-panel{display:none;flex:1;overflow-y:auto;padding:18px 20px;}
.ctx-panel.on{display:flex;flex-direction:column;gap:12px;animation:pfade .2s ease-out both;}
.ctx-panel::-webkit-scrollbar{width:4px;}
.ctx-panel::-webkit-scrollbar-thumb{background:rgba(190,255,220,.09);border-radius:4px;}
.ctx-actions{flex-shrink:0;padding:10px 20px;border-top:1px solid rgba(71,72,70,.18);background:var(--s2);display:flex;align-items:center;gap:7px;}
/* cards */
.card{background:var(--s3);border-radius:11px;border:1px solid rgba(71,72,70,.26);padding:14px;}
.clbl{font-size:9px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--p2);margin-bottom:7px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.tc{background:var(--s4);border-radius:9px;border:1px solid rgba(71,72,70,.22);padding:12px;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:6px;}
.tc:hover{border-color:rgba(190,255,220,.16);}
.tc.on{border-color:rgba(190,255,220,.25);background:rgba(190,255,220,.025);}
.tc-row{display:flex;justify-content:space-between;align-items:flex-start;}
.tc-ico{width:28px;height:28px;border-radius:7px;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--p);font-size:14px;}
.sw{width:28px;height:16px;border-radius:999px;background:var(--s5);position:relative;flex-shrink:0;transition:background .17s;}
.sw.on{background:var(--p);}
.sw-t{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .17s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
.sw.on .sw-t{transform:translateX(12px);}
.tc-n{font-weight:700;font-size:11px;color:var(--fg);}
.tc-d{font-size:10px;color:var(--fg2);line-height:1.38;}
.qbi{background:var(--s4);border-radius:7px;border:1px solid rgba(71,72,70,.2);padding:8px 10px;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.qbn{width:17px;height:17px;border-radius:4px;background:rgba(190,255,220,.09);border:1px solid rgba(190,255,220,.15);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--p);flex-shrink:0;}
.qbt{flex:1;font-size:11px;color:var(--fg2);}
.qbtype{font-size:7px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:rgba(190,255,220,.08);color:var(--p);flex-shrink:0;}
.qb-del{color:var(--fg3);font-size:11px;cursor:pointer;transition:color .12s;}
.qb-del:hover{color:var(--err);}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:rgba(190,255,220,.07);border:1px solid rgba(190,255,220,.12);font-size:10px;font-weight:600;color:var(--p);cursor:pointer;}
.chip:hover{background:rgba(190,255,220,.13);}
.qt-pill{padding:5px 10px;border-radius:6px;font-size:10px;font-weight:700;background:var(--s4);color:var(--fg2);border:1px solid rgba(71,72,70,.22);cursor:pointer;transition:all .12s;}
.qt-pill.on{background:rgba(190,255,220,.09);color:var(--p);border-color:rgba(190,255,220,.22);}
.asset-thumb{aspect-ratio:16/9;border-radius:6px;background:var(--s4);border:1px solid rgba(71,72,70,.26);overflow:hidden;cursor:pointer;transition:border-color .14s;position:relative;}
.asset-thumb:hover{border-color:rgba(190,255,220,.26);}
.asset-thumb img{width:100%;height:100%;object-fit:cover;opacity:.74;}
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.logo-disp{width:60px;height:60px;border-radius:9px;border:1px solid rgba(190,255,220,.16);background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* ==== src/styles/graph-panel.css ==== */
/* styles/graph-panel.css — Graph Panel widget (PR-Widget-Graph-A)
 * Selectors namespaced .gp-* for authoring UI + runtime panel. */

/* ── Config panel (widgets screen right column) ────────────── */
.gp-cfg-sec{
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px dashed rgba(71,72,70,.28);
}
.gp-cfg-sec:last-child{ border-bottom: none; padding-bottom: 0; }
.gp-cfg-lbl{
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg2, #b6b9b1);
  margin-bottom: 6px;
}
.gp-cfg-hdr{
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gp-cfg-count{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 9px;
  color: var(--fg3, #949693);
  font-weight: 800;
  letter-spacing: 0;
  text-transform: none;
}
.gp-empty{
  font-size: 10px;
  color: var(--fg3, #949693);
  font-style: italic;
  text-align: center;
  padding: 8px 6px;
}

/* Viewport grid — X/Y min/max */
.gp-range-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.gp-range-grid label{
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.gp-range-grid span{
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--fg3, #949693);
}
.gp-range-grid input[type="number"],
.gp-step-row input[type="number"],
.gp-pt-row input[type="number"],
.gp-pt-row input[type="text"],
.gp-fn-row input[type="text"]{
  padding: 5px 7px;
  border-radius: 5px;
  background: var(--s5, #242624);
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg, #e5e6e3);
  font-family: inherit;
  font-size: 10px;
  min-width: 0;
}
.gp-fn-row input[type="text"]{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
}
.gp-range-grid input:focus,
.gp-step-row input:focus,
.gp-pt-row input:focus,
.gp-fn-row input:focus{
  border-color: color-mix(in srgb, var(--p, #4531d4) 45%, rgba(71,72,70,.3));
  outline: none;
}

.gp-toggle-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 10px;
  color: var(--fg, #e5e6e3);
}

.gp-step-row{
  display: grid;
  grid-template-columns: 80px 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.gp-step-row span{
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--fg2, #b6b9b1);
}

/* Function rows */
.gp-fn-row,
.gp-pt-row{
  display: grid;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
}
/* feat/graph-point-selection-beta: sidebar row mirrors plot
 * selection. Subtle accent fill + border so the row reads as
 * "this is the currently selected point" without competing with
 * the form chrome inside. */
.gp-pt-row.selected{
  background: rgba(190, 255, 220, 0.10);
  border-left: 2px solid var(--p, #4531d4);
  border-radius: 3px;
}
.gp-cfg .gp-fn-row{
  /* Keep authoring errors on the second grid row: the runtime list below
     shares gp-fn-row but uses flex, which would squeeze this input. */
  display: grid;
  grid-template-columns: 36px 1fr 24px 20px;
}
/* Parse-error row highlights the invalid expression input with a
 * soft error tint plus an inline message spanning the whole row. */
.gp-fn-row.gp-fn-err .gp-fn-expr{
  border-color: color-mix(in srgb, var(--err, #ff7166) 55%, rgba(71,72,70,.3));
  background: color-mix(in srgb, var(--err, #ff7166) 8%, var(--s5, #242624));
}
.gp-fn-err-msg{
  grid-column: 1 / -1;
  font-size: 9px;
  color: var(--err, #ff7166);
  font-style: italic;
  padding: 2px 0 0 44px;
  line-height: 1.3;
}
.gp-fn-idx{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0;
}
.gp-fn-visible,
.gp-fn-remove,
.gp-pt-remove,
.gp-pt-style{
  background: transparent;
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg3, #949693);
  border-radius: 4px;
  cursor: pointer;
  padding: 2px 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.gp-fn-visible.on{
  color: var(--p, #4531d4);
  border-color: color-mix(in srgb, var(--p, #4531d4) 40%, rgba(71,72,70,.3));
}
.gp-fn-remove:hover,
.gp-pt-remove:hover{
  background: color-mix(in srgb, var(--err, #ff7166) 18%, transparent);
  color: var(--err, #ff7166);
  border-color: color-mix(in srgb, var(--err, #ff7166) 45%, transparent);
}
.gp-pt-row{
  grid-template-columns: 18px auto auto 1fr 22px 20px;
}
.gp-pt-idx{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 9px;
  color: var(--p, #4531d4);
  font-weight: 800;
}
.gp-pt-xy{
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 8px;
  color: var(--fg3, #949693);
  font-weight: 700;
  text-transform: uppercase;
}
.gp-pt-xy input{ width: 48px; }
/* Scoped to the authoring (widgets-screen) input field — the
 * label INPUT needs to fill the remaining row width alongside
 * the fixed-width x/y inputs and style/remove buttons. The
 * runtime sidebar list also uses .gp-pt-label but as a <span>
 * inside a flex row; setting width:100% there pushed the coord
 * span and delete button off-screen and produced a horizontal
 * scrollbar on the points list. Restricting to the input variant
 * leaves the runtime span sized to its content as expected by
 * the flex-row rules below (line ~535). */
input.gp-pt-label{ width: 100%; }
.gp-pt-dot{
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: currentcolor;
}
.gp-pt-dot.open{
  background: transparent;
  border: 1.5px solid currentcolor;
}
.gp-pt-style.on{
  color: var(--p, #4531d4);
  border-color: color-mix(in srgb, var(--p, #4531d4) 40%, rgba(71,72,70,.3));
}

.gp-pills{ display: flex; flex-wrap: wrap; gap: 3px; }
.gp-slider-row{
  display: grid;
  grid-template-columns: 60px 1fr 50px;
  align-items: center;
  gap: 8px;
}
.gp-range-lbl{
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--fg2, #b6b9b1);
}
.gp-range-val{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 9px;
  color: var(--fg2, #b6b9b1);
  text-align: right;
}
.gp-pos-grid{
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 4px;
  width: fit-content;
}

/* ── Runtime panel (lesson canvas) ────────────────────────── */

.gp-panel{
  display: none;
  overflow: hidden;
  background: var(--s3, #191b19);
  border: 1px solid rgba(71,72,70,.3);
  border-radius: 8px;
  box-shadow: 0 12px 40px -12px rgba(0,0,0,.6);
  z-index: 40;
}
.gp-panel.on{ display: flex; flex-direction: column; }
/* Round-B3: header is a title + close row, NOT the drag surface.
 * Drag lives on the green .wp-drag bar above it. user-select:none
 * stays so clicks on the title don't accidentally highlight text.
 * PR-5 (feedback #11): touch-action:none was removed — it was
 * copied from the pre-Round-B3 era when the header itself drove
 * drag. With the .wp-drag bar owning the gesture, the header
 * should let normal touch scrolling / pinch-zoom pass through.
 * Padding scales via cqi so the header feels proportional on
 * large resizes. */
.gp-hdr{
  display: flex;
  align-items: center;
  gap: clamp(4px, 2cqi, 10px);
  padding: clamp(5px, 1.8cqi, 10px) clamp(8px, 2.5cqi, 14px);
  background: var(--s4, #242624);
  border-bottom: 1px solid rgba(71,72,70,.3);
  user-select: none;
}
.gp-hdr-title{
  flex: 1;
  /* Container-query clamped so the title reads proportionally at
   * every panel width — was 9px fixed before Round-B round-2. */
  font-size: clamp(9px, 2.5cqi, 12px);
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg3, #949693);
}
.gp-close{
  background: transparent;
  border: none;
  color: var(--fg3, #949693);
  padding: 2px;
  border-radius: 4px;
  cursor: pointer;
}
.gp-close:hover{ color: var(--fg, #e5e6e3); background: var(--s5, #242624); }
.gp-sidebar-toggle{
  background: transparent;
  border: none;
  color: var(--fg3, #949693);
  padding: 2px;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 4px;
}
.gp-sidebar-toggle:hover{ color: var(--fg, #e5e6e3); background: var(--s5, #242624); }
.gp-body{ padding: 8px; }

/* ── Round B #6: two-column sidebar + plot layout ───────────────── */
.gp-body-twocol{
  display: flex;
  gap: 8px;
  padding: 8px;
  /* Round-B3 round-2: two-col body must fill remaining panel height so
   * the plot column's flex:1 + .gp-plotwrap flex:1 actually translate
   * into vertical growth when the teacher enlarges the panel. Without
   * flex:1 + min-height:0 here the body only takes its intrinsic
   * height and the plot stays pinned to its min-height. */
  flex: 1;
  min-height: 0;
}
.gp-body-twocol.gp-sidebar-off .gp-sidebar{
  display: none;
}
.gp-sidebar{
  /* Round-B round-2: sidebar width scales with panel so wider
   * panels get more readable card content without teachers
   * feeling like they're squinting. Clamped so on the small
   * preset it stays narrow enough to leave room for the plot,
   * and on the large preset doesn't eat half the widget. */
  width: clamp(160px, 28cqi, 240px);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(4px, 1.5cqi, 8px);
  max-height: 100%;
  overflow-y: auto;
  /* Cleaner scroll track on dark panel. */
  scrollbar-width: thin;
}
.gp-plotcol{
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.gp-plotwrap{
  position: relative;
  /* Round-B3: flex:1 + min-height makes the wrapper fill the plot
   * column. SVG + drawing canvas inside stretch to 100% via the
   * existing rules below. Drag-resize grows the panel, the flex
   * chain propagates the new size down to the plot surface, no
   * rerender required. min-height keeps the plot usable even on
   * tall narrow panels where the header + runtime input would
   * otherwise eat most of the vertical space. */
  flex: 1;
  min-height: 220px;
  /* SVG + canvas overlay share this wrapper — canvas is absolute
   * so it stacks on top without affecting layout. */
}
.gp-plotwrap .gp-svg{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
.gp-plotwrap .gp-draw{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  /* Allow pointer events so the canvas catches strokes, but
   * background stays transparent so the SVG plot shows through. */
  background: transparent;
  touch-action: none;
  cursor: crosshair;
}
/* fix/graph-canvas-honor-select-tool: select-tool pass-through.
 * Mirrors .dc.sel (canvas.js) and .qoverlay.sel (image annotation
 * overlay). When the select tool is active in the pen bar, the
 * graph drawing canvas yields pointer events so the user isn't
 * unintentionally drawing on the plot. The cursor reverts to the
 * default browser pointer so the select intent is visually clear. */
.gp-plotwrap .gp-draw.sel{
  pointer-events: none;
  cursor: default;
  border-radius: 4px;
}

/* Sidebar cards */
.gp-card{
  background: var(--s5, #242624);
  border: 1px solid rgba(71,72,70,.28);
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
}
.gp-card-head{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--s4, #242624);
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid rgba(71,72,70,.22);
}
.gp-card-head:hover{ background: color-mix(in srgb, var(--p, #4531d4) 5%, var(--s4, #242624)); }
.gp-card-head:focus-visible{ outline: 2px solid var(--p, #4531d4); outline-offset: -2px; }
/* Two-class selectors (.gp-card-head .gp-card-icon / .gp-card-head
 * .gp-card-chevron) lift specificity over the single-class .ms
 * Material-Symbols base rule so the container-query font sizes win
 * on specificity alone — no !important needed. Same pattern as
 * .coin-flipbtn .coin-flipbtn-ico in lesson-runtime.css. */
.gp-card-head .gp-card-icon{
  font-size: 14px;
  color: var(--p, #4531d4);
  flex-shrink: 0;
  /* Defensive: if an unknown Material Icon name is passed, the span
   * would otherwise render the literal string and push the title
   * out of the card. Constrain the icon slot so a bad name renders
   * as an empty square instead of overflowing sibling layout. */
  width: 14px;
  max-width: 14px;
  overflow: hidden;
  white-space: nowrap;
}
.gp-card-title{
  flex: 1;
  min-width: 0;                 /* allow shrink inside flex parent */
  font-size: clamp(9px, 2.5cqi, 12px);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg2, #b6b9b1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gp-card-head .gp-card-chevron{
  font-size: clamp(12px, 3.5cqi, 16px);
  color: var(--fg3, #949693);
  flex-shrink: 0;
}
.gp-card-body{
  padding: clamp(5px, 1.8cqi, 10px) clamp(6px, 2cqi, 11px);
  display: flex;
  flex-direction: column;
  gap: clamp(3px, 1.2cqi, 7px);
}
.gp-card-collapsed .gp-card-body{ display: none; }
.gp-card-stub{
  font-size: 9px;
  color: var(--fg3, #949693);
  font-style: italic;
  line-height: 1.4;
}
.gp-card-row{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--fg, #e5e6e3);
}
.gp-card-toggle{ justify-content: flex-start; }
.gp-card-toggles{
  flex-wrap: wrap;
  font-size: 9px;
}
.gp-card-toggles label{ display: inline-flex; align-items: center; gap: 4px; }
.gp-card-pills{
  flex-wrap: wrap;
  font-size: 9px;
  color: var(--fg2, #b6b9b1);
}
.gp-pill{
  padding: 2px 8px;
  border-radius: 4px;
  background: transparent;
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg2, #b6b9b1);
  cursor: pointer;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.gp-pill.on{
  background: var(--p, #4531d4);
  color: var(--op, #0d1a12);
  border-color: var(--p, #4531d4);
}
.gp-pill-spacer{ color: var(--fg3, #949693); margin: 0 2px; }

.gp-card-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.gp-card-grid label{
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 8px;
  font-weight: 700;
  color: var(--fg3, #949693);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.gp-card-grid input,
.gp-card-row input[type="text"],
.gp-card-row input[type="number"],
.gp-card-row select{
  padding: 3px 6px;
  background: var(--s6, #151715);
  border: 1px solid rgba(71,72,70,.28);
  border-radius: 4px;
  color: var(--fg, #e5e6e3);
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 10px;
  min-width: 0;
}

/* Per-card list styling — shared between Functions, Points, Arcs. */
.gp-fn-list,
.gp-pt-list,
.gp-arc-list{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 120px;
  overflow-y: auto;
}
.gp-fn-row,
.gp-pt-row,
.gp-arc-row{
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 2px;
  font-size: 9px;
  color: var(--fg, #e5e6e3);
}
.gp-fn-swatch,
.gp-arc-dot{
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.gp-arc-dot{ border-radius: 50%; }
.gp-fn-expr,
.gp-pt-label,
.gp-pt-coord,
.gp-arc-summary{
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
}
.gp-pt-label{ flex: 0 0 auto; font-weight: 700; }
.gp-fn-vis,
.gp-fn-del,
.gp-pt-del,
.gp-arc-del{
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--fg3, #949693);
  font-size: 12px !important;
  padding: 2px;
  line-height: 1;
  border-radius: 3px;
}
.gp-fn-vis:hover{ color: var(--fg, #e5e6e3); }
.gp-fn-del:hover,
.gp-pt-del:hover,
.gp-arc-del:hover{
  color: var(--err, #ff7166);
}

.gp-pt-add,
.gp-arc-add{
  gap: 3px;
}
.gp-pt-add input{ flex: 1; }
.gp-pt-add .gp-pt-l{ flex: 1.2; }
.gp-pt-addbtn,
.gp-arc-addbtn{
  padding: 3px 8px;
  border-radius: 4px;
  background: transparent;
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg2, #b6b9b1);
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}
.gp-pt-addbtn:hover,
.gp-arc-addbtn:hover{
  color: var(--p, #4531d4);
  border-color: color-mix(in srgb, var(--p, #4531d4) 40%, rgba(71,72,70,.3));
}

/* Batch 3B: direction toggle pills (CCW ↺ / CW ↻) in the arc card.
 * Lives inline on each .gp-arc-row and on the add-row so teachers
 * can flip an existing arc's direction OR seed a new arc with the
 * intended direction. Visually: two small segmented pills, the
 * active one tinted with --p to reinforce the theme-green treatment
 * used in the plot render. */
.gp-arc-dir{
  display: inline-flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
  border: 1px solid rgba(71,72,70,.3);
  border-radius: 5px;
  overflow: hidden;
}
.gp-arc-dir-btn{
  background: transparent;
  border: none;
  color: var(--fg2, #b6b9b1);
  padding: 2px 6px;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  /* Separator between the two pills. Using border-right on the
   * first button keeps the outer border-radius clean. */
}
.gp-arc-dir-btn + .gp-arc-dir-btn{
  border-left: 1px solid rgba(71,72,70,.3);
}
.gp-arc-dir-btn:hover{
  color: var(--fg, #e5e6e3);
  background: var(--s5, #242624);
}
/* Keyboard focus ring. The parent .gp-arc-dir has overflow:hidden
 * (to keep the segmented-pill border-radius clean on both ends),
 * which would clip a standard outline. An inset outline + z-index
 * bump puts the ring on top of the pill background at the edge
 * without escaping the container. Inset because outline-offset
 * negative keeps it inside the pill's bounds. */
.gp-arc-dir-btn:focus-visible{
  outline: 2px solid var(--p, #4531d4);
  outline-offset: -2px;
  position: relative;
  z-index: 1;
}
.gp-arc-dir-btn.on{
  background: color-mix(in srgb, var(--p, #4531d4) 22%, transparent);
  color: var(--p, #4531d4);
}

.gp-preset-btn{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--p, #4531d4) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--p, #4531d4) 35%, transparent);
  color: var(--p, #4531d4);
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
}
.gp-preset-btn:hover{
  background: color-mix(in srgb, var(--p, #4531d4) 22%, transparent);
}
/* Active state — preset is currently applied. Solid accent fill
 * inverts the foreground/background relationship so the button
 * reads unambiguously as "on" against the surrounding sidebar.
 * fix/graph-unit-circle-toggle. */
.gp-preset-btn.on{
  background: var(--p, #4531d4);
  color: var(--s5, #242624);
  border-color: var(--p, #4531d4);
}
.gp-preset-btn.on:hover{
  background: color-mix(in srgb, var(--p, #4531d4) 88%, white);
}
.gp-preset-btn .ms{ font-size: 14px; }

/* Angle arc rendering — Batch 3B refresh.
 *
 * Color + sizing contract:
 *   - Fill + stroke hardcoded to var(--p) (theme accent green).
 *     --p maps to #4531d4 on dark, #246944 on light via the existing
 *     .gp-panel.gp-light scoping — so arcs auto-adapt without per-
 *     theme rules.
 *   - Fill opacity 0.22: visible translucent sector that lets the
 *     plot grid / functions show through. Stroke stays at full
 *     opacity to keep the arc boundary crisp.
 *   - Stroke-width 2.5px (up from 1.5): legible at 1080p video
 *     playback distance. vector-effect:non-scaling-stroke keeps the
 *     width constant across graph zoom, since teachers may scale
 *     the plot during a recording.
 *   - Labels 15px (up from 9px): tuned for video readability, and
 *     the inside-sector placement at 60% radius gives them room.
 *
 * per-arc stored color (arc.color) still drives the sidebar swatch
 * but NOT the plot render — that's intentional, spec requires all
 * arcs to share the theme-green treatment for visual consistency.
 */
.gp-arc{
  fill: none;
  stroke: var(--p, #4531d4);
  stroke-width: 2.5;
  vector-effect: non-scaling-stroke;
}
.gp-arc-fill{
  fill: var(--p, #4531d4);
  fill-opacity: 0.22;
  stroke: none;
}
/* Initial + terminal rays: thin accent lines so the arc's bounding
 * sides are visually clear without competing with the arc itself.
 * 1.5px weight reads as "reference geometry" rather than "primary
 * curve". opacity 0.8 so they recede slightly against a plotted
 * function if one happens to cross. */
.gp-arc-ray{
  stroke: var(--p, #4531d4);
  stroke-width: 1.5;
  stroke-opacity: 0.8;
  vector-effect: non-scaling-stroke;
  fill: none;
}
.gp-arc-hash{
  stroke: var(--p, #4531d4);
  stroke-width: 2.5;
  vector-effect: non-scaling-stroke;
}
.gp-arc-label{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 15px;
  font-weight: 700;
  /* Fill: use --fg so the text adapts between dark mode (near-white
   * on the dark/lime fill) and light mode (near-black on the light/
   * deep-green fill). paint-order + stroke gives a contrasting halo
   * so the label stays legible even when the bisector lands directly
   * on top of the stroked arc boundary. */
  fill: var(--fg, #e5e6e3);
  paint-order: stroke;
  stroke: var(--s5, #242624);
  stroke-width: 3;
  stroke-linejoin: round;
}

/* Point style variants */
.gp-point-square,
.gp-point-triangle{
  stroke-width: 1.2;
}

/* ════════════════════════════════════════════════════════════════
 * Coordinate Trace overlay (Batch 4E)
 * Pedagogical aid for live demonstration: a movable cursor on the
 * plot decomposes its (x, y) into x-arrow + y-arrow from the origin.
 * x-arrow uses --p (theme accent green); y-arrow uses #5afcd3 (a
 * fixed teal) so the two axes are color-distinct at a glance and
 * read as "horizontal" vs "vertical" in both light and dark themes.
 *
 * Animation: per-segment RAF interpolation from previous → current
 * positions (see _gpkInterpAttr in graphPanel.js). Segments whose
 * endpoints didn't change snap instantly via the < 0.5px skip; the
 * rest ease in over ~180ms. This gives stable step-vs-jump motion
 * without replaying the full draw-out from origin every move.
 *
 * The label halo (paint-order:stroke + thick --s5 stroke) matches
 * the angle-arc label treatment so the two teaching overlays read
 * with consistent typography.
 * ════════════════════════════════════════════════════════════════ */
.gp-trace-arrow{
  fill: none;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
}
.gp-trace-arrow-x{ stroke: var(--p, #4531d4); }
.gp-trace-arrow-y{ stroke: #5afcd3; }
/* Arrowhead polylines: stroke-only (no fill) for a minimal
 * line-style ">" head that matches the arrow's own weight. */
.gp-trace-arrow-x-head{
  fill: none;
  stroke: var(--p, #4531d4);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.gp-trace-arrow-y-head{
  fill: none;
  stroke: #5afcd3;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
/* Cursor: small inner filled dot (theme green) inside a thin ring
 * of the same color. Both follow the live point in --p so the
 * cursor reads as one continuous accent in light + dark themes. */
.gp-trace-cursor-inner{
  fill: var(--p, #4531d4);
  stroke: none;
}
.gp-trace-cursor-ring{
  fill: none;
  stroke: var(--p, #4531d4);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.gp-trace-label,
.gp-trace-coord{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 15px;
  font-weight: 700;
  fill: var(--fg, #e5e6e3);
  paint-order: stroke;
  stroke: var(--s5, #242624);
  stroke-width: 3;
  stroke-linejoin: round;
}
.gp-trace-coord{ font-size: 15px; }

/* Snappable point row (when coord trace is on) — the label +
 * coord pair becomes a real <button> for native keyboard
 * activation (Enter/Space). Reset button chrome so it visually
 * matches the original span layout, then add hover tint + cursor
 * to communicate clickability. */
.gp-pt-snap{
  display: contents;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-align: inherit;
}
.gp-pt-snap:hover .gp-pt-label,
.gp-pt-snap:hover .gp-pt-coord{
  color: var(--p, #4531d4);
}
.gp-pt-snap:focus-visible{
  outline: 2px solid var(--p, #4531d4);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Minor gridline */
.gp-grid.gp-grid-minor{
  stroke: rgba(190,255,220,.035);
  stroke-width: 0.75;
}

/* SVG plotter */
.gp-svg{
  display: block;
  width: 100%;
  height: auto;
  background: var(--s5, #242624);
  border-radius: 4px;
}
.gp-bg{
  fill: var(--s5, #242624);
}
.gp-grid{
  stroke: rgba(190,255,220,.08);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.gp-axis{
  stroke: rgba(190,255,220,.38);
  stroke-width: 1.2;
  vector-effect: non-scaling-stroke;
}
/* Count badge in a card header — survives collapsing, which is its purpose:
 * it is how a teacher tells which card owns an object on the plot without
 * opening each card in turn. */
.gp-card-count{
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 800;
  line-height: 16px;
  color: var(--bg);
  background: var(--p);
}
/* The axes' four arrowheads. FILL, not stroke: they are filled polygons, and
 * a marker does not inherit its referencing line's stroke, so this has to be
 * stated rather than left to the cascade. Kept at the same colour as .gp-axis
 * so the head reads as the end of the axis rather than as a separate mark —
 * including in the light theme, which overrides .gp-axis below and would
 * otherwise leave four mint arrowheads on a white plot. */
.gp-axis-head{
  fill: rgba(190,255,220,.38);
}
/* Major tick marks at labeled positions on each axis. Same colour
 * as .gp-axis (reads as part of the axis), 1.0 vs 1.2 so the
 * axis line stays primary. fix/graph-axis-ticks. */
.gp-tick{
  stroke: rgba(190,255,220,.38);
  stroke-width: 1.0;
  vector-effect: non-scaling-stroke;
}
.gp-tick-label{
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 9px;
  fill: rgba(230, 231, 227, .55);
  pointer-events: none;
}
.gp-curve{
  fill: none;
  stroke-width: 1.75;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* Subtle drop so the curve reads over the grid. */
  filter: drop-shadow(0 0 2px rgba(0,0,0,.4));
}
.gp-point{
  fill: var(--p, #4531d4);
  stroke: rgba(0,0,0,.6);
  stroke-width: 1.2;
}
.gp-point.open{
  fill: var(--s5, #242624);
  stroke: var(--p, #4531d4);
  stroke-width: 2;
}
/* feat/graph-point-selection-beta: 2px accent stroke ring at 10px
 * radius, rendered BEFORE the point so paint order places it
 * behind. pointer-events:none lets clicks on the ring fall
 * through to the point underneath (which carries the
 * data-gp-pt-id attribute the selection handler reads). */
.gp-point-selection-ring{
  fill: transparent;
  stroke: var(--p, #4531d4);
  stroke-width: 2;
  pointer-events: none;
}
.gp-point-label{
  font-family: Manrope, ui-sans-serif,system-ui,sans-serif;
  font-size: 10px;
  font-weight: 700;
  fill: var(--fg, #e5e6e3);
  paint-order: stroke;
  stroke: var(--s5, #242624);
  stroke-width: 2;
  stroke-linejoin: round;
  pointer-events: none;
}

/* ── Runtime expression input (PR Round-A widget-free-drag) ───────
 * Injected inside .gp-body under the SVG. Teachers type live during
 * a lesson; parse errors surface inline below the input. */
.gp-rt-wrap{
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(71,72,70,.3);
}
.gp-rt-input{
  display: flex;
  gap: 4px;
}
.gp-rt-input input[type="text"]{
  flex: 1;
  padding: 5px 7px;
  border-radius: 5px;
  background: var(--s5, #242624);
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg, #e5e6e3);
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 11px;
}
.gp-rt-input input[type="text"]:focus{
  border-color: color-mix(in srgb, var(--p, #4531d4) 45%, rgba(71,72,70,.3));
  outline: none;
}
.gp-rt-input input[type="text"].gp-rt-bad{
  border-color: color-mix(in srgb, var(--err, #ff7166) 55%, rgba(71,72,70,.3));
  background: color-mix(in srgb, var(--err, #ff7166) 8%, var(--s5, #242624));
}
.gp-rt-input button{
  padding: 4px 10px;
  border-radius: 4px;
  background: transparent;
  border: 1px solid rgba(71,72,70,.3);
  color: var(--fg2, #b6b9b1);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: color 120ms, border-color 120ms, background 120ms;
}
.gp-rt-input button:hover{
  color: var(--p, #4531d4);
  border-color: color-mix(in srgb, var(--p, #4531d4) 40%, rgba(71,72,70,.3));
}
.gp-rt-err{
  margin-top: 4px;
  font-size: 9px;
  color: var(--err, #ff7166);
  font-style: italic;
  line-height: 1.3;
}
.gp-rt-list{
  list-style: none;
  padding: 0;
  margin: 6px 0 0;
  max-height: 96px;
  overflow: auto;
}
.gp-rt-item{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px;
  font-size: 10px;
  color: var(--fg, #e5e6e3);
}
.gp-rt-swatch{
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.gp-rt-expr-lbl{
  flex: 1;
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gp-rt-del{
  background: transparent;
  border: none;
  color: var(--fg3, #949693);
  cursor: pointer;
  font-size: 14px;
  padding: 0 4px;
  line-height: 1;
}
.gp-rt-del:hover{
  color: var(--err, #ff7166);
}

/* ── Resize handles for free-drag widgets ─────────────────────────
 * Single corner handle at bottom-right of any widget panel that
 * opts into shared drag+resize via wireWidgetDrag. The diagonal
 * gradient reads as a draggable "corner" at small sizes.
 *
 * Sized to 22px so the touch target is comfortably hittable on
 * hybrid stylus/touch devices (the primary teaching surface is a
 * Surface-class tablet) while still looking like a subtle corner
 * cue on desktop — 44px WCAG would feel too chunky on a widget
 * no bigger than 280px wide. */
.gp-resize,
.coin-resize,
.calc-resize{
  position: absolute;
  right: 0;
  bottom: 0;
  width: 22px;
  height: 22px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 60%, rgba(190,255,220,.4) 60%);
  border-bottom-right-radius: 4px;
  z-index: 2;
  touch-action: none;
}
.gp-resize:hover,
.coin-resize:hover,
.calc-resize:hover{
  background: linear-gradient(135deg, transparent 60%, rgba(190,255,220,.75) 60%);
}

/* ══ LIGHT MODE (scoped to graph widget only) ═══════════════════════
 * Per-widget theme flip — toggled via S.lightMode on the runtime
 * panel root (applyGraphPanelFromState adds/removes .gp-light on
 * .gp-panel). CSS custom properties cascade to descendants only, so
 * overriding --s3/s4/s5/fg/fg2/fg3/ov/p/op here swaps the graph's
 * chrome, cards, inputs, plot backdrop, AND accent green without
 * touching the global theme. Other widgets (calc, coin, image) keep
 * their dark surfaces because none of them inherit from #graph-p.
 *
 * Accent `--p` is scoped to a deeper green (#246944) rather than
 * kept at the lime #4531d4. At 1.08:1 on the light --s5 surface the
 * lime is effectively invisible wherever the CSS uses `color:var(--p)`
 * (22 sites: card-head focus outline, pill text, preset-btn text,
 * close/sidebar hover, point fill fallback, etc.). #246944 preserves
 * the green hue identity while achieving AA normal (5.3-6.3:1) on
 * every light surface. Companion --op swap ensures text-on-green-
 * button (.gp-pill.on) stays readable against the deeper bg — the
 * current --op #1a4d35 would collapse to 1.47:1 against #246944.
 *
 * Grid / axis / tick-label rules use hardcoded rgba lime tints and
 * need direct overrides — those four rules follow the token block. */
.gp-panel.gp-light{
  --s3: #f5f4f0;       /* panel bg */
  --s4: #e8e7e3;       /* header */
  --s5: #fafaf7;       /* card bg, input bg, plot backdrop */
  --s6: #f0efe9;       /* runtime card inputs/selects (Viewport,
                        * Points, Arcs editors). Slightly darker
                        * than --s5 so input fields have a visible
                        * trough against the card around them. */
  --fg: #1a1a19;       /* primary text */
  --fg2: #4a4a47;      /* secondary */
  --fg3: #68685f;      /* muted (AA-normal margin vs tighter #72726f) */
  --ov: #c8c7c3;       /* borders */
  --p:  #4531d4;       /* deeper brand green — AA on all light surfaces */
  --op: #fafaf7;       /* text on green button (was #1a4d35 dark green) */
}
/* SVG rules below hardcode lime-rgba strokes/fills. Override with
 * neutral blacks scaled by the same alpha-ish intent so the plot
 * grid reads as "subtle scaffolding" in both themes. */
.gp-panel.gp-light .gp-grid{ stroke: rgba(0,0,0,.09); }
.gp-panel.gp-light .gp-grid.gp-grid-minor{ stroke: rgba(0,0,0,.045); }
.gp-panel.gp-light .gp-axis{ stroke: rgba(0,0,0,.55); }
.gp-panel.gp-light .gp-axis-head{ fill: rgba(0,0,0,.55); }
.gp-panel.gp-light .gp-tick{ stroke: rgba(0,0,0,.55); }
.gp-panel.gp-light .gp-tick-label{ fill: rgba(0,0,0,.65); }

/* Function color swatch button — opens the Apply popover. Button
 * is a zero-chrome wrapper around the existing .gp-fn-swatch so the
 * visual stays identical to the pre-edit swatch; only cursor +
 * focus state signal that it's interactive. Keyboard focus ring
 * lands on the button itself (native outline), so no extra
 * focus-within machinery is needed here — the previous hidden
 * <input type="color"> pattern needed that because the real
 * focusable element was opacity:0. */
.gp-fn-swatch-btn{
  background: transparent;
  border: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  border-radius: 3px;
}
.gp-fn-swatch-btn:hover .gp-fn-swatch{ transform: scale(1.15); }
.gp-fn-swatch-btn:focus-visible{
  outline: 2px solid var(--p, #4531d4);
  outline-offset: 2px;
}
.gp-fn-swatch-btn .gp-fn-swatch{ transition: transform .12s; }

/* Color picker Apply popover. Floating above the sidebar scroll
 * container (position:fixed, z-index above the panel z:40). Contains
 * a native <input type="color"> for the OS-native hue/sat UI, a
 * live preview swatch that updates during picking, and Apply/Cancel
 * buttons. Only Apply writes to f.color — click-outside, Escape,
 * and Cancel all dismiss without side effects. */
.gp-color-pop{
  background: var(--s4, #1e201e);
  border: 1px solid rgba(71,72,70,.4);
  border-radius: 6px;
  box-shadow: 0 8px 24px -6px rgba(0,0,0,.55);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 160px;
}
.gp-color-pop-row{
  display: flex;
  align-items: center;
  gap: 8px;
}
.gp-color-pop-preview{
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid rgba(71,72,70,.4);
  flex-shrink: 0;
}
.gp-color-pop-input{
  flex: 1;
  height: 28px;
  border: 1px solid rgba(71,72,70,.3);
  border-radius: 4px;
  padding: 0;
  background: transparent;
  cursor: pointer;
}
.gp-color-pop-buttons{
  justify-content: flex-end;
  gap: 4px;
}
.gp-color-pop-cancel,
.gp-color-pop-apply{
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid rgba(71,72,70,.3);
  cursor: pointer;
  font-family: inherit;
}
.gp-color-pop-cancel{
  background: transparent;
  color: var(--fg2, #ababa8);
}
.gp-color-pop-cancel:hover{
  color: var(--fg, #faf9f5);
  border-color: rgba(71,72,70,.6);
}
.gp-color-pop-apply{
  background: var(--p, #4531d4);
  color: var(--op, #1a4d35);
  border-color: var(--p, #4531d4);
}
.gp-color-pop-apply:hover{
  background: color-mix(in srgb, var(--p, #4531d4) 85%, white);
}

/* ══ MATHLIVE THEME ═══════════════════════════════════════════════
 * MathLive's <math-field> uses Shadow DOM internally — regular
 * descendant selectors do NOT pierce. Theme overrides must go
 * through CSS custom properties (which cross the shadow boundary
 * via inheritance). MathLive exposes ~40 properties for theming:
 * we override a curated subset below, grouped by which UI layer
 * they affect.
 *
 * PROPERTIES USED (future theme tweaks: start here):
 *   Field container:
 *     --ui-field-bg        surface of the editing area
 *     --ui-field-bg-focus  surface when focused
 *     --ui-border-color    outline
 *   Math content:
 *     --caret-color        blinking cursor inside math
 *     --selection-background-color   highlight when selecting math
 *     --selection-color              text on selected math
 *     --placeholder-color  placeholder-atom tint (empty numerator, etc.)
 *     --contains-highlight-background-color
 *                          when caret is inside a structure (fraction)
 *     --text-font-family   non-math text within the field
 *   Virtual keyboard:
 *     --keyboard-background, --keyboard-border
 *     --keycap-background, -hover, -active, -pressed
 *     --keycap-text, -hover, -active
 *     --keyboard-accent-color     toolbar + highlights
 *     --keycap-primary-background primary-action keys (Enter, symbols)
 *     --keycap-primary-text
 *
 * SCOPE. All overrides are scoped under .gp-panel so they only
 * affect math-fields inside the graph widget. If the Question
 * Bank or any other feature adopts MathLive later, its own scope
 * block goes there — don't promote these to :root. */

/* Dark theme (default). Values track the widget's existing dark
 * surface palette: --s5 for card + field bg, --fg for text,
 * --ov for borders, --p for the brand-green accents. */
.gp-panel math-field{
  --ui-field-bg: var(--s5);
  --ui-field-bg-focus: color-mix(in srgb, var(--s5) 92%, var(--p) 8%);
  --ui-field-bg-hover: color-mix(in srgb, var(--s5) 95%, var(--p) 5%);
  --ui-border-color: var(--ov);
  --border-color: var(--ov);
  --caret-color: var(--fg);
  --selection-background-color: color-mix(in srgb, var(--p) 30%, transparent);
  --selection-color: var(--fg);
  --placeholder-color: var(--fg3);
  --contains-highlight-background-color: color-mix(in srgb, var(--p) 14%, transparent);
  --text-font-family: Manrope, ui-sans-serif,system-ui,sans-serif;
  /* MathLive's toolbar icons (virtual-keyboard toggle, menu button)
   * default to a bright blue from --primary-color. Replace with the
   * muted-foreground token so the icons read as chrome, not as a
   * primary action. --primary-color-* variants follow for hover /
   * pressed states. */
  --primary-color: var(--fg2);
  --primary-color-dark: var(--fg);
  --primary-color-light: var(--fg3);
  --primary-color-dimmed: var(--fg3);
  --accent-color: var(--p);
  /* Field chrome */
  background: var(--s5);
  color: var(--fg);
  border: 1px solid var(--ov);
  border-radius: 5px;
  padding: 6px 8px;
  min-height: 32px;
  font-size: 13px;
  display: block;
}
.gp-panel math-field:focus,
.gp-panel math-field:focus-within{
  border-color: color-mix(in srgb, var(--p) 45%, var(--ov));
  outline: none;
}
/* MathLive's toolbar icons (keyboard toggle, menu button) render
 * inside the shadow DOM as <div part="virtual-keyboard-toggle"> /
 * <div part="menu-toggle"> with a hardcoded blue fill that our
 * --primary-color override can't reach. The ::part() pseudo piercs
 * the shadow boundary explicitly for elements tagged with
 * part="..." — see MathLive's source for the full part inventory. */
.gp-panel math-field::part(virtual-keyboard-toggle),
.gp-panel math-field::part(menu-toggle){
  color: var(--fg3);
  fill: var(--fg3);
}
.gp-panel math-field::part(virtual-keyboard-toggle):hover,
.gp-panel math-field::part(menu-toggle):hover{
  color: var(--fg);
  fill: var(--fg);
}

/* Virtual keyboard — MathLive renders it in a portal at document
 * body level, NOT inside .gp-panel. The keyboard is theme-aware
 * only if we override its custom properties on :root or a
 * higher-specificity selector. We target `body` so the keyboard
 * inherits the tokens while nothing else on body is affected.
 * When graph is in light mode (.gp-light on panel), MathLive's
 * keyboard stays with the DARK theme because it's parented to
 * body — acceptable tradeoff; the keyboard is an ephemeral popup
 * and doesn't need to mirror per-widget light/dark state. */
body{
  --keyboard-background: var(--s4);
  --keyboard-border: 1px solid var(--ov);
  --keyboard-toolbar-background: var(--s4);
  --keyboard-toolbar-background-hover: color-mix(in srgb, var(--s4) 85%, var(--p) 15%);
  --keyboard-toolbar-background-selected: color-mix(in srgb, var(--s4) 75%, var(--p) 25%);
  --keyboard-toolbar-text: var(--fg2);
  --keyboard-toolbar-text-active: var(--p);
  --keyboard-accent-color: var(--p);
  --keycap-background: var(--s5);
  --keycap-background-hover: color-mix(in srgb, var(--s5) 85%, var(--p) 15%);
  --keycap-background-active: color-mix(in srgb, var(--s5) 70%, var(--p) 30%);
  --keycap-background-pressed: color-mix(in srgb, var(--s5) 60%, var(--p) 40%);
  --keycap-border: 1px solid var(--ov);
  --keycap-text: var(--fg);
  --keycap-text-hover: var(--fg);
  --keycap-primary-background: var(--p);
  --keycap-primary-background-hover: color-mix(in srgb, var(--p) 85%, white);
  --keycap-primary-text: var(--op);
  --keycap-secondary-background: var(--s6);
  --keycap-secondary-background-hover: color-mix(in srgb, var(--s6) 85%, var(--p) 15%);
  --keycap-secondary-text: var(--fg2);
  --keyboard-zindex: 9999;
}

/* Light theme override — when .gp-light is on the panel, inherit
 * the already-scoped light tokens (--s5 becomes #fafaf7, --fg
 * becomes #1a1a19, etc.) via the override block at line ~820.
 * MathLive's custom properties above reference those same tokens,
 * so no second set of overrides is needed here. The field bg
 * and text flip automatically with the .gp-light class.
 *
 * The one thing that does NOT auto-flip is the keyboard — body-
 * scoped tokens don't know which widget triggered the keyboard.
 * See the rationale comment in the body{ } block above. */

/* Error state — parse failures get an --err-tinted border. Applied
 * via the aria-invalid attribute which MathLive does NOT reflect,
 * so we watch for it via selector matching. Our handlers set
 * aria-invalid="true" on compile failures; this rule picks it up. */
.gp-panel math-field[aria-invalid="true"]{
  border-color: color-mix(in srgb, var(--err) 55%, var(--ov));
  background: color-mix(in srgb, var(--err) 6%, var(--s5));
}

/* Layout glue — math-field in the runtime add row takes the flex
 * slot the old <input> occupied. Without flex:1 the field shrinks
 * to its content width. */
.gp-rt-input math-field.gp-rt-expr{
  flex: 1;
  min-width: 0;
  font-size: 12px;
}
/* Authoring-config row math-field — grid column from .gp-fn-row
 * gives it the same width as the old <input> had. */
.gp-fn-row math-field.gp-fn-expr{
  min-width: 0;
  font-size: 11px;
  padding: 4px 6px;
  min-height: 26px;
}

/* Headers ARE the drag gesture again (Round-B round-2 reverted
 * the separate .wp-drag bar approach). Cursor + focus states for
 * .gp-hdr are set at the top of this file alongside the header
 * definition. The prepended three-dot grip (.wp-drag-grip, defined
 * in lesson-runtime.css) provides the visual grab cue. */

/* ──────────────────────────────────────────────────────────────────
 * MATHLIVE KEYBOARD DOCK (Issue 1)
 *
 * Behavior: when a <math-field> inside this graph widget gets focus,
 * src/js/features/graphKeyboard.js sets the global
 * mathVirtualKeyboard.container to .gp-vk-dock below and flips the
 * .gp-vk-docked class on .gp-body-twocol. The dock becomes visible
 * and claims ~320px on the right; the plot column auto-compresses
 * because it's flex:1 and shares the row with a newly-visible
 * fixed-width sibling.
 *
 * Scope: SCOPED TO .gp-panel .gp-body-twocol. The question-bank
 * MathLive keyboard stays on its default bottom-popup because
 * graphKeyboard.js only rebinds the singleton when focus lands in
 * a math-field inside .gp-panel. When focus leaves, the singleton
 * resets to container=null (default body mount).
 *
 * Width: 320px is the sweet spot for MathLive's numeric +
 * alphabetic + symbols layouts at default keycap sizing. Narrower
 * than 300px causes horizontal scroll on the alphabetic layer.
 *
 * Close button (Issue 2): MathLive's default numeric + minimalist
 * layouts include a [hide-keyboard] action in the bottom-right. We
 * use the 'numeric', 'symbols', 'alphabetic' built-ins which all
 * expose it. No custom layout needed.
 *
 * Light mode: scoped overrides under .gp-panel.gp-light below.
 * ────────────────────────────────────────────────────────────────── */

.gp-vk-dock{
  /* Hidden by default — the dock element exists in the DOM so the
   * MathLive container ref stays stable across focus cycles, but
   * takes no space and isn't visible until .gp-vk-docked is set.
   * Using display:none rather than width:0 so flex doesn't allocate
   * any implicit space to it.
   *
   * Batch 4B Fix 1: width bumped 320 → 340px. Kept in lockstep with
   * GRAPH_DOCK_WIDTH in graphKeyboard.js — the JS value drives the
   * min-plot-width fallback calculation.
   *
   * Calc-v2 visual tokens (PR #119 redesign): dark body #15171a
   * is the deep dock body bg, used 7+ places below across
   * .gp-vk-dock, MathLive variable overrides
   * (--keyboard-background, --keycap-text-pressed), .MLK__backdrop,
   * .gp-vk-tabs, and the active tab + insert-key text fills.
   * Intentionally not tokenized — one-off value below the --s1
   * surface step (#0d0f0d) for a distinct keyboard-chrome layer.
   * Accent-tinted left border. Replaces the prior s4/s5 fallback
   * since the dock is no longer a generic widget chrome panel —
   * it shares the calc-v2 visual language. */
  display: none;
  flex: 0 0 340px;
  min-width: 0;
  max-width: 340px;
  background: #15171a;
  border-left: 1px solid rgba(190,255,220,0.08);
  /* Stack close bar + keyboard body vertically. */
  flex-direction: column;
}
.gp-body-twocol.gp-vk-docked > .gp-vk-dock{
  display: flex;
}
/* Batch 4C Fix 3: close bar taller (44px vs 28px) so the X close
 * button reads as a clear dismiss target rather than a decorative
 * header. The [hide-keyboard] alias was removed from every layout
 * so this button is now the ONE obvious way to close — it needs
 * to feel like a real button, not a chrome element. */
.gp-vk-dock-close{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 14px;
  height: 44px;
  flex-shrink: 0;
  background: var(--s5, #242624);
  border-bottom: 1px solid rgba(71,72,70,.3);
}
.gp-vk-dock-title{
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg3, #949693);
  user-select: none;
}
/* 32px touch target per Fix 3 spec, clear X icon (not a keyboard
 * glyph), distinct hover + focus-visible so keyboard users see
 * where they are. Background on hover gives extra affordance
 * weight so a teacher glancing at the dock knows this is "dismiss"
 * rather than "another key in the row below". */
.gp-vk-dock-close-btn{
  background: transparent;
  border: 1px solid transparent;
  color: var(--fg2, #b6b9b1);
  width: 32px;
  height: 32px;
  /* Size applied on the button itself — the button's text node
   * carries the glyph in the graphPanel.js pre-seed path (plain
   * × character), while the graphKeyboard.js fallback path uses
   * a Material `<span class="ms">close</span>` child. Setting
   * font-size on the button covers the pre-seed path; the
   * .ms:font-size:1em below lets the icon-font child inherit the
   * same size rather than silently reverting to the font-family
   * default. */
  font-size: 20px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  cursor: pointer;
  padding: 0;
  transition: background .12s, color .12s, border-color .12s;
}
.gp-vk-dock-close-btn:hover{
  color: var(--fg, #e5e6e3);
  background: var(--s4, #242624);
  border-color: rgba(71,72,70,.4);
}
.gp-vk-dock-close-btn:focus-visible{
  outline: 2px solid var(--p, #4531d4);
  outline-offset: 2px;
}
.gp-vk-dock-close-btn .ms{ font-size: 1em; }
/* Keyboard body: the element whose reference we hand to
 * mathVirtualKeyboard.container. Batch 4D Fix 2: now FILLS the
 * remaining vertical space after the close bar, and
 * graphKeyboard.js's ResizeObserver computes --keycap-height
 * from (dockBody.clientHeight / activeLayer.rowCount) so keys
 * visibly scale with the widget's allocated height rather than
 * leaving empty black space below the last row.
 *
 * Reverted from the prior Batch 4B "shrink to content" behavior
 * now that the widget grows outward to host the dock — there's
 * no longer a plot column sharing vertical space with the keyboard
 * in the same body row, so filling the dock vertically is pure
 * upside. */
.gp-vk-dock-body{
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
/* When the dock is active, the plot column still has flex:1 so it
 * naturally compresses. No explicit min-width override here — the
 * plot's existing min-width:0 plus the SVG's responsive resize
 * handle the new column width correctly. gp-plotwrap keeps its
 * min-height:220px from the canonical rule above. */

/* MathLive singleton's root element mounts as a child of .gp-vk-dock
 * via mathVirtualKeyboard.container assignment in graphKeyboard.js.
 * The default body-anchored .ML__keyboard rule is `position:fixed`;
 * when the keyboard is NOT a direct child of <body>, MathLive
 * switches to position:relative + 100%/100% sizing (see bundle
 * ML__keyboard base rule). That means just mounting it inside the
 * dock gives us the docked look essentially for free — these rules
 * are tuning, not structural. */
.gp-vk-dock .ML__keyboard{
  /* Structural: ensure the keyboard fills the dock body. Belt-and-
   * braces — MathLive's own stylesheet sets these when not under
   * <body>, but we repeat them here so an upstream change doesn't
   * regress the dock. */
  position: relative;
  width: 100%;
  height: 100%;
  /* Visual language adopted from calc-v2: dark body #15171a with
   * accent green #4531d4. Override MathLive's PUBLIC CSS custom
   * properties (--keycap-background etc. — see mathlive.min.js
   * variable defaults around line 1522) rather than hand-styling
   * MLK__ internal selectors. The custom properties survive
   * library upgrades; internal selectors do not.
   *
   * --keycap-height stays dynamic — graphKeyboard.js's
   * ResizeObserver writes it inline based on dock height ÷ row
   * count, and the layouts are now uniform 4-row so the value
   * doesn't jump on tab switch. */
  --keyboard-background: #15171a;
  --keyboard-padding-top: 8px;
  --keyboard-padding-horizontal: 10px;
  --keycap-background: rgba(255,255,255,0.04);
  --keycap-background-hover: rgba(255,255,255,0.08);
  --keycap-background-active: rgba(190,255,220,0.15);
  --keycap-background-pressed: rgba(190,255,220,0.25);
  --keycap-text: #e6e7e3;
  --keycap-text-active: #4531d4;
  --keycap-text-pressed: #15171a;
  --keycap-shift-text: #4531d4;
  --keycap-shift-color: #4531d4;
  --keycap-border: 0.5px solid rgba(190,255,220,0.10);
  --keycap-border-bottom: 1px solid rgba(190,255,220,0.10);
  --keycap-secondary-background: rgba(255,255,255,0.06);
  --keycap-secondary-background-hover: rgba(255,255,255,0.10);
  --keycap-secondary-text: #e6e7e3;
  --keycap-secondary-border: 0.5px solid rgba(190,255,220,0.10);
  --keycap-secondary-border-bottom: 1px solid rgba(190,255,220,0.10);
  --keycap-height: 56px;
  --keycap-font-size: 16px;
  --keycap-small-font-size: 13px;
  --keycap-glyph-size: 18px;
  --keycap-glyph-size-lg: 20px;
  --keycap-shift-font-size: 13px;
  --keyboard-toolbar-font-size: 13px;
  --keycap-gap: 6px;
}
/* Backdrop matches dock body — calc-v2 dark. The dock wrapper's
 * own background is set on the .gp-vk-dock rule above. */
.gp-vk-dock .MLK__backdrop{
  background: #15171a;
}

/* Batch 4B Fix 2 — vertical fill override.
 *
 * MathLive's default .MLK__backdrop is positioned
 *   position: absolute; bottom: calc(-1 * --_keyboard-height);
 *   height: var(--_keyboard-height);
 * and gains
 *   transform: translate(0, calc(-1 * --_keyboard-height));
 * on .is-visible — this is the slide-up bottom-popup animation
 * for body-mounted keyboards. When the keyboard is mounted in a
 * custom container (our .gp-vk-dock-body) with our CSS sizing
 * .ML__keyboard to fill the dock (height:100%), the backdrop ends
 * up stuck at the bottom of the dock with empty space above AND
 * its intrinsic `--_keyboard-height` is set to the row-content
 * size, leaving empty backdrop below the keys too.
 *
 * Fix: re-flow the backdrop as a normal block at the top of the
 * dock, sized to its content — the keyboard rows then stack right
 * below the close-bar header with no empty regions. Also let the
 * plate flow naturally so rows take their content height.
 *
 * Also: shrink .gp-vk-dock-body to the keyboard's intrinsic
 * height by letting it flex-shrink. The dock itself stays anchored
 * to the top of the body-twocol (flex column) and no longer
 * insists on filling full panel height — the plot column claims
 * all remaining vertical space instead, which is the right visual
 * priority (plot is the focus, keyboard is a tool).
 *
 * Scoped under .gp-vk-dock so bottom-popup animation in other
 * contexts (question bank etc.) stays on its default slide-up. */
/* Batch 4D: backdrop + plate stretch to fill the dock body. The
 * ResizeObserver in graphKeyboard.js updates --keycap-height so
 * rows scale to match; this CSS just makes sure the containers
 * give the rows the full vertical range to scale into. */
.gp-vk-dock .MLK__backdrop{
  position: relative;
  top: auto;
  bottom: auto;
  width: 100%;
  height: 100%;
  transform: none;
  opacity: 1;
  visibility: visible;
  display: flex;
  flex-direction: column;
}
.gp-vk-dock .ML__keyboard.is-visible > .MLK__backdrop,
.gp-vk-dock .ML__keyboard > .MLK__backdrop{
  transform: none;
}
.gp-vk-dock .MLK__plate{
  position: relative;
  top: auto;
  left: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
}
/* Layer fills the plate; rows stretch inside the layer. Each row
 * hugs its keycap-height (no flex:1 on rows — we want keycap
 * height from the ResizeObserver to dictate spacing, not
 * equal-distribution). The extra space between rows is absorbed
 * by the justify-content:flex-start default + the slight growth
 * from keycap-height scaling. */
.gp-vk-dock .MLK__layer{
  flex: 1;
  display: flex !important;
  flex-direction: column;
}
/* MathLive hides inactive layers by writing `display: none` as an
 * inline style. Browsers may serialize that with or without a
 * space after the colon depending on how MathLive sets the style
 * (direct style.display = 'none' vs setAttribute('style', ...)).
 * Match both variants so layer visibility stays reliable across
 * library versions. */
.gp-vk-dock .MLK__layer[style*="display: none"],
.gp-vk-dock .MLK__layer[style*="display:none"]{
  display: none !important;
}
/* Dead-tab defensive override: the ACTIVE layer (marked with the
 * `.is-visible` class) must render flex even if MathLive's stock
 * rules try to hide it. Pairs with _gpkSwitchLayer in
 * graphKeyboard.js, which adds/removes `.is-visible` alongside the
 * inline `display` toggle so this rule applies to exactly one
 * layer at a time. We deliberately do NOT match
 * .MLK__layer:not([style*="display:none"]) — that selector also
 * matches inactive layers with no inline display style and would
 * cause every layer to render simultaneously on first paint
 * (CodeRabbit PR #119). */
.gp-vk-dock .MLK__layer.is-visible{
  display: flex !important;
}
.gp-vk-dock .MLK__rows{
  flex: 1;
  justify-content: flex-start;
}
/* Batch 4D Fix 1+2: the dock now grows alongside the plot column
 * and fills full widget height. align-self:stretch (flex default)
 * ensures the dock spans the full body-twocol row height; the
 * close bar + keyboard body inside stack via the dock's own
 * flex-direction:column. */
.gp-body-twocol.gp-vk-docked > .gp-vk-dock{
  align-self: stretch;
}
.gp-vk-dock .ML__keyboard{
  height: 100%;
}

/* Make MathLive's [hide-keyboard] close button more discoverable —
 * Issue 2 requirement. The default rendering is a faint down-arrow
 * glyph that teachers miss. Tint it with the accent color and nudge
 * the hit area. Scoped under .gp-vk-dock so question-bank keyboard
 * retains stock appearance. */
/* Scope the SVG-color boost to the hide-keyboard key specifically.
 * The previous broader `.MLK__keycap.action svg.svg-glyph-lg` hit
 * every MathLive action key that renders an svg-glyph-lg — not
 * just the dismiss glyph — which was an over-reach. */
.gp-vk-dock .MLK__keycap[data-command*="hideVirtualKeyboard"],
.gp-vk-dock .MLK__keycap[data-command*="hideVirtualKeyboard"] svg.svg-glyph-lg{
  color: var(--p, #4531d4);
}

/* ── Redesign (feat/graph-keyboard-redesign) ────────────────────
 * Hide MathLive's stock MLK__toolbar (cut/copy/paste row + layout
 * tabs). Our custom .gp-vk-tabs replaces it. !important is needed
 * because MathLive's stock toolbar styling uses higher-specificity
 * selectors than a plain class override. This is the only MLK__
 * internal selector we touch beyond the layer-visibility plumbing
 * above — flagged as a known brittleness point on MathLive
 * upgrades. */
.gp-vk-dock .ML__keyboard .MLK__toolbar{
  display: none !important;
}

/* Custom three-pill tab bar between the close-bar header and the
 * keyboard body. Mirrors calc-v2 mode-pill rhythm: dark backdrop,
 * accent-fill on active. */
.gp-vk-tabs{
  display: flex;
  gap: 6px;
  padding: 8px 10px 4px 10px;
  background: #15171a;
  flex-shrink: 0;
}
.gp-vk-tab{
  flex: 1;
  padding: 7px 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-align: center;
  color: rgba(230,231,227,0.55);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  transition: background .12s, color .12s, border-color .12s;
}
.gp-vk-tab:hover{
  color: #e6e7e3;
  background: rgba(255,255,255,0.04);
}
.gp-vk-tab:focus-visible{
  outline: 2px solid #4531d4;
  outline-offset: 2px;
}
.gp-vk-tab.on{
  color: #15171a;
  background: #4531d4;
  border-color: #4531d4;
}
.gp-vk-tab .gp-vk-tab-italic{
  font-style: italic;
  font-family: 'KaTeX_Math', 'Times New Roman', serif;
}

/* Per-key class hooks rendered onto MathLive keycaps via the
 * `class` field in the layout schemas (graphKeyboard.js). MathLive
 * appends this string to the .MLK__keycap element so we can target
 * it with descendant selectors. !important is needed against
 * MathLive's per-key default styles which use higher specificity. */

/* Operator tint (÷ × − +) on the 123 layout. */
.gp-vk-dock .MLK__keycap.gp-vk-key--op{
  color: #4531d4 !important;
  background: rgba(190,255,220,0.06) !important;
  font-weight: 500;
}
.gp-vk-dock .MLK__keycap.gp-vk-key--op:hover{
  background: rgba(190,255,220,0.12) !important;
}

/* Insert (↵) commit key — filled accent, dark text. The empty
 * latex on the layout entry makes MathLive's own click a no-op;
 * the real commit happens in graphKeyboard.js's delegated click
 * handler (_gpkInstallInsertHandler). */
.gp-vk-dock .MLK__keycap.gp-vk-key--insert{
  background: #4531d4 !important;
  color: #15171a !important;
  font-weight: 600 !important;
  font-size: 18px !important;
}
.gp-vk-dock .MLK__keycap.gp-vk-key--insert:hover{
  background: #d6ffe8 !important;
}

/* Function-name keys (sin/cos/tan/ln/log/eˣ) — mono accent green
 * to read as "this is a named function" against the neutral
 * digits / templates. */
.gp-vk-dock .MLK__keycap.gp-vk-key--fx{
  color: #4531d4 !important;
  font-family: 'KaTeX_SansSerif', 'IBM Plex Mono', ui-monospace,monospace !important;
  letter-spacing: .02em;
}

/* Function variables (x/y/t) — italic accent, muscle-memory hook
 * for the most common function-definition strokes. */
.gp-vk-dock .MLK__keycap.gp-vk-key--var{
  color: #4531d4 !important;
  font-style: italic;
  font-family: 'KaTeX_Math', 'Times New Roman', serif;
  font-weight: 500;
}

/* Parameters (a/b/c/k/m) — italic neutral. */
.gp-vk-dock .MLK__keycap.gp-vk-key--param{
  font-style: italic;
  font-family: 'KaTeX_Math', 'Times New Roman', serif;
}

/* Light-mode tokens cascade to .gp-vk-dock via the existing
 * .gp-panel.gp-light variable remap at line ~832. MathLive's own
 * --keyboard-background / --keycap-background vars fall back to
 * its defaults, which look fine on both light + dark backgrounds.
 * If a future audit shows poor contrast in light mode, add
 * .gp-panel.gp-light .gp-vk-dock > .ML__keyboard { --keyboard-
 * background: ... } here. */

/* ── Angle Arcs: mode selector, per-mode fields, intersection picker ───────
   Phase 2 of the geometry work. The twoRays and threePoints modes were in the
   renderer and the data model from the start and had no controls at all; these
   are those controls. Everything below reuses the card's existing pill and
   input treatment rather than introducing a second visual language. */
.gp-arc-modes{ display:flex; gap:4px; flex-wrap:wrap; width:100%; margin-bottom:6px; }
.gp-arc-mode-btn{
  flex:1 1 auto; min-width:64px; padding:5px 8px; border-radius:8px; cursor:pointer;
  border:1px solid var(--s6); background:var(--s3); color:var(--tx);
  font-size:11px; line-height:1.2;
}
.gp-arc-mode-btn.on{ background:var(--p); color:var(--s1); border-color:var(--p); font-weight:600; }
.gp-arc-fields{ display:flex; gap:4px; flex-wrap:wrap; align-items:center; width:100%; }
.gp-arc-fields[hidden]{ display:none; }
.gp-arc-n{
  flex:1 1 62px; min-width:52px; padding:5px 6px; border-radius:8px;
  border:1px solid var(--s6); background:var(--s2); color:var(--tx); font-size:11px;
}
.gp-arc-useint, .gp-arc-pick-btn, .gp-arc-style-btn, .gp-arc-measure-btn, .gp-arc-row-style, .gp-arc-row-measure{
  padding:4px 8px; border-radius:8px; cursor:pointer; font-size:11px;
  border:1px solid var(--s6); background:var(--s3); color:var(--tx);
}
.gp-arc-useint{ flex:1 1 100%; }
.gp-arc-style-btn.on, .gp-arc-measure-btn.on, .gp-arc-row-measure.on{
  background:var(--p); color:var(--s1); border-color:var(--p); font-weight:600;
}
.gp-arc-styles{ display:flex; gap:3px; flex-wrap:wrap; }
.gp-arc-common{ margin-top:6px; justify-content:space-between; }
.gp-arc-pick{ display:flex; gap:4px; flex-wrap:wrap; width:100%; margin-top:6px; }
.gp-arc-pick[hidden]{ display:none; }
/* THE REFUSAL HAS TO BE READABLE ON CAMERA. --err against the card, not a
   muted hint: this line is the only thing standing between a teacher and a
   button that appears to do nothing. */
.gp-arc-err{
  width:100%; margin-top:6px; padding:5px 7px; border-radius:8px; font-size:11px;
  color:var(--err); background:color-mix(in srgb, var(--err) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--err) 35%, transparent);
}
.gp-arc-err[hidden]{ display:none; }
.gp-arc-row-style{ text-transform:lowercase; min-width:48px; }
/* THE DIRECTION PILLS MUST ACTUALLY HIDE OUTSIDE STANDARD MODE.
   `.gp-arc-dir { display:inline-flex }` beats the browser's default
   `[hidden] { display:none }`, because both are author-level and the class rule
   comes later — so syncMode() setting `hidden` on the span changed nothing and
   the CCW/CW pills stayed on screen in Two rays and Three points, where they
   mean nothing. Raised in review on #236. */
.gp-arc-dir[hidden], .gp-arc-fields[hidden], .gp-arc-angle[hidden]{ display:none !important; }


/* ===== standalone full-frame overrides ===== */
html, body { margin:0; padding:0; height:100%; background:#ffffff; }
body { overflow:hidden; }
#graph-p.wp, #graph-p {
  position:static !important; inset:auto !important;
  top:auto !important; left:auto !important; right:auto !important; bottom:auto !important;
  transform:none !important;
  width:100%; height:100vh; max-height:100vh;
  margin:0; border-radius:0;
}
/* In a standalone there's no launcher rail to reopen from, so any
 * panel-close control is a dead end — hide it. */
#graph-p .gp-close, #graph-p .gp-hdr-close, #graph-p .wp-close,
#graph-p [data-gp-close], #graph-p [onclick*="togGraph"] { display:none !important; }

  </style>
</head>
<body>
  <div class="wp gp-panel" id="graph-p"></div>
  <script>

/* ===== standalone stubs (suite globals the graph expects) =====
 * WIDGET_STATE is NOT stubbed here — widgetState.js declares the real
 * const (with graphPanel/_defaultGraphPanel seeded); stubbing it as a
 * window prop would shadow-split against that lexical const. */
window.WIDGET_SHELL_CONFIG = window.WIDGET_SHELL_CONFIG || {};
function scheduleAutosave(){}
function showToast(){}
function toast(){}
/* mountWidgetShell intentionally undefined — its call sites are guarded by
 * typeof; the standalone is full-frame and wants no drag/resize chrome. */

/* ==== src/js/state/widgetState.js ==== */
/* state/widgetState.js — Widget configuration state
   Centralizes enabled/disabled and per-widget config for the Widget Studio.
   Consumed by: screens/widgets (UI), screens/router (runtime visibility),
   features/calculator, features/coinFlip, features/sessionMgmt (reset). */

/* Image panel config constants — exported as consts so the UI, the
 * normalizer, and the runtime renderer all read the same vocabulary. */
const IMG_PANEL_SIZE_PRESETS  = ['small','medium','large','custom'];
const IMG_PANEL_SIZE_PX       = { small: 240, medium: 360, large: 540 };
const IMG_PANEL_CAP_POSITIONS = ['top','bottom','none'];
const IMG_PANEL_POSITIONS     = ['topLeft','topRight','bottomLeft','bottomRight','center'];
const IMG_PANEL_RADIUS_MIN    = 0;
const IMG_PANEL_RADIUS_MAX    = 32;
const IMG_PANEL_WIDTH_MIN     = 120;
const IMG_PANEL_WIDTH_MAX     = 900;

function _defaultImagePanel(){
  return {
    enabled:         false,
    assetId:         null,        // id from MEDIA_ASSETS; null = nothing picked
    caption:         '',
    captionPosition: 'bottom',    // top | bottom | none
    sizePreset:      'medium',    // small | medium | large | custom
    customWidthPx:   400,
    border:          true,
    shadow:          true,
    cornerRadius:    8,
    position:        'bottomRight'
  };
}

/* Graph panel config (PR-Widget-Graph-A).
 * A function-plotting overlay designed for classroom use: a
 * configurable grid + axes, up to 6 expressions plotted as curves
 * with distinct colors, and up to 12 labeled points with filled
 * (closed-interval) or open (open-interval) markers. Future PR-B
 * will layer intercept markers, domain shading, and trace tool
 * affordances on top. */
const GRAPH_FUNCTION_LIMIT = 6;
const GRAPH_POINT_LIMIT    = 24;   // Round B #6a: raised from 12 to 24 to
                                   // accommodate unit-circle preset (16
                                   // point markers) + teacher-added points.
const GRAPH_ARC_LIMIT      = 12;   // Round B #6g: angle arcs array cap.
/* PR-6 (feedback #1): caps for the persisted stroke list on the
 * graph panel's drawing canvas. GRAPH_STROKE_LIMIT bounds the
 * total strokes so the serialized snapshot can't grow unbounded;
 * GRAPH_STROKE_POINT_LIMIT caps points per stroke so one long
 * continuous gesture doesn't alone blow the budget.
 *
 * Sizing picked to fit comfortably under HISTORY_MAX_BYTES (8 MB).
 * Each stroke commit snapshots the whole graphPanel.strokes array
 * into the history ring, so the worst-case strokes JSON needs to
 * leave room for the rest of session state in the same snapshot.
 * 100 strokes × 1000 points × ~25 bytes JSON ≈ 2.5 MB upper bound,
 * which fits within the history budget with ample headroom for
 * functions / points / arcs / slides / qbank / calc. Teaching use
 * is nowhere near these caps in practice. */
const GRAPH_STROKE_LIMIT       = 100;
const GRAPH_STROKE_POINT_LIMIT = 1000;
/* Tool whitelist for stroke tool names — keep aligned with the
 * branches in _gpPaintStroke / the live drawing handler in
 * graphPanel.js. A stroke with an unrecognised tool is dropped on
 * restore rather than silently rendered as a default pen stroke. */
