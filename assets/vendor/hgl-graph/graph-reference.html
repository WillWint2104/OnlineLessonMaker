    _gpkInterpAttr(yLine, 'x2', fromPx, px, DUR, isCancelled);
    _gpkInterpAttr(yLine, 'y2', fromPy, py, DUR, isCancelled);
  }
  if(yLabel){
    // Fix 1: animation FROM/TO both go through yLabelYFor so the
    // parking decision applies symmetrically — without this the
    // tween would interpolate from a parked position to a
    // midpoint position when the cursor crossed the threshold.
    _gpkInterpAttr(yLabel, 'x',
      fromPx + Y_LABEL_INSET_PX, px + Y_LABEL_INSET_PX,
      DUR, isCancelled);
    _gpkInterpAttr(yLabel, 'y',
      yLabelYFor(fromPy, fromOy), yLabelYFor(py, oy),
      DUR, isCancelled);
  }
  _gpkInterpAttr(cursorInner, 'cx', fromPx, px, DUR, isCancelled);
  _gpkInterpAttr(cursorInner, 'cy', fromPy, py, DUR, isCancelled);
  _gpkInterpAttr(cursorRing,  'cx', fromPx, px, DUR, isCancelled);
  _gpkInterpAttr(cursorRing,  'cy', fromPy, py, DUR, isCancelled);
  if(coord){
    // Fix 2 + CR follow-up: animate through coordPosFor so both
    // endpoints are edge-flipped consistently. The element was
    // created with the FROM anchor/baseline; we defer the
    // destination anchor/baseline swap until the tween's final
    // frame so the FROM layout actually paints first. Without
    // the deferral, setAttribute runs synchronously and the
    // label would snap to the destination quadrant immediately
    // while x/y interpolated — exactly the visual pop the
    // FROM-quadrant computation above is meant to prevent.
    const toCoordPos = coordPosFor(px, py, cx, cy, coordText);
    _gpkInterpAttr(coord, 'x', fromCoordPos.x, toCoordPos.x, DUR, isCancelled);
    _gpkInterpAttr(coord, 'y', fromCoordPos.y, toCoordPos.y, DUR, isCancelled);
    const applyCoordLayout = () => {
      if(isCancelled()) return;
      coord.setAttribute('text-anchor', toCoordPos.anchor);
      coord.setAttribute('dominant-baseline', toCoordPos.baseline);
    };
    if(DUR > 0) setTimeout(applyCoordLayout, DUR);
    else applyCoordLayout();
  }

  // Cache final positions for the next move's FROM values.
  _gpkTraceAnim.prevOx = ox;
  _gpkTraceAnim.prevOy = oy;
  _gpkTraceAnim.prevPx = px;
  _gpkTraceAnim.prevPy = py;
  _gpkTraceAnim.prevCx = cx;
  _gpkTraceAnim.prevCy = cy;
}

/** Compact number formatter for trace labels. Strips trailing
 *  zeros and renders the minus sign as the visually-distinct
 *  Unicode minus (U+2212) so labels read consistently with
 *  printed math typography. */
function _gpFmtTrace(n){
  if(!Number.isFinite(n)) return '?';
  // 4 decimals matches the keydown handler's drift-guard rounding
  // (Math.round(n*10000)/10000). Earlier mismatch at 3 decimals
  // could surface a 0.0001 fluctuation in the position state as
  // an unrendered digit — visually fine but inconsistent with how
  // values are stored.
  const rounded = Math.round(n * 10000) / 10000;
  let str = rounded.toString();
  if(str.indexOf('.') >= 0) str = str.replace(/\.?0+$/, '');
  if(str.startsWith('-')) str = '−' + str.slice(1);
  return str;
}

/** Re-renders ONLY the .gp-trace overlay subtree on the live plot
 *  SVG, without rebuilding the rest of the plot. Called from the
 *  arrow-key handler and the snap-to-point click handler so each
 *  cursor move animates the new arrows in instead of triggering a
 *  full _gpAfterChange that wipes the SVG and instant-snaps the
 *  trace.
 *
 *  Reads the current panel + state from WIDGET_STATE.graphPanel
 *  and the live #gp-svg in the DOM. Bails silently if either is
 *  missing (panel not mounted, state torn down). The animation
 *  parameter defaults true since this path is only hit on user
 *  movement. */
function _gpRedrawCoordTrace(animate){
  if(typeof WIDGET_STATE === 'undefined' || !WIDGET_STATE.graphPanel) return;
  const S = WIDGET_STATE.graphPanel;
  if(!S.coordTrace || !S.coordTrace.enabled) return;
  // Find the live plot SVG. Multiple graph panels could exist
  // across screens but only one is active per togGraph; query
  // by class on the visible panel.
  const panel = document.querySelector('.gp-panel.on');
  if(!panel) return;
  const svg = panel.querySelector('.gp-svg');
  if(!svg) return;
  // Build coord transforms identical to _gpBuildSvg's local
  // helpers. Read viewport / sizing from the SVG attributes so
  // we don't have to reach into the closure that produced them.
  const viewBox = (svg.getAttribute('viewBox') || '0 0 100 100').split(/\s+/);
  const w = parseFloat(viewBox[2]) || 100;
  const h = parseFloat(viewBox[3]) || 100;
  const pad = 4; // matches _gpBuildSvg's const
  const plotW = w - 2 * pad;
  const plotH = h - 2 * pad;
  const xRange = S.xMax - S.xMin;
  const yRange = S.yMax - S.yMin;
  if(xRange <= 0 || yRange <= 0) return;
  const xToSvg = x => pad + ((x - S.xMin) / xRange) * plotW;
  const yToSvg = y => pad + plotH - ((y - S.yMin) / yRange) * plotH;
  _gpRenderCoordTrace(svg, S, xToSvg, yToSvg, !!animate);
}

/** Format a number for compact label display — 2 decimal places,
 *  trailing zeros stripped, tiny-near-zero snapped to 0. */
function _gpFmtNum(n){
  if(!Number.isFinite(n)) return '—';
  if(Math.abs(n) < 1e-9) return '0';
  const s = (Math.round(n * 100) / 100).toString();
  return s;
}

/* ── Angle arc renderer ────────────────────────────────────────────
   Three construction modes, all unified via a computed vertex +
   startAngle + sweepAngle (both in radians, math-convention CCW).
   The pen style pass then stamps 1, 2, 3, or hash-mark arcs.

   Round B #6g (CR round-4): arc angles are stored as canonical
   RADIANS. Input forms convert from the current S.angleMode on
   commit; this renderer reads them verbatim. Keeps the GeoGebra /
   JSXGraph convention — flipping deg↔rad from the Viewport card
   never reinterprets existing arc data. */
/* ────────────────────────────────────────────────────────────────
 * Batch 3B — Angle arc renderer
 *
 * Rendering model (standard mode, which is what the sidebar exposes):
 *   1. Initial ray   — origin → (r, 0), always along +x axis.
 *   2. Terminal ray  — origin → (r_outer * cos θ_eff, r_outer * sin θ_eff).
 *   3. Arc / spiral  — for |θ| ≤ 2π, a filled sector with stroked
 *                      boundary; for 2π < |θ| ≤ 4π, a spiral whose
 *                      radius grows 18% per full turn; for |θ| > 4π
 *                      the visual caps at 2 turns (matches spec:
 *                      "visual caps at 2 spiral turns; label shows
 *                      the full angle").
 *   4. Label         — signed value with degree symbol (or π-fraction
 *                      in rad mode), placed along the bisector at
 *                      60% of base radius. Offset outward for very
 *                      small sweeps where 60% radius would crash
 *                      into the vertex. For spirals, placed near the
 *                      outermost turn's terminal end.
 *
 * Colors: fill + stroke are hard-coded to --p (theme accent green)
 * via CSS classes. The per-arc color in state still drives the
 * sidebar swatch but no longer the plot render — spec requires the
 * theme-green treatment across the board for visual consistency
 * and auto-adaptation between dark (lime) and light (deep green).
 *
 * twoRays / threePoints modes: also get the translucent fill +
 * sector treatment. Direction toggle is ignored (the angles/points
 * already carry direction information). No spiral support (these
 * modes clamp to shorter-arc ≤ π).
 * ──────────────────────────────────────────────────────────────── */
/* arc.radius is stored in math units (the semantic / authored
 * radius). Effective render radius is clamped to ARC_MIN_PX..
 * ARC_MAX_PX screen pixels so arcs stay readable regardless of
 * viewport zoom — without this, the arc would scale linearly
 * with zoom and become invisible at common zoom-out levels
 * (a 1.2-unit arc at viewport [-20,20] = 12 screen pixels,
 * smaller than its own 15px label). Stored radius is unchanged;
 * only the visual size adapts.
 *
 * When the arc is clamped to the screen-pixel floor (zoomed out),
 * the angle label flips outside the arc since inside-bisector
 * placement would have the label text overflowing a 30px circle.
 * Same outside-flip already existed for very small sweep angles
 * (<15°); the two conditions now share the same branch.
 *
 * fix/graph-arc-readability. */
function _gpRenderArc(svg, arc, S, xToSvg, yToSvg){
  // Resolve vertex + bounding angles (math coords / radians).
  let vx, vy, a0, a1, effSweep;
  if(arc.mode === 'standard'){
    vx = 0; vy = 0;
    a0 = 0;
    // Batch 3B: angle is stored as UNSIGNED magnitude; direction
    // toggle supplies the sign. CCW=+, CW=− (math convention).
    const dirSign = (arc.direction === 'cw') ? -1 : 1;
    const magnitude = Math.max(0, Number(arc.angle) || 0);
    effSweep = dirSign * magnitude;
    a1 = a0 + effSweep;
  } else if(arc.mode === 'twoRays'){
    vx = arc.vx; vy = arc.vy;
    a0 = arc.angleA;
    a1 = arc.angleB;
    // Shorter-arc clamp (preserves pre-Batch-3B twoRays behavior).
    effSweep = a1 - a0;
    while(effSweep <= -Math.PI) effSweep += 2 * Math.PI;
    while(effSweep >   Math.PI) effSweep -= 2 * Math.PI;
  } else {
    // threePoints: vertex B, rays toward A and C.
    vx = arc.bx; vy = arc.by;
    a0 = Math.atan2(arc.ay - arc.by, arc.ax - arc.bx);
    a1 = Math.atan2(arc.cy - arc.by, arc.cx - arc.bx);
    effSweep = a1 - a0;
    while(effSweep <= -Math.PI) effSweep += 2 * Math.PI;
    while(effSweep >   Math.PI) effSweep -= 2 * Math.PI;
  }

  const baseR = arc.radius;
  /* Clamp effective render radius to a readable screen-pixel
   * range, AND render the arc geometry directly in SVG-pixel
   * space rather than projecting math-unit points through
   * xToSvg/yToSvg. CR feedback: an earlier version computed a
   * single math-space effectiveR via Math.min(pxPerUnitX,
   * pxPerUnitY); on a non-square viewport (e.g. xRange ≠ yRange
   * but plot is square), that produced an ellipse instead of a
   * circle and one screen axis could exceed the 30-80px clamp.
   *
   * Refactor: vertex projects once to screen coords (vxSvg,
   * vySvg), then every arc sample / ray endpoint / hash mark /
   * label position is computed in screen pixels using the y-flip
   * `vySvg - sin(ang) * rPx` — math angle θ still appears as
   * the same visual angle on screen, but the rendered shape is
   * a true circle of effectiveRPx pixels regardless of viewport
   * aspect. */
  const ARC_MIN_PX = 30;
  const ARC_MAX_PX = 80;
  const pxPerUnitX = Math.abs(xToSvg(1) - xToSvg(0));
  const pxPerUnitY = Math.abs(yToSvg(0) - yToSvg(1));
  /* "Natural" pixel size of the stored radius. Use the smaller
   * pxPerUnit so the floor logic is conservative — when either
   * axis is squeezed enough that a math-unit circle would render
   * too small, we treat the arc as small and clamp upward. The
   * circle then renders at exactly effectiveRPx pixels in BOTH
   * axes (no ellipse). */
  const pxPerUnitMin = Math.min(pxPerUnitX, pxPerUnitY) || 1;
  const baseRPx      = baseR * pxPerUnitMin;
  const effectiveRPx = Math.max(ARC_MIN_PX, Math.min(ARC_MAX_PX, baseRPx));
  const isClampedSmall = effectiveRPx > baseRPx; // floor was hit
  /* Vertex in SVG pixel space — projected once here so the rest
   * of the function operates in screen coords. */
  const vxSvg = xToSvg(vx);
  const vySvg = yToSvg(vy);

  const stylePass = arc.style || 'single';
  // Spiral geometry (standard mode only). Each full turn grows the
  // radius by 18% of baseR — enough separation that turns don't
  // visually merge, while keeping the spiral compact enough to sit
  // within a typical viewport. 0.18 is tuned by eye; see Batch 3B
  // spec note "tune for visual clarity". Shared between spiral
  // growth and nested double/triple ring spacing so they tune
  // together.
  const SPIRAL_GROWTH = 0.18;
  // Visual turn cap: spec says 2 full revolutions (720°) is the
  // maximum rendered; label carries the rest. 2π * 2 = 4π.
  const MAX_VISUAL_SWEEP = 4 * Math.PI;
  const isSpiral = (arc.mode === 'standard') && Math.abs(effSweep) > 2 * Math.PI;
  // visualSweep = what we actually DRAW (may be shorter than effSweep
  // when the user entered >720°). Sign preserved.
  const sign = effSweep < 0 ? -1 : 1;
  const visualSweep = isSpiral
    ? sign * Math.min(Math.abs(effSweep), MAX_VISUAL_SWEEP)
    : effSweep;
  // Number of samples — denser for spirals so the outward curve
  // reads smoothly even at two full turns.
  const sampleCount = isSpiral ? Math.max(64, Math.round(Math.abs(visualSweep) * 16)) : 32;
  // Radius (in SVG pixels) at parametric t (0 = start, 1 = end
  // of visualSweep). Circle for non-spiral; linearly growing for
  // spiral. Spiral GROWTH is dimensionless so it scales the px
  // base correctly.
  const rAtPx = (t) => isSpiral
    ? effectiveRPx * (1 + SPIRAL_GROWTH * (Math.abs(visualSweep) * t) / (2 * Math.PI))
    : effectiveRPx;
  const outerRPx = rAtPx(1);

  /* Sample points along the arc/spiral curve in SVG pixel space.
   * Math angle θ becomes screen-visual angle θ via the y-flip
   * (SVG y grows downward), so a +90° math angle still appears
   * as "straight up" on the rendered SVG. */
  const samplePtScreen = (t) => {
    const ang = a0 + visualSweep * t;
    const r = rAtPx(t);
    return { x: vxSvg + Math.cos(ang) * r, y: vySvg - Math.sin(ang) * r };
  };

  // Build the FILLED SECTOR path: vertex → arc samples → back to vertex.
  // For spirals, this fills the swept area including the spiral's
  // self-overlap. fill-rule=evenodd on the path element makes the
  // overlapping revolutions show as alternating filled/empty bands,
  // giving visually distinguishable turns (spec Feature 2).
  let sectorD = 'M' + vxSvg.toFixed(2) + ',' + vySvg.toFixed(2) + ' ';
  for(let i = 0; i <= sampleCount; i++){
    const t = i / sampleCount;
    const p = samplePtScreen(t);
    sectorD += 'L' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ' ';
  }
  sectorD += 'Z';

  // Build the STROKE-ONLY arc path: just the curve, no close-back.
  let strokeD = '';
  for(let i = 0; i <= sampleCount; i++){
    const t = i / sampleCount;
    const p = samplePtScreen(t);
    strokeD += (i === 0 ? 'M' : 'L') + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ' ';
  }
  strokeD = strokeD.trim();

  // Ray length: must reach the OUTERMOST rendered ring so nested
  // double/triple styles don't have hanging arc rings past the
  // supposed bounding rays. For spirals, the outermost point IS
  // outerR (the spiral's final radius). For non-spiral double:
  // baseR * (1 + SPIRAL_GROWTH). For triple: baseR * (1 + 2*GROWTH).
  // Single / hash / other: baseR.
  let rayOuterRPx = outerRPx;
  if(!isSpiral){
    if(stylePass === 'triple')       rayOuterRPx = effectiveRPx * (1 + 2 * SPIRAL_GROWTH);
    else if(stylePass === 'double')  rayOuterRPx = effectiveRPx * (1 + SPIRAL_GROWTH);
    else                             rayOuterRPx = effectiveRPx;
  }
  // Initial ray: vertex along the starting angle out to rayOuterRPx.
  // SVG-pixel coords directly via the y-flip.
  const iRayEndX = vxSvg + Math.cos(a0) * rayOuterRPx;
  const iRayEndY = vySvg - Math.sin(a0) * rayOuterRPx;
  svg.appendChild(_svgEl('line', {
    class: 'gp-arc-ray',
    x1: vxSvg.toFixed(2),  y1: vySvg.toFixed(2),
    x2: iRayEndX.toFixed(2), y2: iRayEndY.toFixed(2)
  }));
  // Terminal ray: vertex → point at rayOuterRPx along terminal angle.
  const termAng = a0 + visualSweep;
  const tRayEndX = vxSvg + Math.cos(termAng) * rayOuterRPx;
  const tRayEndY = vySvg - Math.sin(termAng) * rayOuterRPx;
  svg.appendChild(_svgEl('line', {
    class: 'gp-arc-ray',
    x1: vxSvg.toFixed(2),  y1: vySvg.toFixed(2),
    x2: tRayEndX.toFixed(2), y2: tRayEndY.toFixed(2)
  }));

  // Filled sector (evenodd so spiral overlaps render as bands).
  svg.appendChild(_svgEl('path', {
    class: 'gp-arc-fill',
    d: sectorD,
    'fill-rule': 'evenodd'
  }));
  // Stroked arc/spiral boundary.
  svg.appendChild(_svgEl('path', {
    class: 'gp-arc',
    d: strokeD
  }));

  // Pen style: single is default. Double/triple layer extra nested
  // stroke rings (for non-spiral arcs only — layering on a spiral
  // visually competes with the spiral's own concentric growth).
  // stylePass declared earlier (alongside baseR) so the ray-length
  // calculation can factor nested-ring depth.
  if(!isSpiral && (stylePass === 'double' || stylePass === 'triple')){
    const extraPasses = stylePass === 'double' ? 1 : 2;
    for(let i = 1; i <= extraPasses; i++){
      // Reuse SPIRAL_GROWTH so double/triple ring spacing and
      // spiral-per-turn growth stay in sync — a future tune of the
      // growth factor will visually match across both treatments.
      const rNestPx = effectiveRPx * (1 + i * SPIRAL_GROWTH);
      let dNest = '';
      for(let j = 0; j <= 32; j++){
        const t = j / 32;
        const ang = a0 + visualSweep * t;
        const mxSvg = vxSvg + Math.cos(ang) * rNestPx;
        const mySvg = vySvg - Math.sin(ang) * rNestPx;
        dNest += (j === 0 ? 'M' : 'L') + mxSvg.toFixed(2) + ',' + mySvg.toFixed(2) + ' ';
      }
      svg.appendChild(_svgEl('path', { class: 'gp-arc', d: dNest.trim() }));
    }
  }
  if(!isSpiral && stylePass === 'hash'){
    const markAt = [0.3, 0.7];
    for(const t of markAt){
      const ang = a0 + visualSweep * t;
      // Mark center and perpendicular direction in SCREEN space.
      // Radial direction on screen: (cos(ang), -sin(ang)) (the
      // y-flip again). Perpendicular (rotate 90° CCW in screen):
      // (sin(ang), cos(ang)).
      const mxSvg = vxSvg + Math.cos(ang) * effectiveRPx;
      const mySvg = vySvg - Math.sin(ang) * effectiveRPx;
      const perpX = Math.sin(ang);
      const perpY = Math.cos(ang);
      const extentPx = effectiveRPx * 0.08;
      svg.appendChild(_svgEl('line', {
        class: 'gp-arc-hash',
        x1: (mxSvg - perpX * extentPx).toFixed(2),
        y1: (mySvg - perpY * extentPx).toFixed(2),
        x2: (mxSvg + perpX * extentPx).toFixed(2),
        y2: (mySvg + perpY * extentPx).toFixed(2)
      }));
    }
  }

  // Measure label. Position along the bisector at 60% of base
  // radius (INSIDE the sector). Small-sweep fallback: if the sector
  // is narrow enough that 60% radius would crowd the vertex, push
  // the label outward to 1.1× radius along the bisector. Threshold
  // of 15° (≈0.26 rad) is tuned by eye — below that, labels collide.
  //
  // For spirals, anchor the label near the terminal end of the
  // outermost turn at ≈85% of outer radius. Picks the terminal
  // angle (not the bisector) so the label sits near where the
  // spiral visually ends rather than on the opposite side of the
  // plot where the bisector of 405° would land.
  //
  // Label TEXT always carries the author's intended SIGNED value
  // — for a CW 90° arc the label reads "-90°". Match standard
  // math convention (CCW positive, CW negative).
  if(arc.showMeasure){
    let labelAng, labelRPx;
    const smallSweepRad = 15 * Math.PI / 180;
    if(isSpiral){
      // Anchor near terminal end, at 85% of outer radius. Pull back
      // from the terminal angle by 20° in the winding direction so
      // the label sits inside the outermost turn, not on top of
      // the terminal ray.
      const pullBack = 20 * Math.PI / 180 * sign;
      labelAng = termAng - pullBack;
      labelRPx = outerRPx * 0.85;
    } else {
      // Label sits OUTSIDE the arc when:
      // (a) sweep is small enough that inside-bisector would
      //     crash into the vertex (existing behaviour, threshold
      //     15° ≈ 0.26 rad), OR
      // (b) the arc was clamped to the screen-pixel floor — the
      //     visual circle is now ≤ 30px and the 15px label text
      //     would overflow it if placed at 60% radius.
      // Both conditions push the label to 1.3× effectiveRPx along
      // the bisector. Inside-the-bisector at 60% remains the
      // default for arcs that have room.
      const smallSweep = Math.abs(visualSweep) < smallSweepRad;
      labelAng = a0 + visualSweep / 2;
      labelRPx = (smallSweep || isClampedSmall)
        ? (effectiveRPx * 1.3)
        : (effectiveRPx * 0.6);
    }
    // Position label in SCREEN-PX space directly via the y-flip
    // — no second xToSvg/yToSvg projection.
    const lmx = vxSvg + Math.cos(labelAng) * labelRPx;
    const lmy = vySvg - Math.sin(labelAng) * labelRPx;
    // Displayed value: for standard mode use the SIGNED effSweep
    // (so CW 90° reads as "-90°"). twoRays/threePoints use the
    // unsigned short-arc magnitude — they don't have a "direction"
    // concept the teacher is steering.
    const labelSweep = (arc.mode === 'standard') ? effSweep : Math.abs(effSweep);
    let label;
    if(S.angleMode === 'rad'){
      // π-fraction for magnitudes, prepend minus for negative.
      const mag = _gpFmtRad(Math.abs(labelSweep));
      label = (labelSweep < 0 ? '-' : '') + mag;
    } else {
      const deg = labelSweep * 180 / Math.PI;
      // 1-decimal precision matches the pre-Batch-3B rendering.
      // Math.round on negative values rounds half-to-even in JS —
      // keep it, a rounding tie on a displayed angle isn't worth
      // extra code.
      const rounded = Math.round(deg * 10) / 10;
      label = rounded.toString() + '°';
    }
    const t = _svgEl('text', {
      class: 'gp-arc-label',
      // lmx / lmy are already SVG-pixel coords (computed via
      // vxSvg + cos*rPx and vySvg - sin*rPx above) — no second
      // projection through xToSvg/yToSvg.
      x: lmx, y: lmy,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle'
    });
    t.textContent = label;
    svg.appendChild(t);
  }
}

/** Format a radian measure as a clean π-fraction when it matches a
 *  common angle (π/6, π/4, π/3, π/2, π, ...), otherwise fall back
 *  to a numeric radian value with 3 sig figs. */
function _gpFmtRad(radians){
  const PI = Math.PI;
  const eps = 1e-4;
  // Common fractions of π at secondary level.
  const table = [
    [0,       '0'],
    [PI/6,    'π/6'],
    [PI/4,    'π/4'],
    [PI/3,    'π/3'],
    [PI/2,    'π/2'],
    [2*PI/3,  '2π/3'],
    [3*PI/4,  '3π/4'],
    [5*PI/6,  '5π/6'],
    [PI,      'π'],
    [7*PI/6,  '7π/6'],
    [5*PI/4,  '5π/4'],
    [4*PI/3,  '4π/3'],
    [3*PI/2,  '3π/2'],
    [5*PI/3,  '5π/3'],
    [7*PI/4,  '7π/4'],
    [11*PI/6, '11π/6'],
    [2*PI,    '2π']
  ];
  for(const [v, s] of table){
    if(Math.abs(radians - v) < eps) return s;
  }
  return (Math.round(radians * 1000) / 1000) + ' rad';
}

/* ── Drag support ──────────────────────────────────────────────────
   Previously this module carried a quadrant-snapping dragger that
   rounded the panel to the nearest corner/center on pointerup. Field
   testing (Round-A) reported that behavior as annoying — teachers
   want the panel to stay where they dropped it, not jump to a preset.

   Drag + resize now go through the shared wireWidgetDrag helper
   (src/js/features/widgetDrag.js) called from applyGraphPanelFromState.
   That helper writes {x, y, w, h} into WIDGET_STATE.graphPanel.
   customPosition — when present it overrides the string preset
   (S.position) which continues to drive the initial placement and
   the position-pill UI in the authoring panel.                     */

/* ══════════════════════════════════════════════════════════════════
   COORDINATE TRACE — arrow-key cursor handler (Batch 4E)
   ════════════════════════════════════════════════════════════════
   Single document-level keydown listener (capture phase) that moves
   the trace cursor when:
     • coord trace is enabled in state, AND
     • a graph panel is currently open (.gp-panel.on exists), AND
     • focus is NOT inside a math-field (MathLive consumes input
       when its math-field is focused — we defer to the field)
   Step size: 1.0 unit per arrow press, 0.25 with Shift modifier.
   Cursor clamps to current viewport bounds (no auto-pan) per spec.
   ══════════════════════════════════════════════════════════════════ */
(function _gpkInstallCoordTraceKeys(){
  if(typeof document === 'undefined') return;
  if(document._gpCoordTraceWired) return;
  document._gpCoordTraceWired = true;

  const ARROW_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);

  document.addEventListener('keydown', ev => {
    if(!ARROW_KEYS.has(ev.key)) return;
    // Defer to math-field input so the teacher can type formula
    // characters (which include arrow keys for caret movement)
    // without the trace cursor stealing the keystroke.
    const ae = document.activeElement;
    if(ae && ae.tagName && ae.tagName.toLowerCase() === 'math-field') return;
    // Also defer for any editable / focus-managed control: text
    // inputs, textareas, native dropdowns, and contenteditable
    // regions. A teacher arrowing through a select / point-label
    // input shouldn't have those keys stolen by the trace cursor.
    if(ae && typeof ae.matches === 'function' &&
       ae.matches('input, textarea, select, [contenteditable=""], [contenteditable="true"]')){
      return;
    }
    // Bail if no graph panel is currently open OR coord trace is off.
    if(typeof WIDGET_STATE === 'undefined' || !WIDGET_STATE.graphPanel) return;
    const S = WIDGET_STATE.graphPanel;
    if(!S.coordTrace || !S.coordTrace.enabled) return;
    const panel = document.querySelector('.gp-panel.on');
    if(!panel) return;
    // Consume the key — prevents page scroll on Up/Down and avoids
    // double-handling by other listeners.
    ev.preventDefault();
    ev.stopPropagation();
    const step = ev.shiftKey ? 0.25 : 1;
    let nx = Number(S.coordTrace.x) || 0;
    let ny = Number(S.coordTrace.y) || 0;
    if(ev.key === 'ArrowRight') nx += step;
    else if(ev.key === 'ArrowLeft')  nx -= step;
    else if(ev.key === 'ArrowUp')    ny += step;
    else if(ev.key === 'ArrowDown')  ny -= step;
    // Clamp to current viewport so the cursor never wanders off
    // the visible plot (spec: stop at edge, no auto-pan).
    nx = Math.max(S.xMin, Math.min(S.xMax, nx));
    ny = Math.max(S.yMin, Math.min(S.yMax, ny));
    // Round to step grid to avoid floating-point drift after many
    // moves (e.g. 0.25 + 0.25 + ... eventually accumulating tiny
    // errors that show up in the label as "0.7500000001").
    nx = Math.round(nx * 10000) / 10000;
    ny = Math.round(ny * 10000) / 10000;
    if(nx === S.coordTrace.x && ny === S.coordTrace.y) return;
    S.coordTrace.x = nx;
    S.coordTrace.y = ny;
    _gpRedrawCoordTrace(/*animate=*/true);
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  }, true);
})();

/* ══════════════════════════════════════════════════════════════════
   Plot point selection — keyboard delete
   feat/graph-point-selection-beta

   Backspace and Delete remove the currently-selected point. Guards
   protect text input throughout the app (math-fields, sidebar
   inputs, contenteditable). One-shot install via
   document._gpSelectionKeyWired flag; mirrors the coord-trace
   pattern above.
   ══════════════════════════════════════════════════════════════════ */
(function _gpInstallSelectionKeys(){
  if(typeof document === 'undefined') return;
  if(document._gpSelectionKeyWired) return;
  document._gpSelectionKeyWired = true;

  document.addEventListener('keydown', ev => {
    if(ev.key !== 'Backspace' && ev.key !== 'Delete') return;
    /* CR PR #134: harden against unintended deletes.
     * - defaultPrevented: another handler already consumed this
     *   key (e.g. math-field internal). Don't double-act.
     * - Modifier keys: Ctrl/Cmd/Alt + Backspace are common app
     *   shortcuts (undo, trash file, etc.). Don't repurpose. */
    if(ev.defaultPrevented) return;
    if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
    // Focus guard: don't intercept when the user is typing in any
    // input surface. Math-field has its own backspace semantics
    // for character deletion; sidebar inputs (point labels,
    // viewport bounds, etc.) need backspace to edit values.
    const ae = document.activeElement;
    if(ae){
      const tag = ae.tagName && ae.tagName.toLowerCase();
      if(tag === 'input' || tag === 'textarea' || tag === 'math-field') return;
      if(ae.isContentEditable) return;
    }
    // State guard: only fire when a graph point is selected.
    if(typeof WIDGET_STATE === 'undefined' || !WIDGET_STATE.graphPanel) return;
    const S = WIDGET_STATE.graphPanel;
    if(!S.selectedPointId) return;
    // Visibility guard: only fire when a graph panel is on screen.
    const panel = document.querySelector('.gp-panel.on');
    if(!panel) return;

    ev.preventDefault();
    S.points = (S.points || []).filter(p => p.id !== S.selectedPointId);
    S.selectedPointId = null;
    if(typeof _gpAfterChange === 'function') _gpAfterChange({ label: 'delete-graph-point' });
  }, true);
})();


/* ===== boot: mount the graph full-frame (togGraph's mount half without
 * the launcher rail) ===== */
(function(){
  function boot(){
    try {
      var S = (typeof normalizeGraphPanelState === 'function' && typeof _defaultGraphPanel === 'function')
        ? normalizeGraphPanelState(_defaultGraphPanel())
        : (typeof _defaultGraphPanel === 'function' ? _defaultGraphPanel() : {});
      S.enabled   = true;   // applyGraphPanelFromState bails unless enabled
      S.lightMode = true;   // Math Studio is a paper-white worksheet
      WIDGET_STATE.graphPanel = S;   // the real const from widgetState.js
      var p = document.getElementById('graph-p');
      if (p) p.classList.add('on');
      if (typeof applyGraphPanelFromState === 'function') applyGraphPanelFromState();
      else throw new Error('applyGraphPanelFromState is not defined');
    } catch (e) {
      document.body.innerHTML =
        '<pre style="white-space:pre-wrap;color:#c63528;padding:16px;font:13px monospace">'
        + 'Graph boot error:\n' + (e && e.stack || e) + '</pre>';
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

  </script>
