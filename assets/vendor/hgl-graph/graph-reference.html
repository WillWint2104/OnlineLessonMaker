  // textbox can stay blank while state keeps the previous value.
  if(t.dataset.gpPtX || t.dataset.gpPtY){
    _gpAfterChange({ continuous: true });     // same: commit of a coordinate being typed
    return;
  }
}

/* The graph panel's single "something changed" funnel — 45 call sites.
 *
 * IT USED TO RECORD EVERY ONE OF THEM THE SAME WAY: a debounced
 * scheduleAutosave(), whose generic 'edit' label is the one label history.js
 * coalesces. So adding a function and deleting a point within 2.5s became ONE
 * undo entry, and defect A survived intact in the editor with the most discrete
 * controls, even after the history policy changed.
 *
 * Three modes now, and DISCRETE IS THE DEFAULT — the same shape as the
 * coalescing set itself, so a call site added later is individually undoable
 * unless someone deliberately says otherwise:
 *
 *   (default)          a click: add/remove a function or point, toggle
 *                      visibility or style, size, position, the unit-circle
 *                      preset, an arc. Its own undo step.
 *   { continuous:true} the six sites inside _gpConfigInput and _gpConfigChange
 *                      — per-keystroke number, width and math-field input, plus
 *                      the blur/Enter commit that normalises it. One gesture,
 *                      one undo, so these keep the coalescing path.
 *   { selection:true } the two sites that only move S.selectedPointId. Clicking
 *                      a point to select it is not an edit; persist it, but do
 *                      not spend an undo slot on it (the same call the widget
 *                      drag positions make).
 *
 * opts.label names the action for the discrete case; it only has to be distinct
 * from the coalescing labels, which every named label already is. */
function _gpAfterChange(opts){
  opts = opts || {};
  /* RENDER FIRST. applyGraphPanelFromState is not a pure painter: it clears a
   * stale selectedPointId, runs _gpMigrateUnitCircle, and fires the first-open
   * seed that pushes sin(x) and sets S.seedDismissed. commitEdit snapshots
   * SYNCHRONOUSLY, so taking it before that render checkpoints and persists a
   * state one render behind.
   *
   * Measured: delete the last function, and live held the re-seeded sin(x) with
   * seedDismissed true while both the head entry and localStorage held fns:0,
   * seedDismissed:false. On reload the seed fires again — breaking the
   * guarantee, documented at the seed itself, that an intentionally-empty graph
   * stays empty.
   *
   * This is a regression introduced with the three-mode funnel: the debounced
   * scheduleAutosave it replaced fired 1200ms later and therefore captured the
   * render's mutations. The continuous and selection branches still debounce
   * and were never affected. */
  applyGraphPanelFromState();
  if(opts.selection){
    if(typeof scheduleAutosave === 'function') scheduleAutosave({ skipHistory: true });
  } else if(opts.continuous){
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  } else if(typeof commitEdit === 'function'){
    commitEdit(opts.label || 'graph-edit');
  } else if(typeof scheduleAutosave === 'function'){
    scheduleAutosave();                       // defensive: bundle order guarantees commitEdit
  }
  if(!opts.skipReRender){
    if(typeof renderWidgetConfig === 'function') renderWidgetConfig('graphPanel');
  }
}

/* ══════════════════════════════════════════════════════════════
   RUNTIME PANEL (lesson screen)
   ══════════════════════════════════════════════════════════════ */

/** Toggles the Graph Panel overlay on the lesson canvas. */
function togGraph(){
  const p = document.getElementById('graph-p');
  const b = document.getElementById('wl-graph');
  if(!p) return;
  const on = p.classList.toggle('on');
  if(b) b.classList.toggle('on', on);
  if(on) applyGraphPanelFromState();
}

/** Paints the Graph Panel — viewport, grid, axes, function curves,
 *  and points — from WIDGET_STATE.graphPanel. Called on open, on
 *  every config change, and on persistence restore. */
/* ── Runtime panel layout (Round B #6) ────────────────────────────
   Full layout overhaul. Old panel = header + SVG + runtime input
   row. New panel = drag bar + header + two-column body:

     [sidebar]            [plot area]
      Functions             <svg>           ← math plot
      Points                <canvas>        ← freehand annotation
      Angle Arcs            [expression-add runtime row]
      Viewport
      Calculus
      Readouts
      Style

   Each sidebar entry is a collapsible .gp-card. Cards persist their
   collapse state in sidebarCardStates (session-only — no snapshot
   write, collapsing is a UI preference). The drawing canvas is
   dedicated to the graph panel; strokes painted here never leak to
   the main lesson canvas and vice versa.                          */
/* THE definition of "this graph has no content", used by both the first-open
 * seed and the unit-circle migration that decides whether to re-enable it.
 * Kept as one predicate because the two drifted apart the moment they were
 * written separately, and the resulting bug (a dismissed demo curve coming
 * back after the teacher deletes their points) only surfaces a session later.
 *
 * NOTE: S.strokes is deliberately NOT included, because the seed has never
 * considered pen annotations to be content and changing that is a behaviour
 * change outside this fix. A strokes-only graph therefore still gets seeded —
 * pre-existing, flagged in BUILD_REPORT_P0.md, not altered here.
 *
 * A function declaration, so it is hoisted and cannot trip the TDZ trap in
 * CLAUDE.md lesson 15 regardless of where callers sit in the file. */
function _gpGraphIsEmpty(S){
  /* Array.isArray is required, not incidental: the seed's next act is
   * S.functions.push(...), so a MISSING collection must read as "not empty"
   * (don't seed) rather than "empty" (seed, then TypeError). This mirrors the
   * original condition exactly — `Array.isArray(x) && x.length === 0`. */
  const empty = k => Array.isArray(S[k]) && S[k].length === 0;
  return empty('functions') && empty('points') && empty('arcs');
}

/* Unit-circle retirement (P0b). The preset control is hidden pending the
 * parametric rebuild, so a snapshot saved while it was ON would otherwise
 * strand its 2 functions + 16 points + 1 arc forever: the disable path's only
 * caller was that button. Migrate on load instead.
 *
 * Called from applyGraphPanelFromState BEFORE the first-open seed, so clearing
 * seedDismissed can actually let the seed fire on an emptied graph.
 *
 * _gpToggleUnitCirclePreset's disable branch is preset-SCOPED — it filters on
 * the tracked ids and the fromUnitCirclePreset marker — so a teacher's own
 * functions and points survive untouched. What it deliberately does NOT do is
 * revert the settings the enable branch changed, which is why the reset below
 * exists: without it the user is left on a blank ±1.5 equal-aspect radian pane
 * with the seed suppressed. Every field here is one the enable path sets
 * unconditionally; defaults come from _defaultGraphPanel (widgetState.js).
 *
 * SEPARATED FROM applyGraphPanelFromState, which is DOM-bound, so a real
 * persisted WIDGET_STATE blob can be round-tripped through the migration in a
 * test. It had only ever been checked one predicate at a time; nothing had put
 * a whole snapshot in one end and looked at what came out the other.
 *
 * Mutates S in place, and returns true when it migrated, so the test can tell
 * "nothing to do" from "did nothing". */
function _gpMigrateUnitCircle(S){
  if(!S || !S.unitCircleActive || typeof _gpToggleUnitCirclePreset !== 'function') return false;

  _gpToggleUnitCirclePreset(S);                     // clears the flag + preset entries
  const d = (typeof _defaultGraphPanel === 'function') ? _defaultGraphPanel() : null;
  if(d){
    S.xMin = d.xMin; S.xMax = d.xMax;
    S.yMin = d.yMin; S.yMax = d.yMax;
    S.xStep = d.xStep; S.yStep = d.yStep;
    S.gridStep = d.gridStep;
    S.aspect = d.aspect;
    S.angleMode = d.angleMode;
    S.quadrant = d.quadrant;
    S.showAllCoords = d.showAllCoords;
  }
  /* Only un-suppress the seed when the graph is genuinely empty. A lesson that
   * had its own content alongside the preset must not have a demo sin(x)
   * injected into it.
   *
   * This MUST use the same predicate as the seed. It first shipped checking
   * S.functions alone, which was wrong in a way that does not show up
   * immediately: the seed's own condition also requires points and arcs to be
   * empty, so a points-only pane would not have been seeded there and then. But
   * seedDismissed is a PERSISTED field — clearing it on a points-only pane means
   * the seed fires LATER, the first time the teacher deletes those points,
   * resurrecting a demo curve they had already dismissed. One shared predicate,
   * so the two can never drift again. */
  if(_gpGraphIsEmpty(S)) S.seedDismissed = false;
  if(typeof showToast === 'function'){
    showToast('Unit circle removed — it returns properly in the Circles update. Graph view reset to defaults.');
  }
  return true;
}

function applyGraphPanelFromState(){
  const panel = document.getElementById('graph-p');
  if(!panel) return;
  const S = (typeof WIDGET_STATE !== 'undefined' && WIDGET_STATE.graphPanel) ? WIDGET_STATE.graphPanel : null;
  if(!S || !S.enabled){
    panel.classList.remove('on');
    panel.innerHTML = '';
    document.getElementById('wl-graph')?.classList.remove('on');
    return;
  }

  /* feat/graph-point-selection-beta: sanitize stale selection.
   * If selectedPointId references a point that no longer exists
   * (sidebar × delete, unit-circle disable removed it, etc.),
   * clear it before any code reads the field for render. Lazy
   * cleanup — every mutation site doesn't need its own reset. */
  if(S.selectedPointId !== null &&
     !((S.points || []).some(p => p.id === S.selectedPointId))){
    S.selectedPointId = null;
  }

  _gpMigrateUnitCircle(S);

  // First-open seed: one canonical example function so the graph
  // comes alive on first reveal (teacher doesn't have to type before
  // anything renders). Only seeds when BOTH functions and points
  // arrays are empty — after that the teacher's edits are
  // authoritative.
  // seedDismissed is a persisted model field (renamed from _seeded in
  // CR round-6 — the underscore prefix caused the persistence layer
  // to strip it, so a teacher who deleted everything saw sin(x)
  // reappear on every reload). Now that the sentinel survives save
  // + restore, an intentionally-empty graph stays empty.
  if(_gpGraphIsEmpty(S) && !S.seedDismissed){
    // Use the theme-appropriate palette for the first-open seed so
    // the default sin(x) curve is readable against whichever backdrop
    // the teacher had active on their previous session. Falls back
    // to dark palette when lightMode is absent / false.
    S.functions.push({
      id: _grNewId('fn'),
      expr: 'sin(x)',
      raw: 'sin(x)',
      color: _gpRtPalette(S)[0],
      visible: true,
      showDerivative: false
    });
    S.seedDismissed = true;
  }

  // Snapshot persistent UI state before the innerHTML wipe (CR round-2):
  // - drawing canvas bitmap so freehand annotations survive rerender
  // - per-card expansion flags so open Viewport / Points etc. stay open
  //   after any sidebar edit that triggers _gpAfterChange
  _gpPreserveBeforeRender(panel, S);

  panel.innerHTML = '';

  // Light-mode toggle. The .gp-light class scopes local custom-
  // property overrides (see graph-panel.css — LIGHT MODE block) so
  // surfaces / text / accent green / grid rules all swap without
  // leaking into other widgets. Classes updated in place rather
  // than replaced so non-theme classes the resize handler or other
  // code may have added survive the re-render.
  if(S.lightMode){ panel.classList.add('gp-light'); }
  else           { panel.classList.remove('gp-light'); }

  // Size + position. customPosition (set by wireWidgetDrag on user
  // drag) overrides the string preset — preset drives the INITIAL
  // layout and the authoring-panel position pills, but once dragged
  // the panel stays where dropped.
  const widthPx = S.sizePreset === 'custom'
    ? S.customWidthPx
    : (GRAPH_SIZE_PX[S.sizePreset] || GRAPH_SIZE_PX.medium);
  panel.style.width = widthPx + 'px';
  if(!S.customPosition){
    _applyGraphPanelPosition(panel, S.position);
  }

  // Unified drag bar + header.
  const dragBar = (typeof ensureWidgetDragBar === 'function')
    ? ensureWidgetDragBar(panel, false)
    : null;
  const hdr = document.createElement('div');
  hdr.className = 'gp-hdr';
  const sidebarToggleLabel = S.sidebarCollapsed ? 'Show sidebar' : 'Hide sidebar';
  const sidebarToggleIcon  = S.sidebarCollapsed ? 'chevron_right' : 'chevron_left';
  hdr.innerHTML = `
    <button type="button" class="wc gp-sidebar-toggle" aria-label="${sidebarToggleLabel}" title="${sidebarToggleLabel}"><span class="ms" aria-hidden="true">${sidebarToggleIcon}</span></button>
    <span class="gp-hdr-title">Graph</span>
    <button type="button" class="wc gp-close" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>`;
  hdr.querySelector('.gp-close').addEventListener('click', () => {
    panel.classList.remove('on');
    const b = document.getElementById('wl-graph');
    if(b) b.classList.remove('on');
  });
  hdr.querySelector('.gp-sidebar-toggle').addEventListener('click', () => {
    S.sidebarCollapsed = !S.sidebarCollapsed;
    _gpAfterChange();
  });
  panel.appendChild(hdr);

  // Two-column body: [sidebar] [plot + drawing + runtime input].
  const body = document.createElement('div');
  body.className = 'gp-body gp-body-twocol' + (S.sidebarCollapsed ? ' gp-sidebar-off' : '');

  // Sidebar with collapsible cards (Round B #6).
  const sidebar = document.createElement('aside');
  sidebar.className = 'gp-sidebar';
  sidebar.appendChild(_gpBuildFunctionsCard(S));
  sidebar.appendChild(_gpBuildPointsCard(S));
  sidebar.appendChild(_gpBuildArcsCard(S));
  sidebar.appendChild(_gpBuildViewportCard(S));
  sidebar.appendChild(_gpBuildPresetsCard(S));
  sidebar.appendChild(_gpBuildStubCard(
    // 'calculus' is NOT a Material Icon name, so the glyph failed to
    // render and the literal text 'calculus' was leaking into the
    // card header — pushing the title out. 'functions' is the
    // closest intent-matching real icon.
    'calc-card',  'functions',  'Calculus',
    'Derivative / integral / tangent — coming soon.'
  ));
  sidebar.appendChild(_gpBuildStubCard(
    'read-card',  'straighten', 'Readouts',
    'Distance / midpoint / slope — coming soon.'
  ));
  sidebar.appendChild(_gpBuildStyleCard(S));
  body.appendChild(sidebar);

  // Plot + drawing canvas + runtime input.
  const plotCol = document.createElement('div');
  plotCol.className = 'gp-plotcol';

  // Round-B3 round-2 (CR): measure the actual rendered .gp-plotwrap
  // after the flex layout resolves, instead of estimating width by
  // subtracting a hard-coded 180px sidebar from panel.offsetWidth.
  // The sidebar is clamp(160px, 28cqi, 240px) so the estimate was
  // wrong at most panel sizes. We build plotWrap empty, mount the
  // full body into the panel so flex settles, then read
  // plotWrap.getBoundingClientRect() for real dimensions before
  // building the SVG + drawing canvas at the correct resolution.
  const plotWrap = document.createElement('div');
  plotWrap.className = 'gp-plotwrap';
  plotCol.appendChild(plotWrap);

  // Runtime expression-add row — kept so a teacher can add a
  // function without opening the Functions card. Pure convenience.
  plotCol.appendChild(_gpBuildRuntimeInput(S));

  body.appendChild(plotCol);

  // MathLive virtual-keyboard right-dock (Issue 1). The dock element
  // is created lazily by features/graphKeyboard.js on first math-
  // field focus, but we pre-seed an empty slot here so the flex
  // layout has a stable sibling and the initial plot-column width
  // measurement above doesn't shift when the dock first appears.
  // The element starts display:none (see .gp-vk-dock in graph-
  // panel.css) so it takes zero space until gp-vk-docked flips on.
  //
  // Structure: the dock hosts a custom close bar above the MathLive
  // keyboard root. MathLive's numeric/symbols/alphabetic layouts
  // DON'T include the built-in [hide-keyboard] action (only the
  // minimalist layout does), so we render our own explicit close
  // affordance here. The MathLive keyboard element mounts as a
  // sibling of .gp-vk-dock-close inside .gp-vk-dock-body — the
  // container graphKeyboard.js sets on mathVirtualKeyboard.container
  // is .gp-vk-dock-body (the KEYBOARD slot), NOT the .gp-vk-dock
  // wrapper, so our close bar stays outside MathLive's DOM ownership.
  const vkDock = document.createElement('div');
  vkDock.className = 'gp-vk-dock';
  vkDock.setAttribute('aria-hidden', 'true');
  vkDock.innerHTML = `
    <div class="gp-vk-dock-close">
      <span class="gp-vk-dock-title">Keyboard</span>
      <button type="button" class="gp-vk-dock-close-btn" aria-label="Close keyboard">
        <span class="ms" aria-hidden="true">close</span>
      </button>
    </div>
    <div class="gp-vk-dock-body"></div>`;
  body.appendChild(vkDock);
  // Close-button handler: hides the global VK singleton; the
  // 'virtual-keyboard-toggle' listener in graphKeyboard.js then
  // removes the dock class and blurs the field so the plot area
  // re-expands with no lingering focus ring.
  vkDock.querySelector('.gp-vk-dock-close-btn').addEventListener('click', () => {
    if(window.mathVirtualKeyboard && typeof window.mathVirtualKeyboard.hide === 'function'){
      window.mathVirtualKeyboard.hide();
    }
  });

  panel.appendChild(body);

  // Measure the now-mounted plotWrap. getBoundingClientRect forces
  // layout, so we get real post-flex dimensions. If the panel isn't
  // yet in the DOM (zero rect), fall back to a conservative estimate
  // from panel.offsetWidth minus a sidebar guess — the next rerender
  // will correct it once the panel is visible.
  const plotRect = plotWrap.getBoundingClientRect();
  const fallbackSidebarPx = S.sidebarCollapsed ? 0 : 200;
  const svgW = plotRect.width > 10
    ? Math.max(200, Math.round(plotRect.width))
    : Math.max(200, (panel.offsetWidth || widthPx) - fallbackSidebarPx - 16);
  const xSpan = S.xMax - S.xMin;
  const ySpan = S.yMax - S.yMin;
  // Guard against a zero/invalid xSpan (xMin === xMax, or NaN from a
  // malformed state) before dividing. Without this the ratio becomes
  // Infinity or NaN and svgH ends up non-finite, which corrupts the
  // SVG viewBox and the drawing canvas' intrinsic resolution. Fall
  // back to a 1:1 ratio so the plot still renders at a usable size
  // while the teacher fixes the viewport numbers.
  const safeRatio = (Number.isFinite(xSpan) && Math.abs(xSpan) > 1e-9 && Number.isFinite(ySpan))
    ? (ySpan / xSpan)
    : 1;
  const availH = plotRect.height > 10
    ? Math.max(140, Math.round(plotRect.height))
    : Math.max(200, (panel.offsetHeight || (widthPx * 0.9)) - 140);
  // Aspect handling: 'equal' forces square-ratio plot so circles
  // look circular; 'stretch' derives from range ratio. Bounded by
  // the real available height so the plot doesn't spill past its
  // column.
  let svgH;
  if(S.aspect === 'equal'){
    svgH = Math.min(availH, svgW * safeRatio);
    if(svgH < 140) svgH = 140;
  } else {
    svgH = Math.max(140, Math.min(availH, svgW * safeRatio));
  }
  // Round-B3: NO inline width/height on plotWrap — CSS flex:1 drives
  // the rendered size continuously as the panel is drag-resized.
  // svgW/svgH define the internal SVG viewBox coord space and the
  // drawing canvas intrinsic resolution for this render.
  const svg = _gpBuildSvg(S, svgW, svgH);
  /* feat/graph-point-selection-beta: delegated pointerdown on
   * the plot SVG handles point selection when the select tool
   * is active. PR A's .gp-draw.sel { pointer-events: none } lets
   * events through to the SVG; this handler then maps clicks to
   * data-gp-pt-id (set or clear selectedPointId). The
   * currentTool() guard is defensive — should be redundant with
   * PR A's class but cheap insurance. */
  svg.addEventListener('pointerdown', (ev) => {
    const tool = (typeof activeTool === 'string') ? activeTool : 'pen';
    if(tool !== 'select') return;
    const target = ev.target && ev.target.closest
      ? ev.target.closest('[data-gp-pt-id]')
      : null;
    /* CR PR #134: skip re-render when the click doesn't change
     * selection state. Tapping an already-selected point or
     * empty plot when nothing is selected should be a no-op,
     * not a full _gpAfterChange cascade. */
    const nextId = target ? target.getAttribute('data-gp-pt-id') : null;
    if(nextId === S.selectedPointId) return;
    S.selectedPointId = nextId;
    _gpAfterChange({ selection: true });      // tapping a point is not an edit
  });
  plotWrap.appendChild(svg);
  // Drawing canvas overlay (Round B #5). Reuses the previously-
  // rendered <canvas class="gp-draw"> when one already exists inside
  // #graph-p so strokes painted before the rerender survive config
  // changes (CR-round-2 fix — previously panel.innerHTML='' at the
  // top of applyGraphPanelFromState wiped the bitmap on every
  // _gpAfterChange call). _gpGetPreservedDrawCanvas stashes the old
  // canvas and its ImageData before the innerHTML wipe; we pull it
  // back here, re-attach to the fresh plotWrap, and blit the saved
  // pixels onto the (possibly differently-sized) new canvas.
  const drawCanvas = _gpAttachOrCreateDrawCanvas(plotWrap, svgW, svgH);

  // Drag / resize wiring. PR-2 of the widget-shell refactor — tuning
  // (minW:404 / minH:280 — the two-column layout's floor below which
  // sidebar + plot would overlap) now lives in
  // WIDGET_SHELL_CONFIG['graphPanel']. mountWidgetShell creates the
  // .gp-resize handle if not already present and hands the existing
  // dragBar through as the handle override.
  if(typeof mountWidgetShell === 'function'){
    mountWidgetShell(panel, 'graphPanel', { handleEl: dragBar || hdr });
  }

  /* LAST, because it is the only point where the panel's real height exists.
     _applyGraphPanelPosition runs near the top of this function, BEFORE the
     header, sidebar and plot are built, so a guard placed there measures an
     empty panel and can never see it outgrow its host -- which is exactly how
     the first version of this fix failed to fire. The panel's height is a
     result of this render, so the check that depends on it belongs after it. */
  _gpKeepHeaderReachable(panel);
}

/* ── State preservation across rerenders ──────────────────────────
   applyGraphPanelFromState wipes panel.innerHTML on every call so
   the layout can be rebuilt from state. That's fine for the
   declarative parts (SVG, sidebar card content, title row) but
   destroys two things teachers expect to survive a config change:
     1. Anything they've drawn on .gp-draw with the pen tool.
     2. Which sidebar cards they'd opened (the builders' `collapsed`
        defaults otherwise reset every pill flip / viewport edit).

   These helpers snapshot both BEFORE the innerHTML wipe, stash them
   on the state object behind an underscore-prefixed session key
   (_ui), and the render path reads from there on re-attach.

   _ui is intentionally NOT persisted via JSON.stringify — see
   _gpStripTransientKeys below for the strip-before-save convention.
   If the normalizer were to accept _ui on restore, a reload would
   carry card-open state across sessions; we chose session-only so
   the teacher's fresh open starts with a clean opinionated default. */
function _gpPreserveBeforeRender(panel, S){
  if(!S) return;
  if(!S._ui) S._ui = {};
  // PR-6 (feedback #1): the drawing-canvas bitmap snapshot that used
  // to live here (S._ui.drawImage + drawW/drawH) is retired. Strokes
  // are now persisted as vectors on S.strokes and replayed on every
  // attach — no transient bitmap roundtrip needed. This also fixes
  // the narrow case where _stripTransientWidgetKeys dropped _ui
  // before autosave, meaning a rerender-without-new-stroke could
  // lose annotations entirely if the tab backgrounded between paint
  // and save.
  //
  // Per-card expansion state stays transient — map from card id to
  // boolean "isOpen". Cards register via _gpMakeCard with their id;
  // on the next render the builder looks up this map to override
  // its default collapse state.
  if(!S._ui.cardOpen) S._ui.cardOpen = {};
  panel.querySelectorAll(':scope .gp-card').forEach(card => {
    if(!card.id) return;
    S._ui.cardOpen[card.id] = !card.classList.contains('gp-card-collapsed');
  });
}

/** Resolve whether a card should render expanded this pass. Returns
 *  the preserved open-state when known, falls back to the builder's
 *  `defaultCollapsed` argument otherwise. Callers pass in their
 *  natural default so the first-ever render still honors it. */
function _gpResolveCardCollapsed(S, id, defaultCollapsed){
  if(S && S._ui && S._ui.cardOpen && Object.prototype.hasOwnProperty.call(S._ui.cardOpen, id)){
    return !S._ui.cardOpen[id];
  }
  return !!defaultCollapsed;
}

/** Attach the drawing canvas into plotWrap and replay any persisted
 *  strokes on S.strokes. Strokes are stored in canvas-pixel coords
 *  paired with the canvas dimensions at stroke-time; if the new
 *  canvas is a different size, points are scaled proportionally
 *  during replay so a drag-resize preserves the drawing's shape
 *  relative to the plot. Wire is idempotent via a sentinel on the
 *  canvas. */
function _gpAttachOrCreateDrawCanvas(plotWrap, w, h){
  const canvas = document.createElement('canvas');
  canvas.className = 'gp-draw';
  canvas.width  = w;
  canvas.height = h;
  canvas.setAttribute('aria-label', 'Graph annotation canvas');
  plotWrap.appendChild(canvas);
  const S = (typeof WIDGET_STATE !== 'undefined' && WIDGET_STATE.graphPanel) ? WIDGET_STATE.graphPanel : null;
  // PR-6 (feedback #1): replay vector strokes from S.strokes. This
  // replaces the old bitmap-snapshot round-trip — the strokes list
  // is now the source of truth, so an undo that shrinks S.strokes
  // by one naturally produces a rerender that paints one fewer
  // stroke. Replay happens in insertion order so eraser strokes
  // correctly sit on top of pen strokes that preceded them.
  if(S && Array.isArray(S.strokes) && S.strokes.length){
    const ctx = canvas.getContext('2d');
    if(ctx){
      for(const stroke of S.strokes){
        _gpPaintStroke(ctx, stroke, w, h);
      }
    }
  }
  _gpWireGraphDrawing(canvas);
  return canvas;
}

/** Paint one persisted stroke onto a 2D context. Shared between the
 *  live-drawing handler (for the final commit frame) and the
 *  on-attach replay path, so a stroke painted during an edit session
 *  looks identical when replayed after a rerender or after an undo +
 *  redo. stroke.w / stroke.h are the canvas dimensions the stroke
 *  was captured against; targetW / targetH are the current canvas
 *  dimensions. When they differ the points are scaled proportionally,
 *  preserving shape relative to the plot even across drag-resize. */
function _gpPaintStroke(ctx, stroke, targetW, targetH){
  if(!ctx || !stroke) return;
  const pts = Array.isArray(stroke.points) ? stroke.points : [];
  if(pts.length === 0) return;
  const sx = (stroke.w && targetW) ? targetW / stroke.w : 1;
  const sy = (stroke.h && targetH) ? targetH / stroke.h : 1;
  // PR-6 CR-1: stroke thickness must scale with the canvas too, not
  // just the point coordinates. Otherwise a stroke drawn at canvas
  // 400×300 and replayed at 800×600 would have correctly-placed
  // points but lines still rendered at the original line width —
  // visibly half as thick relative to the content. Use min(sx, sy)
  // so a non-uniform axis resize (which shouldn't normally happen
  // since the plot's aspect is locked, but can during transient
  // resize frames) doesn't pathologically fatten the stroke.
  const scale = Math.min(sx, sy);
  const scaled = pts.map(p => [p[0] * sx, p[1] * sy, p[2]]);
  const tool = stroke.tool;
  const color = stroke.color;
  const sz = stroke.size * scale;

  if(tool === 'eraser'){
    // Replay eraser strokes as clearRect patches at each recorded
    // point. Box size uses the scaled thickness so the erased area
    // matches what the teacher originally saw at the recording
    // canvas size — a tiny-canvas eraser tap no longer leaves a
    // giant crater when replayed onto a large canvas.
    for(const p of scaled){
      ctx.clearRect(p[0] - sz*5, p[1] - sz*5, sz*10, sz*10);
    }
    return;
  }

  if(tool === 'dotted' || tool === 'dashed'){
    // Segmented fallback — replay as a sequence of dashed segments
    // between successive points, matching the live pointermove path.
    if(scaled.length < 2) return;
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = sz;
    ctx.globalAlpha = 1;
    ctx.setLineDash(tool === 'dotted' ? [sz*0.6, sz*2] : [sz*3, sz*2]);
    ctx.beginPath();
    ctx.moveTo(scaled[0][0], scaled[0][1]);
    for(let i = 1; i < scaled.length; i++){
      ctx.lineTo(scaled[i][0], scaled[i][1]);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }

  // Smooth fill-outline tools (pen / highlight / marker / brush).
  const pf = (typeof window !== 'undefined') ? window.perfectFreehand : null;
  ctx.save();
  if(!pf || typeof pf.getStroke !== 'function'){
    // Library missing — polyline fallback (same as live handler).
    ctx.strokeStyle = color;
    ctx.lineWidth = sz;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for(let i = 0; i < scaled.length; i++){
      if(i === 0) ctx.moveTo(scaled[i][0], scaled[i][1]);
      else ctx.lineTo(scaled[i][0], scaled[i][1]);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }
  // Only the four smooth tools actually reach this code path —
  // dotted / dashed returned early above. Dropped the two stale
  // entries per CR.
  const sizeMap = { pen: sz*1.6, highlight: sz*4, marker: sz*2.4, brush: sz*2 };
  const opts = {
    size: sizeMap[tool] || sz * 1.6,
    thinning: tool === 'marker' ? 0.2 : (tool === 'highlight' ? 0.1 : 0.55),
    smoothing: tool === 'brush' ? 0.75 : 0.62,
    streamline: 0.55,
    simulatePressure: true,
    last: true                        // replay is always a final stroke
  };
  const outline = pf.getStroke(scaled, opts);
  if(!outline.length){ ctx.restore(); return; }
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  if(tool === 'highlight'){ ctx.globalAlpha = 0.44; ctx.fillStyle = _gpHexToRgba(color, 0.33); }
  else if(tool === 'marker'){ ctx.globalAlpha = 0.95; }
  else if(tool === 'brush'){ ctx.globalAlpha = 0.85; ctx.shadowBlur = sz * 1.6; ctx.shadowColor = color; }
  ctx.beginPath();
  ctx.moveTo(outline[0][0], outline[0][1]);
  for(let i = 1; i < outline.length; i++){ ctx.lineTo(outline[i][0], outline[i][1]); }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ── Drawing canvas (Round B #5) ───────────────────────────────────
   Pointer-event-based freehand drawing scoped to the graph panel.
   Reuses the lesson canvas's global pen tool state (penColor,
   penSz, activeTool) so the teacher's existing pen bar drives both
   surfaces. Uses perfect-freehand when available (same library as
   main canvas) and falls back to simple line segments otherwise.
   Handlers are local to the canvas element, so strokes never bleed
   into the main lesson canvas. Eraser tool does a clearRect
   square; dotted/dashed fall back to segmented lines since
   perfect-freehand's filled outline doesn't respect setLineDash. */
function _gpWireGraphDrawing(canvas){
  if(!canvas || canvas._gpDrawWired) return;
  canvas._gpDrawWired = true;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  let drawing = false;
  let activePointerId = null;
  let strokePoints = [];
  let baseSnapshot = null;

  const getPoint = ev => {
    const r  = canvas.getBoundingClientRect();
    const sx = canvas.width  / r.width;
    const sy = canvas.height / r.height;
    const p  = (typeof ev.pressure === 'number' && ev.pressure > 0) ? ev.pressure : 0.5;
    return [(ev.clientX - r.left) * sx, (ev.clientY - r.top) * sy, p];
  };

  const currentTool  = () => (typeof activeTool === 'string' ? activeTool : 'pen');
  const currentColor = () => (typeof penColor === 'string' ? penColor : '#4531d4');
  const currentSize  = () => (typeof penSz === 'number' && penSz > 0 ? penSz : 4);

  const applyFill = () => {
    const tool = currentTool();
    const color = currentColor();
    const sz = currentSize();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    if(tool === 'highlight'){ ctx.globalAlpha = 0.44; ctx.fillStyle = _gpHexToRgba(color, 0.33); }
    else if(tool === 'marker'){ ctx.globalAlpha = 0.95; }
    else if(tool === 'brush'){ ctx.globalAlpha = 0.85; ctx.shadowBlur = sz * 1.6; ctx.shadowColor = color; }
  };

  const renderSmooth = (isFinal) => {
    if(!strokePoints.length) return;
    const tool = currentTool();
    const sz = currentSize();
    if(tool === 'dotted' || tool === 'dashed'){
      // Segmented-stroke fallback for dashed tools.
      if(strokePoints.length < 2) return;
      const [px, py] = strokePoints[strokePoints.length - 2];
      const [x, y]   = strokePoints[strokePoints.length - 1];
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor();
      ctx.lineWidth = sz;
      ctx.globalAlpha = 1;
      ctx.setLineDash(tool === 'dotted' ? [sz*0.6, sz*2] : [sz*3, sz*2]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      ctx.setLineDash([]);
      return;
    }
    const pf = (typeof window !== 'undefined') ? window.perfectFreehand : null;
    if(!pf || typeof pf.getStroke !== 'function'){
      // Library missing — simple polyline fallback.
      ctx.strokeStyle = currentColor();
      ctx.lineWidth = sz;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      for(let i = 0; i < strokePoints.length; i++){
        const [x, y] = strokePoints[i];
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      return;
    }
    const sizeMap = { pen: sz*1.6, highlight: sz*4, marker: sz*2.4, brush: sz*2, dotted: sz*1.4, dashed: sz*1.4 };
    const opts = {
      size: sizeMap[tool] || sz * 1.6,
      thinning: tool === 'marker' ? 0.2 : (tool === 'highlight' ? 0.1 : 0.55),
      smoothing: tool === 'brush' ? 0.75 : 0.62,
      streamline: 0.55,
      simulatePressure: true,
      last: !!isFinal
    };
    const outline = pf.getStroke(strokePoints, opts);
    if(!outline.length) return;
    if(baseSnapshot){ ctx.putImageData(baseSnapshot, 0, 0); }
    applyFill();
    ctx.beginPath();
    ctx.moveTo(outline[0][0], outline[0][1]);
    for(let i = 1; i < outline.length; i++){ ctx.lineTo(outline[i][0], outline[i][1]); }
    ctx.closePath();
    ctx.fill();
  };

  // PR-6: track the tool at pointerdown so a mid-stroke tool change
  // (from a keyboard shortcut, say) doesn't split the stroke's
  // recorded tool between frames. Eraser needs to accumulate points
  // too — previously it only clearRect'd and discarded the gesture,
  // making replay impossible.
  let strokeTool = 'pen';
  let strokeColor = '#4531d4';
  let strokeSize = 4;
  // fix/graph-canvas-honor-select-tool: apply initial .sel class
  // based on the current tool. The CSS rule on .gp-draw.sel sets
  // pointer-events:none, so a pointerdown on the plot in select
  // mode falls through to the SVG underneath. Mirrors the
  // .qoverlay.sel pattern (imageAnnotationOverlay.js:63) and
  // .dc.sel pattern (canvas.js:312-314).
  canvas.classList.toggle('sel', currentTool() === 'select');
  // Tool-change broadcast hook — canvas.js's setTool calls
  // window._gpCanvasOnToolChange after switching tools. Set-based
  // registry pattern (CR PR #133): a single window-level hook
  // iterates the registry on each tool change. Each canvas adds
  // itself to the registry; disconnected canvases are pruned
  // lazily on the next broadcast. Avoids the recursive-wrapping
  // leak where every re-render accumulated a stale closure
  // capturing the old canvas.
  if(typeof window !== 'undefined'){
    if(!window._gpCanvasToolListeners){
      window._gpCanvasToolListeners = new Set();
      window._gpCanvasOnToolChange = (newTool) => {
        const reg = window._gpCanvasToolListeners;
        if(!reg) return;
        for(const c of reg){
          if(!c || !c.isConnected){ reg.delete(c); continue; }
          try { c.classList.toggle('sel', newTool === 'select'); } catch(_){}
        }
      };
    }
    window._gpCanvasToolListeners.add(canvas);
  }

  canvas.addEventListener('pointerdown', ev => {
    // Defensive early-return for the select tool. The .sel class +
    // pointer-events:none above should prevent this listener from
    // firing at all in select mode, but the redundant guard
    // matches the canvas.js:750 pattern and protects against any
    // tool-change race where the class hasn't applied yet.
    if(currentTool() === 'select') return;
    // PR-toolbar-overhaul C: area-erase is main-canvas-only for now —
    // without this guard the graph canvas would treat 'eraserArea' as
    // an unknown drawing tool and lay down a phantom pen stroke whose
    // replay would clearRect a region instead. Deferred: a real
    // area-erase for graph strokes.
    if(currentTool() === 'eraserArea') return;
    if(activePointerId !== null) return;
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    activePointerId = ev.pointerId;
    drawing = true;
    strokeTool = currentTool();
    strokeColor = currentColor();
    strokeSize = currentSize();
    strokePoints = [getPoint(ev)];
    try { canvas.setPointerCapture(ev.pointerId); } catch(_){}
    if(strokeTool !== 'eraser' && strokeTool !== 'dotted' && strokeTool !== 'dashed'){
      baseSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
    // PR-6 CR-1: eraser taps need to clear the live canvas at the
    // pointerdown point too, not just on pointermove. Without this,
    // a click-without-drag recorded an eraser point that replay
    // later turned into a clearRect, but the live canvas stayed
    // untouched until the user moved — an odd "commits to persist
    // but not to paint" mismatch. Apply the clearRect here so live
    // and replay stay in lockstep.
    if(strokeTool === 'eraser'){
      const [x, y] = strokePoints[0];
      ctx.clearRect(x - strokeSize*5, y - strokeSize*5, strokeSize*10, strokeSize*10);
    }
    ev.preventDefault();
  });
  canvas.addEventListener('pointermove', ev => {
    if(!drawing || ev.pointerId !== activePointerId) return;
    const p = getPoint(ev);
    if(strokeTool === 'eraser'){
      const sz = strokeSize;
      ctx.clearRect(p[0] - sz*5, p[1] - sz*5, sz*10, sz*10);
      // PR-6: record eraser points too so replay can re-apply the
      // clearRect patches in the same order.
      strokePoints.push(p);
      return;
    }
    strokePoints.push(p);
    renderSmooth(false);
  });
  const endStroke = ev => {
    if(!drawing || ev.pointerId !== activePointerId) return;
    drawing = false;
    activePointerId = null;
    try { canvas.releasePointerCapture(ev.pointerId); } catch(_){}
    if(strokeTool !== 'eraser' && strokeTool !== 'dotted' && strokeTool !== 'dashed'){
      renderSmooth(true);
    }
    // PR-6 (feedback #1): commit the stroke to state + history.
    // CR-1: pointerdown always seeds one point, so "length > 0"
    // was always true and taps on dotted/dashed (which need >=2
    // points to render) were consuming undo slots for nothing.
    // The minimum-points rule is tool-specific:
    //   pen / highlight / marker / brush — 1 point is a valid dot,
    //     keep the stroke so a tap-to-dot renders + is undoable.
    //   dotted / dashed — need 2 points to draw any segment,
    //     drop single-point strokes (no-op on replay otherwise).
    //   eraser — 1 point is a valid single clear patch, keep.
    const minPoints = (strokeTool === 'dotted' || strokeTool === 'dashed') ? 2 : 1;
    if(strokePoints.length >= minPoints &&
       typeof WIDGET_STATE !== 'undefined' &&
       WIDGET_STATE.graphPanel){
      const S = WIDGET_STATE.graphPanel;
      if(!Array.isArray(S.strokes)) S.strokes = [];
      // Bound the persisted list so a user can't fill localStorage
      // with a hundred-thousand-stroke session. Matches the cap
      // applied by normalizeGraphPanelState on restore.
      const limit = (typeof GRAPH_STROKE_LIMIT === 'number') ? GRAPH_STROKE_LIMIT : 200;
      const ptLimit = (typeof GRAPH_STROKE_POINT_LIMIT === 'number') ? GRAPH_STROKE_POINT_LIMIT : 2000;
      const capped = strokePoints.length > ptLimit ? strokePoints.slice(0, ptLimit) : strokePoints;
      S.strokes.push({
        tool: strokeTool,
        color: strokeColor,
        size: strokeSize,
        points: capped.map(p => [p[0], p[1], p[2]]),
        w: canvas.width,
        h: canvas.height
      });
      while(S.strokes.length > limit) S.strokes.shift();
      // PR-stroke-undo: graph strokes share the main-canvas stroke
      // commit path via autosaveOnStrokeCommit (persistence.js).
      // Bypasses debounce, uses the non-coalescing 'stroke' label
      // so each graph stroke is its own undo entry.
      if(typeof autosaveOnStrokeCommit === 'function'){
        autosaveOnStrokeCommit();
      } else if(typeof scheduleAutosave === 'function'){
        scheduleAutosave();
      }
    }
    strokePoints = [];
    baseSnapshot = null;
  };
  canvas.addEventListener('pointerup',     endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave',  ev => { if(drawing) endStroke(ev); });
}

function _gpHexToRgba(hex, alpha){
  const h = (hex || '').replace('#','');
  if(!/^[0-9A-Fa-f]{6}$/.test(h)) return 'rgba(0,0,0,' + alpha + ')';
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

/* ── Sidebar card builders (Round B #6) ────────────────────────────
   Each builder returns a <section class="gp-card"> with header
   (icon + label + fold toggle) and body. Cards commit state
   changes via _gpAfterChange which re-renders the runtime. */

/** Generic card shell: header with title + chevron + icon, body
 *  below. Returns the root .gp-card element plus the body element
 *  so callers can append card-specific controls.                  */
function _gpMakeCard(opts){
  const { id, icon, title, collapsed, count } = opts;
  const card = document.createElement('section');
  card.className = 'gp-card' + (collapsed ? ' gp-card-collapsed' : '');
  card.id = id;
  const head = document.createElement('header');
  head.className = 'gp-card-head';
  /* COUNT BADGE. Rendered only when there is something to count, so an empty
     card stays quiet. It sits in the HEADER rather than the body because the
     header is the part that survives collapsing — which is the whole point:
     a teacher looking at a plot with an object on it needs to be able to see
     WHICH card owns that object without opening each one in turn. The count is
     folded into the header's accessible name for the same reason. */
  const n = Number.isFinite(count) ? count : 0;
  const badge = n > 0 ? `<span class="gp-card-count" aria-hidden="true">${n}</span>` : '';
  head.innerHTML = `
    <span class="ms gp-card-icon" aria-hidden="true">${icon}</span>
    <span class="gp-card-title">${title}</span>${badge}
    <span class="ms gp-card-chevron" aria-hidden="true">${collapsed ? 'expand_more' : 'expand_less'}</span>`;
  head.setAttribute('aria-label', n > 0 ? `${title} (${n})` : String(title));
  head.setAttribute('role', 'button');
  head.setAttribute('tabindex', '0');
  head.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  head.addEventListener('click', () => {
    card.classList.toggle('gp-card-collapsed');
    const isCollapsed = card.classList.contains('gp-card-collapsed');
    head.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
    head.querySelector('.gp-card-chevron').textContent = isCollapsed ? 'expand_more' : 'expand_less';
  });
  head.addEventListener('keydown', ev => {
    if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); head.click(); }
  });
  card.appendChild(head);
  const body = document.createElement('div');
  body.className = 'gp-card-body';
  card.appendChild(body);
  return { card, body };
}

function _gpBuildStubCard(id, icon, title, message){
  const S = (typeof WIDGET_STATE !== 'undefined' && WIDGET_STATE.graphPanel) ? WIDGET_STATE.graphPanel : null;
  const { card, body } = _gpMakeCard({
    id, icon, title,
    collapsed: _gpResolveCardCollapsed(S, id, true)
  });
  const note = document.createElement('div');
  note.className = 'gp-card-stub';
  note.textContent = message;
  body.appendChild(note);
  return card;
}

/** Style card — houses the light-mode toggle. Previously a stub
 *  ("Legend / export / lock viewport — coming soon"). Future
 *  style-like options (legend, axis-label font size, stroke width)
 *  extend this same card rather than proliferating new cards. */
function _gpBuildStyleCard(S){
  const { card, body } = _gpMakeCard({
    id: 'style-card', icon: 'palette', title: 'Style',
    collapsed: _gpResolveCardCollapsed(S, 'style-card', true)
  });
  const row = document.createElement('label');
  row.className = 'gp-card-row gp-card-toggle';
  row.innerHTML = `<input type="checkbox" ${S.lightMode ? 'checked' : ''}> <span>Light mode</span>`;
  row.querySelector('input').addEventListener('change', e => {
    S.lightMode = !!e.target.checked;
    _gpAfterChange();
  });
  body.appendChild(row);
  return card;
}

function _gpBuildFunctionsCard(S){
  const { card, body } = _gpMakeCard({
    id: 'gp-fn-card', icon: 'function', title: 'Functions',
    collapsed: _gpResolveCardCollapsed(S, 'gp-fn-card', false)
  });
  // Per-function row: color swatch, expression text, delete button.
  const list = document.createElement('ul');
  list.className = 'gp-fn-list';
  for(let i = 0; i < S.functions.length; i++){
    const f = S.functions[i];
    const li = document.createElement('li');
    li.className = 'gp-fn-row';
    // Fallback uses the theme-appropriate palette index 0 so a
    // tampered / missing f.color stays readable against whichever
    // backdrop is active. Previously hardcoded to '#4531d4' (dark
    // palette), which rendered ~1.2:1 on the light #fafaf7 surface.
    const swatchColor = _gpIsSafeColor(f.color) ? f.color : _gpRtPalette(S)[0];
    // The swatch is a button that opens a popover with a color
    // picker + Apply/Cancel. The popover owns a draft color that
    // the native picker edits live; only Apply writes to f.color.
    // Click-outside, Escape, and Cancel all dismiss without
    // committing. (See _gpOpenColorPopover below.) This replaces the
    // previous hidden <input type="color"> that committed on the
    // native 'change' event — teachers wanted an explicit confirm.
    li.innerHTML = `
      <button type="button" class="gp-fn-swatch-btn" data-idx="${i}" aria-label="Edit color for function ${i + 1}">
        <span class="gp-fn-swatch" style="background:${_gpEsc(swatchColor)}"></span>
      </button>
      <span class="gp-fn-expr" data-gp-fn-expr-idx="${i}">${_gpEsc(f.raw || 'y = ' + f.expr)}</span>
      <button type="button" class="gp-fn-vis ms" aria-label="${f.visible === false ? 'Show' : 'Hide'} function" data-idx="${i}">${f.visible === false ? 'visibility_off' : 'visibility'}</button>
      <button type="button" class="gp-fn-del ms" aria-label="Remove function" data-idx="${i}">close</button>`;
    list.appendChild(li);
  }
  body.appendChild(list);

  /* KaTeX typeset each function's display span. Batch 2B:
   * rendering-only foundation — the function's `raw` (if it looks
   * like LaTeX) is rendered directly; plain-text expressions are
   * wrapped minimally so they still render as typeset math rather
   * than monospace text. MathLive authoring lands in Batch 2C;
   * until then legacy plain-text entries flow through the
   * latex-from-plain-text fallback below.
   *
   * Runs post-mount so the fallback raw HTML (set in the row
   * innerHTML above) is visible for the ~frame until KaTeX swaps
   * it. Users see either the cached pre-render (no flicker on
   * re-renders) or the brief raw-text glimpse (first mount). Both
   * are preferable to empty spans while KaTeX loads. */
  if(typeof katex !== 'undefined'){
    body.querySelectorAll('.gp-fn-expr[data-gp-fn-expr-idx]').forEach(span => {
      const i = parseInt(span.dataset.gpFnExprIdx, 10);
      const f = S.functions[i];
      if(!f) return;
      // Prefer raw LaTeX when present. For legacy entries lacking
      // raw (pre-Batch-2B data), render expr as-is — KaTeX accepts
      // most plain-math strings (x^2, sin(x), etc.) without
      // modification; anything it can't parse falls back via the
      // throwOnError:false path to a red error span.
      const src = f.raw || f.expr || '';
      try {
        katex.render(src, span, {
          throwOnError: false,
          displayMode: false,
          // errorColor tracks --err for visibility in either theme.
          errorColor: 'var(--err)',
        });
      } catch(_){ /* extremely unexpected — leave the pre-render span content */ }
    });
  }
  body.addEventListener('click', ev => {
    const vis = ev.target.closest('.gp-fn-vis');
    const del = ev.target.closest('.gp-fn-del');
    const swatchBtn = ev.target.closest('.gp-fn-swatch-btn');
    if(vis){
      const i = parseInt(vis.dataset.idx, 10);
      if(Number.isFinite(i) && S.functions[i]){
        S.functions[i].visible = !S.functions[i].visible;
        _gpAfterChange();
      }
      return;
    }
    if(del){
      const i = parseInt(del.dataset.idx, 10);
      if(Number.isFinite(i)){ S.functions.splice(i, 1); _gpAfterChange({ label: 'delete-graph-function' }); }
      return;
    }
    if(swatchBtn){
      const i = parseInt(swatchBtn.dataset.idx, 10);
      if(!Number.isFinite(i) || !S.functions[i]) return;
      // Close over the stable function id rather than the array
      // index — the popover is non-modal, so the teacher can delete
      // another function before clicking Apply. Index `i` would
      // then point at a different row (shift left) or be
      // out-of-bounds; find-by-id always resolves the original row
      // or bails cleanly when it's been deleted.
      const fnId = S.functions[i].id;
      const current = _gpIsSafeColor(S.functions[i].color) ? S.functions[i].color : _gpRtPalette(S)[0];
      _gpOpenColorPopover(swatchBtn, current, newColor => {
        if(!_gpIsSafeColor(newColor)) return;
        const fn = S.functions.find(f => f.id === fnId);
        if(!fn) return;
        fn.color = newColor;
        _gpAfterChange();
      });
    }
  });
  return card;
}

/** Opens a small popover anchored to `anchorEl` containing a native
 *  color input + a live preview swatch + Apply/Cancel buttons. The
 *  native picker edits a DRAFT color (updates the preview only); the
 *  real onApply callback fires only when the teacher clicks Apply.
 *  Click-outside, pressing Escape, or clicking Cancel all dismiss
 *  without invoking onApply — no state change.
 *
 *  Why not just use <input type="color">'s 'change' event:
 *    - 'change' fires on native dismissal, including clicking away,
 *      which the teacher legitimately wants to mean "cancel".
 *    - 'input' fires continuously during hue scrubbing, flooding
 *      autosave with intermediate values.
 *  Neither maps cleanly to "explicit confirm." A popover owning its
 *  own draft is the cleanest way. */
/* Module-level handle to the currently-open popover's close routine.
 * When a teacher clicks a second swatch while one is already open,
 * we must run the previous popover's FULL cleanup path (remove its
 * document-level click + keydown listeners, then the DOM node) —
 * not just remove the node. Otherwise the stale listeners survive
 * and the next Enter/Escape can fire an abandoned onApply against
 * a different function's row. */
let _gpCloseColorPopover = null;

function _gpOpenColorPopover(anchorEl, currentColor, onApply){
  // Close the previous popover via its cleanup path (not a raw
  // element.remove()) so its document listeners are unregistered
  // before the new popover attaches its own.
  if(typeof _gpCloseColorPopover === 'function') _gpCloseColorPopover();

  const pop = document.createElement('div');
  pop.className = 'gp-color-pop';
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Pick function color');
  pop.innerHTML = `
    <div class="gp-color-pop-row">
      <span class="gp-color-pop-preview" aria-hidden="true" style="background:${_gpEsc(currentColor)};"></span>
      <input type="color" class="gp-color-pop-input" value="${_gpEsc(currentColor)}" aria-label="Color">
    </div>
    <div class="gp-color-pop-row gp-color-pop-buttons">
      <button type="button" class="gp-color-pop-cancel">Cancel</button>
      <button type="button" class="gp-color-pop-apply">Apply</button>
    </div>`;

  /* Positioning: anchor below the swatch when there's room, flip
   * above when the swatch is near the viewport bottom. Clamp
   * horizontally to viewport too. Measure the popover's own size
   * AFTER mounting (render via visibility:hidden first) so the flip
   * decision uses the real box rather than a guess. */
  const r = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.visibility = 'hidden';
  pop.style.zIndex = '9999';
  document.body.appendChild(pop);
  const pr = pop.getBoundingClientRect();
  const margin = 6;
  const wantTop = r.bottom + margin;
  const fitsBelow = wantTop + pr.height <= window.innerHeight - margin;
  const top = fitsBelow
    ? wantTop
    : Math.max(margin, r.top - pr.height - margin);
  const left = Math.max(margin, Math.min(window.innerWidth - pr.width - margin, r.left));
  pop.style.top  = top  + 'px';
  pop.style.left = left + 'px';
  pop.style.visibility = '';

  const preview = pop.querySelector('.gp-color-pop-preview');
  const picker  = pop.querySelector('.gp-color-pop-input');
  let draft = currentColor;

  // Live-preview only — 'input' updates the visible swatch in the
  // popover but does NOT commit. 'change' same thing (don't commit
  // on native dismissal).
  picker.addEventListener('input', e => {
    draft = e.target.value;
    preview.style.background = draft;
  });
  picker.addEventListener('change', e => {
    draft = e.target.value;
    preview.style.background = draft;
  });

  /* Pending-timer handle for the deferred outside-click listener
   * below. If the popover closes BEFORE the setTimeout fires (rapid
   * Apply/Cancel/Escape, or immediate reopen on a second swatch),
   * we must clear it — otherwise the stale capture-phase listener
   * would attach after close, stay parented to the document, and
   * fire on future unrelated clicks. */
  let outsideClickTimer = null;

  /* close({restoreFocus}) — restoreFocus:true returns keyboard focus
   * to the originating swatch so a tab-user doesn't lose their
   * place after dismissing with Escape / Apply / Cancel. Mouse
   * click-outside passes false since the teacher's cursor is
   * already elsewhere. */
  const close = ({ restoreFocus = true } = {}) => {
    if(outsideClickTimer !== null){
      clearTimeout(outsideClickTimer);
      outsideClickTimer = null;
    }
    document.removeEventListener('click', onOutsideClick, true);
    document.removeEventListener('keydown', onKey, true);
    if(_gpCloseColorPopover === close) _gpCloseColorPopover = null;
    pop.remove();
    if(restoreFocus && anchorEl && typeof anchorEl.focus === 'function' && document.contains(anchorEl)){
      anchorEl.focus();
    }
  };
  _gpCloseColorPopover = close;

  const onOutsideClick = e => {
    if(!pop.contains(e.target) && e.target !== anchorEl && !anchorEl.contains(e.target)){
      close({ restoreFocus: false });
    }
  };
  /* Only Escape is intercepted globally. Enter is deliberately NOT
   * handled here — a global Enter→Apply would mis-commit when the
   * teacher pressed Enter while Cancel had focus, or while another
   * control inside/outside the popover had focus. The native
   * <button> elements already translate Enter-when-focused into a
   * click on themselves, so focus+Enter on Cancel/Apply routes
   * through the right button handler below. Enter on the native
   * color input still opens the OS picker (browser default) — we
   * don't need to filter for that case anymore. */
  const onKey = e => {
    if(e.key === 'Escape'){ e.preventDefault(); close(); }
  };
  // Defer the outside-click listener by one tick so the click that
  // OPENED the popover doesn't immediately close it. Timer handle
  // is cleared by close() if it fires first.
  outsideClickTimer = setTimeout(() => {
    outsideClickTimer = null;
    document.addEventListener('click', onOutsideClick, true);
  }, 0);
  document.addEventListener('keydown', onKey, true);

  pop.querySelector('.gp-color-pop-apply').addEventListener('click', () => {
    if(typeof onApply === 'function') onApply(draft);
    close();
  });
  pop.querySelector('.gp-color-pop-cancel').addEventListener('click', () => close());

  // Focus the picker so keyboard users can arrow through hues
  // immediately without a second Tab.
  picker.focus();
}

function _gpBuildPointsCard(S){
  const { card, body } = _gpMakeCard({
    id: 'gp-pt-card', icon: 'scatter_plot', title: 'Points',
    collapsed: _gpResolveCardCollapsed(S, 'gp-pt-card', false)
  });
  // Master coord toggle row.
  const master = document.createElement('label');
  master.className = 'gp-card-row gp-card-toggle';
  master.innerHTML = `<input type="checkbox" ${S.showAllCoords !== false ? 'checked' : ''}> <span>Show coordinates</span>`;
  master.querySelector('input').addEventListener('change', e => {
    S.showAllCoords = !!e.target.checked;
    _gpAfterChange();
  });
  body.appendChild(master);

  // Batch 4E — Coordinate Trace toggle. When enabled, a separate
  // arrow-key-driven cursor renders on the plot with x/y arrows
  // decomposing its position from the origin. Distinct from the
  // "Show coordinates" toggle above (which labels existing user
  // points); this is a teaching-aid mode for live demonstration.
  if(!S.coordTrace) S.coordTrace = { enabled: false, x: 0, y: 0 };
  const traceRow = document.createElement('label');
  traceRow.className = 'gp-card-row gp-card-toggle';
  traceRow.innerHTML = `<input type="checkbox" ${S.coordTrace.enabled ? 'checked' : ''}> <span>Coordinate Trace</span>`;
  traceRow.querySelector('input').addEventListener('change', e => {
    S.coordTrace.enabled = !!e.target.checked;
    // Spec: cursor returns to origin on each enable, not the
    // last-used position. Predictability for live demonstration —
    // teacher always knows where the trace will start.
    if(S.coordTrace.enabled){
      S.coordTrace.x = 0;
      S.coordTrace.y = 0;
    }
    _gpAfterChange();
  });
  body.appendChild(traceRow);

  const list = document.createElement('ul');
  list.className = 'gp-pt-list';
  for(let i = 0; i < S.points.length; i++){
    const p = S.points[i];
    const li = document.createElement('li');
    /* feat/graph-point-selection-beta: runtime sidebar mirror.
     * CR PR #134: the config panel's sidebar (#widget-config-
     * panel) was wired separately, but this runtime points card
     * (visible on the lesson surface) wasn't. Mirror the same
     * .selected class + data-gp-pt-id contract here so plot
     * selection reflects in the live sidebar and clicking a row
     * selects the point. */
    li.className = 'gp-pt-row' + (p.id === S.selectedPointId ? ' selected' : '');
    li.setAttribute('data-gp-pt-id', p.id);
    // Batch 4E: when coord trace is on, label+coord wrap in a real
    // <button> so keyboard users can Tab to it and activate via
    // Enter/Space natively. CodeRabbit caught the prior <span> +
    // tabindex pattern as inaccessible — switching to a button
    // gives correct semantics + native key handling without our
    // own keydown wiring. Delete <button> stays a sibling.
    // When trace is off, plain spans (no interactive surface).
    const snappable = !!(S.coordTrace && S.coordTrace.enabled);
    const labelText = _gpEsc(p.label || '·');
    const coordText = '(' + _gpFmtNum(p.x) + ', ' + _gpFmtNum(p.y) + ')';
    const ariaName = (p.label ? p.label + ' ' : '') + 'at ' + _gpFmtNum(p.x) + ', ' + _gpFmtNum(p.y);
    const snapInner = snappable
      ? `<button type="button" class="gp-pt-snap" data-pt-snap="${i}" aria-label="Move trace cursor to ${_gpEsc(ariaName)}">
           <span class="gp-pt-label">${labelText}</span>
           <span class="gp-pt-coord">${coordText}</span>
         </button>`
      : `<span class="gp-pt-label">${labelText}</span>
         <span class="gp-pt-coord">${coordText}</span>`;
    li.innerHTML = `${snapInner}
      <button type="button" class="gp-pt-del ms" aria-label="Remove point" data-idx="${i}">close</button>`;
    if(snappable) li.classList.add('gp-pt-row-snappable');
    list.appendChild(li);
  }
  body.appendChild(list);
  // Add-point input row.
  const addRow = document.createElement('div');
  addRow.className = 'gp-card-row gp-pt-add';
  addRow.innerHTML = `
    <input type="text" class="gp-pt-x" placeholder="x" aria-label="Point x coordinate">
    <input type="text" class="gp-pt-y" placeholder="y" aria-label="Point y coordinate">
    <input type="text" class="gp-pt-l" placeholder="label" aria-label="Point label" maxlength="24">
    <button type="button" class="gp-pt-addbtn" aria-label="Add point">+</button>`;
  const pushPoint = () => {
    const xv = parseFloat(addRow.querySelector('.gp-pt-x').value);
    const yv = parseFloat(addRow.querySelector('.gp-pt-y').value);
    const lv = (addRow.querySelector('.gp-pt-l').value || '').slice(0, 24);
    if(!Number.isFinite(xv) || !Number.isFinite(yv)) return;
    if(S.points.length >= GRAPH_POINT_LIMIT) return;
    // Match the restore-path normalizer: clamp coordinates to
    // GRAPH_RANGE_MIN/MAX at creation time so live state matches
    // what survives save + restore. Without this, a teacher typing
    // x=5000 would see the point render now but silently disappear
    // on reload when normalizeGraphPanelState filtered it out for
    // being out of range.
    const lo = (typeof GRAPH_RANGE_MIN === 'number') ? GRAPH_RANGE_MIN : -1000;
    const hi = (typeof GRAPH_RANGE_MAX === 'number') ? GRAPH_RANGE_MAX :  1000;
    const px = Math.max(lo, Math.min(hi, xv));
    const py = Math.max(lo, Math.min(hi, yv));
    S.points.push({
      id: _grNewId('pt'), x: px, y: py, label: lv,
      style: 'filled', color: null, showCoords: true
    });
    addRow.querySelector('.gp-pt-x').value = '';
    addRow.querySelector('.gp-pt-y').value = '';
    addRow.querySelector('.gp-pt-l').value = '';
    _gpAfterChange();
  };
  addRow.querySelector('.gp-pt-addbtn').addEventListener('click', pushPoint);
  addRow.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); pushPoint(); }});
  body.appendChild(addRow);
  body.addEventListener('click', ev => {
    const del = ev.target.closest('.gp-pt-del');
    if(del){
      const i = parseInt(del.dataset.idx, 10);
      if(Number.isFinite(i)){ S.points.splice(i, 1); _gpAfterChange({ label: 'delete-graph-point' }); }
      return;
    }
    /* CR PR #134: runtime sidebar row-click select. Mirror the
     * config-panel handler. Excludes inner interactive elements
     * (snap button, delete button) so their dedicated handlers
     * fire instead. */
    const ptRow = ev.target.closest('.gp-pt-row');
    if(ptRow && !ev.target.closest('button, input, math-field, [data-pt-snap], .gp-pt-del')){
      const id = ptRow.getAttribute('data-gp-pt-id');
      if(id && id !== S.selectedPointId){
        S.selectedPointId = id;
        _gpAfterChange({ selection: true });   // the runtime row: also not an edit
      }
      return;
    }
    // Batch 4E: snap-to-point. Click on a point row's snap button
    // (when coord trace is on) → cursor animates to that point's
    // (x, y). Cursor stays controllable by arrow keys after snap,
    // so the teacher can demo "this named point is at (5, 4); now
    // I'll move one unit right" in one flow.
    const snap = ev.target.closest('[data-pt-snap]');
    if(snap && S.coordTrace && S.coordTrace.enabled){
      const i = parseInt(snap.dataset.ptSnap, 10);
      const pt = (Array.isArray(S.points) && Number.isFinite(i)) ? S.points[i] : null;
      if(pt && Number.isFinite(pt.x) && Number.isFinite(pt.y)){
        // Clamp to current viewport so the cursor never lands off
        // the visible plot. A point placed at (50, 50) on an
        // earlier wide viewport would otherwise drag the cursor
        // off-canvas after the teacher zooms in to (-5,5)x(-5,5).
        S.coordTrace.x = Math.max(S.xMin, Math.min(S.xMax, pt.x));
        S.coordTrace.y = Math.max(S.yMin, Math.min(S.yMax, pt.y));
        // Coord-trace-only re-render with animation rather than a
        // full _gpAfterChange (which would rebuild the entire SVG
        // and lose the draw-out animation).
        if(typeof _gpRedrawCoordTrace === 'function') _gpRedrawCoordTrace(true);
        // Persist the snap. Arrow-key path schedules autosave too
        // — without this, a snapped position would be lost on
        // reload while an arrow-keyed position would survive.
        if(typeof scheduleAutosave === 'function') scheduleAutosave();
      }
    }
  });
  return card;
}

function _gpBuildArcsCard(S){
  /* THE CARD OPENS WHEN IT HAS SOMETHING IN IT.
   *
   * This is the "unexplained green circle": a persisted full-revolution arc
   * paints a filled disc on the plot, and with Functions empty the teacher has
   * nothing to connect it to. The row and its delete button were always here —
   * the card just defaulted to collapsed and is called "Angle Arcs", which is
   * not where anyone looks for a mystery circle. So the default is now
   * conditional: collapsed while empty, open when arcs exist.
   *
   * An EXPLICIT choice still wins. _gpResolveCardCollapsed consults
   * S._ui.cardOpen first, so a teacher who collapsed this card keeps it
   * collapsed; only the no-preference case changes. That is why this is a
   * default rather than a forced open, and why the header count matters: the
   * teacher who collapsed it still sees "Angle Arcs 1". */
  const arcCount = (S.arcs || []).length;
  /* THE 0 -> N TRANSITION RE-APPLIES THE DEFAULT, and this is the half that
   * actually matters during a lesson.
   *
   * Every re-render first SNAPSHOTS each card's current collapse state into
   * S._ui.cardOpen (see the loop above _gpResolveCardCollapsed). So the moment
   * this card has rendered once while empty — which it does on every open — the
   * map holds `gp-arc-card: false`, and the conditional default above can never
   * fire again. Measured: after a reload the arc card opened correctly (fresh
   * _ui, no key), but adding an arc LIVE left it collapsed with the row hidden.
   * Same state, two renderings, which is the asymmetry this card is supposed to
   * end rather than reproduce.
   *
   * SO THE AUTOMATIC COLLAPSE AND THE TEACHER'S OWN CHOICE ARE TRACKED APART.
   * Clearing the map entry outright — the first version of this — also threw
   * away a preference the teacher had actually expressed, as soon as the arcs
   * went to zero and back: collapse the card WITH an arc in it, delete the arc,
   * add another, and their collapse was gone. Raised in review on #233.
   *
   * The two are distinguishable without a new hook, because the snapshot is
   * taken from the DOM: if what the map now holds disagrees with what this
   * function last RENDERED, something moved that card between renders, and the
   * only thing that can is the teacher clicking its header. Once that has
   * happened the preference is theirs and the default never speaks again. */
  if(S._ui){
    const has = S._ui.cardOpen
      && Object.prototype.hasOwnProperty.call(S._ui.cardOpen, 'gp-arc-card');
    const snapCollapsed = has ? !S._ui.cardOpen['gp-arc-card'] : null;
    if(snapCollapsed !== null && S._ui._arcCardRendered !== undefined
       && snapCollapsed !== S._ui._arcCardRendered){
      S._ui._arcCardExplicit = true;
    }
    const prevArcCount = Number.isFinite(S._ui._arcCardCount) ? S._ui._arcCardCount : 0;
    if(arcCount > 0 && prevArcCount === 0 && !S._ui._arcCardExplicit && S._ui.cardOpen){
      delete S._ui.cardOpen['gp-arc-card'];
    }
    S._ui._arcCardCount = arcCount;
  }
  const arcCollapsed = _gpResolveCardCollapsed(S, 'gp-arc-card', arcCount === 0);
  /* Remember what we rendered, so the next pass can tell a teacher's toggle
     from this function's own default coming back round. */
  if(S._ui) S._ui._arcCardRendered = arcCollapsed;
  const { card, body } = _gpMakeCard({
    id: 'gp-arc-card', icon: 'architecture', title: 'Angle Arcs',
    count: arcCount,
    collapsed: arcCollapsed
  });
  const list = document.createElement('ul');
  list.className = 'gp-arc-list';
  for(let i = 0; i < (S.arcs || []).length; i++){
    const a = S.arcs[i];
    const li = document.createElement('li');
    li.className = 'gp-arc-row';
    // Render the arc summary in the CURRENT display units. Since
    // arcs store canonical radians, convert back to degrees for
    // display when angleMode is 'deg'. Each property is fallback-
    // guarded with _gpFmtNum / '?' so a malformed arc (missing
    // angle / ax / etc.) renders "?" in place of "undefined".
    // Batch 3B: standard mode angle is now unsigned magnitude +
    // direction field. Summary includes the signed value so the
    // sidebar row reflects what the plot label shows.
    const displayAng = (v) => {
      if(!Number.isFinite(v)) return '?';
      if(S.angleMode === 'rad') return _gpFmtNum(v);
      return _gpFmtNum(v * 180 / Math.PI) + '°';
    };
    const unitSuffix = S.angleMode === 'rad' ? ' rad' : '';
    let summary;
    if(a.mode === 'standard'){
      const dirSign = (a.direction === 'cw') ? -1 : 1;
      summary = `θ = ${displayAng(dirSign * (a.angle || 0))}${unitSuffix}`;
    } else if(a.mode === 'twoRays'){
      summary = `${displayAng(a.angleA)}→${displayAng(a.angleB)}${unitSuffix}`;
    } else {
      summary = `A(${_gpFmtNum(a.ax)},${_gpFmtNum(a.ay)})–B(${_gpFmtNum(a.bx)},${_gpFmtNum(a.by)})–C(${_gpFmtNum(a.cx)},${_gpFmtNum(a.cy)})`;
    }
    // Direction toggle: shown for standard mode only (twoRays /
    // threePoints derive direction from their underlying points).
    // Two small pill buttons; the active one carries .on. Per-arc
    // (not global) — teachers can mix CCW and CW on the same plot.
    // aria-label (not title) carries the accessible name — title is
    // unreliable across screen readers and these pills have no text
    // content beyond the ↺ / ↻ glyphs.
    const dirToggle = (a.mode === 'standard')
      ? `<span class="gp-arc-dir" role="radiogroup" aria-label="Direction">
           <button type="button" class="gp-arc-dir-btn${(a.direction !== 'cw') ? ' on' : ''}"
                   data-arc-dir="ccw" data-idx="${i}" role="radio"
                   aria-label="Counterclockwise"
                   aria-checked="${a.direction !== 'cw'}" title="Counterclockwise (positive)">↺</button>
           <button type="button" class="gp-arc-dir-btn${(a.direction === 'cw') ? ' on' : ''}"
                   data-arc-dir="cw" data-idx="${i}" role="radio"
                   aria-label="Clockwise"
                   aria-checked="${a.direction === 'cw'}" title="Clockwise (negative)">↻</button>
         </span>`
      : '';
    li.innerHTML = `
      <span class="gp-arc-dot" style="background:${_gpIsSafeColor(a.color) ? a.color : '#4531d4'}"></span>
      <button type="button" class="gp-arc-row-style" data-idx="${i}"
              aria-label="Change marking style (now ${_gpEsc(a.style || 'single')})"
              title="Marking style: ${_gpEsc(a.style || 'single')}">${_gpEsc(a.style || 'single')}</button>
      <button type="button" class="gp-arc-row-measure${a.showMeasure === false ? '' : ' on'}" data-idx="${i}"
              aria-label="${a.showMeasure === false ? 'Show' : 'Hide'} the angle measure"
              aria-pressed="${a.showMeasure !== false}" title="Angle measure">measure</button>
      <span class="gp-arc-summary">${_gpEsc(summary)}</span>
      ${dirToggle}
      <button type="button" class="gp-arc-del ms" aria-label="Remove arc" data-idx="${i}">close</button>`;
    list.appendChild(li);
  }
  body.appendChild(list);
  // Add-arc row — standard position (single angle) only. The other
  // modes can be added manually into state until the full arc-editor
  // lands in a follow-up PR; the renderer already handles all three.
  //
  // Batch 3B: row now exposes a direction toggle that also seeds
  // the new arc's direction. Sign in the input OVERRIDES the
  // toggle: typing "-45" with the CCW pill lit stores magnitude 45
  // + direction 'cw' and auto-flips the pill to CW so the displayed
  // state matches the stored arc. Cleaner than rejecting signed
  // inputs (teachers frequently type them); also mirrors the
  // behavior of most physical protractors, where "-45°" means
  // "45° clockwise".
  const addRow = document.createElement('div');
  addRow.className = 'gp-card-row gp-arc-add';
  // addDir holds the pending direction for the NEXT arc created
  // from this row. Persisted on S._ui.arcAddDir so _gpAfterChange()
  // rebuilds (which happen on every card interaction) preserve the
  // user's selected direction — previously a local `let` that got
  // silently reset to CCW on rerender, causing the next unsigned
  // add to go the wrong way after a sign-wins flip.
  if(!S._ui) S._ui = {};
  const readAddDir = () => (S._ui.arcAddDir === 'cw') ? 'cw' : 'ccw';
  const writeAddDir = (d) => { S._ui.arcAddDir = (d === 'cw') ? 'cw' : 'ccw'; };
  const renderAddDir = () => {
    const pills = addRow.querySelectorAll('.gp-arc-add-dir-btn');
    pills.forEach(p => {
      const isOn = p.getAttribute('data-add-dir') === readAddDir();
      p.classList.toggle('on', isOn);
      p.setAttribute('aria-checked', String(isOn));
    });
  };
  // Seed the initial markup from persisted state so the lit pill
  // matches readAddDir() on first paint (no flash of CCW when the
  // user had CW selected across a rerender).
  const initDir = readAddDir();
  /* MODE, persisted beside the direction and for the same reason: every card
     interaction rebuilds this row, and a mode that reset to Standard on
     rerender would throw away half-entered coordinates mid-recording. */
  const readAddMode = () => (GRAPH_ARC_MODES.includes(S._ui.arcAddMode) ? S._ui.arcAddMode : 'standard');
  const writeAddMode = (m) => { S._ui.arcAddMode = GRAPH_ARC_MODES.includes(m) ? m : 'standard'; };
  const readAddStyle = () => (GRAPH_ARC_STYLES.includes(S._ui.arcAddStyle) ? S._ui.arcAddStyle : 'single');
  const writeAddStyle = (v) => { S._ui.arcAddStyle = GRAPH_ARC_STYLES.includes(v) ? v : 'single'; };
  const readAddMeasure = () => S._ui.arcAddMeasure !== false;
  const writeAddMeasure = (v) => { S._ui.arcAddMeasure = !!v; };
  const initMode = readAddMode();
  const MODE_LABEL = { standard: 'Standard', twoRays: 'Two rays', threePoints: 'Three points' };
  const num = (cls, ph, label) =>
    `<input type="number" class="gp-arc-n ${cls}" placeholder="${ph}" aria-label="${label}" step="any">`;
  addRow.innerHTML = `
    <div class="gp-arc-modes" role="radiogroup" aria-label="Angle construction mode">
      ${GRAPH_ARC_MODES.map(m => `<button type="button" role="radio"
         class="gp-arc-mode-btn${m === initMode ? ' on' : ''}" data-arc-mode="${m}"
         aria-checked="${m === initMode}">${MODE_LABEL[m]}</button>`).join('')}
    </div>
    <div class="gp-arc-fields" data-arc-fields="twoRays"${initMode === 'twoRays' ? '' : ' hidden'}>
      ${num('gp-arc-vx', 'vertex x', 'Vertex x')}${num('gp-arc-vy', 'vertex y', 'Vertex y')}
      <button type="button" class="gp-arc-useint" aria-label="Use an intersection as the vertex">Use an intersection</button>
      ${num('gp-arc-ray1', 'ray 1 (' + (S.angleMode === 'rad' ? 'rad' : 'deg') + ')', 'First ray direction')}
      ${num('gp-arc-ray2', 'ray 2 (' + (S.angleMode === 'rad' ? 'rad' : 'deg') + ')', 'Second ray direction')}
    </div>
    <div class="gp-arc-fields" data-arc-fields="threePoints"${initMode === 'threePoints' ? '' : ' hidden'}>
      ${num('gp-arc-ax', 'A x', 'Point A x')}${num('gp-arc-ay', 'A y', 'Point A y')}
      ${num('gp-arc-bx', 'B x (vertex)', 'Vertex B x')}${num('gp-arc-by', 'B y (vertex)', 'Vertex B y')}
      <button type="button" class="gp-arc-useint" aria-label="Use an intersection as the vertex">Use an intersection</button>
      ${num('gp-arc-cx', 'C x', 'Point C x')}${num('gp-arc-cy', 'C y', 'Point C y')}
    </div>
    <div class="gp-arc-pick" hidden role="group" aria-label="Choose an intersection"></div>
    <div class="gp-arc-err" hidden role="status"></div>
    <div class="gp-arc-fields gp-arc-common">
      <span class="gp-arc-styles" role="radiogroup" aria-label="Marking style">
        ${GRAPH_ARC_STYLES.map(v => `<button type="button" role="radio"
           class="gp-arc-style-btn${v === readAddStyle() ? ' on' : ''}" data-arc-style="${v}"
           aria-checked="${v === readAddStyle()}">${v}</button>`).join('')}
      </span>
      <button type="button" class="gp-arc-measure-btn${readAddMeasure() ? ' on' : ''}"
              aria-label="Show the angle measure" aria-pressed="${readAddMeasure()}">measure</button>
    </div>
    <span class="gp-arc-dir gp-arc-add-dir" data-arc-fields="standard"${initMode === 'standard' ? '' : ' hidden'} role="radiogroup" aria-label="Direction for new arc">
      <button type="button" class="gp-arc-dir-btn gp-arc-add-dir-btn${initDir === 'ccw' ? ' on' : ''}"
              data-add-dir="ccw" role="radio"
              aria-label="Counterclockwise" aria-checked="${initDir === 'ccw'}"
              title="Counterclockwise (positive)">↺</button>
      <button type="button" class="gp-arc-dir-btn gp-arc-add-dir-btn${initDir === 'cw' ? ' on' : ''}"
              data-add-dir="cw" role="radio"
              aria-label="Clockwise" aria-checked="${initDir === 'cw'}"
              title="Clockwise (negative)">↻</button>
    </span>
    <input type="number" class="gp-arc-angle" data-arc-fields="standard"${initMode === 'standard' ? '' : ' hidden'} placeholder="angle (${S.angleMode === 'rad' ? 'rad' : 'deg'})" aria-label="Angle value" step="1">
    <button type="button" class="gp-arc-addbtn" aria-label="Add angle arc">+</button>`;
  addRow.querySelectorAll('.gp-arc-add-dir-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      writeAddDir(btn.getAttribute('data-add-dir'));
      renderAddDir();
    });
  });
  /* ── mode, style, measure and the error line ─────────────────────────── */
  const errEl = addRow.querySelector('.gp-arc-err');
