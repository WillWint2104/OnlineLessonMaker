/* Whitelist of valid CALC_STATE.activePanel values. Module-level
 * const (the codebase uses plain script-globals; calc-core.js
 * loads before persistence.js + calc-ui-v2.js in scripts/bundle.js
 * so consumers see this without an import). frozen so a stray
 * runtime mutation can't broaden the accepted set. */
const CALC_PANEL_VALUES = Object.freeze([
  null, 'history', 'setup', 'catalog', 'help', 'vars'
]);

/* ── TOKENIZER ───────────────────────────────────────────────── */

/** Tokenizes an expression string into {type, value} tokens. */
function _calcTokenize(src){
  const tokens = [];
  let i = 0;
  while(i < src.length){
    const c = src[i];
    if(c === ' '){ i++; continue; }

    // Numbers (incl. decimal, scientific notation e/E). Strict match —
    // rejects malformed literals like "1..2" or "2e+" with an error
    // instead of silently parsing them as `1` or `2`.
    if(/[0-9.]/.test(c)){
      const m = src.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
      if(!m) throw new Error('Bad number literal near: ' + src.slice(i, i+4));
      const degVal = Number(m[0]);
      tokens.push({type:'num', value: degVal});
      i += m[0].length;

      // DMS literal aggregation (feat/calc-dms-input). If the
      // number is immediately followed by ° (U+00B0), optionally
      // consume minute and second components and replace the
      // previously-emitted num token with the decimal-degrees
      // value: deg + min/60 + sec/3600. ASCII ' / " are accepted
      // alongside Unicode ′ (U+2032) / ″ (U+2033) for
      // physical-keyboard friendliness; the DMS button itself
      // inserts the Unicode glyphs so the display reads correctly.
      // Negative DMS works via standard unary minus
      // (`-64°38'` parses as `-(64 + 38/60)`).
      if(src[i] === '°'){
        i++;  // consume °
        let minVal = 0;
        let secVal = 0;
        // Skip whitespace between ° and the next number.
        while(src[i] === ' ') i++;
        // Speculative read for minute component. If the marker
        // doesn't follow, we leave i unchanged so the trailing
        // chars get tokenized normally — no rollback machinery
        // needed because we only advance i AFTER both number +
        // marker are confirmed.
        const minMatch = src.slice(i).match(/^(?:\d+\.?\d*|\.\d+)/);
        if(minMatch){
          let j = i + minMatch[0].length;
          while(src[j] === ' ') j++;
          if(src[j] === '′' || src[j] === "'"){
            minVal = Number(minMatch[0]);
            i = j + 1;  // commit: past number + whitespace + marker
            // Optional second component, same pattern.
            while(src[i] === ' ') i++;
            const secMatch = src.slice(i).match(/^(?:\d+\.?\d*|\.\d+)/);
            if(secMatch){
              let k = i + secMatch[0].length;
              while(src[k] === ' ') k++;
              if(src[k] === '″' || src[k] === '"'){
                secVal = Number(secMatch[0]);
                i = k + 1;
              }
            }
          }
        }
        const decimal = degVal + minVal / 60 + secVal / 3600;
        tokens[tokens.length - 1].value = decimal;
      }
      continue;
    }

    // Identifiers. We have to be careful: button inputs can emit things like
    // `x` followed by `sin(`, which naively concatenates to `xsin(`. Only
    // accept a multi-character identifier when it's a known function, a
    // known constant, or is followed by `(` (meaning it must be a fn call).
    // Otherwise emit a single-character identifier so implicit multiplication
    // can split `xsin(30)` into `x*sin(30)`.
    if(/[a-zA-Z_]/.test(c)){
      let j = i;
      while(j < src.length && /[a-zA-Z0-9_]/.test(src[j])) j++;
      const full = src.slice(i, j);
      // Single-letter names always take the short form — they're the common
      // variable namespace (A-F, x, y, z, M) and should never swallow a
      // following function name.
      if(full.length === 1){
        tokens.push({type:'ident', value: full});
        i = j; continue;
      }
      // Multi-char: accept only if it's a function, constant, multi-letter var,
      // OR followed by '(' AND doesn't start with a multi-letter var prefix.
      // Prevents 'Anssin(30)' from being accepted as 'Anssin' — we split to
      // 'Ans' + 'sin(30)' instead.
      const isFn    = Object.prototype.hasOwnProperty.call(_CALC_FUNCTIONS, full);
      const isConst = Object.prototype.hasOwnProperty.call(_CALC_CONSTANTS, full);
      const nextIsParen = src[j] === '(';
      const MULTI_VARS = ['Ans', 'Inf'];
      const isMultiLetterVar = MULTI_VARS.includes(full);
      const startsWithMultiVar = MULTI_VARS.find(v => full.startsWith(v) && v.length < full.length);
      if(isFn || isConst || isMultiLetterVar){
        tokens.push({type:'ident', value: full});
        i = j; continue;
      }
      if(startsWithMultiVar){
        // Emit the multi-letter var, then continue scanning the rest
        tokens.push({type:'ident', value: startsWithMultiVar});
        i += startsWithMultiVar.length; continue;
      }
      // Check for any known constant/function prefix — e.g. 'pi2' → 'pi' + '2',
      // 'sinx' (when followed by anything non-paren) should keep 'sin' as a
      // name the RPN builder can complain about. Longest match wins.
      let knownPrefix = '';
      for(const name of Object.keys(_CALC_CONSTANTS)){
        if(full.startsWith(name) && name.length > knownPrefix.length && name.length < full.length){
          knownPrefix = name;
        }
      }
      for(const name of Object.keys(_CALC_FUNCTIONS)){
        if(full.startsWith(name) && name.length > knownPrefix.length && name.length < full.length){
          knownPrefix = name;
        }
      }
      if(knownPrefix){
        tokens.push({type:'ident', value: knownPrefix});
        i += knownPrefix.length; continue;
      }
      if(nextIsParen){
        // Unknown multi-char name followed by '(' — accept as-is so the RPN
        // builder can report 'Unknown function' rather than silently split.
        tokens.push({type:'ident', value: full});
        i = j; continue;
      }
      // Break apart — emit each char as its own identifier
      tokens.push({type:'ident', value: src[i]});
      i += 1; continue;
    }

    // Operators + grouping
    if('+-*/^%(),!'.indexOf(c) >= 0){
      tokens.push({type:'op', value: c});
      i++; continue;
    }

    // Unicode fallbacks (templates may emit these)
    if(c === '×'){ tokens.push({type:'op', value:'*'}); i++; continue; }
    if(c === '÷'){ tokens.push({type:'op', value:'/'}); i++; continue; }
    if(c === '−'){ tokens.push({type:'op', value:'-'}); i++; continue; }
    if(c === 'π'){ tokens.push({type:'ident', value:'pi'}); i++; continue; }

    throw new Error('Unexpected character: ' + c);
  }
  return tokens;
}

/* ── PARSER (shunting-yard → RPN) ────────────────────────────── */

const _CALC_PRECEDENCE = { '+':1, '-':1, '*':2, '/':2, '%':2, 'u-':3, '^':4, '!':5 };
const _CALC_RIGHT_ASSOC = { '^':true, 'u-':true };

function _calcToRPN(tokens, legacyPercent = false){
  const out = [];
  const stack = [];
  let prev = null; // track previous token to detect unary minus and implicit *

  for(let i = 0; i < tokens.length; i++){
    const t = tokens[i];

    // Implicit multiplication rules:
    //   num num        → num * num
    //   num ident      → num * ident (e.g., 2x)
    //   num (          → num * (
    //   ) (            → ) * (
    //   ) num / ident  → ) * ...
    //   ident (        → ONLY when ident is a variable (not a function). For
    //                    functions, the '(' starts the function call.
    const prevIsFn = prev && prev.type === 'ident' && _calcHasOwn(_CALC_FUNCTIONS, prev.value);
    if(prev && (
        (t.type === 'num'   && (prev.type === 'num' || prev.type === 'ident' || (prev.type === 'op' && (prev.value === ')' || prev.value === '!')))) ||
        (t.type === 'ident' && (prev.type === 'num' || (prev.type === 'op' && (prev.value === ')' || prev.value === '!')))) ||
        (t.type === 'op' && t.value === '(' && (
          prev.type === 'num' ||
          (prev.type === 'ident' && !prevIsFn) ||
          (prev.type === 'op' && (prev.value === ')' || prev.value === '!'))
        ))
    )){
      // synthesize a *
      while(stack.length){
        const top = stack[stack.length-1];
        if(top.type === 'op' && top.value !== '(' &&
           (_CALC_PRECEDENCE[top.value] > _CALC_PRECEDENCE['*'] ||
            (_CALC_PRECEDENCE[top.value] === _CALC_PRECEDENCE['*'] && !_CALC_RIGHT_ASSOC['*']))){
          out.push(stack.pop());
        } else break;
      }
      stack.push({type:'op', value:'*'});
    }

    if(t.type === 'num'){ out.push(t); prev = t; continue; }

    if(t.type === 'ident'){
      // Look ahead: if next is '(' and this identifier is a known function,
      // push as fn-or-var for the ')' handler to pop into a fn call. Otherwise
      // emit as a variable immediately — no stacking, no implicit '*'.
      const next = tokens[i + 1];
      const isFnCall = next && next.type === 'op' && next.value === '(' && _calcHasOwn(_CALC_FUNCTIONS, t.value);
      if(isFnCall){
        stack.push({type:'fn-or-var', value: t.value});
      } else {
        out.push({type:'var', value: t.value});
      }
      prev = t; continue;
    }

    if(t.type === 'op'){
      const op = t.value;

      if(op === '('){ stack.push({type:'op', value:'('}); prev = t; continue; }

      if(op === ')'){
        while(stack.length && !(stack[stack.length-1].type === 'op' && stack[stack.length-1].value === '(')){
          out.push(stack.pop());
        }
        if(!stack.length) throw new Error('Mismatched parentheses');
        stack.pop(); // remove '('
        // If top is a fn-or-var — it becomes a function call
        if(stack.length && stack[stack.length-1].type === 'fn-or-var'){
          out.push({type:'fn', value: stack.pop().value});
        }
        prev = t; continue;
      }

      if(op === ','){
        while(stack.length && !(stack[stack.length-1].type === 'op' && stack[stack.length-1].value === '(')){
          out.push(stack.pop());
        }
        prev = t; continue;
      }

      // Percentage is postfix in new input; legacy replay alone uses binary %.
      if(op === '%' && !legacyPercent){
        if(!prev || (prev.type === 'op' && ![')', '!', '%'].includes(prev.value))){
          throw new Error('Percentage needs a preceding value');
        }
        out.push({type:'op', value:'percent'}); prev = {type:'op', value:'!'}; continue;
      }

      // Unary minus detection
      let tok = t;
      if(op === '-' && (prev === null || (prev.type === 'op' && prev.value !== ')' && prev.value !== '!'))){
        tok = {type:'op', value:'u-'};
      }

      // Factorial (postfix) — immediate push to output
      if(op === '!'){ out.push({type:'op', value:'!'}); prev = t; continue; }

      // Prefix unary minus — push directly without draining higher-precedence
      // binary ops. Otherwise `2^-2` would drain `^` before pushing `u-`,
      // producing malformed RPN.
      if(tok.value === 'u-'){
        stack.push(tok);
        prev = t; continue;
      }

      while(stack.length){
        const top = stack[stack.length-1];
        if(top.type === 'op' && top.value !== '('){
          const tp = _CALC_PRECEDENCE[top.value] || 0;
          const cp = _CALC_PRECEDENCE[tok.value] || 0;
          if(tp > cp || (tp === cp && !_CALC_RIGHT_ASSOC[tok.value])){
            out.push(stack.pop());
          } else break;
        } else break;
      }
      stack.push(tok);
      prev = t; continue;
    }
  }

  while(stack.length){
    const top = stack.pop();
    if(top.type === 'op' && (top.value === '(' || top.value === ')')) throw new Error('Mismatched parentheses');
    // Lone fn-or-var at end becomes a variable reference
    if(top.type === 'fn-or-var') out.push({type:'var', value: top.value});
    else out.push(top);
  }
  return out;
}

/* ── EVALUATOR ───────────────────────────────────────────────── */

const _CALC_CONSTANTS = { pi: Math.PI, e: Math.E, Inf: Infinity };

function _calcAngleIn(x){ return CALC_STATE.angle === 'deg' ? x * Math.PI / 180 : x; }
function _calcAngleOut(x){ return CALC_STATE.angle === 'deg' ? x * 180 / Math.PI : x; }

function _calcFactorial(n){
  if(!Number.isInteger(n) || n < 0) return NaN;
  if(n > 170) return Infinity;
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}

/* nPr / nCr — multiplicative, not factorial-quotient.
 *
 * The previous forms were fact(n)/fact(n-r) and fact(n)/(fact(r)·fact(n-r)).
 * Because _calcFactorial saturates to Infinity above 170, ANY n > 170 gave
 * Infinity/Infinity = NaN even when the true answer is small and perfectly
 * representable — 200 nCr 2 is 19900, and it returned NaN. That NaN then landed
 * in HISTORY as a result with no error shown.
 *
 * Building the product term by term keeps every intermediate near the size of
 * the answer, so the domain is limited by the ANSWER overflowing rather than by
 * an intermediate. Cost is O(r) with r clamped to min(r, n-r) for nCr, so the
 * worst case is ~n/2 multiplications; n is itself bounded below, giving a hard
 * ceiling on the work. Out-of-domain inputs return NaN, which _calcEvalRPN
 * surfaces as an error rather than a silent result. */
const CALC_COMB_MAX_N = 1e7;   // ~5e6 multiplications worst case; ms, not minutes

function _calcNPr(n, r){
  if(!Number.isInteger(n) || !Number.isInteger(r)) return NaN;
  if(n < 0 || r < 0 || r > n) return NaN;          // r > n is undefined, not 0
  if(n > CALC_COMB_MAX_N) return NaN;              // refuse rather than grind
  let out = 1;
  for(let i = 0; i < r; i++){
    out *= (n - i);
    if(!Number.isFinite(out)) return Infinity;     // genuine overflow, bail early
  }
  return out;
}

function _calcNCr(n, r){
  if(!Number.isInteger(n) || !Number.isInteger(r)) return NaN;
  if(n < 0 || r < 0 || r > n) return NaN;
  if(n > CALC_COMB_MAX_N) return NaN;
  // C(n,r) === C(n,n-r); taking the smaller r halves the loop and keeps the
  // running value smaller.
  const k = Math.min(r, n - r);
  let out = 1;
  for(let i = 1; i <= k; i++){
    // Multiply then divide each step: (out * (n-k+i)) / i is exact for all
    // intermediates that fit, because the running value is always a binomial
    // coefficient times an integer.
    out = out * (n - k + i) / i;
    if(!Number.isFinite(out)) return Infinity;
  }
  // Floating division can leave a hair of error on large inputs; the true
  // value is an integer, so snap when we are within representable range.
  return out <= Number.MAX_SAFE_INTEGER ? Math.round(out) : out;
}

/** Real integer-index roots, including reciprocal roots for negative indices. */
function _calcNthRoot(rad, index){
  if(!Number.isSafeInteger(index) || index === 0 || Number.isNaN(rad)) return NaN;
  if(rad < 0 && index % 2 === 0) return NaN;
  return rad < 0 ? -Math.pow(-rad, 1/index) : Math.pow(rad, 1/index);
}

const _CALC_FUNCTIONS = {
  sin:  a => Math.sin(_calcAngleIn(a)),
  cos:  a => Math.cos(_calcAngleIn(a)),
  tan:  a => Math.tan(_calcAngleIn(a)),
  asin: a => _calcAngleOut(Math.asin(a)),
  acos: a => _calcAngleOut(Math.acos(a)),
  atan: a => _calcAngleOut(Math.atan(a)),
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  log:  a => Math.log10(a),
  log10:a => Math.log10(a),
  ln:   a => Math.log(a),
  exp:  Math.exp,
  sqrt: Math.sqrt,
  cbrt: Math.cbrt,
  nthroot: _calcNthRoot,
  mixed: (w,n,d) => (w < 0 || Object.is(w, -0)) ? -(Math.abs(w) + n/d) : w + n/d,
  mod: (a,b) => a % b,
  abs:  Math.abs,
  round: Math.round,
  floor: Math.floor,
  ceil:  Math.ceil,
  min:   Math.min,
  max:   Math.max,
  pow:   (a,b) => Math.pow(a,b),
  fact:  _calcFactorial,
  nCr:   _calcNCr,
  nPr:   _calcNPr,
  gcd:   (a,b) => { a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b)); while(b){ [a,b]=[b,a%b]; } return a; },
  lcm:   (a,b) => { const g = _CALC_FUNCTIONS.gcd(a,b); return g ? Math.abs(a*b)/g : 0; }
};

/** Shared arities for evaluation and legacy replay serialization. */
function _calcFunctionArity(fn){
  if(fn === 'mixed') return 3;
  return ['pow','nCr','nPr','gcd','lcm','min','max','nthroot','mod'].includes(fn) ? 2 : 1;
}

/** Only pre-version-2 saved expressions use binary %. Convert their RPN to
 * explicit mod calls at recall, without mutating stored display/result data.
 * Non-% entries and new postfix expressions are returned byte-for-byte. */
function calcHistoryExpression(entry, expr){
  if(entry.syntaxVersion === 2 || !expr.includes('%')) return expr;
  const stack = [];
  for(const t of _calcToRPN(_calcTokenize(expr), true)){
    if(t.type === 'num' || t.type === 'var') stack.push(String(t.value));
    else if(t.type === 'fn'){
      const arity = _calcFunctionArity(t.value);
      if(stack.length < arity) throw new Error('Invalid legacy replay');
      stack.push(t.value + '(' + stack.splice(-arity).join(',') + ')');
    } else if(t.type === 'op'){
      if(t.value === 'u-' || t.value === '!'){
        if(!stack.length) throw new Error('Invalid legacy replay');
        const a = stack.pop();
        stack.push(t.value === 'u-' ? '-(' + a + ')' : '(' + a + ')!');
      } else {
        if(stack.length < 2) throw new Error('Invalid legacy replay');
        const b = stack.pop(), a = stack.pop();
        stack.push(t.value === '%' ? 'mod(' + a + ',' + b + ')' : '(' + a + t.value + b + ')');
      }
    }
  }
  if(stack.length !== 1) throw new Error('Invalid legacy replay');
  return stack[0];
}

/** Persisted output aliases normalize without touching unrelated entry fields. */
function calcNormalizeHistory(history){
  return history.map(entry => entry && entry.format === 'improper' ? {...entry, format:'fraction'} : entry);
}

/** Evaluates an RPN token stream. Throws on error. */
function _calcEvalRPN(rpn){
  const stk = [];
  // Function arity — for functions we know; anything else assumed 1

  for(const t of rpn){
    if(t.type === 'num'){ stk.push(t.value); continue; }

    if(t.type === 'var'){
      const n = t.value;
      if(_calcHasOwn(_CALC_CONSTANTS, n)){ stk.push(_CALC_CONSTANTS[n]); continue; }
      if(_calcHasOwn(CALC_STATE.vars, n)){ stk.push(CALC_STATE.vars[n]); continue; }
      throw new Error('Unknown name: ' + n);
    }

    if(t.type === 'fn'){
      const fn = _CALC_FUNCTIONS[t.value];
      if(!fn){
        // Maybe it's a constant/variable used without ()
        if(_calcHasOwn(_CALC_CONSTANTS, t.value)){ stk.push(_CALC_CONSTANTS[t.value]); continue; }
        if(_calcHasOwn(CALC_STATE.vars, t.value)){ stk.push(CALC_STATE.vars[t.value]); continue; }
        throw new Error('Unknown function: ' + t.value);
      }
      const n = _calcFunctionArity(t.value);
      if(stk.length < n) throw new Error('Bad arguments to ' + t.value);
      const args = stk.splice(stk.length - n, n);
      stk.push(fn.apply(null, args));
      continue;
    }

    if(t.type === 'op'){
      const op = t.value;
      if(op === 'percent'){
        if(!stk.length) throw new Error('Bad percentage');
        stk.push(stk.pop()/100); continue;
      }
      if(op === 'u-'){
        if(!stk.length) throw new Error('Bad unary minus');
        stk.push(-stk.pop()); continue;
      }
      if(op === '!'){
        if(!stk.length) throw new Error('Bad factorial');
        stk.push(_calcFactorial(stk.pop())); continue;
      }
      if(stk.length < 2) throw new Error('Bad operator: ' + op);
      const b = stk.pop(), a = stk.pop();
      switch(op){
        case '+': stk.push(a + b); break;
        case '-': stk.push(a - b); break;
        case '*': stk.push(a * b); break;
        case '/': stk.push(a / b); break;
        case '%': stk.push(a % b); break;
        case '^': stk.push(Math.pow(a, b)); break;
        default:  throw new Error('Bad op: ' + op);
      }
    }
  }
  if(stk.length !== 1) throw new Error('Malformed expression');
  return stk[0];
}

/* ── CALCULUS PLACEHOLDERS (Σ, ∫, d/dx, Π) ────────────────────
   Templates for summation, integration, derivative, and product cannot
   be serialized to a plain expression string because their body depends
   on a bound variable. Instead, their `serialize()` registers the slot
   strings in this map and returns an opaque token `__HGL_PH_N__`. On
   evaluate, we resolve each token by binding the loop variable, re-
   calling calcEvaluate on the body, and substituting the numeric result
   into the outer expression. Tokens are single-use — cleared after each
   top-level evaluation so stale bodies don't leak between calls. */
const _CALC_PLACEHOLDERS = {};
let _calcPlaceholderCounter = 0;
const _CALC_PH_RE = /__HGL_PH_\d+__/;

function _calcRegisterPlaceholder(kind, slots){
  const id = '__HGL_PH_' + (++_calcPlaceholderCounter) + '__';
  _CALC_PLACEHOLDERS[id] = { kind, slots };
  return id;
}

/** Adaptive Simpson's rule integrator. Recursively subdivides until the
 *  two half-interval Simpson estimates agree within tol, or maxDepth is
 *  reached. Returns the integral of f from a to b. */
function _calcSimpson(f, a, b){
  const c = (a + b) / 2;
  return (b - a) / 6 * (f(a) + 4 * f(c) + f(b));
}
function _calcAdaptiveSimpson(f, a, b, tol, whole, depth){
  const c  = (a + b) / 2;
  const left  = _calcSimpson(f, a, c);
  const right = _calcSimpson(f, c, b);
  const diff  = left + right - whole;
  if(depth <= 0 || Math.abs(diff) < 15 * tol){
    return left + right + diff / 15;
  }
  return _calcAdaptiveSimpson(f, a, c, tol/2, left,  depth - 1) +
         _calcAdaptiveSimpson(f, c, b, tol/2, right, depth - 1);
}
function _calcIntegrate(f, a, b){
  if(a === b) return 0;
  const sign = b < a ? -1 : 1;
  if(b < a){ const t = a; a = b; b = t; }
  const whole = _calcSimpson(f, a, b);
  return sign * _calcAdaptiveSimpson(f, a, b, 1e-8, whole, 18);
}

/** Numerical derivative via central difference + Richardson extrapolation.
 *  D ≈ (4·D(h/2) − D(h)) / 3, which cancels the O(h²) error term so the
 *  result is O(h⁴) accurate. h scales with |x| so it works for large and
 *  small arguments without losing precision. */
function _calcDerivative(f, x){
  const h = Math.max(1e-6, Math.abs(x) * 1e-6);
  const d1 = (f(x + h)     - f(x - h))     / (2 * h);
  const d2 = (f(x + h / 2) - f(x - h / 2)) / h;
  return (4 * d2 - d1) / 3;
}

/** Evaluates a single placeholder node — binds the loop variable (saving
 *  its prior value), evaluates slots, restores the variable, and returns
 *  the numeric result. Throws on nested evaluation errors. */
function _calcEvalPlaceholder(node){
  const { kind, slots } = node;
  const evalStr = (s, fallback) => {
    const str = String(s == null ? '' : s).trim();
    if(!str) return fallback;
    const r = calcEvaluate(str);
    if(!r.ok) throw new Error(r.error || 'Bad sub-expression');
    if(r.value == null || !Number.isFinite(r.value)) throw new Error('Non-finite limit');
    return r.value;
  };

  if(kind === 'sum' || kind === 'prod'){
    const name = String(slots.var || '').trim() || 'x';
    if(!_calcHasOwn(CALC_STATE.vars, name)) throw new Error('Unknown variable: ' + name);
    const lo = Math.round(evalStr(slots.lo, 0));
    const hi = Math.round(evalStr(slots.hi, 0));
    if(!Number.isFinite(lo) || !Number.isFinite(hi)) throw new Error('Bad bounds');
    if(hi - lo > 1e6) throw new Error('Range too large');
    const body = String(slots.body || '').trim();
    if(!body) throw new Error('Empty body');
    const saved = CALC_STATE.vars[name];
    let acc = kind === 'sum' ? 0 : 1;
    try {
      for(let i = lo; i <= hi; i++){
        CALC_STATE.vars[name] = i;
        const r = calcEvaluate(body);
        if(!r.ok) throw new Error(r.error || 'Bad body');
        if(kind === 'sum') acc += r.value;
        else               acc *= r.value;
      }
    } finally {
      CALC_STATE.vars[name] = saved;
    }
    return acc;
  }

  if(kind === 'integ'){
    const name = String(slots.var || '').trim() || 'x';
    if(!_calcHasOwn(CALC_STATE.vars, name)) throw new Error('Unknown variable: ' + name);
    const lo = evalStr(slots.lo, 0);
    const hi = evalStr(slots.hi, 0);
    const body = String(slots.body || '').trim();
    if(!body) throw new Error('Empty body');
    const saved = CALC_STATE.vars[name];
    try {
      const f = x => {
        CALC_STATE.vars[name] = x;
        const r = calcEvaluate(body);
        if(!r.ok) throw new Error(r.error || 'Bad body');
        return r.value;
      };
      return _calcIntegrate(f, lo, hi);
    } finally {
      CALC_STATE.vars[name] = saved;
    }
  }

  if(kind === 'deriv'){
    const name = String(slots.var || '').trim() || 'x';
    if(!_calcHasOwn(CALC_STATE.vars, name)) throw new Error('Unknown variable: ' + name);
    const at   = evalStr(slots.at, 0);
    const body = String(slots.body || '').trim();
    if(!body) throw new Error('Empty body');
    const saved = CALC_STATE.vars[name];
    try {
      const f = x => {
        CALC_STATE.vars[name] = x;
        const r = calcEvaluate(body);
        if(!r.ok) throw new Error(r.error || 'Bad body');
        return r.value;
      };
      return _calcDerivative(f, at);
    } finally {
      CALC_STATE.vars[name] = saved;
    }
  }

  throw new Error('Unknown placeholder: ' + kind);
}

/** Resolves every `__HGL_PH_N__` in `src` to a numeric literal by
 *  evaluating the registered placeholder. Repeats until no tokens remain.
 *  Placeholder entries are consumed (deleted) as they're resolved so the
 *  map doesn't grow unbounded across sessions. */
function _calcResolvePlaceholders(src){
  let expr = String(src);
  let guard = 0;
  while(_CALC_PH_RE.test(expr)){
    if(guard++ > 200) throw new Error('Placeholder recursion limit');
    const m = expr.match(_CALC_PH_RE);
    const id = m[0];
    const ph = _CALC_PLACEHOLDERS[id];
    if(!ph) throw new Error('Stale placeholder');
    const val = _calcEvalPlaceholder(ph);
    delete _CALC_PLACEHOLDERS[id];
    // Wrap result so unary-minus / operator context stays correct
    const literal = Number.isFinite(val) ? '(' + val + ')' : (val > 0 ? '(1/0)' : '(-1/0)');
    expr = expr.split(id).join(literal);
  }
  return expr;
}

/**
 * Evaluates an expression string. Returns { ok, value, decimal, error }.
 * @param {string} src - expression to evaluate
 */
function calcEvaluate(src){
  if(!src || !String(src).trim()) return { ok:true, value:null, decimal:'', error:null };
  try {
    const resolved = _calcResolvePlaceholders(String(src));
    const tokens = _calcTokenize(resolved);
    const rpn    = _calcToRPN(tokens);
    const value  = _calcEvalRPN(rpn);
    if(!Number.isFinite(value) && !Number.isNaN(value)){
      return { ok:true, value, decimal: (value > 0 ? '∞' : '-∞'), error:null };
    }
    if(Number.isNaN(value)) return { ok:false, value:NaN, decimal:'Err', error:'Math error' };
    /* feat/calc-format-dms-render: drop eager fraction
     * computation. The decimal field is now always plain
     * decimal — _calcFormatDisplay reads entry.value lazily on
     * render and applies CALC_STATE.formatMode (sticky) /
     * entry.dmsActive (per-result) there. The decimal field is
     * retained for replay metadata, history-row text fallback,
     * and back-compat with persisted entries that pre-date
     * entry.value. */
    const decimal = calcFormatResult(value);
    return { ok:true, value, decimal, error:null };
  } catch(e){
    return { ok:false, value:null, decimal:'Err', error: e.message };
  }
}

/**
 * Formats a numeric result for display — trims trailing zeros, uses sci
 * notation past 10 digits, and truncates to 10 significant figures.
 * @param {number} n
 */
function calcFormatResult(n){
  if(n === 0) return '0';
  const abs = Math.abs(n);
  if(abs >= 1e10 || abs < 1e-6){
    return n.toExponential(6).replace(/0+e/,'e').replace(/\.e/,'e');
  }
  let s = Number(n.toPrecision(10)).toString();
  // Strip trailing zeros after decimal
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}

/**
 * feat/calc-format-dms-render: lazy formatters for the displayed
 * answer. Render sites call _calcFormatDisplay(entry) on every
 * paint — it reads CALC_STATE.formatMode (sticky) and
 * entry.dmsActive (per-result) and reformats entry.value lazily.
 *
 * Fall-through ladder:
 *   entry.dmsActive  → _calcFormatDMS  (per-result wins)
 *   entry.value      → _calcFormatNumber per CALC_STATE.formatMode
 *   else             → entry.decimal (older snapshots without value)
 *
 * Irrational results (calcTryFraction returns null) fall through
 * to plain decimal regardless of the requested entry format — fraction modes
 * silently degrade.
 */
function _calcFormatNumber(value, mode){
  if(!Number.isFinite(value)) return calcFormatResult(value);
  if(mode === 'decimal') return calcFormatResult(value);
  const frac = calcTryFraction(value);
  if(!frac) return calcFormatResult(value);   // irrational → decimal
  const { n, d } = frac;
  if(mode === 'fraction' || mode === 'improper'){
    // improper is accepted only as a legacy output alias.
    return `${n}/${d}`;
  }
  if(mode === 'mixed'){
    const sign = n < 0 ? -1 : 1;
    const absN = Math.abs(n);
    const whole = Math.trunc(absN / d);
    const rem = absN - whole * d;
    if(rem === 0){
      // CR feedback: use Unicode minus consistently across all
      // negative-result branches in this formatter.
      return sign < 0 ? `−${whole}` : String(whole);
    }
    if(whole === 0){
      // No whole part — render as plain fraction. Unicode minus
      // on the numerator matches the wholeStr branch below.
      const numStr = sign < 0 ? `−${absN}` : String(absN);
      return `${numStr}/${d}`;
    }
    // Standard mixed form. Unicode minus matches existing trace
    // formatter convention (graphPanel _gpFmtTrace, calc-ui-v2).
    const wholeStr = sign < 0 ? `−${whole}` : `${whole}`;
    return `${wholeStr} ${rem}/${d}`;
  }
  return calcFormatResult(value);
}

/** Decimal-degrees → degrees-minutes-seconds string. When called
 *  on a value originated in radian-mode trig, the angleMode=='rad'
 *  path converts via × 180/π first — DMS is purely degree
 *  notation. */
function _calcFormatDMS(value, angleMode){
  if(!Number.isFinite(value)) return calcFormatResult(value);
  let degrees = (angleMode === 'rad') ? value * 180 / Math.PI : value;
  const sign = degrees < 0 ? -1 : 1;
  const absDeg = Math.abs(degrees);
  let d = Math.trunc(absDeg);
  const mFrac = (absDeg - d) * 60;
  let m = Math.trunc(mFrac);
  let s = (mFrac - m) * 60;
  // Round seconds to 3 decimals; carry to minutes if rounding
  // produces 60. Carry minutes to degrees on the same condition.
  s = Math.round(s * 1000) / 1000;
  if(s >= 60){ s -= 60; m += 1; }
  if(m >= 60){ m -= 60; d += 1; }
  // Strip trailing-zero seconds for cleaner display when integral
  const sStr = String(s);
  const signStr = sign < 0 ? '−' : '';

/* ── INPUT MODEL ─────────────────────────────────────────────── */

/**
 * The current input is an array of atoms. Each atom is either a string
 * (character) or a template node {kind, slots:{...Node[]}}.
 * The cursor is tracked as a path — array of indices into nested slots.
 */
const CALC_INPUT = {
  atoms:  [],                        // root atom array
  cursor: { path: [], pos: 0 },      // path = [] means at root; pos = index
};

/** Clears the input to empty. */
function calcInputClear(){
  CALC_INPUT.atoms = [];
  CALC_INPUT.cursor = { path: [], pos: 0 };
}

/** Returns the atom-array at a cursor path. */
function _calcAtomsAt(path){
  let arr = CALC_INPUT.atoms;
  for(const step of path){
    const node = arr[step.idx];
    if(!node || !node.slots) return arr;
    arr = node.slots[step.slot];
    if(!Array.isArray(arr)){
      // Slot stored as string — normalize to char array of atoms
      arr = (arr || '').split('');
      node.slots[step.slot] = arr;
    }
  }
  return arr;
}

/** Inserts a character at the cursor. */
function calcInputInsertChar(ch){
  const arr = _calcAtomsAt(CALC_INPUT.cursor.path);
  arr.splice(CALC_INPUT.cursor.pos, 0, ch);
  CALC_INPUT.cursor.pos++;
}

/** Inserts a string at the cursor (atom-by-atom). */
function calcInputInsertString(s){
  for(const ch of String(s)) calcInputInsertChar(ch);
}

/** Known function names sorted longest-first so multi-char names
 *  match before their substrings (e.g. "asin" before "sin"). Lazy
 *  + cached: _CALC_FUNCTIONS is declared in calc-core.js which the
 *  bundler concatenates before this file; the cache is populated
 *  on first backspace press, well after both modules are loaded.
 *  Single source of truth — adding a function to _CALC_FUNCTIONS
 *  automatically gets smart-backspace coverage. */
function _calcFunctionNamesSorted(){
  if(!_calcFunctionNamesSorted._cache){
    _calcFunctionNamesSorted._cache = Object.keys(_CALC_FUNCTIONS)
      .slice()
      .sort((a, b) => b.length - a.length);
  }
  return _calcFunctionNamesSorted._cache;
}

/** Deletes the atom to the left of the cursor (backspace). Three
 *  branches in order: smart-backspace (function-name + `(` as a
 *  unit), standard char-delete, and template-aware slot boundary
 *  handling. See fix/calc-template-input-cleanup. */

  // AND the preceding contiguous single-char atoms form a known
  // function name, remove the whole `fname(` in one operation.
  if(CALC_INPUT.cursor.pos > 0){
    const arr = _calcAtomsAt(CALC_INPUT.cursor.path);
    const pos = CALC_INPUT.cursor.pos;
    if(arr[pos - 1] === '('){
      // Walk backward collecting consecutive single-char string atoms.
      let collectStart = pos - 1;
      let collected = '';
      while(collectStart > 0){
        const a = arr[collectStart - 1];
        if(typeof a !== 'string' || a.length !== 1) break;
        collected = a + collected;
        collectStart--;

    arr.splice(CALC_INPUT.cursor.pos - 1, 1);
    CALC_INPUT.cursor.pos--;
    return;
  }

  // inside a slot. Behavior depends on which slot we're in and
  // whether the template has any content.
  if(CALC_INPUT.cursor.path.length){
    const last = CALC_INPUT.cursor.path[CALC_INPUT.cursor.path.length - 1];
    const parentArr = _calcAtomsAt(CALC_INPUT.cursor.path.slice(0, -1));
    const parentAtom = parentArr[last.idx];

    if(parentAtom && parentAtom.kind && CALC_TEMPLATES[parentAtom.kind]){
      const slotsList = CALC_TEMPLATES[parentAtom.kind].slots;
      const currentSlotIdx = slotsList.indexOf(last.slot);

      if(currentSlotIdx > 0){
        // Non-first slot — walk to previous sibling slot, position
        // at end. Mirrors calcInputLeft's sibling walker. Update
        // the path segment and let _calcAtomsAt normalize the
        // destination slot (it handles arrays, string-backed
        // legacy slots, and missing stubs by writing back a real
        // array). CR PR #122: an earlier "coerce non-array to []"
        // shortcut would have silently wiped string-backed slots.
        const prevSlot = slotsList[currentSlotIdx - 1];
        CALC_INPUT.cursor.path[CALC_INPUT.cursor.path.length - 1] =
          { idx: last.idx, slot: prevSlot };
        const prevSlotArr = _calcAtomsAt(CALC_INPUT.cursor.path);
        CALC_INPUT.cursor.pos = prevSlotArr.length;
        return;
      }

      // First slot, pos=0. If the ENTIRE template is empty (every
      // slot is array-empty, string-empty, or absent), delete the
      // template node entirely. Otherwise no-op — protects the
      // user from accidentally destroying a complex expression
      // with one keystroke. They can empty other slots first, or
      // use AC. Three-shape predicate (CR PR #122): legacy slots
      // may be stored as strings ('12'), arrays (['1','2']), or
      // missing — naive `.length` checks treat string-empty
      // correctly but the original `!slotArr || slotArr.length`
      // would also return false for plain-object stubs whose
      // .length is undefined.
      const allEmpty = slotsList.every(slotName => {
        const s = parentAtom.slots[slotName];
        if(Array.isArray(s))         return s.length === 0;
        if(typeof s === 'string')    return s.length === 0;
        return true;  // missing / stub treated as empty
      });

      if(allEmpty){
        parentArr.splice(last.idx, 1);
        CALC_INPUT.cursor.path.pop();
        CALC_INPUT.cursor.pos = last.idx;
        return;
      }

      // First slot, pos=0, template has content elsewhere — no-op.
      return;
    }

    // Parent isn't a template (shouldn't normally happen given the
    // path-segment model, but stay defensive — preserve the old
    // exit-to-parent behavior).
    const parent = CALC_INPUT.cursor.path.slice(0, -1);
    CALC_INPUT.cursor = { path: parent, pos: last.idx };

    // would skip every middle slot on their way out.

    if(parentAtom && parentAtom.kind && CALC_TEMPLATES[parentAtom.kind]){
      const slotsList = CALC_TEMPLATES[parentAtom.kind].slots;
      const currentSlotIdx = slotsList.indexOf(last.slot);
      if(currentSlotIdx > 0){

        // of the file does (object/array preferred, defaulting to
        // empty array if missing).
        const prevSlotArr = parentAtom.slots[prevSlot] =

        CALC_INPUT.cursor.pos = prevSlotArr.length;
        return;
      }
    }

    const parent = CALC_INPUT.cursor.path.slice(0, -1);
    CALC_INPUT.cursor = { path: parent, pos: last.idx };

    // the template, check whether there is a NEXT sibling slot in

    // multi-slot templates unusable for input (Phase 1 deferred,
    // see docs/calc-redesign/PATCH-calc-ux-redesign-phase1.md).
    const last = CALC_INPUT.cursor.path[CALC_INPUT.cursor.path.length - 1];
    const parentArr = _calcAtomsAt(CALC_INPUT.cursor.path.slice(0, -1));
    const parentAtom = parentArr[last.idx];
    if(parentAtom && parentAtom.kind && CALC_TEMPLATES[parentAtom.kind]){
      const slotsList = CALC_TEMPLATES[parentAtom.kind].slots;
      const currentSlotIdx = slotsList.indexOf(last.slot);
      if(currentSlotIdx >= 0 && currentSlotIdx < slotsList.length - 1){
        const nextSlot = slotsList[currentSlotIdx + 1];
        // Normalize the next slot's storage so subsequent insert
        // calls land in a real array.
        parentAtom.slots[nextSlot] =

        return;
      }
    }
    // Last slot (or non-template parent — defensive): exit to parent.
    const parent = CALC_INPUT.cursor.path.slice(0, -1);
    CALC_INPUT.cursor = { path: parent, pos: last.idx + 1 };

/** Vertical slot chains per template kind. The chain is the
 *  ordered list of slot names that are visually stacked top-down.
 *  Kinds not listed have no vertical chain — Up/Down for those
 *  falls through to history scroll.
 *
 *  mixed deliberately EXCLUDES 'w' (the whole-number part) since
 *  it renders inline to the LEFT of the fraction, not above it.
 *  Only num ↔ den constitute the vertical pair in a mixed number
 *  (CR PR #122 caught the original mixed-w-as-vertical bug). */
const _CALC_VERTICAL_CHAINS = {
  frac:  ['num', 'den'],
  mixed: ['num', 'den'],
};

/** Walks cursor.path bottom-up looking for the nearest ancestor
 *  whose (template kind, slot) is in a vertical chain. Critical
 *  for nested templates: a cursor at frac.num → sqrt.rad should
 *  still respond to Up/Down by navigating the outer frac, not
 *  fall through to history because the last path frame is sqrt
 *  (which has no vertical chain). CR PR #122.

 *  the index in cursor.path of the matched segment, or null if
 *  no vertical ancestor exists at any depth. */
function _calcFindVerticalAncestor(){
  const path = CALC_INPUT.cursor.path;
  for(let depth = path.length - 1; depth >= 0; depth--){
    const seg = path[depth];
    const ancestorPath = path.slice(0, depth);
    const parentArr = _calcAtomsAt(ancestorPath);
    const parentAtom = parentArr[seg.idx];
    if(!parentAtom || !parentAtom.kind) continue;
    const chain = _CALC_VERTICAL_CHAINS[parentAtom.kind];
    if(!chain) continue;
    const slotIdx = chain.indexOf(seg.slot);
    if(slotIdx < 0) continue;
    return { depth, chain, slotIdx, parentAtom };
  }
  return null;
}

/** True when ANY ancestor in cursor.path is a vertically-stacked
 *  template slot. Drives the Up/Down dispatcher's routing
 *  decision — see _calcUpDispatch in calc-ui.js. */
function _calcCursorInVerticalTemplate(){
  return _calcFindVerticalAncestor() !== null;
}

/** Up-arrow: move to the previous slot in the nearest vertical
 *  ancestor's chain. Truncates cursor.path back to the ancestor's
 *  level — any nested templates the cursor was inside are left in
 *  place as content of the source slot. No-op at the top of the
 *  chain. Returns true on transition. */
function calcInputSlotUp(){
  const found = _calcFindVerticalAncestor();
  if(!found) return false;
  if(found.slotIdx <= 0) return false;
  const prevSlot = found.chain[found.slotIdx - 1];
  const idxAtDepth = CALC_INPUT.cursor.path[found.depth].idx;
  // Truncate path back to the ancestor level + update its slot,
  // then let _calcAtomsAt normalize the destination slot in place
  // (handles arrays, string-backed legacy slots, missing stubs).
  // CR PR #122: an earlier "coerce non-array to []" shortcut
  // would have wiped string-backed slot contents on hop.
  CALC_INPUT.cursor.path = CALC_INPUT.cursor.path.slice(0, found.depth);
  CALC_INPUT.cursor.path.push({ idx: idxAtDepth, slot: prevSlot });
  const prevSlotArr = _calcAtomsAt(CALC_INPUT.cursor.path);
  CALC_INPUT.cursor.pos = prevSlotArr.length;

 *  ancestor's chain. Same truncation behavior as slotUp. No-op
 *  at the bottom of the chain. */
function calcInputSlotDown(){
  const found = _calcFindVerticalAncestor();
  if(!found) return false;
  if(found.slotIdx >= found.chain.length - 1) return false;
  const nextSlot = found.chain[found.slotIdx + 1];
  const idxAtDepth = CALC_INPUT.cursor.path[found.depth].idx;
  CALC_INPUT.cursor.path = CALC_INPUT.cursor.path.slice(0, found.depth);
  CALC_INPUT.cursor.path.push({ idx: idxAtDepth, slot: nextSlot });

  // pos:0 lands at start of the (now-array) next slot.
  _calcAtomsAt(CALC_INPUT.cursor.path);
  CALC_INPUT.cursor.pos = 0;
  return true;

function calcInputInsertTemplate(kind){

  if(!def) return;

  const first = def.slots[0];
  const pathSeg = { idx: CALC_INPUT.cursor.pos, slot: first };
  CALC_INPUT.cursor.path.push(pathSeg);
  CALC_INPUT.cursor.pos = 0;
}

/* ── SERIALIZATION ───────────────────────────────────────────── */

/** Serializes atom array to an evaluator-ready string. Calculus templates
 *  (sum/prod/integ/deriv) register opaque placeholder IDs here that the
 *  evaluator resolves before tokenization. This form is NOT safe for
 *  persistence or display — use calcSerializeDisplay for history entries. */
function calcSerialize(atoms){
  if(!atoms) atoms = CALC_INPUT.atoms;
  let out = '';
  for(const a of atoms){
    if(typeof a === 'string'){ out += a; continue; }
    if(a && a.kind){
      const def = CALC_TEMPLATES[a.kind];
      if(!def){ continue; }
      const slotStrs = {};
      def.slots.forEach(s => slotStrs[s] = calcSerialize(a.slots[s]));
      out += def.serialize(slotStrs);
    }
  }
  return out;
}

/** Serializes atom array to a stable, human-readable string — never emits
 *  placeholder tokens. Templates that define `display(slots)` use that;
 *  others fall back to their normal `serialize`. Use this for anything that
 *  outlives a single evaluate() call (history entries, session snapshots). */
function calcSerializeDisplay(atoms){
  if(!atoms) atoms = CALC_INPUT.atoms;
  let out = '';
  for(const a of atoms){
    if(typeof a === 'string'){ out += a; continue; }
    if(a && a.kind){
      const def = CALC_TEMPLATES[a.kind];
      if(!def){ continue; }
      const slotStrs = {};
      def.slots.forEach(s => slotStrs[s] = calcSerializeDisplay(a.slots[s]));
      out += (def.display || def.serialize)(slotStrs);
    }
  }
  return out;
}

/* ── RENDER ──────────────────────────────────────────────────── */

/** Display-only glyph map. Storage + serialization keep ASCII operators
 *  (* / -) so the tokenizer and history replay stay unchanged; the render
 *  path substitutes the proper math glyphs (× ÷ −) so users don't see
 *  asterisks and slashes in the live input area. */
const _CALC_DISPLAY_GLYPH = { '*': '×', '/': '÷', '-': '−' };

/** Transform an arbitrary already-serialized calculator string into
 *  display form by substituting the operator glyphs. Used for history
 *  rows and any other surface that renders a pre-flattened expression
 *  string (as opposed to the atom array, which calcRender handles).
 *  Kept as a pure function so callers can compose with _escCalc /
 *  escHtml without worrying about double-encoding — glyphify first,
 *  then escape. */
function calcDisplayGlyphify(s){
  if(s == null) return '';
  // Replace only exact ASCII operators. We deliberately don't touch
  // `-` inside identifiers (there aren't any) or `/` inside a fraction
  // placeholder notation like "()/()" because the whole segment is
  // the serialized form — any `/` in it IS division.
  return String(s).replace(/[*/\-]/g, ch => _CALC_DISPLAY_GLYPH[ch] || ch);
}

/** Renders atom array to HTML, with a caret marker at cursor position. */
function calcRender(atoms, path, cursorPos, includeCaret){
  if(!atoms) atoms = CALC_INPUT.atoms;
  const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = '';
  for(let i = 0; i < atoms.length; i++){
    if(includeCaret && _pathsEqual(path, CALC_INPUT.cursor.path) && i === cursorPos){
      out += '<span class="ct-caret"></span>';
    }
    const a = atoms[i];
    if(typeof a === 'string'){
      const g = _CALC_DISPLAY_GLYPH[a];
      out += g ? escHtml(g) : escHtml(a);
      continue;
    }
    if(a && a.kind){
      const def = CALC_TEMPLATES[a.kind];
      if(!def){ continue; }
      const slotHtml = {};
      def.slots.forEach(slot => {
        const inside = a.slots[slot] || [];
        const childPath = (path || []).concat([{ idx: i, slot }]);
        // Empty slot — special-case so the focused-slot indicator
        // and the caret can coexist. The existing fallback path
        // (`childHtml || '<span class="ct-empty">▢</span>'`) hid
        // the placeholder square whenever the caret was inside an
        // empty slot, because the caret span itself is non-empty
        // truthy HTML. Users couldn't see which slot they were in
        // until they typed a character.
        if(inside.length === 0){
          const isFocused = includeCaret &&
            _pathsEqual(childPath, CALC_INPUT.cursor.path);
          const cls = isFocused ? 'ct-empty is-focused' : 'ct-empty';
          // No caret in this branch — the .is-focused accent border
          // IS the cursor indicator for empty slots. The previous
          // version emitted a caret beside the ▢ box, which read
          // as two cursor positions per recording-use feedback.
          // See fix/calc-template-input-cleanup.
          slotHtml[slot] = `<span class="${cls}">▢</span>`;
        } else {
          slotHtml[slot] = calcRender(inside, childPath, cursorPos, includeCaret);
        }
      });
      out += def.render(slotHtml);
    }
  }
  if(includeCaret && _pathsEqual(path, CALC_INPUT.cursor.path) && cursorPos === atoms.length){
    out += '<span class="ct-caret"></span>';
  }
  return out;
}

function _pathsEqual(a, b){
  a = a || []; b = b || [];
  if(a.length !== b.length) return false;
  for(let i = 0; i < a.length; i++){
    if(a[i].idx !== b[i].idx || a[i].slot !== b[i].slot) return false;
  }
  return true;
}

/** Flattens root-level atoms and caret-visible render at current cursor. */
function calcRenderCurrent(){
  return calcRender(CALC_INPUT.atoms, [], CALC_INPUT.cursor.pos, true);
}

/* ==== src/js/features/calc/calc-undo.js ==== */
/* features/calc/calc-undo.js — UNDO / REDO for the Calculate-mode input.
   Phase 2 of the calc redesign; the buttons existed since Phase 1 but hit the
   console.log stub in _calcV2HandleAct.

   WHAT IS UNDOABLE
   Only the live input — CALC_INPUT.atoms plus the cursor. Typing, deletions,
   template insertions, DMS symbol insertion, ± and ×10ⁿ: anything that changes
   the expression you are building. Deliberately NOT undoable:
     - evaluated history entries (EXE is a commit point, see below),
     - settings (angle, format), panels, or anything in CALC_STATE,
     - anything across a session — the stack is in-memory only and is never
       persisted, so a reload starts clean.

   HOW CHANGES ARE DETECTED
   Rather than enumerating which keys mutate — a list that silently rots as keys
   are added — the keypad dispatcher captures a snapshot BEFORE the key runs and
   commits it on the next microtask, keeping it only if the input actually
   changed. Every mutation path is covered automatically, including future ones,
   and keys that don't touch the input record nothing.

   MEMORY
   Snapshots are JSON strings of {atoms, cursor}. The stack is bounded at
   CALC_UNDO_MAX entries (oldest dropped), so a long recording session cannot
   grow it without limit. EXE and AC reset both stacks: they are clean-slate
   boundaries, and undoing "backwards through" an evaluation into a previous
   expression would contradict the input-level scope above. */

/** Hard cap on remembered input states. 50 covers any realistic edit run while
 *  keeping the stack trivially small (each entry is a short JSON string). */
const CALC_UNDO_MAX = 50;

const _CALC_UNDO = {
  undo: [],        // snapshots of states we can go BACK to (oldest → newest)
  redo: [],        // snapshots we can go FORWARD to after undoing
  applying: false, // guard: an undo/redo must not record itself as an edit
};

/* Suppress the dispatcher's PENDING commit as well as the current call.
 *
 * UNDO, REDO and the EXE/AC resets all run from inside the keypad click
 * handler, which captured a snapshot before dispatch and queued a commit for
 * the next microtask. A guard that cleared synchronously was still false by the
 * time that commit ran, so undo re-recorded its own change (every UNDO pushed a
 * new entry and the stack walked in circles) and EXE's reset was immediately
 * followed by a push, leaving depth 1 instead of 0 — both measured.
 *
 * Clearing the flag from a microtask queued HERE means it is cleared strictly
 * after the dispatcher's commit microtask, which was queued first. */
function _calcUndoSuppress(){
  _CALC_UNDO.applying = true;
  queueMicrotask(() => { _CALC_UNDO.applying = false; });
}

/** Serializes the live input. Doubles as the change-detection key — atoms are
 *  plain data (chars, or {kind, slots} template nodes) and the cursor is
 *  {path, pos}, so JSON round-trips them exactly and compares reliably. */
function _calcUndoSnapshot(){
  try{
    return JSON.stringify({ atoms: CALC_INPUT.atoms, cursor: CALC_INPUT.cursor });
  }catch(_){
    return null;   // never let snapshotting break a keypress
  }
}

/** Replaces the live input with a snapshot. */
function _calcUndoRestore(snap){
  let o;
  try{ o = JSON.parse(snap); }catch(_){ return false; }
  if(!o || !Array.isArray(o.atoms)) return false;
  CALC_INPUT.atoms  = o.atoms;
  CALC_INPUT.cursor = (o.cursor && Array.isArray(o.cursor.path))
    ? o.cursor
    : { path: [], pos: o.atoms.length };
  return true;
}

/** Called by the keypad dispatcher BEFORE a key runs. Returns the pre-key
 *  snapshot, or null when recording is suppressed. */
function calcUndoCapture(){
  if(_CALC_UNDO.applying) return null;
  return _calcUndoSnapshot();
}

/** Called on the microtask after a key ran. Keeps `before` only if the key
 *  actually changed the input. */
function calcUndoCommit(before){
  if(before == null || _CALC_UNDO.applying) return;
  const after = _calcUndoSnapshot();
  if(after == null || after === before) return;     // no edit → no entry
  _CALC_UNDO.undo.push(before);
  // Bounded: drop the oldest rather than growing without limit.
  while(_CALC_UNDO.undo.length > CALC_UNDO_MAX) _CALC_UNDO.undo.shift();
  // A fresh edit invalidates the redo branch, as in every editor.
  _CALC_UNDO.redo.length = 0;
}

/** Clears both stacks. Called at clean-slate boundaries (EXE, AC). */
function calcUndoReset(){
  _CALC_UNDO.undo.length = 0;
  _CALC_UNDO.redo.length = 0;
  _calcUndoSuppress();   // the EXE/AC keypress itself must not re-push
}

/** True when there is anything to undo / redo — drives the disabled state. */
function calcCanUndo(){ return _CALC_UNDO.undo.length > 0; }
function calcCanRedo(){ return _CALC_UNDO.redo.length > 0; }

/** Steps one state back. Returns true if something changed. */
function calcUndo(){
  if(!_CALC_UNDO.undo.length) return false;
  const current = _calcUndoSnapshot();
  const prev = _CALC_UNDO.undo.pop();
  _calcUndoSuppress();
  const ok = _calcUndoRestore(prev);
  if(!ok) return false;
  if(current != null) _CALC_UNDO.redo.push(current);
  while(_CALC_UNDO.redo.length > CALC_UNDO_MAX) _CALC_UNDO.redo.shift();
  return true;
}

/** Steps one state forward. Returns true if something changed. */
function calcRedo(){
  if(!_CALC_UNDO.redo.length) return false;
  const current = _calcUndoSnapshot();
  const next = _CALC_UNDO.redo.pop();
  _calcUndoSuppress();
  const ok = _calcUndoRestore(next);
  if(!ok) return false;
  if(current != null) _CALC_UNDO.undo.push(current);
  while(_CALC_UNDO.undo.length > CALC_UNDO_MAX) _CALC_UNDO.undo.shift();
  return true;
}

/* ==== src/js/features/calc/calc-stats.js ==== */
/* features/calc/calc-stats.js — Statistics mode (fx-8200 style)
   1-variable: mean, sample stdev, population stdev, Σx, Σx², min, max,
               median, Q1, Q3, variance.
   2-variable: linear regression y = a + bx, correlation r, r².
   Data is stored in CALC_STATS_STATE.rows — each row is { x, y, freq }.
   `freq` defaults to 1 (used when binning or weighting data).
   The UI renders a table with editable cells; bottom panel shows the
   computed statistics. Pressing `Calc` re-evaluates them. */

/** Factory for the default Statistics state shape. Used both by the
 *  module's initializer and by reset paths (widgetState.js,
 *  persistence.js) so "New Session" and snapshot restore share a single
 *  source of truth. */
function _calcStatsDefaults(){
  return {
    mode: '1var',                            // '1var' | '2var'
    rows: [
      { x:'', y:'', freq:'1' },
      { x:'', y:'', freq:'1' },
      { x:'', y:'', freq:'1' }
    ],
    results: null                            // cached last computation
  };
}

const CALC_STATS_STATE = _calcStatsDefaults();

/** Resets the runtime Statistics state in place. Called from
 *  resetWidgetState and applySessionSnapshot so both reset and restore
 *  paths stay aligned. */
function resetCalcStatsState(){
  const d = _calcStatsDefaults();
  CALC_STATS_STATE.mode    = d.mode;
  CALC_STATS_STATE.rows    = d.rows;
  CALC_STATS_STATE.results = d.results;
}

/** Parses a numeric cell, returning null when empty/invalid. */
function _statsParseCell(v){
  if(v == null) return null;
  const s = String(v).trim();
  if(!s) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/** Resets the stats grid to three empty rows (keeps current mode). */
function calcStatsClearRows(){
  const d = _calcStatsDefaults();
  CALC_STATS_STATE.rows    = d.rows;
  CALC_STATS_STATE.results = null;
}

/** Computes 1-variable statistics from the current rows. Returns null if
 *  no valid data points are present. */
function calcStats1Var(){
  const data = [];
  for(const r of CALC_STATS_STATE.rows){
    const x = _statsParseCell(r.x);
    const f = _statsParseCell(r.freq);
    if(x == null || f == null || f <= 0) continue;
    // Expand frequency into individual observations (capped to avoid blowup)
    const count = Math.min(Math.round(f), 1e5);
    for(let i = 0; i < count; i++) data.push(x);
  }
  if(!data.length) return null;
  const n    = data.length;
  const sum  = data.reduce((a, b) => a + b, 0);
  const sum2 = data.reduce((a, b) => a + b * b, 0);
  const mean = sum / n;
  const varPop = sum2 / n - mean * mean;
  const varSmp = n > 1 ? (sum2 - n * mean * mean) / (n - 1) : 0;
  const sorted = [...data].sort((a, b) => a - b);
  const q = p => {
    const idx = (sorted.length - 1) * p;
    const lo  = Math.floor(idx);
    const hi  = Math.ceil(idx);
    if(lo === hi) return sorted[lo];
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  };
  return {
    n,
    sumX:   sum,
    sumX2:  sum2,
    mean,
    sigmaX: Math.sqrt(Math.max(0, varPop)),
    sX:     Math.sqrt(Math.max(0, varSmp)),
    min:    sorted[0],
    max:    sorted[sorted.length - 1],
    median: q(0.5),
    q1:     q(0.25),
    q3:     q(0.75)
  };
}

/** Computes 2-variable linear regression + correlation. */
function calcStats2Var(){
  const pairs = [];
  for(const r of CALC_STATS_STATE.rows){
    const x = _statsParseCell(r.x);
    const y = _statsParseCell(r.y);
    if(x == null || y == null) continue;
    pairs.push([x, y]);
  }
  if(pairs.length < 2) return null;
  const n = pairs.length;
  let sumX = 0, sumY = 0, sumX2 = 0, sumY2 = 0, sumXY = 0;
  for(const [x, y] of pairs){
    sumX  += x;
    sumY  += y;
    sumX2 += x * x;
    sumY2 += y * y;
    sumXY += x * y;
  }
  const meanX = sumX / n;
  const meanY = sumY / n;
  const ssxx  = sumX2 - n * meanX * meanX;
  const ssyy  = sumY2 - n * meanY * meanY;
  const ssxy  = sumXY - n * meanX * meanY;
  const b = ssxx ? ssxy / ssxx : 0;
  const a = meanY - b * meanX;
  const r = (ssxx * ssyy > 0) ? ssxy / Math.sqrt(ssxx * ssyy) : 0;
  return {
    n, sumX, sumY, sumX2, sumY2, sumXY,
    meanX, meanY,
    a, b,
    r,
    r2: r * r,
    // Predictors (useful for forecasting):
    yAt: x => a + b * x,
    xAt: y => (b ? (y - a) / b : NaN)
  };
}

function _statsFmt(v){
  if(v == null || Number.isNaN(v)) return '—';
  if(typeof calcFormatResult === 'function') return calcFormatResult(v);
  return String(v);
}

/** Renders the Statistics mode UI. */
function calcRenderStats(){
  const rows = CALC_STATS_STATE.rows;
  const is2 = CALC_STATS_STATE.mode === '2var';
  const res = CALC_STATS_STATE.results;
  const fs = CALC_STATE.fullscreen ? ' calc-fs' : '';

  const headCells = is2
    ? `<th>x</th><th>y</th>`
    : `<th>x</th><th>freq</th>`;
  const bodyCells = rows.map((r, i) => is2
    ? `<tr><td>${i+1}</td><td><input class="st-cell" data-row="${i}" data-col="x" value="${_escCalc(r.x)}" inputmode="decimal"></td><td><input class="st-cell" data-row="${i}" data-col="y" value="${_escCalc(r.y)}" inputmode="decimal"></td></tr>`
    : `<tr><td>${i+1}</td><td><input class="st-cell" data-row="${i}" data-col="x" value="${_escCalc(r.x)}" inputmode="decimal"></td><td><input class="st-cell" data-row="${i}" data-col="freq" value="${_escCalc(r.freq)}" inputmode="decimal"></td></tr>`
  ).join('');

  let resultsHtml = '<div class="st-empty">Add data and press Calc</div>';
  if(res){
    if(is2){
      resultsHtml = `
        <div class="st-grid">
          <div><span class="st-k">n</span><span class="st-v">${_statsFmt(res.n)}</span></div>
          <div><span class="st-k">x̄</span><span class="st-v">${_statsFmt(res.meanX)}</span></div>
          <div><span class="st-k">ȳ</span><span class="st-v">${_statsFmt(res.meanY)}</span></div>
          <div><span class="st-k">a</span><span class="st-v">${_statsFmt(res.a)}</span></div>
          <div><span class="st-k">b</span><span class="st-v">${_statsFmt(res.b)}</span></div>
          <div><span class="st-k">r</span><span class="st-v">${_statsFmt(res.r)}</span></div>
          <div><span class="st-k">r²</span><span class="st-v">${_statsFmt(res.r2)}</span></div>
          <div><span class="st-k">Σxy</span><span class="st-v">${_statsFmt(res.sumXY)}</span></div>
        </div>
        <div class="st-eq">y = ${_statsFmt(res.a)} + ${_statsFmt(res.b)}·x</div>`;
    } else {
      resultsHtml = `
        <div class="st-grid">
          <div><span class="st-k">n</span><span class="st-v">${_statsFmt(res.n)}</span></div>
          <div><span class="st-k">x̄</span><span class="st-v">${_statsFmt(res.mean)}</span></div>
          <div><span class="st-k">σx</span><span class="st-v">${_statsFmt(res.sigmaX)}</span></div>
          <div><span class="st-k">sx</span><span class="st-v">${_statsFmt(res.sX)}</span></div>
          <div><span class="st-k">Σx</span><span class="st-v">${_statsFmt(res.sumX)}</span></div>
          <div><span class="st-k">Σx²</span><span class="st-v">${_statsFmt(res.sumX2)}</span></div>
          <div><span class="st-k">min</span><span class="st-v">${_statsFmt(res.min)}</span></div>
          <div><span class="st-k">max</span><span class="st-v">${_statsFmt(res.max)}</span></div>
          <div><span class="st-k">Q1</span><span class="st-v">${_statsFmt(res.q1)}</span></div>
          <div><span class="st-k">med</span><span class="st-v">${_statsFmt(res.median)}</span></div>
          <div><span class="st-k">Q3</span><span class="st-v">${_statsFmt(res.q3)}</span></div>
        </div>`;
    }
  }

  return `
    <div class="calc-wrap calc-stats${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Statistics</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="st-modebar">
        <button class="st-pill${is2 ? '' : ' on'}" data-act="mode-1var">1-Var</button>
        <button class="st-pill${is2 ? ' on' : ''}" data-act="mode-2var">2-Var</button>
        <div style="flex:1"></div>
        <button class="st-btn" data-act="add">+ Row</button>
        <button class="st-btn" data-act="clear">Clear</button>
        <button class="st-btn st-btn-p" data-act="calc">Calc</button>
      </div>
      <div class="st-table">
        <table><thead><tr><th>#</th>${headCells}</tr></thead>
        <tbody>${bodyCells}</tbody></table>
      </div>
      <div class="st-results">${resultsHtml}</div>
    </div>`;
}

/** Wires input/button handlers for the Statistics mode. */
function calcWireStats(){
  const panel = document.querySelector('#calc-p .calc-stats');
  if(!panel || panel._wired) return;
  panel._wired = true;

  panel.addEventListener('input', e => {
    const cell = e.target.closest('.st-cell');
    if(!cell) return;
    const row = +cell.dataset.row;
    const col = cell.dataset.col;
    if(CALC_STATS_STATE.rows[row]) CALC_STATS_STATE.rows[row][col] = cell.value;
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  });

  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    switch(btn.dataset.act){
      case 'mode-1var': CALC_STATS_STATE.mode = '1var'; CALC_STATS_STATE.results = null; calcRenderUI(); break;
      case 'mode-2var': CALC_STATS_STATE.mode = '2var'; CALC_STATS_STATE.results = null; calcRenderUI(); break;
      case 'add':
        CALC_STATS_STATE.rows.push({ x:'', y:'', freq:'1' });
        calcRenderUI();
        break;
      case 'clear':
        calcStatsClearRows();
        calcRenderUI();
        if(typeof scheduleAutosave === 'function') scheduleAutosave();
        break;
      case 'calc':
        CALC_STATS_STATE.results = CALC_STATS_STATE.mode === '2var'
          ? calcStats2Var()
          : calcStats1Var();
        calcRenderUI();
        if(typeof scheduleAutosave === 'function') scheduleAutosave();
        break;
    }
  });
}

/* features/calc/calc-dist.js — Distribution mode
   Probability distributions (fx-8200 style):
     Normal:   PDF, CDF(lower,upper), InvN(p)  with mean μ, stdev σ
     Binomial: PDF(k), CDF(k)                  with n trials, prob p
     Poisson:  PDF(k), CDF(k)                  with rate λ
   All use closed-form or series implementations — no lookup tables.
   CDFs for continuous distributions are computed via erf; binomial and
   poisson CDFs use cumulative summation of their PDFs. */

/** Factory for the default Distribution state shape. Shared between the
 *  module's initializer, reset paths (widgetState.js), and snapshot
 *  restore (persistence.js) so all three stay aligned. */
function _calcDistDefaults(){
  return {
    type: 'normal',        // 'normal' | 'binom' | 'poisson'
    op:   'pdf',           // 'pdf' | 'cdf' | 'invN' (normal only)
    params: {
      mean:  '0',
      stdev: '1',
      x:     '0',
      lower: '-1',
      upper: '1',
      p:     '0.5',
      n:     '10',
      prob:  '0.5',
      k:     '5',
      lambda:'3'
    },
    result: null
  };
}

const CALC_DIST_STATE = _calcDistDefaults();

/** Resets the runtime Distribution state in place. Called from
 *  resetWidgetState and applySessionSnapshot. */
function resetCalcDistState(){
  const d = _calcDistDefaults();
  CALC_DIST_STATE.type   = d.type;
  CALC_DIST_STATE.op     = d.op;
  CALC_DIST_STATE.params = d.params;
  CALC_DIST_STATE.result = d.result;
}

/** Returns a fresh copy of the canonical param defaults. Exposed so the
 *  persistence whitelist-merge can iterate known keys without duplicating
 *  the defaults inline. */
function getCalcDistParamDefaults(){
  return _calcDistDefaults().params;
}

/* ── DISTRIBUTION MATH ───────────────────────────────────────── */

/** Abramowitz & Stegun 7.1.26 — max error ≈ 1.5e-7 for erf. Good enough
 *  for a classroom calculator. Uses sign-extending form for negative x. */
function _distErf(x){
  const sign = x < 0 ? -1 : 1;
  const a = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * a);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
  return sign * y;
}

function _distNormalPDF(x, mu, sigma){
  if(sigma <= 0) return NaN;
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}

function _distNormalCDF(x, mu, sigma){
  if(sigma <= 0) return NaN;
  return 0.5 * (1 + _distErf((x - mu) / (sigma * Math.SQRT2)));
}

/** Inverse standard normal — Beasley-Springer/Moro algorithm. Input in
 *  (0,1). Returns z such that P(Z <= z) = p. */
function _distInvNormStd(p){
  if(p <= 0 || p >= 1) return NaN;
  // Rational approximation, max error ~1e-9 across (0,1)
  const a = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2,
             1.383577518672690e2, -3.066479806614716e1, 2.506628277459239];
  const b = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2,
             6.680131188771972e1, -1.328068155288572e1];
  const c = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838,
             -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996,
             3.754408661907416];
  const plow  = 0.02425;
  const phigh = 1 - plow;
  let q, r;
  if(p < plow){
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0]*q + c[1])*q + c[2])*q + c[3])*q + c[4])*q + c[5]) /
           ((((d[0]*q + d[1])*q + d[2])*q + d[3])*q + 1);
  }
  if(p <= phigh){
    q = p - 0.5;
    r = q * q;
    return (((((a[0]*r + a[1])*r + a[2])*r + a[3])*r + a[4])*r + a[5]) * q /
           (((((b[0]*r + b[1])*r + b[2])*r + b[3])*r + b[4])*r + 1);
  }
  q = Math.sqrt(-2 * Math.log(1 - p));
  return -(((((c[0]*q + c[1])*q + c[2])*q + c[3])*q + c[4])*q + c[5]) /
          ((((d[0]*q + d[1])*q + d[2])*q + d[3])*q + 1);
}

function _distInvNorm(p, mu, sigma){
  if(sigma <= 0) return NaN;
  return mu + sigma * _distInvNormStd(p);
}

function _distBinomPDF(k, n, p){
  k = Math.round(k); n = Math.round(n);
  // Reject non-finite inputs up front — calcEvaluate can return ±Infinity
  // for expressions like 1/0, which would otherwise run the factorial
  // loop below forever and lock the UI thread.
  if(!Number.isFinite(k) || !Number.isFinite(n) || !Number.isFinite(p) ||
     n < 0 || p < 0 || p > 1) return NaN;
  if(k < 0 || k > n) return 0;
  // Use log-factorial to avoid overflow for larger n
  const lnFact = m => {
    let s = 0;
    for(let i = 2; i <= m; i++) s += Math.log(i);
    return s;
  };
  const logC = lnFact(n) - lnFact(k) - lnFact(n - k);
  const logP = k === 0 ? 0 : k * Math.log(p);
  const logQ = (n - k) === 0 ? 0 : (n - k) * Math.log(1 - p);
  return Math.exp(logC + logP + logQ);
}

/** O(k) binomial CDF via the PMF recurrence
 *    P(i+1) = P(i) · (n−i)/(i+1) · p/(1−p)
 *  Computes P(X=0) = (1−p)^n once via log1p (accurate for small p) and
 *  walks up to k without re-running lnFact each term. Large n/k inputs
 *  no longer stall the main thread. */
function _distBinomCDF(k, n, p){
  k = Math.round(k); n = Math.round(n);
  if(!Number.isFinite(k) || !Number.isFinite(n) || n < 0 || p < 0 || p > 1) return NaN;
  if(k < 0)    return 0;
  if(k >= n)   return 1;
  if(p === 0)  return 1;                    // all mass at 0
  if(p === 1)  return k >= n ? 1 : 0;       // all mass at n
  let term = Math.exp(n * Math.log1p(-p));  // P(X = 0)
  let acc  = term;
  const ratio = p / (1 - p);
  for(let i = 0; i < k; i++){
    term *= ((n - i) / (i + 1)) * ratio;
    acc  += term;
  }
  return Math.min(1, acc);
}

function _distPoissonPDF(k, lambda){
  k = Math.round(k);
  // Same Infinity guard as the binomial PDF — otherwise an infinite k
  // would spin the logFact loop below indefinitely.
  if(!Number.isFinite(k) || !Number.isFinite(lambda) || lambda < 0) return NaN;
  if(k < 0) return 0;
  // e^-λ * λ^k / k!   — computed via logs for large k/λ
  let logFact = 0;
  for(let i = 2; i <= k; i++) logFact += Math.log(i);
  return Math.exp(-lambda + k * Math.log(lambda || 1e-300) - logFact);
}

/** O(k) Poisson CDF via the PMF recurrence P(i+1) = P(i) · λ/(i+1).
 *  Avoids the inner logFact rebuild each term so classroom-scale λ/k
 *  don't stall the UI. */
function _distPoissonCDF(k, lambda){
  k = Math.round(k);
  if(!Number.isFinite(k) || !Number.isFinite(lambda) || lambda < 0) return NaN;
  if(k < 0) return 0;
  let term = Math.exp(-lambda);             // P(X = 0)
  let acc  = term;
  for(let i = 0; i < k; i++){
    term *= lambda / (i + 1);
    acc  += term;
  }
  return Math.min(1, acc);
}

/* ── UI ──────────────────────────────────────────────────────── */

/** Evaluates a param string through the main evaluator so expressions
 *  like pi, sqrt(2), 2^10 can be used as parameters. */
function _distEvalParam(s){
  if(typeof calcEvaluate !== 'function') return Number(s);
  const r = calcEvaluate(String(s || ''));
  return r.ok && r.value != null ? r.value : NaN;
}

function _distCompute(){
  const P = CALC_DIST_STATE.params;
  const t = CALC_DIST_STATE.type;
  const op = CALC_DIST_STATE.op;
  try {
    if(t === 'normal'){
      const mu    = _distEvalParam(P.mean);
      const sigma = _distEvalParam(P.stdev);
      if(op === 'pdf'){
        const x = _distEvalParam(P.x);
        return { value: _distNormalPDF(x, mu, sigma), label: `f(x = ${x})` };
      }
      if(op === 'cdf'){
        const lo = _distEvalParam(P.lower);
        const hi = _distEvalParam(P.upper);
        // Normalize reversed bounds so the interval probability can't go
        // negative when the user enters lower > upper.
        const a = Math.min(lo, hi);
        const b = Math.max(lo, hi);
        return { value: _distNormalCDF(b, mu, sigma) - _distNormalCDF(a, mu, sigma),
                 label: `P(${a} ≤ X ≤ ${b})` };
      }
      if(op === 'invN'){
        const p = _distEvalParam(P.p);
        return { value: _distInvNorm(p, mu, sigma), label: `x where P(X ≤ x) = ${p}` };
      }
    }
    if(t === 'binom'){
      const n    = _distEvalParam(P.n);
      const prob = _distEvalParam(P.prob);
      const k    = _distEvalParam(P.k);
      if(op === 'pdf') return { value: _distBinomPDF(k, n, prob), label: `P(X = ${Math.round(k)})` };
      if(op === 'cdf') return { value: _distBinomCDF(k, n, prob), label: `P(X ≤ ${Math.round(k)})` };
    }
    if(t === 'poisson'){
      const lambda = _distEvalParam(P.lambda);
      const k      = _distEvalParam(P.k);
      if(op === 'pdf') return { value: _distPoissonPDF(k, lambda), label: `P(X = ${Math.round(k)})` };
      if(op === 'cdf') return { value: _distPoissonCDF(k, lambda), label: `P(X ≤ ${Math.round(k)})` };
    }
  } catch(e){
    return { value: NaN, label: 'Error: ' + e.message };
  }
  return { value: NaN, label: 'Unsupported combination' };
}

function _distParamInput(key, label, col){
  const v = CALC_DIST_STATE.params[key] || '';
  // No inputmode="decimal": params accept full calc expressions (pi,
  // sqrt(2), 2^10) that require letters and operators on mobile keyboards.
  return `<label class="dt-p"><span class="dt-plabel">${label}</span><input class="dt-pinput" data-pkey="${key}" value="${_escCalc(v)}"${col?` style="grid-column:${col};"`:''}></label>`;
}

function _distRenderParams(){
  const t  = CALC_DIST_STATE.type;
  const op = CALC_DIST_STATE.op;
  if(t === 'normal'){
    const common = _distParamInput('mean','μ') + _distParamInput('stdev','σ');
    if(op === 'pdf')  return common + _distParamInput('x','x');
    if(op === 'cdf')  return common + _distParamInput('lower','lower') + _distParamInput('upper','upper');
    if(op === 'invN') return common + _distParamInput('p','p');
  }
  if(t === 'binom'){
    return _distParamInput('n','n') + _distParamInput('prob','p') + _distParamInput('k','k');
  }
  if(t === 'poisson'){
    return _distParamInput('lambda','λ') + _distParamInput('k','k');
  }
  return '';
}

function _distOpsFor(type){
  if(type === 'normal') return [
    { id:'pdf', label:'PDF' }, { id:'cdf', label:'CDF' }, { id:'invN', label:'InvN' }
  ];
  return [ { id:'pdf', label:'PDF' }, { id:'cdf', label:'CDF' } ];
}

/** Renders the Distribution mode UI. */
function calcRenderDist(){
  const fs = CALC_STATE.fullscreen ? ' calc-fs' : '';
  const t  = CALC_DIST_STATE.type;
  const op = CALC_DIST_STATE.op;
  const types = [
    { id:'normal',  label:'Normal'   },
    { id:'binom',   label:'Binomial' },
    { id:'poisson', label:'Poisson'  }
  ];
  const typePills = types.map(x =>
    `<button class="st-pill${t === x.id ? ' on':''}" data-act="type-${x.id}">${x.label}</button>`
  ).join('');
  const opPills = _distOpsFor(t).map(x =>
    `<button class="st-pill${op === x.id ? ' on':''}" data-act="op-${x.id}">${x.label}</button>`
  ).join('');
  const res = CALC_DIST_STATE.result;

  return `
    <div class="calc-wrap calc-dist${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Distribution</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="st-modebar">${typePills}</div>
      <div class="st-modebar">${opPills}</div>
      <div class="dt-params">${_distRenderParams()}</div>
      <div class="dt-actions">
        <button class="st-btn st-btn-p" data-act="compute">Compute</button>
      </div>
      <div class="dt-result">
        ${res
          ? `<div class="dt-rlabel">${_escCalc(res.label)}</div>
             <div class="dt-rvalue">${Number.isFinite(res.value) ? (typeof calcFormatResult === 'function' ? calcFormatResult(res.value) : res.value) : '—'}</div>`
          : '<div class="st-empty">Choose a distribution and press Compute</div>'}
      </div>
    </div>`;
}

/** Wires input/button handlers for Distribution mode. */
function calcWireDist(){
  const panel = document.querySelector('#calc-p .calc-dist');
  if(!panel || panel._wired) return;
  panel._wired = true;

  panel.addEventListener('input', e => {
    const inp = e.target.closest('.dt-pinput');
    if(!inp) return;
    const key = inp.dataset.pkey;
    if(key) CALC_DIST_STATE.params[key] = inp.value;
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  });

  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act.startsWith('type-')){
      CALC_DIST_STATE.type = act.slice(5);
      // Reset op if the new type doesn't support the current one
      const ops = _distOpsFor(CALC_DIST_STATE.type).map(o => o.id);
      if(!ops.includes(CALC_DIST_STATE.op)) CALC_DIST_STATE.op = 'pdf';
      CALC_DIST_STATE.result = null;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    if(act.startsWith('op-')){
      CALC_DIST_STATE.op = act.slice(3);
      CALC_DIST_STATE.result = null;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    if(act === 'compute'){
      CALC_DIST_STATE.result = _distCompute();
      calcRenderUI();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    }
  });
}
