/* ==== src/js/features/calc/calc-table.js ==== */
/* features/calc/calc-table.js — Table mode (fx-8200 style)

   Tabulates a user-supplied real-valued expression f(x) over a range
   [start, end] with a constant step. Computed via the existing
   calcEvaluate() pipeline, so every feature supported in Calculate mode
   (functions, constants, variables other than x) is supported here too.
   Bound variable defaults to x but can be any single letter in
   CALC_STATE.vars (saved/restored around each row so table evaluation
   doesn't clobber user state).

   Output rows feed the grid and can be piped into Statistics mode's
   2-var data grid via the "Send to Stats" button — useful for fitting
   regression curves to a tabulated function. */

/** Factory for the Table state shape. Shared with reset/restore. */
function _calcTableDefaults(){
  return {
    expr:  'x^2',            // expression of the bound variable
    varN:  'x',              // bound variable name
    start: '-5',
    end:   '5',
    step:  '1',
    rows:  [],               // [{x:number, y:number|NaN, err:string|null}]
    error: null              // top-level error (e.g. bad bounds)
  };
}

const CALC_TABLE_STATE = _calcTableDefaults();

/** Fields persisted via the session snapshot. Shared with persistence.js
 *  so the save and restore paths can't drift when the state shape grows.
 *  Computed `rows` and `error` are excluded — they can be regenerated. */
const CALC_TABLE_PERSIST_FIELDS = ['expr','varN','start','end','step'];

/** Resets runtime Table state in place. */
function resetCalcTableState(){
  const d = _calcTableDefaults();
  CALC_TABLE_STATE.expr  = d.expr;
  CALC_TABLE_STATE.varN  = d.varN;
  CALC_TABLE_STATE.start = d.start;
  CALC_TABLE_STATE.end   = d.end;
  CALC_TABLE_STATE.step  = d.step;
  CALC_TABLE_STATE.rows  = d.rows;
  CALC_TABLE_STATE.error = d.error;
}

/** Evaluates the bounds/step strings via calcEvaluate so users can type
 *  expressions like pi or 2^10. Returns null on bad input. */
function _tableEvalNumber(s){
  if(typeof calcEvaluate !== 'function') return null;
  const r = calcEvaluate(String(s == null ? '' : s));
  return (r.ok && r.value != null && Number.isFinite(r.value)) ? r.value : null;
}

/** Builds the (x, f(x)) rows by binding the loop variable, evaluating
 *  the expression, and restoring the prior var value afterwards. Caps
 *  rows at 1000 to prevent UI stalls from accidental tiny steps. */
function calcTableCompute(){
  CALC_TABLE_STATE.rows  = [];
  CALC_TABLE_STATE.error = null;

  const name = String(CALC_TABLE_STATE.varN || 'x').trim() || 'x';
  // Tabulation requires a loop-variable slot — must be a single ASCII
  // letter (Ans is read-only, so anything multi-char is rejected even if
  // it somehow already existed in CALC_STATE.vars).
  if(!/^[A-Za-z]$/.test(name)){
    CALC_TABLE_STATE.error = 'Variable must be a single letter';
    return;
  }
  if(typeof CALC_STATE === 'undefined' ||
     !Object.prototype.hasOwnProperty.call(CALC_STATE.vars, name)){
    CALC_TABLE_STATE.error = 'Unknown variable: ' + name;
    return;
  }

  const start = _tableEvalNumber(CALC_TABLE_STATE.start);
  const end   = _tableEvalNumber(CALC_TABLE_STATE.end);
  const step  = _tableEvalNumber(CALC_TABLE_STATE.step);
  if(start == null || end == null || step == null){
    CALC_TABLE_STATE.error = 'Bad bounds or step';
    return;
  }
  if(step === 0){
    CALC_TABLE_STATE.error = 'Step cannot be zero';
    return;
  }
  // Infer direction automatically so `start > end` with a positive step
  // walks backwards instead of immediately terminating.
  const signedStep = (end < start) ? -Math.abs(step) : Math.abs(step);
  // Scale-aware epsilon used for both row counting and the final-row
  // snap. Needed because endpoint-aligned inputs like start=0, end=0.3,
  // step=0.1 produce 2.999...9 when divided, which Math.floor would
  // undercount to 2 and drop the intended final row at 0.3.
  const eps = Math.max(Math.abs(signedStep), 1) * 1e-9;
  const count = Math.floor((Math.abs(end - start) + eps) / Math.abs(step)) + 1;
  if(count > 1000){
    CALC_TABLE_STATE.error = 'Too many rows (' + count + ') — increase step';
    return;
  }

  const expr = String(CALC_TABLE_STATE.expr || '').trim();
  if(!expr){ CALC_TABLE_STATE.error = 'Empty expression'; return; }

  const saved = CALC_STATE.vars[name];
  try {
    for(let i = 0; i < count; i++){
      let x = start + i * signedStep;
      // Snap the final row to `end` when float drift put us within eps,
      // so displayed tables finish exactly where the user requested.
      if(i === count - 1 && Math.abs(x - end) < eps) x = end;
      CALC_STATE.vars[name] = x;
      const r = calcEvaluate(expr);
      CALC_TABLE_STATE.rows.push({
        x,
        y:   r.ok ? r.value : NaN,
        err: r.ok ? null    : (r.error || 'Err')
      });
    }
  } finally {
    CALC_STATE.vars[name] = saved;
  }
}

/** Copies the current table into Statistics mode as 2-var data, then
 *  navigates to Stats. Only finite (x,y) pairs are kept.
 *
 *  Recomputes the table before export so inputs edited since the last
 *  Generate press can't ship stale rows. If the recompute surfaces a
 *  bounds/expression error, the UI refreshes with that error rather
 *  than silently sending nothing. */
function calcTableSendToStats(){
  if(typeof CALC_STATS_STATE === 'undefined') return;
  calcTableCompute();
  if(CALC_TABLE_STATE.error){
    calcRenderUI();
    if(typeof showToast === 'function') showToast('Fix inputs first: ' + CALC_TABLE_STATE.error);
    return;
  }
  const pairs = CALC_TABLE_STATE.rows
    .filter(r => Number.isFinite(r.x) && Number.isFinite(r.y))
    .map(r => ({ x: String(r.x), y: String(r.y), freq: '1' }));
  if(!pairs.length){
    if(typeof showToast === 'function') showToast('No finite rows to send');
    return;
  }
  CALC_STATS_STATE.mode    = '2var';
  CALC_STATS_STATE.rows    = pairs;
  CALC_STATS_STATE.results = null;
  // Switch mode BEFORE scheduling autosave so the persisted CALC_STATE.mode
  // reflects where the user actually ended up, not the intermediate 'table'.
  CALC_STATE.mode = 'statistics';
  if(typeof calcRenderUI   === 'function') calcRenderUI();
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
  if(typeof showToast      === 'function') showToast(`Sent ${pairs.length} rows to Stats`);
}

function _tableFmt(v){
  if(v == null || Number.isNaN(v)) return '—';
  if(typeof calcFormatResult === 'function') return calcFormatResult(v);
  return String(v);
}

function calcRenderTable(){
  const fs = (typeof CALC_STATE !== 'undefined' && CALC_STATE.fullscreen) ? ' calc-fs' : '';
  const rows = CALC_TABLE_STATE.rows;
  let body = '';
  if(CALC_TABLE_STATE.error){
    body = `<div class="st-empty" style="color:var(--err);">${_escCalc(CALC_TABLE_STATE.error)}</div>`;
  } else if(!rows.length){
    body = '<div class="st-empty">Enter expression and range, then press Generate</div>';
  } else {
    const trs = rows.map((r, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${_tableFmt(r.x)}</td>
        <td>${r.err ? `<span style="color:var(--err);">${_escCalc(r.err)}</span>` : _tableFmt(r.y)}</td>
      </tr>`).join('');
    body = `
      <table>
        <thead><tr><th>#</th><th>${_escCalc(CALC_TABLE_STATE.varN)}</th><th>f(${_escCalc(CALC_TABLE_STATE.varN)})</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>`;
  }

  const P = CALC_TABLE_STATE;
  return `
    <div class="calc-wrap calc-table${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Table</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="dt-params" style="grid-template-columns:repeat(4,1fr);">
        <label class="dt-p" style="grid-column:span 4;">
          <span class="dt-plabel">f(${_escCalc(P.varN)}) =</span>
          <input class="dt-pinput tb-expr" data-tkey="expr" value="${_escCalc(P.expr)}">
        </label>
        <label class="dt-p">
          <span class="dt-plabel">var</span>
          <input class="dt-pinput" data-tkey="varN" value="${_escCalc(P.varN)}" maxlength="1" pattern="[A-Za-z]">
        </label>
        <label class="dt-p">
          <span class="dt-plabel">start</span>
          <input class="dt-pinput" data-tkey="start" value="${_escCalc(P.start)}">
        </label>
        <label class="dt-p">
          <span class="dt-plabel">end</span>
          <input class="dt-pinput" data-tkey="end" value="${_escCalc(P.end)}">
        </label>
        <label class="dt-p">
          <span class="dt-plabel">step</span>
          <input class="dt-pinput" data-tkey="step" value="${_escCalc(P.step)}">
        </label>
      </div>
      <div class="dt-actions" style="justify-content:space-between;">
        <button class="st-btn" data-act="send-stats" title="Send finite rows into Statistics 2-Var">→ Send to Stats</button>
        <button class="st-btn st-btn-p" data-act="compute">Generate</button>
      </div>
      <div class="st-table">${body}</div>
    </div>`;
}

function calcWireTable(){
  const panel = document.querySelector('#calc-p .calc-table');
  if(!panel || panel._wired) return;
  panel._wired = true;

  panel.addEventListener('input', e => {
    const inp = e.target.closest('.dt-pinput');
    if(!inp) return;
    const key = inp.dataset.tkey;
    if(key && Object.prototype.hasOwnProperty.call(CALC_TABLE_STATE, key)){
      CALC_TABLE_STATE[key] = inp.value;

    }
  });

  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    if(btn.dataset.act === 'compute'){
      calcTableCompute();
      calcRenderUI();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    } else if(btn.dataset.act === 'send-stats'){
      calcTableSendToStats();
    }
  });
}

/* ==== src/js/features/calc/calc-complex.js ==== */
/* features/calc/calc-complex.js — Complex arithmetic mode

   Dedicated shunting-yard evaluator for expressions over the complex
   numbers. Does NOT share calcEvaluate's RPN engine — that one operates
   on scalars and promoting every op to {re, im} would regress Calculate-
   mode performance. Instead this file ships a small self-contained
   parser specialized for complex values.

   Supports:
     - literals:   numeric (2, 3.5, 1e-3), pure imaginary (i, 2i, 3.5i)
     - binary ops: + − × ÷ ^ (real exponents only)
     - unary:      -x, conj(x)
     - functions:  abs, arg, re, im, sqrt, exp, ln, conj
     - constants:  pi, e, i
     - grouping:   ( )

   Result display toggles between rectangular (a+bi) and polar (r∠θ).
   Angle units follow CALC_STATE.angle (deg | rad). */

function _calcComplexDefaults(){
  return {
    input:  '(2+3i)*(1-i)',
    form:   'rect',          // 'rect' | 'polar'
    result: null              // { re, im, err } once computed
  };
}

const CALC_COMPLEX_STATE = _calcComplexDefaults();

/** Snapshot whitelist shared with persistence.js. `result` is excluded —
 *  it can be recomputed from `input` on demand. */
const CALC_COMPLEX_PERSIST_FIELDS = ['input','form'];

function resetCalcComplexState(){
  const d = _calcComplexDefaults();
  CALC_COMPLEX_STATE.input  = d.input;
  CALC_COMPLEX_STATE.form   = d.form;
  CALC_COMPLEX_STATE.result = d.result;
}

/* ── COMPLEX ARITHMETIC PRIMITIVES ─────────────────────────── */

function _cx(re, im){ return { re, im: im || 0 }; }
function _cxAdd(a, b){ return _cx(a.re + b.re, a.im + b.im); }
function _cxSub(a, b){ return _cx(a.re - b.re, a.im - b.im); }
function _cxMul(a, b){
  return _cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
}
function _cxDiv(a, b){
  const d = b.re * b.re + b.im * b.im;
  if(d === 0) throw new Error('Division by zero');
  return _cx((a.re * b.re + a.im * b.im) / d,
             (a.im * b.re - a.re * b.im) / d);
}
function _cxNeg(a){ return _cx(-a.re, -a.im); }
function _cxAbs(a){ return Math.hypot(a.re, a.im); }
function _cxArgRad(a){ return Math.atan2(a.im, a.re); }
function _cxConj(a){ return _cx(a.re, -a.im); }
function _cxExp(a){
  const k = Math.exp(a.re);
  return _cx(k * Math.cos(a.im), k * Math.sin(a.im));
}
function _cxLn(a){
  const r = _cxAbs(a);
  if(r === 0) throw new Error('ln(0)');
  return _cx(Math.log(r), _cxArgRad(a));
}
function _cxSqrt(a){
  // Principal branch via half-angle
  const r = Math.sqrt(_cxAbs(a));
  const t = _cxArgRad(a) / 2;
  return _cx(r * Math.cos(t), r * Math.sin(t));
}
function _cxPowReal(a, n){
  // a^n for real n via polar form. General a^b would need _cxExp(_cxMul(b,_cxLn(a)))
  // but the parser restricts exponents to real literals for this release.
  if(!Number.isFinite(n)) throw new Error('Bad exponent');
  if(a.re === 0 && a.im === 0){
    if(n === 0) return _cx(1, 0);
    if(n < 0) throw new Error('0 raised to negative');
    return _cx(0, 0);
  }
  const r = Math.pow(_cxAbs(a), n);
  const t = _cxArgRad(a) * n;
  return _cx(r * Math.cos(t), r * Math.sin(t));
}

const _CX_FUNCTIONS = {
  abs:  a => _cx(_cxAbs(a), 0),
  arg:  a => {
    const rad = _cxArgRad(a);
    return _cx(CALC_STATE.angle === 'deg' ? rad * 180 / Math.PI : rad, 0);
  },
  re:   a => _cx(a.re, 0),
  im:   a => _cx(a.im, 0),
  conj: _cxConj,
  sqrt: _cxSqrt,
  exp:  _cxExp,
  ln:   _cxLn
};
const _CX_CONSTANTS = { pi: _cx(Math.PI, 0), e: _cx(Math.E, 0), i: _cx(0, 1) };

/* ── TOKENIZER ─────────────────────────────────────────────── */

function _cxTokenize(src){
  const tokens = [];
  let i = 0;
  while(i < src.length){
    const c = src[i];
    if(c === ' '){ i++; continue; }

    if(/[0-9.]/.test(c)){
      const m = src.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
      if(!m) throw new Error('Bad number near: ' + src.slice(i, i+4));
      const n = Number(m[0]);
      i += m[0].length;
      // Trailing 'i' → pure imaginary literal (3i, 2.5i, 1e-3i)
      if(src[i] === 'i' && !/[a-zA-Z0-9_]/.test(src[i+1] || '')){
        tokens.push({ type:'num', value: _cx(0, n) });
        i++;
      } else {
        tokens.push({ type:'num', value: _cx(n, 0) });
      }
      continue;
    }

    if(/[a-zA-Z_]/.test(c)){
      let j = i;
      while(j < src.length && /[a-zA-Z0-9_]/.test(src[j])) j++;
      const name = src.slice(i, j);
      tokens.push({ type:'ident', value: name });
      i = j; continue;
    }

    if('+-*/^(),'.indexOf(c) >= 0){
      tokens.push({ type:'op', value: c });
      i++; continue;
    }
    if(c === '×'){ tokens.push({type:'op', value:'*'}); i++; continue; }
    if(c === '÷'){ tokens.push({type:'op', value:'/'}); i++; continue; }
    if(c === '−'){ tokens.push({type:'op', value:'-'}); i++; continue; }

    throw new Error('Unexpected character: ' + c);
  }
  return tokens;
}

/* ── SHUNTING-YARD ─────────────────────────────────────────── */

const _CX_PREC = { '+':1, '-':1, '*':2, '/':2, 'u-':3, '^':4 };
const _CX_RIGHT = { '^':true, 'u-':true };

function _cxToRPN(tokens){
  const out = [];
  const stack = [];
  let prev = null;
  for(let i = 0; i < tokens.length; i++){
    const t = tokens[i];
    // Implicit multiplication: num/ident/) followed by num/ident/( inserts *
    if(prev){
      const leftIsVal = (prev.type === 'num' || prev.type === 'ident' ||
                        (prev.type === 'op' && prev.value === ')'));
      const rightIsVal = (t.type === 'num' || t.type === 'ident' ||
                         (t.type === 'op' && t.value === '('));
      // Skip when prev was a function call that just opened '('
      const prevIsFn = prev.type === 'ident' && Object.prototype.hasOwnProperty.call(_CX_FUNCTIONS, prev.value);
      if(leftIsVal && rightIsVal && !(prevIsFn && t.type === 'op' && t.value === '(')){
        while(stack.length){
          const top = stack[stack.length - 1];
          if(top.type === 'op' && top.value !== '(' &&
             (_CX_PREC[top.value] || 0) >= _CX_PREC['*']){
            out.push(stack.pop());
          } else break;
        }
        stack.push({ type:'op', value:'*' });
      }
    }

    if(t.type === 'num'){ out.push(t); prev = t; continue; }

    if(t.type === 'ident'){
      const isFn = Object.prototype.hasOwnProperty.call(_CX_FUNCTIONS, t.value);
      if(isFn && tokens[i+1] && tokens[i+1].type === 'op' && tokens[i+1].value === '('){
        stack.push({ type:'fn', value: t.value });
      } else {
        // constant or error deferred to eval
        out.push({ type:'var', value: t.value });
      }
      prev = t; continue;
    }

    if(t.type === 'op'){
      const op = t.value;
      if(op === '('){ stack.push(t); prev = t; continue; }
      if(op === ')'){
        while(stack.length && !(stack[stack.length-1].type === 'op' && stack[stack.length-1].value === '(')){
          out.push(stack.pop());
        }
        if(!stack.length) throw new Error('Mismatched parens');
        stack.pop();
        if(stack.length && stack[stack.length-1].type === 'fn') out.push(stack.pop());
        prev = t; continue;
      }
      if(op === ','){
        while(stack.length && !(stack[stack.length-1].type === 'op' && stack[stack.length-1].value === '(')){
          out.push(stack.pop());
        }
        prev = t; continue;
      }
      let actual = op;
      if(op === '-' && (!prev || (prev.type === 'op' && prev.value !== ')'))) actual = 'u-';
      // Unary minus is a prefix operator: push it directly without
      // draining higher-precedence ops first, so `2^-2` parses as
      // `2 ^ (-2)` instead of popping `^` before the RHS is emitted.
      if(actual === 'u-'){
        stack.push({ type:'op', value: actual });
        prev = t;
        continue;
      }
      while(stack.length){
        const top = stack[stack.length-1];
        if(top.type !== 'op' || top.value === '(') break;
        const tp = _CX_PREC[top.value] || 0;
        const cp = _CX_PREC[actual] || 0;
        if(tp > cp || (tp === cp && !_CX_RIGHT[actual])) out.push(stack.pop());
        else break;
      }
      stack.push({ type:'op', value: actual });
      prev = t; continue;
    }
  }
  while(stack.length){
    const top = stack.pop();
    if(top.type === 'op' && (top.value === '(' || top.value === ')')) throw new Error('Mismatched parens');
    out.push(top);
  }
  return out;
}

/* ── EVALUATOR ─────────────────────────────────────────────── */

function _cxEvalRPN(rpn){
  const s = [];
  for(const t of rpn){
    if(t.type === 'num'){ s.push(t.value); continue; }
    if(t.type === 'var'){
      if(Object.prototype.hasOwnProperty.call(_CX_CONSTANTS, t.value)){ s.push(_CX_CONSTANTS[t.value]); continue; }
      throw new Error('Unknown name: ' + t.value);
    }
    if(t.type === 'fn'){
      const fn = _CX_FUNCTIONS[t.value];
      if(!fn) throw new Error('Unknown function: ' + t.value);
      if(!s.length) throw new Error('Bad call to ' + t.value);
      s.push(fn(s.pop()));
      continue;
    }
    if(t.type === 'op'){
      const op = t.value;
      if(op === 'u-'){
        if(!s.length) throw new Error('Bad unary -');
        s.push(_cxNeg(s.pop())); continue;
      }
      if(s.length < 2) throw new Error('Bad op ' + op);
      const b = s.pop(), a = s.pop();
      switch(op){
        case '+': s.push(_cxAdd(a, b)); break;
        case '-': s.push(_cxSub(a, b)); break;
        case '*': s.push(_cxMul(a, b)); break;
        case '/': s.push(_cxDiv(a, b)); break;
        case '^':
          if(b.im !== 0) throw new Error('Complex exponent not supported');
          s.push(_cxPowReal(a, b.re));
          break;
        default: throw new Error('Bad op: ' + op);
      }
    }
  }
  if(s.length !== 1) throw new Error('Malformed expression');
  return s[0];
}

/** Public API — parse, evaluate, return {ok, value:{re,im}, error}. */
function calcEvaluateComplex(src){
  try {
    const tokens = _cxTokenize(String(src || ''));
    const rpn    = _cxToRPN(tokens);
    const v      = _cxEvalRPN(rpn);
    if(!Number.isFinite(v.re) || !Number.isFinite(v.im)){
      return { ok:false, value:null, error:'Non-finite result' };
    }
    return { ok:true, value:v, error:null };
  } catch(e){
    return { ok:false, value:null, error: e.message };
  }
}

/* ── FORMATTING ────────────────────────────────────────────── */

function _cxFmtNum(n){
  if(typeof calcFormatResult === 'function') return calcFormatResult(n);
  return String(n);
}

function _cxFormatRect(v){
  if(!v) return '—';
  const re = v.re, im = v.im;
  const reStr = _cxFmtNum(re);
  if(im === 0) return reStr;
  const imAbs  = Math.abs(im);
  const imStr  = imAbs === 1 ? 'i' : _cxFmtNum(imAbs) + 'i';
  if(re === 0) return (im < 0 ? '-' : '') + imStr;
  return reStr + (im < 0 ? ' − ' : ' + ') + imStr;
}

function _cxFormatPolar(v){
  if(!v) return '—';
  const r = Math.hypot(v.re, v.im);
  let theta = Math.atan2(v.im, v.re);
  if(CALC_STATE.angle === 'deg') theta = theta * 180 / Math.PI;
  return _cxFmtNum(r) + ' ∠ ' + _cxFmtNum(theta) + (CALC_STATE.angle === 'deg' ? '°' : ' rad');
}

/* ── UI ────────────────────────────────────────────────────── */

function calcRenderComplex(){
  const fs = (typeof CALC_STATE !== 'undefined' && CALC_STATE.fullscreen) ? ' calc-fs' : '';
  const S = CALC_COMPLEX_STATE;

    } else {

      // actually swaps the output instead of just re-styling a row.
      const isPolar = S.form === 'polar';

      out = `
        <div class="cx-results">
          <div class="cx-row on"><span class="cx-rk">${label}</span><span class="cx-rv">${_escCalc(value)}</span></div>
        </div>`;
    }
  }

  return `
    <div class="calc-wrap calc-complex${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Complex</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="st-modebar">
        <button class="st-pill${S.form==='rect'?' on':''}"  data-act="form-rect">a + bi</button>
        <button class="st-pill${S.form==='polar'?' on':''}" data-act="form-polar">r ∠ θ</button>
        <div style="flex:1"></div>
        <span style="font-size:10px;color:var(--fg3);letter-spacing:.08em;">fns: abs arg re im conj sqrt exp ln</span>
      </div>
      <div class="dt-params" style="grid-template-columns:1fr;">
        <label class="dt-p">
          <span class="dt-plabel">expression</span>
          <input class="dt-pinput cx-expr" data-ckey="input" value="${_escCalc(S.input)}">
        </label>
      </div>
      <div class="dt-actions">
        <button class="st-btn st-btn-p" data-act="evaluate">Evaluate</button>
      </div>
      <div class="dt-result">${out}</div>
    </div>`;
}

function calcWireComplex(){
  const panel = document.querySelector('#calc-p .calc-complex');
  if(!panel || panel._wired) return;
  panel._wired = true;

  panel.addEventListener('input', e => {
    const inp = e.target.closest('.dt-pinput');
    if(!inp) return;
    if(inp.dataset.ckey === 'input'){
      CALC_COMPLEX_STATE.input = inp.value;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    }
  });

  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act === 'form-rect' || act === 'form-polar'){
      CALC_COMPLEX_STATE.form = act === 'form-polar' ? 'polar' : 'rect';
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    if(act === 'evaluate'){
      const r = calcEvaluateComplex(CALC_COMPLEX_STATE.input);
      CALC_COMPLEX_STATE.result = r.ok
        ? { re: r.value.re, im: r.value.im, err: null }
        : { re: NaN, im: NaN, err: r.error };
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
    }
  });
}

/* ==== src/js/features/calc/calc-vector.js ==== */
/* features/calc/calc-vector.js — Vector mode (fx-8200 style)

   Three editable vector slots (VctA, VctB, VctC), each 2 or 3 dimensions.
   Operations:
     Dot A·B        — scalar (any equal-dimension pair)
     Cross A×B      — 3D vector (both inputs must be 3-component)
     |A|            — magnitude
     Â              — unit vector
     Angle(A, B)    — in CALC_STATE.angle units
     A + B, A − B   — element-wise
     scalar * A     — scale each component
   Successful scalar results flow into CALC_STATE.vars.Ans so the number
   can be reused in Calculate mode. */

function _calcVectorDefaults(){
  return {
    dim:  3,                                  // 2 | 3
    vecs: {
      A: { x:'1', y:'0', z:'0' },
      B: { x:'0', y:'1', z:'0' },
      C: { x:'0', y:'0', z:'1' }
    },
    op:      'dot',                           // see _VEC_OPS below
    scalar:  '2',                             // for scalar * A
    leftVar: 'A',                             // primary operand
    rightVar:'B',                             // secondary operand (for binary ops)
    result:  null                             // { kind:'scalar'|'vector', value, label, err }
  };
}

const CALC_VECTOR_STATE = _calcVectorDefaults();
const CALC_VECTOR_PERSIST_FIELDS = ['dim','vecs','op','scalar','leftVar','rightVar'];

/** Resets runtime Vector state in place. */
function resetCalcVectorState(){
  const d = _calcVectorDefaults();
  CALC_VECTOR_STATE.dim      = d.dim;
  CALC_VECTOR_STATE.vecs     = d.vecs;
  CALC_VECTOR_STATE.op       = d.op;
  CALC_VECTOR_STATE.scalar   = d.scalar;
  CALC_VECTOR_STATE.leftVar  = d.leftVar;
  CALC_VECTOR_STATE.rightVar = d.rightVar;
  CALC_VECTOR_STATE.result   = d.result;
}

/* ── OP TABLE ────────────────────────────────────────────── */

const _VEC_OPS = [
  { id:'dot',    label:'A · B',       binary:true,  scalarArg:false, produces:'scalar' },
  { id:'cross',  label:'A × B (3D)',  binary:true,  scalarArg:false, produces:'vector' },
  { id:'add',    label:'A + B',       binary:true,  scalarArg:false, produces:'vector' },
  { id:'sub',    label:'A − B',       binary:true,  scalarArg:false, produces:'vector' },
  { id:'mag',    label:'|A|',         binary:false, scalarArg:false, produces:'scalar' },
  { id:'unit',   label:'Â (unit)',    binary:false, scalarArg:false, produces:'vector' },
  { id:'angle',  label:'∠(A, B)',     binary:true,  scalarArg:false, produces:'scalar' },
  { id:'scale',  label:'k · A',       binary:false, scalarArg:true,  produces:'vector' }
];

/* ── COMPUTATION ─────────────────────────────────────────── */

function _vecEvalComponent(s){
  if(typeof calcEvaluate !== 'function') return Number(s);
  const r = calcEvaluate(String(s == null ? '0' : s));
  return (r.ok && r.value != null && Number.isFinite(r.value)) ? r.value : NaN;
}

/** Materializes a named vector slot as a numeric array of length dim. */
function _vecGet(name){
  const slot = CALC_VECTOR_STATE.vecs[name];
  if(!slot) throw new Error('Unknown vector: ' + name);
  const dim = CALC_VECTOR_STATE.dim;
  const comps = ['x','y','z'].slice(0, dim).map(k => _vecEvalComponent(slot[k]));
  if(comps.some(v => !Number.isFinite(v))) throw new Error('Bad component in ' + name);
  return comps;
}

function _vecDot(a, b){ let s = 0; for(let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
function _vecMag(a){ return Math.sqrt(_vecDot(a, a)); }
function _vecAdd(a, b){ return a.map((v, i) => v + b[i]); }
function _vecSub(a, b){ return a.map((v, i) => v - b[i]); }
function _vecScale(k, a){ return a.map(v => k * v); }
function _vecUnit(a){
  const m = _vecMag(a);
  if(m === 0) throw new Error('Zero vector has no direction');
  return a.map(v => v / m);
}
function _vecCross3(a, b){
  return [
    a[1]*b[2] - a[2]*b[1],
    a[2]*b[0] - a[0]*b[2],
    a[0]*b[1] - a[1]*b[0]
  ];
}
function _vecAngle(a, b){
  const ma = _vecMag(a), mb = _vecMag(b);
  if(ma === 0 || mb === 0) throw new Error('Angle undefined for zero vector');
  let cos = _vecDot(a, b) / (ma * mb);
  if(cos >  1) cos =  1;
  if(cos < -1) cos = -1;
  const rad = Math.acos(cos);
  return (typeof CALC_STATE !== 'undefined' && CALC_STATE.angle === 'deg')
    ? rad * 180 / Math.PI
    : rad;
}

function calcVectorCompute(){
  try {
    const opDef = _VEC_OPS.find(o => o.id === CALC_VECTOR_STATE.op);
    if(!opDef) throw new Error('Unknown op');
    const L = _vecGet(CALC_VECTOR_STATE.leftVar);
    const R = opDef.binary ? _vecGet(CALC_VECTOR_STATE.rightVar) : null;

    if(opDef.id === 'cross' && CALC_VECTOR_STATE.dim !== 3){
      throw new Error('Cross product requires 3D vectors');
    }
    if(opDef.binary && R.length !== L.length){
      throw new Error('Dimension mismatch');
    }

    let value, kind;
    switch(opDef.id){
      case 'dot':   kind = 'scalar'; value = _vecDot(L, R); break;
      case 'cross': kind = 'vector'; value = _vecCross3(L, R); break;
      case 'add':   kind = 'vector'; value = _vecAdd(L, R); break;
      case 'sub':   kind = 'vector'; value = _vecSub(L, R); break;
      case 'mag':   kind = 'scalar'; value = _vecMag(L); break;
      case 'unit':  kind = 'vector'; value = _vecUnit(L); break;
      case 'angle': kind = 'scalar'; value = _vecAngle(L, R); break;
      case 'scale': {
        const k = _vecEvalComponent(CALC_VECTOR_STATE.scalar);
        if(!Number.isFinite(k)) throw new Error('Bad scalar');
        kind = 'vector'; value = _vecScale(k, L); break;
      }
      default: throw new Error('Unhandled op: ' + opDef.id);
    }

    CALC_VECTOR_STATE.result = { kind, value, label: opDef.label, err: null };
    // Scalar results flow into Ans so Calculate mode can consume them.
    if(kind === 'scalar' && typeof CALC_STATE !== 'undefined' &&
       Object.prototype.hasOwnProperty.call(CALC_STATE.vars, 'Ans')){
      CALC_STATE.vars.Ans = value;
    }
  } catch(e){
    CALC_VECTOR_STATE.result = { kind:null, value:null, label:null, err: e.message };
  }
}

/* ── UI ──────────────────────────────────────────────────── */

function _vecFmt(n){
  if(typeof calcFormatResult === 'function') return calcFormatResult(n);
  return String(n);
}

function _vecRenderSlot(name){
  const slot = CALC_VECTOR_STATE.vecs[name];
  const dim = CALC_VECTOR_STATE.dim;
  const axes = ['x','y','z'].slice(0, dim);
  const cells = axes.map(ax =>
    `<input class="vc-cell" data-vname="${name}" data-vaxis="${ax}" value="${_escCalc(slot[ax])}" inputmode="decimal">`
  ).join('');
  return `
    <div class="vc-slot">
      <div class="vc-slot-hdr">Vct ${name}</div>
      <div class="vc-slot-cells" style="grid-template-columns:repeat(${dim},1fr);">${cells}</div>
    </div>`;
}

function calcRenderVector(){
  const fs = (typeof CALC_STATE !== 'undefined' && CALC_STATE.fullscreen) ? ' calc-fs' : '';
  const S = CALC_VECTOR_STATE;
  const opDef = _VEC_OPS.find(o => o.id === S.op) || _VEC_OPS[0];
  const opPills = _VEC_OPS.map(o =>
    `<button class="st-pill${S.op===o.id?' on':''}" data-act="op-${o.id}">${o.label}</button>`
  ).join('');

  let resultHtml = '<div class="st-empty">Edit vectors, pick an op, press Compute</div>';
  if(S.result){
    if(S.result.err){
      resultHtml = `<div class="st-empty" style="color:var(--err);">${_escCalc(S.result.err)}</div>`;
    } else if(S.result.kind === 'scalar'){
      resultHtml = `
        <div class="dt-rlabel">${_escCalc(S.result.label)}</div>
        <div class="dt-rvalue">${_escCalc(_vecFmt(S.result.value))}</div>`;
    } else {
      const parts = S.result.value.map(v => _escCalc(_vecFmt(v))).join(', ');
      resultHtml = `
        <div class="dt-rlabel">${_escCalc(S.result.label)}</div>
        <div class="dt-rvalue">[ ${parts} ]</div>`;
    }
  }

  const scalarRow = opDef.scalarArg
    ? `<label class="dt-p"><span class="dt-plabel">scalar k</span><input class="dt-pinput" data-ckey="scalar" value="${_escCalc(S.scalar)}"></label>`
    : '';
  const rightSel = opDef.binary
    ? `<label class="dt-p"><span class="dt-plabel">right</span>
         <select class="dt-pinput" data-ckey="rightVar">
           <option value="A"${S.rightVar==='A'?' selected':''}>A</option>
           <option value="B"${S.rightVar==='B'?' selected':''}>B</option>
           <option value="C"${S.rightVar==='C'?' selected':''}>C</option>
         </select></label>`
    : '';

  return `
    <div class="calc-wrap calc-vector${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Vector</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="st-modebar">
        <button class="st-pill${S.dim===2?' on':''}" data-act="dim-2">2D</button>
        <button class="st-pill${S.dim===3?' on':''}" data-act="dim-3">3D</button>
        <div style="flex:1"></div>
        <span style="font-size:10px;color:var(--fg3);">Scalar result → Ans</span>
      </div>
      <div class="vc-slots">
        ${_vecRenderSlot('A')}
        ${_vecRenderSlot('B')}
        ${_vecRenderSlot('C')}
      </div>
      <div class="st-modebar" style="flex-wrap:wrap;">${opPills}</div>
      <div class="dt-params" style="grid-template-columns:repeat(3,1fr);">
        <label class="dt-p">
          <span class="dt-plabel">left</span>
          <select class="dt-pinput" data-ckey="leftVar">
            <option value="A"${S.leftVar==='A'?' selected':''}>A</option>
            <option value="B"${S.leftVar==='B'?' selected':''}>B</option>
            <option value="C"${S.leftVar==='C'?' selected':''}>C</option>
          </select>
        </label>
        ${rightSel}
        ${scalarRow}
      </div>
      <div class="dt-actions">
        <button class="st-btn st-btn-p" data-act="compute">Compute</button>
      </div>
      <div class="dt-result">${resultHtml}</div>
    </div>`;
}

function calcWireVector(){
  const panel = document.querySelector('#calc-p .calc-vector');
  if(!panel || panel._wired) return;
  panel._wired = true;

  /** Stale result after the user has edited inputs reads as a lie — wipe
   *  both the stored value and the visible DOM so a new Compute press is
   *  required before any number reappears. */
  const clearResult = () => {
    CALC_VECTOR_STATE.result = null;
    const out = panel.querySelector('.dt-result');
    if(out) out.innerHTML = '<div class="st-empty">Edit vectors, pick an op, press Compute</div>';
  };

  // Vector component cells (live-edit)
  panel.addEventListener('input', e => {
    const cell = e.target.closest('.vc-cell');
    if(cell){
      const name = cell.dataset.vname, axis = cell.dataset.vaxis;
      if(CALC_VECTOR_STATE.vecs[name]) CALC_VECTOR_STATE.vecs[name][axis] = cell.value;
      clearResult();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      return;
    }
    const inp = e.target.closest('.dt-pinput');
    if(inp && inp.dataset.ckey){
      const key = inp.dataset.ckey;
      if(key === 'leftVar' || key === 'rightVar' || key === 'scalar'){
        CALC_VECTOR_STATE[key] = inp.value;
        clearResult();
        if(typeof scheduleAutosave === 'function') scheduleAutosave();
      }
    }
  });

  panel.addEventListener('change', e => {
    const sel = e.target.closest('select.dt-pinput');
    if(!sel) return;
    const key = sel.dataset.ckey;
    if(key === 'leftVar' || key === 'rightVar'){
      CALC_VECTOR_STATE[key] = sel.value;
      clearResult();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    }
  });

  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act === 'dim-2' || act === 'dim-3'){
      CALC_VECTOR_STATE.dim = act === 'dim-2' ? 2 : 3;
      CALC_VECTOR_STATE.result = null;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    if(act.startsWith('op-')){
      CALC_VECTOR_STATE.op = act.slice(3);
      CALC_VECTOR_STATE.result = null;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    if(act === 'compute'){
      calcVectorCompute();
      calcRenderUI();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    }
  });
}

/* ==== src/js/features/calc/calc-spreadsheet.js ==== */
/* features/calc/calc-spreadsheet.js — Spreadsheet mode (fx-8200 style)

   5 columns (A–E) × 10 rows grid. Each cell is either:
     - empty
     - a literal value ("42", "-3.5", "pi", "sqrt(2)")
     - a formula "=<expression>" where the expression can reference other
       cells by name (A1, B7), or ranges via SUM / MEAN / MIN / MAX /
       PRODUCT / COUNT over a range like A1:A5 or B2:D2.

   Evaluation is demand-driven with memoization, tracking the visit
   stack so cycles (A1=B1, B1=A1) surface as an error instead of
   stack-overflowing. Non-range functions and bare cell refs go through
   the main calcEvaluate pipeline so every Calculate-mode function is
   available (sin, log, etc.).

   We store both the raw text (authoritative) and the last computed
   value (cache). Typing in any cell invalidates all values and redraws
   the display layer with fresh numbers. */

const SHEET_COLS = ['A','B','C','D','E'];
const SHEET_ROWS = 10;

function _sheetFreshCells(){
  const cells = {};
  for(const col of SHEET_COLS){
    for(let r = 1; r <= SHEET_ROWS; r++){
      cells[col + r] = '';
    }
  }
  return cells;
}

function _calcSheetDefaults(){
  return {
    cells: _sheetFreshCells(),
    sel:   'A1',          // currently-focused cell
    computed: null         // populated by calcSheetRecompute, not persisted
  };
}

const CALC_SHEET_STATE = _calcSheetDefaults();
const CALC_SHEET_PERSIST_FIELDS = ['cells','sel'];

function resetCalcSheetState(){
  const d = _calcSheetDefaults();
  CALC_SHEET_STATE.cells    = d.cells;
  CALC_SHEET_STATE.sel      = d.sel;
  CALC_SHEET_STATE.computed = d.computed;
}

/* ── EVALUATION ──────────────────────────────────────────── */

const _SHEET_RANGE_FNS = {
  SUM:     arr => arr.reduce((a,b) => a + b, 0),
  MEAN:    arr => arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : NaN,
  AVERAGE: arr => arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : NaN,
  MIN:     arr => arr.length ? Math.min.apply(null, arr) : NaN,
  MAX:     arr => arr.length ? Math.max.apply(null, arr) : NaN,
  PRODUCT: arr => arr.reduce((a,b) => a * b, 1),
  COUNT:   arr => arr.filter(v => Number.isFinite(v)).length
};

/** Expands a range like 'A1:B3' into an array of cell refs. Returns null
 *  when the range endpoints aren't both valid cells. */
function _sheetExpandRange(spec){
  const m = /^([A-E])(\d+)\s*:\s*([A-E])(\d+)$/i.exec(spec);
  if(!m) return null;
  const c0 = SHEET_COLS.indexOf(m[1].toUpperCase());
  const c1 = SHEET_COLS.indexOf(m[3].toUpperCase());
  const r0 = +m[2], r1 = +m[4];
  if(c0 < 0 || c1 < 0 || r0 < 1 || r1 < 1 || r0 > SHEET_ROWS || r1 > SHEET_ROWS) return null;
  const out = [];
  const [cl, ch] = c0 <= c1 ? [c0, c1] : [c1, c0];
  const [rl, rh] = r0 <= r1 ? [r0, r1] : [r1, r0];
  for(let c = cl; c <= ch; c++){
    for(let r = rl; r <= rh; r++) out.push(SHEET_COLS[c] + r);
  }
  return out;
}

/** Resolves a cell reference recursively with cycle detection. Returns
 *  a finite number or NaN. Fills `cache` and `errors` objects keyed by
 *  cell ref as a side effect for the whole sheet render. */
function _sheetResolve(ref, visiting, cache, errors){
  if(Object.prototype.hasOwnProperty.call(cache, ref)) return cache[ref];
  if(visiting.has(ref)){
    // Mark every cell participating in the cycle, not just the entry
    // point — otherwise A1=B1, B1=A1 reports one cell as circular and
    // the other as "Non-finite", which is confusing.
    for(const cycRef of visiting){
      errors[cycRef] = 'Circular reference';
      cache[cycRef]  = NaN;
    }
    errors[ref] = 'Circular reference';
    cache[ref]  = NaN;
    return NaN;
  }
  const raw = String(CALC_SHEET_STATE.cells[ref] || '').trim();
  if(!raw){ cache[ref] = NaN; return NaN; }
  visiting.add(ref);
  let val = NaN;
  try {
    const expr = raw.startsWith('=') ? raw.slice(1) : raw;
    val = _sheetEvalExpr(expr, visiting, cache, errors);
    if(!Number.isFinite(val)) errors[ref] = errors[ref] || 'Non-finite';
  } catch(e){
    errors[ref] = e.message || 'Err';
    val = NaN;
  } finally {
    visiting.delete(ref);
  }
  cache[ref] = val;
  return val;
}

/** Evaluates an expression (no leading '=') in the sheet context.
 *  Range functions are resolved first (they're sheet-specific and the
 *  main evaluator doesn't know about cell refs), then remaining cell
 *  references are substituted with their resolved values, and finally
 *  the result string is handed to calcEvaluate. */
function _sheetEvalExpr(expr, visiting, cache, errors){
  // 1) Expand range functions: e.g. SUM(A1:A5) → numeric literal.
  //    Propagates circular-reference errors from referenced cells so the
  //    caller reports the real cause instead of a generic "Non-finite".
  let out = expr.replace(/\b([A-Z]+)\s*\(\s*([A-E]\d+\s*:\s*[A-E]\d+)\s*\)/gi, (m, fnName, range) => {
    const fn = _SHEET_RANGE_FNS[fnName.toUpperCase()];
    if(!fn) return m; // leave for calcEvaluate to reject
    const refs = _sheetExpandRange(range);
    if(!refs) throw new Error('Bad range: ' + range);
    const vals = [];
    for(const r of refs){
      const v = _sheetResolve(r, visiting, cache, errors);
      if(errors[r] === 'Circular reference') throw new Error('Circular reference');
      if(Number.isFinite(v)) vals.push(v);
    }
    const result = fn(vals);
    return '(' + (Number.isFinite(result) ? result : 'NaN') + ')';
  });

  // 2) Substitute bare cell refs A1..E10 with their numeric values.
  //    Avoid consuming the letter 'e' in scientific notation by requiring
  //    a word boundary and a digit that's not the exponent form (e.g.
  //    "1e5" is a number literal, "E5" at a boundary is a cell).
  // Case-insensitive so `=a1+1` behaves the same as `=A1+1`. The range
  // regex above is already /gi, so this keeps the two paths consistent.
  out = out.replace(/(^|[^a-zA-Z0-9_])([A-E])(\d+)/gi, (m, pre, col, rowDigits) => {
    const row = +rowDigits;
    if(row < 1 || row > SHEET_ROWS) return m;
    const ref = col.toUpperCase() + row;
    const v = _sheetResolve(ref, visiting, cache, errors);
    if(errors[ref] === 'Circular reference') throw new Error('Circular reference');
    return pre + '(' + (Number.isFinite(v) ? v : 'NaN') + ')';
  });

  if(typeof calcEvaluate !== 'function') throw new Error('Evaluator unavailable');
  const r = calcEvaluate(out);
  if(!r.ok) throw new Error(r.error || 'Bad expression');
  return r.value;
}

/** Walks every cell and resolves it. Returns { cache, errors } keyed by
 *  cell ref. Safe to call on every redraw; the demand-driven resolver
 *  shares work via the cache within a single pass. */
function calcSheetRecompute(){
  const cache  = {};
  const errors = {};
  for(const col of SHEET_COLS){
    for(let r = 1; r <= SHEET_ROWS; r++){
      _sheetResolve(col + r, new Set(), cache, errors);
    }
  }
  CALC_SHEET_STATE.computed = { cache, errors };
  return CALC_SHEET_STATE.computed;
}

/* ── UI ──────────────────────────────────────────────────── */

function _sheetFmt(v){
  if(!Number.isFinite(v)) return '';
  if(typeof calcFormatResult === 'function') return calcFormatResult(v);
  return String(v);
}

function calcRenderSheet(){
  const fs = (typeof CALC_STATE !== 'undefined' && CALC_STATE.fullscreen) ? ' calc-fs' : '';
  const { cache, errors } = calcSheetRecompute();
  const S = CALC_SHEET_STATE;

  // Column headers
  const thead = `<tr><th class="sh-idx"></th>${SHEET_COLS.map(c => `<th>${c}</th>`).join('')}</tr>`;

  // Rows: each cell renders the computed value by default and the raw
  // text when it's the selected cell (so the user edits the formula).
  let rows = '';
  for(let r = 1; r <= SHEET_ROWS; r++){
    let row = `<tr><th class="sh-idx">${r}</th>`;
    for(const col of SHEET_COLS){
      const ref = col + r;
      const raw = S.cells[ref] || '';
      const err = errors[ref];
      const val = cache[ref];
      const selected = S.sel === ref;
      const cls = ['sh-cell'];
      if(selected) cls.push('sel');
      if(err) cls.push('err');
      if(raw.startsWith('=')) cls.push('formula');
      const shownValue = err ? '#ERR' : _sheetFmt(val);
      const shown = selected ? _escCalc(raw) : _escCalc(shownValue);
      row += `<td class="${cls.join(' ')}" data-ref="${ref}" title="${_escCalc(raw)}${err?' — '+_escCalc(err):''}">${shown || '&nbsp;'}</td>`;
    }
    row += '</tr>';
    rows += row;
  }

  const selRaw = S.cells[S.sel] || '';
  return `
    <div class="calc-wrap calc-sheet${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Spreadsheet</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="sh-formulabar">
        <span class="sh-selref">${_escCalc(S.sel)}</span>
        <input class="sh-finput" data-skey="formula" value="${_escCalc(selRaw)}" placeholder="= expression or value (e.g. =SUM(A1:A5))">
      </div>
      <div class="sh-gridwrap">
        <table class="sh-grid">
          <thead>${thead}</thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="st-modebar">
        <button class="st-btn" data-act="clear">Clear sheet</button>
        <div style="flex:1"></div>
        <span style="font-size:10px;color:var(--fg3);">fns: SUM MEAN MIN MAX PRODUCT COUNT</span>
      </div>
    </div>`;
}

function calcWireSheet(){
  const panel = document.querySelector('#calc-p .calc-sheet');
  if(!panel || panel._wired) return;
  panel._wired = true;

  // Click a cell → select it; if already selected, re-select (no-op).
  panel.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(btn && btn.dataset.act === 'clear'){
      if(typeof confirm === 'function' && !confirm('Clear entire sheet?')) return;
      CALC_SHEET_STATE.cells = _sheetFreshCells();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    const cell = e.target.closest('.sh-cell');
    if(!cell) return;
    CALC_SHEET_STATE.sel = cell.dataset.ref;
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
    calcRenderUI();
    // Focus the formula bar so typing immediately edits
    const bar = document.querySelector('#calc-p .sh-finput');
    if(bar){ bar.focus(); bar.select(); }
  });

  // Formula bar edits the selected cell
  panel.addEventListener('input', e => {
    const inp = e.target.closest('.sh-finput');
    if(!inp) return;
    CALC_SHEET_STATE.cells[CALC_SHEET_STATE.sel] = inp.value;
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
    // Re-render so computed values in other cells update — but preserve
    // caret position in the formula bar by refocusing after render.
    const cursor = inp.selectionStart;
    calcRenderUI();
    const bar = document.querySelector('#calc-p .sh-finput');
    if(bar){ bar.focus(); try { bar.setSelectionRange(cursor, cursor); } catch(_){} }
  });

  // Arrow navigation in the formula bar — Enter moves down, Tab moves right
  panel.addEventListener('keydown', e => {
    const bar = e.target.closest('.sh-finput');
    if(!bar) return;
    const [col, rowStr] = [CALC_SHEET_STATE.sel[0], CALC_SHEET_STATE.sel.slice(1)];
    const row = +rowStr;
    const ci = SHEET_COLS.indexOf(col);
    let next = null;
    if(e.key === 'Enter')      next = SHEET_COLS[ci] + Math.min(SHEET_ROWS, row + 1);
    else if(e.key === 'Tab')   next = SHEET_COLS[Math.min(SHEET_COLS.length - 1, ci + 1)] + row;
    if(next){
      e.preventDefault();
      CALC_SHEET_STATE.sel = next;
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      const b2 = document.querySelector('#calc-p .sh-finput');
      if(b2){ b2.focus(); b2.select(); }
    }
  });
}

/* ==== src/js/features/calc/calc-inequality.js ==== */
/* features/calc/calc-inequality.js — Inequality mode (fx-8200 style)

   Solves linear and quadratic inequalities in a single variable and
   presents the solution set in interval notation, inequality notation,
   and a small number-line SVG. Closes the last HOME tile on the
   calculator's mode grid.

   Supported shapes:
     Linear:    a·x + b  <op>  0      where op ∈ { <, ≤, >, ≥ }
     Quadratic: a·x² + b·x + c  <op>  0

   Coefficients accept any calcEvaluate expression (pi, sqrt(2), etc.)
   so classroom problems written symbolically don't need to be
   pre-simplified.

   Output convention: solutions always returned relative to the left-
   hand-side being on the less-than side of the operator, matching how
   textbooks present the canonical form. A zero leading coefficient
   falls through to the next-lower degree (e.g. quadratic with a=0 is
   treated as linear) rather than erroring. */

function _calcIneqDefaults(){
  return {
    degree: 'linear',      // 'linear' | 'quadratic'
    op:     '<',           // '<' | '<=' | '>' | '>='
    // Coefficient inputs — strings so the user can type expressions.
    a: '1',
    b: '0',
    c: '0',
    variable: 'x',
    result: null           // set by calcInequalitySolve; see shape below
  };
}

const CALC_INEQ_STATE = _calcIneqDefaults();
const CALC_INEQ_PERSIST_FIELDS = ['degree','op','a','b','c','variable'];

/** Resets the runtime state in place. Called from widgetState's reset
 *  path so "New Session" starts with a fresh inequality example. */
function resetCalcInequalityState(){
  const d = _calcIneqDefaults();
  for(const k of Object.keys(d)) CALC_INEQ_STATE[k] = d[k];
}

/* ── MATH ─────────────────────────────────────────────── */

/** Flips the direction of an inequality when multiplying/dividing by a
 *  negative value. Keeps the strict/non-strict bit intact. */
function _ineqFlipOp(op){
  return { '<':'>', '<=':'>=', '>':'<', '>=':'<=' }[op] || op;
}

/** Renders op as its Unicode symbol for display. */
function _ineqOpSym(op){
  return { '<':'<', '<=':'≤', '>':'>', '>=':'≥' }[op] || op;
}

/** True when the operator allows equality at the boundary. */
function _ineqIncludesBoundary(op){
  return op === '<=' || op === '>=';
}

/** Evaluates a coefficient cell through the main evaluator so users
 *  can paste expressions. Returns a finite number or NaN. */
function _ineqEvalCoef(s){
  if(typeof calcEvaluate !== 'function') return Number(s);
  const r = calcEvaluate(String(s == null ? '0' : s));
  return (r.ok && r.value != null && Number.isFinite(r.value)) ? r.value : NaN;
}

/** Solves a·x + b (op) 0. Returns a structured result, never throws.
 *  Handles a=0 (constant inequality, either always-true or no-solution)
 *  and negative a (flip op). */
function _ineqSolveLinear(a, b, op){
  if(!Number.isFinite(a) || !Number.isFinite(b)){
    return { kind: 'error', message: 'Bad coefficient' };
  }
  // Scale-aware zero check — mirrors the quadratic solver so symbolic
  // residue (e.g. cos(pi/2) ≈ 6e-17) collapses to a constant inequality
  // instead of dividing through and emitting a threshold near 1e16.
  // Scaling by |a| itself (in addition to |b|) guarantees a legitimate
  // small coefficient like 1e-13 can't be swept into the degenerate
  // branch when b=1 — only values indistinguishable from zero at this
  // magnitude's float resolution are collapsed.
  const aEps = Number.EPSILON * Math.max(1, Math.abs(a), Math.abs(b));
  if(Math.abs(a) <= aEps){
    // Constant inequality: 0·x + b ≷ 0 reduces to b ≷ 0. Classify b's
    // sign with the same epsilon treatment so symbolic residuals like
    // sin(pi) ≈ 1.22e-16 don't register as positive and flip an
    // all-reals answer into a no-solution (or vice-versa).
    const bEps = Number.EPSILON * Math.max(1, Math.abs(b));
    const bSign = Math.abs(b) <= bEps ? 0 : (b > 0 ? 1 : -1);
    const truthy = (op === '<'  && bSign <  0) ||
                   (op === '<=' && bSign <= 0) ||
                   (op === '>'  && bSign >  0) ||
                   (op === '>=' && bSign >= 0);
    return {
      kind: 'linear',
      a: 0, b, op,
      solution: truthy ? { type: 'all' } : { type: 'none' }
    };
  }
  // Divide both sides by a; flip op when a < 0.
  const threshold = -b / a;
  const effectiveOp = (a < 0) ? _ineqFlipOp(op) : op;
  const leftOf = (effectiveOp === '<' || effectiveOp === '<=');
  return {
    kind: 'linear',
    a, b, op,
    effectiveOp,
    solution: {
      type: 'ray',                       // one-sided ray
      direction: leftOf ? 'below' : 'above',
      threshold,
      inclusive: _ineqIncludesBoundary(effectiveOp)
    }
  };
}

/** Solves a·x² + b·x + c (op) 0. Degenerate a=0 cases delegate to the
 *  linear solver. Non-degenerate cases branch on the discriminant:
 *    Δ > 0 → two distinct real roots, parabola crosses zero twice
 *    Δ = 0 → repeated root (parabola touches x-axis tangentially)
 *    Δ < 0 → no real roots (parabola sits entirely above or below)
 *  The sign of a then determines which side of the roots satisfies.
 *
 *  Uses scale-aware epsilons rather than strict === 0 / < 0 / > 0 so
 *  coefficients entered symbolically (pi, sqrt(2), 1/3) don't misclassify
 *  as quadratic-with-microscopic-a or non-zero-discriminant just
 *  because floating-point evaluation leaves 1e-16 residue. */
function _ineqSolveQuadratic(a, b, c, op){
  if(!Number.isFinite(a) || !Number.isFinite(b) || !Number.isFinite(c)){
    return { kind: 'error', message: 'Bad coefficient' };
  }
  // Tolerance for a ≈ 0 — indistinguishable-from-zero at this row of
  // coefficients' float resolution. Small-but-real a (e.g. 1e-13 when
  // b = 1) now stays on the quadratic branch instead of being swept
  // into the degenerate linear path.
  const aEps = Number.EPSILON * Math.max(1, Math.abs(a), Math.abs(b), Math.abs(c));
  if(Math.abs(a) <= aEps) return _ineqSolveLinear(b, c, op);

  const disc = b * b - 4 * a * c;
  // Discriminant tolerance bounded to the catastrophic-cancellation
  // floor of b² − 4ac. 16·EPSILON gives a few ULP of headroom so a
  // genuine double root like (x − π)² — where symbolic evaluation of
  // b² and 4ac leaves ~1e-14 residue at magnitude 40 — still collapses
  // cleanly, while a small real interval like x² − 1e-11 (disc = 4e-11)
  // stays on the distinct-roots branch.
  const dEps = 16 * Number.EPSILON * Math.max(1, b * b, Math.abs(4 * a * c));
  const wantLess = (op === '<' || op === '<=');
  const inclusive = _ineqIncludesBoundary(op);

  if(disc < -dEps){
    // Parabola never touches x-axis. Sign at x=0 is c; the overall
    // sign of a·x² + b·x + c matches sign(a) for all x when there are
    // no real roots.
    const sign = a > 0 ? 1 : -1;
    const alwaysTrue  = (sign > 0 && !wantLess) || (sign < 0 && wantLess);
    // For the non-strict cases (≤, ≥) equality is unreachable when
    // Δ<0, so the strict and non-strict forms coincide.
    return {
      kind: 'quadratic', a, b, c, op, disc,
      solution: alwaysTrue ? { type: 'all' } : { type: 'none' }
    };
  }

  // Clamp small-negative disc up to zero so sqrt doesn't go NaN on
  // a near-double-root that landed just inside dEps.
  const sqrtDisc = Math.sqrt(Math.max(0, disc));
  const r1 = (-b - sqrtDisc) / (2 * a);
  const r2 = (-b + sqrtDisc) / (2 * a);
  // Ensure rLo ≤ rHi for consistent rendering.
  const rLo = Math.min(r1, r2);
  const rHi = Math.max(r1, r2);

  // Root-separation guard: scale the threshold to the root magnitudes
  // so distinct roots spaced at any scale (e.g. rHi − rLo ≈ 6.3e-6 for
  // x² − 1e-11) don't get collapsed into a repeated-root interpretation.
  const rootEps = 8 * Number.EPSILON * Math.max(1, Math.abs(rLo), Math.abs(rHi));
  if(Math.abs(disc) <= dEps || Math.abs(rLo - rHi) <= rootEps){
    // Repeated root. f(x) = a·(x - r)², always same sign as a except
    // exactly at x=r where it's 0. Strict forms have no solution at
    // the root; non-strict include it.
    const root = (rLo + rHi) / 2;
    const sign = a > 0 ? 1 : -1;
    const polarityMatches = (sign > 0 && !wantLess) || (sign < 0 && wantLess);
    if(polarityMatches){
      // Everywhere except possibly the root.
      return {
        kind: 'quadratic', a, b, c, op, disc,
        roots: [root],
        solution: inclusive
          ? { type: 'all' }
          : { type: 'all-except', point: root }
      };
    }
    // Parabola's sign disagrees with the wanted side everywhere except
    // at the root: only {root} (if inclusive) or nothing.
    return {
      kind: 'quadratic', a, b, c, op, disc,
      roots: [root],
      solution: inclusive
        ? { type: 'point', point: root }
        : { type: 'none' }
    };
  }

  // Distinct roots. Between the roots the parabola takes the opposite
  // sign of a; outside it matches sign(a).
  //   a > 0 and wantLess → solution is (rLo, rHi)
  //   a > 0 and wantGreater → solution is (-∞, rLo) ∪ (rHi, ∞)
  //   a < 0 flips both cases.
  const insideMatches = (a > 0 && wantLess) || (a < 0 && !wantLess);
  return {
    kind: 'quadratic', a, b, c, op, disc,
    roots: [rLo, rHi],
    solution: insideMatches
      ? { type: 'interval', lo: rLo, hi: rHi, loInclusive: inclusive, hiInclusive: inclusive }
      : { type: 'union',
          left:  { type: 'ray', direction: 'below', threshold: rLo, inclusive },
          right: { type: 'ray', direction: 'above', threshold: rHi, inclusive } }
  };
}

/** Public solver: runs the selected degree and caches the result on
 *  CALC_INEQ_STATE.result. Always returns the result object so UI code
 *  can refresh without reading state back. */
function calcInequalitySolve(){
  const a = _ineqEvalCoef(CALC_INEQ_STATE.a);
  const b = _ineqEvalCoef(CALC_INEQ_STATE.b);
  const c = _ineqEvalCoef(CALC_INEQ_STATE.c);
  const op = CALC_INEQ_STATE.op;
  const result = CALC_INEQ_STATE.degree === 'quadratic'
    ? _ineqSolveQuadratic(a, b, c, op)
    : _ineqSolveLinear(a, b, op);
  CALC_INEQ_STATE.result = result;
  return result;
}

/* ── RENDER HELPERS ──────────────────────────────────── */

/** Formats a number for display, reusing calcFormatResult when
 *  available so output matches the rest of the calculator. */
function _ineqFmtNum(n){
  if(!Number.isFinite(n)) return '—';
  if(typeof calcFormatResult === 'function') return calcFormatResult(n);
  return String(n);
}

/** Returns {interval, inequality} strings for a solution object. */
function _ineqRenderSolution(sol, varName){
  const v = varName || 'x';
  if(!sol) return { interval: '—', inequality: '—' };
  switch(sol.type){
    case 'all':
      return { interval: '(−∞, ∞)', inequality: `${v} ∈ ℝ` };
    case 'none':
      return { interval: '∅',       inequality: 'no solution' };
    case 'point': {
      const p = _ineqFmtNum(sol.point);
      return { interval: `{${p}}`, inequality: `${v} = ${p}` };
    }
    case 'all-except': {
      const p = _ineqFmtNum(sol.point);
      return { interval: `(−∞, ${p}) ∪ (${p}, ∞)`, inequality: `${v} ≠ ${p}` };
    }
    case 'ray': {
      const t = _ineqFmtNum(sol.threshold);
      if(sol.direction === 'below'){
        return {
          interval:   sol.inclusive ? `(−∞, ${t}]` : `(−∞, ${t})`,
          inequality: `${v} ${sol.inclusive ? '≤' : '<'} ${t}`
        };
      }
      return {
        interval:   sol.inclusive ? `[${t}, ∞)` : `(${t}, ∞)`,
        inequality: `${v} ${sol.inclusive ? '≥' : '>'} ${t}`
      };
    }
    case 'interval': {
      const lo = _ineqFmtNum(sol.lo);
      const hi = _ineqFmtNum(sol.hi);
      const lb = sol.loInclusive ? '[' : '(';
      const rb = sol.hiInclusive ? ']' : ')';
      const opLo = sol.loInclusive ? '≤' : '<';
      const opHi = sol.hiInclusive ? '≤' : '<';
      return {
        interval:   `${lb}${lo}, ${hi}${rb}`,
        inequality: `${lo} ${opLo} ${v} ${opHi} ${hi}`
      };
    }
    case 'union': {
      const L = _ineqRenderSolution(sol.left,  v);
      const R = _ineqRenderSolution(sol.right, v);
      return {
        interval:   `${L.interval} ∪ ${R.interval}`,
        inequality: `${L.inequality}  or  ${R.inequality}`
      };
    }
    default:
      return { interval: '—', inequality: '—' };
  }
}

/** Builds an SVG fragment visualizing the solution on a number line.
 *  Auto-scales around any finite boundary points with 20% padding; when
 *  everything is infinite or empty it draws the axis alone. */
function _ineqRenderNumberLine(sol){
  const W = 360, H = 60, padX = 18, y = 36;
  const axisStart = padX;
  const axisEnd   = W - padX;

  // Collect finite reference points to compute a scale.
  const pts = [];
  const collect = s => {
    if(!s) return;
    if(s.type === 'ray')     pts.push(s.threshold);
    if(s.type === 'interval'){ pts.push(s.lo); pts.push(s.hi); }
    if(s.type === 'point' || s.type === 'all-except') pts.push(s.point);
    if(s.type === 'union'){ collect(s.left); collect(s.right); }
  };
  collect(sol);
  const finite = pts.filter(Number.isFinite);
  let min, max;
  if(finite.length === 0){ min = -1; max = 1; }
  else if(finite.length === 1){ min = finite[0] - 1; max = finite[0] + 1; }
  else { min = Math.min(...finite); max = Math.max(...finite); }
  const span = Math.max(1e-9, max - min);
  const pad  = span * 0.25;
  min -= pad; max += pad;

  const scale = v => axisStart + (v - min) / (max - min) * (axisEnd - axisStart);
  const parts = [];

  // Axis line
  parts.push(`<line x1="${axisStart}" y1="${y}" x2="${axisEnd}" y2="${y}" stroke="var(--fg3)" stroke-width="1.5"/>`);
  // Arrowheads
  parts.push(`<polygon points="${axisStart},${y} ${axisStart + 6},${y - 4} ${axisStart + 6},${y + 4}" fill="var(--fg3)"/>`);
  parts.push(`<polygon points="${axisEnd},${y} ${axisEnd - 6},${y - 4} ${axisEnd - 6},${y + 4}" fill="var(--fg3)"/>`);

  // Shading helpers
  const shadeRange = (x1, x2) => {
    const a = Math.min(x1, x2), b = Math.max(x1, x2);
    return `<rect x="${a}" y="${y - 3}" width="${Math.max(1, b - a)}" height="6" fill="var(--p)" opacity=".35"/>`;
  };
  // Unfilled (open) endpoint uses the darkest calculator surface
  // token so the dot blends into the display background even if the
  // palette changes later. Fallback literal matches the value
  // calculator.css currently hardcodes for .calc-display.
  const dot = (x, filled) => `<circle cx="${x}" cy="${y}" r="5" ${filled ? 'fill="var(--p)"' : 'fill="var(--s1, #0a0b0a)" stroke="var(--p)" stroke-width="2"'}/>`;
  const tick = (x, label) => `
    <line x1="${x}" y1="${y - 6}" x2="${x}" y2="${y + 6}" stroke="var(--fg3)" stroke-width="1"/>
    <text x="${x}" y="${y + 20}" text-anchor="middle" fill="var(--fg2)" font-size="10" font-family="'JetBrains Mono', Menlo, monospace">${label}</text>`;

  const drawSol = s => {
    if(!s) return;
    switch(s.type){
      case 'all':
        parts.push(shadeRange(axisStart, axisEnd));
        break;
      case 'none':
        // axis only
        break;
      case 'point':
        parts.push(dot(scale(s.point), true));
        parts.push(tick(scale(s.point), _ineqFmtNum(s.point)));
        break;
      case 'all-except':
        parts.push(shadeRange(axisStart, axisEnd));
        parts.push(dot(scale(s.point), false));
        parts.push(tick(scale(s.point), _ineqFmtNum(s.point)));
        break;
      case 'ray': {
        const x = scale(s.threshold);
        parts.push(shadeRange(s.direction === 'below' ? axisStart : x,
                              s.direction === 'below' ? x : axisEnd));
        parts.push(dot(x, !!s.inclusive));
        parts.push(tick(x, _ineqFmtNum(s.threshold)));
        break;
      }
      case 'interval': {
        const xl = scale(s.lo), xh = scale(s.hi);
        parts.push(shadeRange(xl, xh));
        parts.push(dot(xl, !!s.loInclusive));
        parts.push(dot(xh, !!s.hiInclusive));
        parts.push(tick(xl, _ineqFmtNum(s.lo)));
        parts.push(tick(xh, _ineqFmtNum(s.hi)));
        break;
      }
      case 'union':
        drawSol(s.left);
        drawSol(s.right);
        break;
    }
  };
  drawSol(sol);

  return `<svg class="iq-number-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Solution on number line">${parts.join('')}</svg>`;
}

/* ── UI ──────────────────────────────────────────────── */

function _iqEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function calcRenderInequality(){
  const fs = (typeof CALC_STATE !== 'undefined' && CALC_STATE.fullscreen) ? ' calc-fs' : '';
  const S  = CALC_INEQ_STATE;
  const degreePill = (id, label) =>
    `<button type="button" class="st-pill${S.degree===id?' on':''}" data-ideg="${id}" aria-pressed="${S.degree===id}">${label}</button>`;
  const opPill = (id, sym) =>
    `<button type="button" class="st-pill${S.op===id?' on':''}" data-iop="${id}" aria-pressed="${S.op===id}">${sym}</button>`;

  const showC = S.degree === 'quadratic';

  let resultHtml = '<div class="st-empty">Enter coefficients and press Solve</div>';
  if(S.result){
    if(S.result.kind === 'error'){
      resultHtml = `<div class="st-empty" style="color:var(--err);">${_iqEsc(S.result.message)}</div>`;
    } else {
      const rend = _ineqRenderSolution(S.result.solution, S.variable || 'x');
      const vEsc = _iqEsc(S.variable || 'x');
      // Build the LHS by piecing together already-escaped fragments so
      // symbolic coefficients preserve their explicit signs. Previously
      // we inferred sign via Number(val), which returns NaN for
      // expressions like "-sqrt(3)" and silently flipped the displayed
      // statement relative to what the solver actually evaluated.
      const lhs = S.degree === 'quadratic'
        ? `${_iqEsc(S.a)}${vEsc}²${_renderSignedTerm(S.b, vEsc)}${_renderSignedTerm(S.c)}`
        : `${_iqEsc(S.a)}${vEsc}${_renderSignedTerm(S.b)}`;
      const rootBits = Array.isArray(S.result.roots) && S.result.roots.length
        ? `<div class="iq-roots">Roots: ${S.result.roots.map(_ineqFmtNum).join(', ')}</div>`
        : '';
      const discBit = (S.degree === 'quadratic' && Number.isFinite(S.result.disc))
        ? `<div class="iq-disc">Δ = ${_ineqFmtNum(S.result.disc)}</div>`
        : '';
      resultHtml = `
        <div class="iq-statement">${lhs} ${_ineqOpSym(S.op)} 0</div>
        <div class="iq-solution-grid">
          <div class="iq-cell"><span class="iq-k">Interval</span><span class="iq-v">${_iqEsc(rend.interval)}</span></div>
          <div class="iq-cell"><span class="iq-k">Inequality</span><span class="iq-v">${_iqEsc(rend.inequality)}</span></div>
        </div>
        ${discBit}${rootBits}
        ${_ineqRenderNumberLine(S.result.solution)}
      `;
    }
  }

  return `
    <div class="calc-wrap calc-inequality${fs}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">Inequality</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="st-modebar" role="group" aria-label="Polynomial degree">
        ${degreePill('linear','Linear')}
        ${degreePill('quadratic','Quadratic')}
        <div style="flex:1"></div>
        <span style="font-size:10px;color:var(--fg3);">Coefficients accept expressions (pi, sqrt(2), …)</span>
      </div>
      <div class="st-modebar" role="group" aria-label="Inequality operator" style="padding-top:0;">
        ${opPill('<',  '<')}
        ${opPill('<=', '≤')}
        ${opPill('>',  '>')}
        ${opPill('>=', '≥')}
      </div>
      <div class="dt-params" style="grid-template-columns:repeat(${showC?4:3},1fr);">
        <label class="dt-p">
          <span class="dt-plabel">a${showC?' (x²)':' (x)'}</span>
          <input class="dt-pinput" data-ikey="a" value="${_iqEsc(S.a)}">
        </label>
        <label class="dt-p">
          <span class="dt-plabel">b${showC?' (x)':' (const)'}</span>
          <input class="dt-pinput" data-ikey="b" value="${_iqEsc(S.b)}">
        </label>
        ${showC ? `<label class="dt-p">
          <span class="dt-plabel">c (const)</span>
          <input class="dt-pinput" data-ikey="c" value="${_iqEsc(S.c)}">
        </label>` : ''}
        <label class="dt-p">
          <span class="dt-plabel">variable</span>
          <input class="dt-pinput" data-ikey="variable" value="${_iqEsc(S.variable)}" maxlength="1" pattern="[A-Za-z]">
        </label>
      </div>
      <div class="dt-actions">
        <button class="st-btn st-btn-p" data-iact="solve">Solve</button>
      </div>
      <div class="dt-result iq-result">${resultHtml}</div>
    </div>`;
}

/** Builds a signed term for the statement display (" + x" / " − x").
 *  Inspects the raw coefficient STRING rather than coercing to a
 *  number, so symbolic expressions like "-sqrt(3)" or " -3" render
 *  with the correct operator instead of being forced to " + " by
 *  Number() returning NaN. Blank coefficients emit " + 0<suffix>" so
 *  the statement still parses visually.
 *
 *  @param {string} val    raw coefficient (typically CALC_INEQ_STATE.{b,c})
 *  @param {string} [suffix]  appended after the coefficient ("" for c,
 *                            the variable for b in quadratic LHS)
 */
function _renderSignedTerm(val, suffix){
  const s = String(val == null ? '' : val).trim();
  const tail = suffix || '';
  if(!s) return ` + 0${tail}`;
  if(s.startsWith('-')) return ` − ${_iqEsc(s.slice(1).trim())}${tail}`;
  if(s.startsWith('+')) return ` + ${_iqEsc(s.slice(1).trim())}${tail}`;
  return ` + ${_iqEsc(s)}${tail}`;
}

function calcWireInequality(){
  const panel = document.querySelector('#calc-p .calc-inequality');
  if(!panel || panel._wired) return;
  panel._wired = true;

  /** Editing any coefficient invalidates the stored result so the
   *  display doesn't claim an answer that belongs to earlier input. */
  const clearResult = () => {
    CALC_INEQ_STATE.result = null;
    const res = panel.querySelector('.iq-result');
    if(res) res.innerHTML = '<div class="st-empty">Enter coefficients and press Solve</div>';
  };

  panel.addEventListener('input', e => {
    const inp = e.target.closest('.dt-pinput');
    if(!inp) return;
    const key = inp.dataset.ikey;
    if(!key) return;
    if(key === 'variable'){
      // Sanitize first, then push the same value into both state and
      // the DOM so invalid keystrokes (digits, symbols, >1 char) don't
      // remain visible in the input while CALC_INEQ_STATE silently
      // ignores them. Falls back to 'x' when the field is cleared so
      // the statement renderer always has a legal name — and the
      // input shows the fallback too, keeping DOM and state aligned.
      const raw = String(inp.value || '').slice(0, 1);
      const safe = /^[A-Za-z]$/.test(raw) ? raw : '';
      const shown = safe || 'x';
      CALC_INEQ_STATE.variable = shown;
      if(inp.value !== shown) inp.value = shown;
    } else if(['a','b','c'].includes(key)){
      CALC_INEQ_STATE[key] = inp.value;
    }
    clearResult();
    if(typeof scheduleAutosave === 'function') scheduleAutosave();
  });

  panel.addEventListener('click', e => {
    const degBtn = e.target.closest('[data-ideg]');
    if(degBtn){
      CALC_INEQ_STATE.degree = degBtn.dataset.ideg === 'quadratic' ? 'quadratic' : 'linear';
      clearResult();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
      calcRenderUI();
      return;
    }
    const opBtn = e.target.closest('[data-iop]');
    if(opBtn){
      // Validate against the same allowed set the persistence restore
      // path uses, so tampered markup can't park CALC_INEQ_STATE.op on
      // an operator the solver doesn't recognize.
      const op = opBtn.dataset.iop;
      if(op === '<' || op === '<=' || op === '>' || op === '>='){
        CALC_INEQ_STATE.op = op;
        clearResult();
        if(typeof scheduleAutosave === 'function') scheduleAutosave();
        calcRenderUI();
      }
      return;
    }
    const act = e.target.closest('[data-iact]');
    if(act && act.dataset.iact === 'solve'){
      calcInequalitySolve();
      calcRenderUI();
      if(typeof scheduleAutosave === 'function') scheduleAutosave();
    }
  });
}

/* ==== src/js/features/calc/calc-ui.js ==== */
/* features/calc/calc-ui.js — ClassWiz-inspired calculator UI
   Mounts into #calc-p widget panel (replaces the legacy basic/scientific
   calculator). HOME screen with 8 mode tiles, Calculate mode with Soulver
   history, SHIFT/ALPHA modifier latches, FUNCTION/CATALOG popovers,
   natural-display template keys, and a fullscreen recording-mode toggle.
*/

const CALC_MODES = [
  { id:'calculate',   icon:'calculate',      label:'Calculate',    ready:true  },
  { id:'statistics',  icon:'monitoring',     label:'Statistics',   ready:true  },
  { id:'distribution',icon:'scatter_plot',   label:'Distribution', ready:true  },
  { id:'table',       icon:'table_view',     label:'Table',        ready:true  },
  { id:'complex',     icon:'extension',      label:'Complex',      ready:true  },
  { id:'vector',      icon:'timeline',       label:'Vector',       ready:true  },
  { id:'spreadsheet', icon:'grid_on',        label:'Spreadsheet',  ready:true  },
  { id:'inequality',  icon:'rule',           label:'Inequality',   ready:true  }
];

/* ── FRESH-RESULT FLAG ───────────────────────────────────────────
   Calculate-mode-only flag that holds the just-evaluated result at
   a large prominent size at the bottom of the display until the
   user begins their next expression. Set true at the tail of
   _calcExecute; cleared on the first forward keystroke (digit /
   operator / function / template / variable insert), on history
   navigation, and on mode changes. Backspace and AC do NOT clear
   the flag — the user may be correcting, and the result should
   remain large until they actually begin a new expression. */
let _calcResultFresh = false;
/** True when AC has been pressed and the display should render as
 *  a blank slate: no history scrollback, no big-result block,
 *  just an empty input row with caret. Cleared on the next
 *  forward-input (digit/op/fn/tmpl), on CLEAR, and on EXE.
 *  Module-scope only — NOT persisted, so a page reload restores
 *  the normal post-EXE display state.
 *  See fix/calc-ac-clean-slate-and-format-per-result. */
let _calcDisplayCleared = false;

/* ── RENDER ENTRY POINT ──────────────────────────────────────── */

/** Renders the entire calculator UI into its container. */
function calcRenderUI(){
  const panel = document.getElementById('calc-p');
  if(!panel) return;

  if(CALC_STATE.mode === 'home'){
    panel.innerHTML = _calcRenderHome();
  } else if(CALC_STATE.mode === 'calculate'){
    panel.innerHTML = _calcRenderCalculate();
    _calcWireKeypad();
    // Calc-redesign Phase 1: v2 header pills (DEG/RAD/BASIC/ADV)
    // and the new utility / action-row stub buttons live outside
    // the .calc-keypad subtree, so the keypad-scoped click
    // delegation in _calcWireKeypad can't see them. _calcWireV2
    // binds a parallel listener on the panel root that routes
    // everything matching .calc-v2 button selectors through
    // _calcV2HandleAct. No-op for the legacy keypad — that wirer
    // skips when calcView !== basic/adv.
    if(typeof _calcWireV2 === 'function') _calcWireV2();
    _calcUpdatePreview();
  } else if(CALC_STATE.mode === 'statistics' && typeof calcRenderStats === 'function'){
    panel.innerHTML = calcRenderStats();
    if(typeof calcWireStats === 'function') calcWireStats();
  } else if(CALC_STATE.mode === 'distribution' && typeof calcRenderDist === 'function'){
    panel.innerHTML = calcRenderDist();
    if(typeof calcWireDist === 'function') calcWireDist();
  } else if(CALC_STATE.mode === 'table' && typeof calcRenderTable === 'function'){
    panel.innerHTML = calcRenderTable();
    if(typeof calcWireTable === 'function') calcWireTable();
  } else if(CALC_STATE.mode === 'complex' && typeof calcRenderComplex === 'function'){
    panel.innerHTML = calcRenderComplex();
    if(typeof calcWireComplex === 'function') calcWireComplex();
  } else if(CALC_STATE.mode === 'vector' && typeof calcRenderVector === 'function'){
    panel.innerHTML = calcRenderVector();
    if(typeof calcWireVector === 'function') calcWireVector();
  } else if(CALC_STATE.mode === 'spreadsheet' && typeof calcRenderSheet === 'function'){
    panel.innerHTML = calcRenderSheet();
    if(typeof calcWireSheet === 'function') calcWireSheet();
  } else if(CALC_STATE.mode === 'inequality' && typeof calcRenderInequality === 'function'){
    panel.innerHTML = calcRenderInequality();
    if(typeof calcWireInequality === 'function') calcWireInequality();
  } else {
    // Coming-soon modes
    panel.innerHTML = _calcRenderComingSoon(CALC_STATE.mode);
  }
  // Re-wire free-drag + resize on every render. calcRenderUI wipes
  // panel.innerHTML which destroys the previous .calc-hdr handle, so
  // the drag listeners need to re-bind on the fresh element every
  // time — mode toggles (DEG/RAD, MathO/DecO), Home navigation, and
  // EXE history recalls all land here but previously only calcMount
  // re-wired, leaving the panel un-draggable after any mode change.
  _calcWireDrag();
}
