function _calcRenderComingSoon(mode){
  const m = CALC_MODES.find(x => x.id === mode) || {};
  return `
    <div class="calc-wrap${CALC_STATE.fullscreen?' calc-fs':''}">
      <div class="calc-hdr">
        <button class="calc-home-btn" onclick="calcGoHome()" title="Home"><span class="ms">apps</span></button>
        <span class="calc-brand hf">${_escCalc(m.label || mode)}</span>
        <button class="calc-x" onclick="togCalc()" title="Close"><span class="ms">close</span></button>
      </div>
      <div class="calc-soon"><span class="ms" style="font-size:48px;color:var(--fg3);">construction</span><div class="hf" style="margin-top:10px;">${_escCalc(m.label || mode)} mode coming soon</div></div>
    </div>`;
}

/** HTML-escape a string for safe use in both element content and quoted
 *  attribute values. Escapes &, <, >, ", and ' so values containing any
 *  quote character cannot break out of a `value="…"` attribute and inject
 *  markup when the template is written via innerHTML. */
function _escCalc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ── KEYPAD WIRING (event delegation) ────────────────────────── */

/** Resolve the key's advertised secondary before modifying input. */
function _calcInsertMathKey(data){
  if(!data.fn && !data.tmpl) return false;
  const shifted = CALC_STATE.shift;
  const fn = shifted && data.shiftFn ? data.shiftFn : data.fn;
  const tmpl = shifted && data.shiftTmpl ? data.shiftTmpl : data.tmpl;
  if(shifted && data.shiftAct){
    _calcV2HandleAct(data.shiftAct);
  } else {
    if(fn) calcInputInsertString(fn + '(');
    else calcInputInsertTemplate(tmpl);
    _afterInput(true);
  }
  CALC_STATE.shift = false;
  if(shifted) calcRenderUI();
  return true;
}

function _calcWireKeypad(){
  const pad = document.querySelector('#calc-p .calc-keypad');
  if(!pad || pad._wired) return;
  pad._wired = true;
  pad.addEventListener('click', e => {
    const btn = e.target.closest('button.ck');
    if(!btn) return;

    // Calc-redesign Phase 1 (Step 2): SHIFT is a one-shot modal —
    // after dispatching ANY non-SHIFT key, the shift flag clears
    // and the math zone reverts. Capture the pre-dispatch flag so
    // a re-render can be triggered after the action commits when
    // shift was armed but no render path ran (e.g. a digit insert
    // takes the _afterInput partial-render path that doesn't redraw
    // the math zone). The 'shift' action itself is excluded — it
    // toggles its own state. Same for 'alpha' which is a separate
    // modifier latch with its own UX.
    /* UNDO/REDO (calc-undo.js): snapshot the input BEFORE the key runs and
     * commit on the next microtask, keeping it only if the input actually
     * changed. Done here — the one funnel every keypad key passes through —
     * rather than inside each mutating function, so no future key can be
     * added without undo support by accident. Guarded by typeof so a stripped
     * bundle without calc-undo.js still dispatches keys normally. */
    if(typeof calcUndoCapture === 'function'){
      const _undoBefore = calcUndoCapture();
      queueMicrotask(() => { try{ calcUndoCommit(_undoBefore); }catch(_){} });
    }

    const _shiftWasArmed = !!CALC_STATE.shift;
    const _shouldAutoClearShift = _shiftWasArmed
      && btn.dataset.act !== 'shift'
      && btn.dataset.act !== 'alpha';
    const _maybeClearShift = () => {
      if(_shouldAutoClearShift){
        CALC_STATE.shift = false;
        // Force a full render so the math zone visual reverts. The
        // partial _afterInput path only updates the input row.
        if(typeof calcRenderUI === 'function') calcRenderUI();
      }
    };

    // _afterInput(true) for forward-input actions (digit / op / fn /
    // template) so the fresh-result display demotes to history when
    // the user begins their next expression. _afterInput() with no
    // arg keeps the fresh display intact for cursor moves, backspace,
    // and AC.
    if(btn.dataset.ins != null){ calcInputInsertString(btn.dataset.ins); _afterInput(true); _maybeClearShift(); return; }
    if(btn.dataset.op){
      // ClassWiz-style chaining: immediately after a successful EXE, tapping
      // a binary operator auto-prefills Ans so 2+3 EXE → × 4 EXE = 20.
      // _shouldAnsChain gates on the armed flag so this only fires in the
      // "next operator press after EXE" window — fresh sessions and
      // post-AC empties do NOT insert Ans.
      if(_shouldAnsChain(btn.dataset.op)){
        calcInputInsertString('Ans');
      }
      calcInputInsertString(btn.dataset.op); _afterInput(true); _maybeClearShift(); return;
    }
    if(_calcInsertMathKey(btn.dataset)){ _maybeClearShift(); return; }

    // Calc-redesign Phase 1: delegate v2-prefixed actions (and
    // angle-deg/angle-rad/view-basic/view-adv) to the v2 handler
    // module before falling through to the legacy switch. Returning
    // true from the handler short-circuits the switch.
    if(btn.dataset.act && typeof _calcV2HandleAct === 'function'){
      if(_calcV2HandleAct(btn.dataset.act, btn)){
        _maybeClearShift();
        return;
      }
    }
    switch(btn.dataset.act){
      case 'shift':  CALC_STATE.shift = !CALC_STATE.shift; calcRenderUI(); break;
      case 'alpha':  CALC_STATE.alpha = !CALC_STATE.alpha; calcRenderUI(); break;
      case 'up':     _calcUpDispatch(); break;
      case 'down':   _calcDownDispatch(); break;
      case 'left':   calcInputLeft(); _afterInput(); break;
      case 'right':  calcInputRight(); _afterInput(); break;
      case 'del':    calcInputBackspace(); _afterInput(); break;
      case 'ac': {
        // Clean-slate AC: clears live input, demotes the fresh
        // result, blanks the display via _calcDisplayCleared,
        // disarms ans-chain, and dismisses any active panel
        // (HISTORY/CATALOG). The history list itself is preserved
        // — that's CLEAR's job.
        //
        // CR PR #124: must call calcRenderUI() for a FULL re-paint
        // — the prior version used _afterInput() which only does
        // partial render (.calc-input + preview) unless it's
        // demoting a fresh result. Without full render the history
        // block + big-result block + active panel stayed on screen
        // after AC. The disarm and clear semantics that
        // _afterInput() also did are inlined here so we get them
        // without the partial-render side effect.
        calcInputClear();
        _calcInputError = '';
        _calcResultFresh = false;
        _calcDisplayCleared = true;
        _calcAnsChainArmed = false;
        if(typeof CALC_STATE !== 'undefined') CALC_STATE.activePanel = null;
        // AC is a clean slate, so it is also an undo boundary — there is no
        // expression left to step back through (calc-undo.js).
        if(typeof calcUndoReset === 'function') calcUndoReset();
        calcRenderUI();
        break;
      }
      // EXE commits the expression to history; undo is input-level only, so
      // the stacks reset rather than letting UNDO walk back across a result.
      case 'exe':    _calcExecute(); if(typeof calcUndoReset === 'function') calcUndoReset(); break;
      case 'angle':  CALC_STATE.angle = CALC_STATE.angle === 'deg' ? 'rad' : 'deg'; calcRenderUI(); _calcUpdatePreview(); _calcAutosave(); break;
      case 'frac':   CALC_STATE.fractions = !CALC_STATE.fractions; calcRenderUI(); _calcUpdatePreview(); _calcAutosave(); break;
      case 'sd':     _calcToggleSD(); break;
      case 'func':   _calcShowFunctionMenu(); break;
      case 'var':    _calcShowVarMenu(); break;
    }
    // SHIFT auto-clear after any non-SHIFT/non-ALPHA action that
    // landed in the legacy switch (or that fell through unrecognized).
    _maybeClearShift();
  });
}

/** Request a debounced persistence autosave. Called after any CALC_STATE
 *  mutation so toggles (angle/fractions), variable assignments, and mode
 *  switches survive a session close without waiting for the next EXE. */
function _calcAutosave(){
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

/** Armed ONLY immediately after a successful EXE. Gates the Ans
 *  auto-prefill so that fresh sessions (Ans initialized to 0) and
 *  post-AC empty lines do NOT silently insert Ans when the user
 *  presses an operator. The flag goes true at the tail of
 *  _calcExecute and false as soon as _afterInput runs after any
 *  subsequent keystroke — so the chaining window is exactly "the
 *  next operator press after EXE, before any other input". */
let _calcAnsChainArmed = false;
let _calcInputError = '';

/** Re-render input area + preview without rebuilding whole keypad.
 *  Also closes the Ans-chain window: anything the user does after
 *  EXE — digits, templates, arrows, AC, another operator — lands
 *  here and disarms, so a later operator press on a freshly-empty
 *  line (AC then +) does NOT re-insert Ans.
 *
 *  `forward` flag (default false): set by callers that represent a
 *  forward-input action (digit / operator / function / template /
 *  variable insert). When forward=true and the calculator is in the
 *  fresh-result state (just pressed EXE), clear the flag and do a
 *  full calcRenderUI so the prior result demotes from the large
 *  bottom block back into the small history list above. Backspace,
 *  AC, and arrow-key callers pass forward=false (the default) so
 *  the result stays large while the user corrects or moves the
 *  cursor.                                                          */
function _afterInput(forward){
  _calcInputError = '';
  const error = document.querySelector('#calc-p .calc-input-error');
  if(error) error.remove();
  // Forward-input also un-suppresses an AC-cleared display so the
  // first character after AC reveals the input row normally.
  if(forward && _calcDisplayCleared){
    _calcDisplayCleared = false;
  }
  if(forward && _calcResultFresh && CALC_STATE.mode === 'calculate'){
    _calcResultFresh = false;
    // Full re-render rebuilds the display in default layout. The
    // current input (now containing the new char that triggered
    // this call) carries through via _calcRenderCalculate reading
    // calcRenderCurrent(). _calcAnsChainArmed is also reset by
    // calcRenderUI's render flow.
    _calcAnsChainArmed = false;
    calcRenderUI();
    return;
  }
  const inp = document.querySelector('#calc-p .calc-input');
  if(inp) inp.innerHTML = calcRenderCurrent() || '<span class="ct-caret"></span>';
  _calcUpdatePreview();
  _calcAnsChainArmed = false;
}

/** True when CALC_INPUT has no atoms at the root — fresh line after
 *  EXE / AC / brand new session. Used to drive the Ans auto-prefill
 *  heuristic on operator presses. */
function _calcInputIsEmpty(){
  return !CALC_INPUT || !Array.isArray(CALC_INPUT.atoms) || CALC_INPUT.atoms.length === 0;
}

/** True when a stored Ans value is available to chain against. Treats
 *  0 as a valid Ans so "2-2 = 0, then × 5" still works. Note this
 *  only informs _shouldAnsChain() alongside the armed flag — the
 *  flag gate is what ensures fresh-session Ans=0 doesn't chain. */
function _calcHasAns(){
  return CALC_STATE && CALC_STATE.vars && CALC_STATE.vars.Ans !== undefined && CALC_STATE.vars.Ans !== null;
}

/** Single predicate for both keypad and keyboard operator handlers.
 *  Requires: armed post-EXE, input cleared, stored Ans exists, and
 *  the pressed operator is binary. Keeping this in one place means
 *  the chaining rule can't drift between the two input paths. */
function _shouldAnsChain(op){
  return _calcAnsChainArmed && _calcInputIsBinaryOp(op) && _calcInputIsEmpty() && _calcHasAns();
}

/** True for operator characters that take a left-hand operand. `!` and
 *  `%` are postfix (they read what's already to their left) so they
 *  should NOT trigger Ans prefill — pressing ! on an empty input is
 *  already a parse error, and Ans! would silently change its meaning.
 *
 *  Unary-minus edge case: `-` is still classified as binary here,
 *  matching ClassWiz — after EXE the user explicitly presses AC to
 *  clear the Ans-chain arming before typing a negative literal like
 *  -5. This preserves the common "4 EXE, subtract 7" path
 *  (Ans-7 = -3) at the cost of making "enter -5 fresh after EXE"
 *  require one AC tap first. Revisit if users report this as
 *  frequent friction.                                                */
function _calcInputIsBinaryOp(op){
  return op === '+' || op === '-' || op === '*' || op === '/' || op === '^';
}

function _calcUpdatePreview(){
  const prev = document.getElementById('calc-preview');
  if(!prev) return;
  const expr = calcSerialize();
  if(!expr.trim()){ prev.textContent = ''; return; }
  const r = calcEvaluate(expr);
  prev.textContent = r.ok ? '= ' + r.decimal : '';
}

function _calcExecute(){
  const expr = calcSerialize();
  if(!expr.trim()) return;
  const r = calcEvaluate(expr);
  if(!r.ok){
    _calcInputError = 'Math error: ' + (r.error === 'Math error' ? 'outside the real-number domain' : (r.error || 'bad expression'));
    _calcResultFresh = false;
    calcRenderUI();
    if(typeof showToast === 'function') showToast(_calcInputError);
    return;
  }
  CALC_STATE.vars.Ans = r.value;
  _calcInputError = '';
  // Arm the Ans-chain window. The next operator press (keypad or
  // keyboard) will auto-insert Ans; any other input (digit / template
  // / arrow / AC / backspace) disarms via _afterInput. This is what
  // makes "Ans chaining" a post-EXE-only behavior instead of firing
  // on every empty-input operator press.
  _calcAnsChainArmed = true;
  // Record explicit replay metadata so history recall doesn't have to
  // reverse-engineer the input string. 'expr' entries store the parser-
  // safe serialization (not the display form, which emits syntax like
  // `Σ[i=1..10](i^2)` that the tokenizer can't consume). We reuse the
  // `expr` from above rather than calling calcSerialize again — a second
  // call would register placeholder IDs that never get consumed by an
  // evaluate pass, leaking entries into _CALC_PLACEHOLDERS.
  const flat       = _calcFlattenInput();            // display form, for UI
  const isCalculus = /[Σ∑Π∏∫]|\bd\/d[a-zA-Z]/.test(flat);
  const lit = (r.decimal && !r.decimal.includes('/')) ? r.decimal : String(r.value);
  CALC_STATE.history.push({
    input:    flat,
    syntaxVersion: 2,
    value:    r.value,
    decimal:  r.decimal,
    /* feat/calc-format-dms-render: per-result DMS toggle. New
     * entries default to false; the v2-dms handler flips this
     * on the LAST entry. _calcFormatDisplay reads it on every
     * render. */
    dmsActive: false,
    /* CR feedback: snapshot the angle mode at evaluate time so
     * DMS formatting later (after a user toggles deg↔rad) still
     * uses the unit the calculation was actually performed in.
     * Without this, sin(45) in deg → 0.707, then user switches
     * to rad, then presses DMS on that entry — the formatter
     * would treat 0.707 as a radian value and convert wrong. */
    angle:    CALC_STATE.angle,
    replay:   isCalculus
      ? { type:'literal', value: '(' + lit + ')' }
      : { type:'expr',    value: expr }
  });
  // Reset the history nav cursor so the next Up press walks back from
  // the newest entry instead of a stale browsed position.
  _calcHistIdx = -1;
  // Cap history
  if(CALC_STATE.history.length > 50) CALC_STATE.history.shift();
  calcInputClear();
  // Mark the just-pushed result as the freshly-displayed entry so
  // the renderer below shows it as a large bottom block instead of
  // a small history row. _calcExecute is only reachable from
  // Calculate mode (gated by both the keypad EXE button and the
  // keyboard listener), so the flag is implicitly mode-scoped.
  _calcResultFresh = true;
  // New result un-suppresses any prior AC clean-slate so the
  // big-result block renders normally.
  _calcDisplayCleared = false;
  calcRenderUI();
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

/** Returns a readable, persistence-safe string for the current expression
 *  (used for history entries and session snapshots). Uses the display-form
 *  serializer so calculus templates emit their human-readable shape
 *  (e.g. `Σ[i=1..10](i^2)`) rather than transient placeholder IDs that
 *  expire after the current evaluation. */
function _calcFlattenInput(){
  const s = (typeof calcSerializeDisplay === 'function' ? calcSerializeDisplay() : calcSerialize());
  // Try to strip synthetic outer parens the template emitter added
  return s.replace(/^\(([^()]*)\)$/, '$1');
}

let _calcHistIdx = -1;

/** Clears the calculator history list. Triggered by the manual
 *  Clear button in the Calculate-mode header. Resets the fresh-
 *  result flag (the .calc-result-large block was reading from
 *  history.slice(-1) — without history that block has nothing to
 *  show) and the history-nav cursor. Persists via scheduleAutosave
 *  so the cleared state survives reload. Intentionally preserves
 *  CALC_STATE.vars.Ans — teacher cleared visible history but is
 *  still working, the Ans-chain affordance should remain usable.
 *  startRecordingSession (recordingState.js) is the path that
 *  resets Ans alongside history for "truly fresh session". */
function calcClearHistory(){
  if(typeof CALC_STATE === 'undefined') return;
  CALC_STATE.history = [];
  _calcResultFresh = false;
  // CLEAR empties history; the natural empty-history render path
  // handles the display. Resetting this flag avoids carrying
  // a stale clean-slate flag past CLEAR.
  _calcDisplayCleared = false;
  _calcHistIdx = -1;
  // Disarm the Ans-chain window. _calcAnsChainArmed is set true at
  // the tail of _calcExecute; without this reset, a prior EXE
  // could leave the flag armed across the clear and the next
  // operator press would auto-insert Ans against an empty history
  // (or a zeroed Ans on the recording-start path). Cleaner to
  // disarm — the user gets the chain back on their next EXE.
  _calcAnsChainArmed = false;
  if(typeof CALC_STATE.mode !== 'undefined') calcRenderUI();
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

/** Restores a history entry into the current input. Prefers the entry's
 *  explicit replay metadata (recorded by _calcExecute) which spells out
 *  whether to re-insert the original expression or a parenthesised
 *  numeric literal. Falls back to a display-string heuristic for entries
 *  from older sessions that predate the `replay` field. */
function _calcRecallHistory(h){
  if(!h) return;
  _calcInputError = '';
  _calcResultFresh = false;
  // History recall un-suppresses any AC-cleared display so the
  // recalled expression is actually visible. CR PR #124: the
  // recall would otherwise repopulate atoms while
  // _calcDisplayCleared stayed true, and the next calcRenderUI()
  // would hit the blank-slate branch and hide the recall.
  _calcDisplayCleared = false;
  calcInputClear();
  if(h.replay && typeof h.replay === 'object' && typeof h.replay.value === 'string'){
    try{
      calcInputInsertString(calcHistoryExpression(h, h.replay.value));
    }catch(error){
      _calcInputError = 'Math error: ' + error.message;
    }
    calcRenderUI();
    return;
  }
  // Legacy fallback — pre-replay history entries
  const hasCalculusMarker = /[Σ∑Π∏∫]|\bd\/d[a-zA-Z]/.test(h.input || '');
  if(hasCalculusMarker){
    const lit = (h.decimal && !h.decimal.includes('/')) ? h.decimal : String(h.value);
    calcInputInsertString('(' + lit + ')');
  } else {
    try{
      calcInputInsertString(calcHistoryExpression(h, h.input || ''));
    }catch(error){
      _calcInputError = 'Math error: ' + error.message;
    }
  }
  calcRenderUI();
}

function _calcHistoryUp(){
  if(!CALC_STATE.history.length) return;
  // History navigation begins recalling prior expressions into the
  // input — the fresh-result display no longer reflects "the just-
  // evaluated entry" once the user steps backwards through history,
  // so demote it before _calcRecallHistory rebuilds the display.
  _calcResultFresh = false;
  _calcHistIdx = Math.max(0, (_calcHistIdx < 0 ? CALC_STATE.history.length : _calcHistIdx) - 1);
  _calcRecallHistory(CALC_STATE.history[_calcHistIdx]);
}

function _calcHistoryDown(){
  if(!CALC_STATE.history.length || _calcHistIdx < 0) return;
  _calcResultFresh = false;
  _calcHistIdx = Math.min(CALC_STATE.history.length - 1, _calcHistIdx + 1);
  _calcRecallHistory(CALC_STATE.history[_calcHistIdx]);
}

/** Up/Down dispatcher: when the cursor is inside a vertically
 *  stacked template slot (per _CALC_VERTICAL_CHAINS in
 *  calc-templates.js — currently frac.num↔den and
 *  mixed.num↔den, with mixed.w deliberately excluded since it
 *  renders inline to the left of the fraction, not above it),
 *  navigates slot-to-slot vertically. Otherwise falls through to
 *  history scroll. The walker also handles nested templates by
 *  searching cursor.path bottom-up for the nearest vertical
 *  ancestor — a cursor at frac.num → sqrt.rad still responds to
 *  Up/Down. See fix/calc-template-input-cleanup Bug 4 and the
 *  CR follow-ups on PR #122. */
function _calcUpDispatch(){
  if(typeof _calcCursorInVerticalTemplate === 'function' &&
     _calcCursorInVerticalTemplate()){
    calcInputSlotUp();
    _afterInput();
    return;
  }
  _calcHistoryUp();
}
function _calcDownDispatch(){
  if(typeof _calcCursorInVerticalTemplate === 'function' &&
     _calcCursorInVerticalTemplate()){
    calcInputSlotDown();
    _afterInput();
    return;
  }
  _calcHistoryDown();
}

function _calcToggleSD(){
  const last = CALC_STATE.history[CALC_STATE.history.length - 1];
  if(!last) return;
  const frac = calcTryFraction(last.value);
  if(frac){
    last.decimal = (last.decimal.includes('/')) ? calcFormatResult(last.value) : `${frac.n}/${frac.d}`;
  } else {
    last.decimal = calcFormatResult(last.value);
  }
  calcRenderUI();
  _calcAutosave();
}

function _calcShowFunctionMenu(){
  const functions = ['sin(','cos(','tan(','asin(','acos(','atan(','log(','ln(','exp(','sqrt(','abs(','round(','floor(','ceil(','gcd(','lcm(','min(','max(','nCr(','nPr('];
  const pick = prompt('Insert function:\n' + functions.join('  '), 'sin(');
  if(pick) { calcInputInsertString(pick); _afterInput(true); }
}

function _calcShowVarMenu(){
  const names = Object.keys(CALC_STATE.vars);
  const pick = prompt('Variables: ' + names.join(', ') + '\nUse name in expression, or set value.\nFormat: name=value to set, or name to insert.', '');
  if(!pick) return;
  // Own-property checks prevent prototype pollution via names like
  // 'constructor', 'toString', 'hasOwnProperty'.
  const hasVar = n => Object.prototype.hasOwnProperty.call(CALC_STATE.vars, n);
  if(pick.includes('=')){
    const [n, v] = pick.split('=').map(s => s.trim());
    if(hasVar(n)){
      const r = calcEvaluate(v);
      if(r.ok && r.value != null){
        CALC_STATE.vars[n] = r.value;
        _calcUpdatePreview();
        _calcAutosave();
      }
    }
  } else if(hasVar(pick)){
    calcInputInsertString(pick);
    _afterInput(true);
  }
}

/* ── MODE NAV ─────────────────────────────────────────────────── */

/** Navigates to the home tile grid. */
function calcGoHome(){
  // Mode change clears the Calculate-mode fresh-result flag so a
  // later return to Calculate doesn't render with a stale "fresh"
  // display from a prior session of EXE presses.
  _calcResultFresh = false;
  CALC_STATE.mode = 'home';
  calcRenderUI();
  _calcAutosave();
}

/** Switches to a specific mode. */
function calcGoMode(mode){
  const m = CALC_MODES.find(x => x.id === mode);
  if(!m || !m.ready){
    if(typeof showToast === 'function') showToast((m?.label||mode) + ' coming soon');
    return;
  }
  _calcResultFresh = false;
  CALC_STATE.mode = mode;
  calcRenderUI();
  _calcAutosave();
}

/** Toggles fullscreen recording mode (big readable text). */
function calcToggleFullscreen(){
  CALC_STATE.fullscreen = !CALC_STATE.fullscreen;
  const panel = document.getElementById('calc-p');
  if(panel) panel.classList.toggle('calc-fs-wrap', CALC_STATE.fullscreen);
  calcRenderUI();
}

/* ── MOUNT: replace the legacy panel body ─────────────────────── */

/** Called on calc widget open. Replaces panel HTML with the new UI.
 *
 *  PR-4 (feedback #8): togCalc force-resets CALC_STATE.mode to 'home'
 *  on every open, so this function's role shrinks to "validate and
 *  render". The lingering sanity check below guards the rare path
 *  where calcMount is invoked without going through togCalc (programmatic
 *  mount, future HUD entry point) — in that case an unknown or coming-
 *  soon mode still routes to 'home' rather than a blank Coming Soon
 *  screen. */
function calcMount(){
  const m = CALC_MODES.find(x => x.id === CALC_STATE.mode);
  if(CALC_STATE.mode !== 'home' && !(m && m.ready)){
    CALC_STATE.mode = 'home';
  }
  // calcRenderUI handles drag wiring at its tail — no explicit
  // _calcWireDrag call needed here (was a redundant double-wire).
  calcRenderUI();
}

/** Wire free drag + corner resize on the calc panel. Runs after every
 *  render because calcRenderUI replaces innerHTML.
 *
 *  Round-B round-2: the drag handle is the .calc-hdr row itself,
 *  decorated by ensureWidgetDragBar with a three-dot grip cue at
 *  its left. The separate .wp-drag bar that earlier Round B
 *  introduced was removed because it overlapped content and broke
 *  the widget's visual cohesion. The header's Home/Fullscreen/
 *  Close buttons keep their click behavior because
 *  wireWidgetDrag's pointerdown handler skips when the event's
 *  target is an interactive descendant of the handle. */
function _calcWireDrag(){
  const panel = document.getElementById('calc-p');
  if(!panel) return;
  // PR-2 of the widget-shell refactor: drag bar + resize handle +
  // min bounds all come from WIDGET_SHELL_CONFIG['calculator'] now.
  // This function's per-render guarantee (calcRenderUI wipes
  // panel.innerHTML on every mode switch so must re-wire drag at
  // the tail of every render) is preserved because mountWidgetShell
  // delegates to wireWidgetDrag, which uses Round-B3 split drag /
  // resize sentinels — safe to call every render, no leaked
  // listeners on the drag bar, fresh resize element picked up on
  // each call.
  if(typeof mountWidgetShell === 'function'){
    mountWidgetShell(panel, 'calculator');
  }
}

/** Wire HOME tile clicks via delegation (done once on first render). */
if(typeof document !== 'undefined' && !window._calcTileDelegation){
  window._calcTileDelegation = true;
  document.addEventListener('click', e => {
    const tile = e.target.closest('#calc-p .calc-tile');
    if(tile && tile.dataset.mode){ calcGoMode(tile.dataset.mode); }
  });
}

/* ── KEYBOARD SHORTCUTS ───────────────────────────────────────
   Only fire when the calculator widget is open, visible, and the event
   target is either inside #calc-p (our own inputs/buttons) or nowhere
   specific. We deliberately ignore keystrokes going into unrelated
   <input>/<textarea>/contenteditable elements elsewhere on the page so
   the calculator doesn't hijack typing in lesson authoring fields. */
/** Returns true when a keydown belongs to the calculator widget. Inside
 *  #calc-p always counts. Outside the panel, we only accept events from
 *  document.body / documentElement so focused controls (buttons, links,
 *  inputs, contenteditables) elsewhere on the page continue to receive
 *  their normal key behavior. */
function _calcKbdIsOurTarget(target){
  if(!target) return true;
  if(target.closest && target.closest('#calc-p')) return true;
  if(target.isContentEditable) return false;
  if(target.matches && target.matches('input, textarea, select, [contenteditable], button, a[href], [role="button"], [tabindex]')) return false;
  return target === document.body || target === document.documentElement;
}

if(typeof document !== 'undefined' && !window._calcKbdShortcuts){
  window._calcKbdShortcuts = true;
  document.addEventListener('keydown', e => {
    const panel = document.getElementById('calc-p');
    if(!panel || !panel.classList.contains('on')) return; // widget not open
    if(!_calcKbdIsOurTarget(e.target)) return;

    // Consume = both preventDefault AND stopImmediatePropagation so the
    // builder screen's document-level ArrowLeft/Right handler doesn't
    // also flip the lesson context while the calc widget is open.
    const consume = () => { e.preventDefault(); e.stopImmediatePropagation(); };

    // Mode-level shortcuts that apply regardless of which mode is active
    if(e.key === 'F11'){ calcToggleFullscreen(); consume(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l'){
      calcGoHome(); consume(); return;
    }

    // The rest only apply to Calculate mode — Stats/Dist/Table/etc.
    // already have their own native input handling.
    if(CALC_STATE.mode !== 'calculate') return;
    // And skip when focus is inside a regular input within our panel
    // (e.g. a future formula bar) so the user can type there normally.
    if(e.target && e.target.matches && e.target.matches('input, textarea')) return;

    const k = e.key;
    if(typeof calcUndoCapture === 'function' && typeof calcUndoCommit === 'function'){
      const undoBefore = calcUndoCapture();
      queueMicrotask(() => calcUndoCommit(undoBefore));
    }
    // _afterInput(true) for forward-input keys (digits, operators,
    // parens) so the fresh-result display demotes to history when the
    // user begins their next expression. Backspace / Escape / arrows
    // pass no arg so the fresh display stays intact.
    if(/^[0-9.]$/.test(k)){ calcInputInsertString(k); _afterInput(true); consume(); return; }
    if(k === '+' || k === '-' || k === '*' || k === '/' || k === '^' || k === '%' ||
       k === '(' || k === ')' || k === ','){
      // Mirror keypad Ans-chaining for physical keyboard users via the
      // shared gate — keeps the two input paths in lockstep.
      if(_shouldAnsChain(k)){
        calcInputInsertString('Ans');
      }
      calcInputInsertString(k); _afterInput(true); consume(); return;
    }
    if(k === 'Enter' || k === '='){ _calcExecute(); if(typeof calcUndoReset === 'function') calcUndoReset(); consume(); return; }
    if(k === 'Backspace'){ calcInputBackspace(); _afterInput(); consume(); return; }
    if(k === 'Escape'){ calcInputClear(); _afterInput(); consume(); return; }
    if(k === 'ArrowLeft'){  calcInputLeft();    _afterInput(); consume(); return; }
    if(k === 'ArrowRight'){ calcInputRight();   _afterInput(); consume(); return; }
    if(k === 'ArrowUp'){    _calcUpDispatch();   consume(); return; }
    if(k === 'ArrowDown'){  _calcDownDispatch(); consume(); return; }
    // Tab — explicit slot-walker, matches Desmos / MathLive / Word
    // equation editor convention. Tab walks forward (same path as
    // right-arrow's sibling-slot transition); Shift+Tab walks
    // backward.
    //
    // Accessibility guard (CR PR #120): only consume Tab when the
    // event target is NOT a real focusable control. The wider key
    // handler bails on input/textarea earlier (line ~786), but
    // buttons and links inside the calc panel would otherwise have
    // their native focus traversal swallowed — a keyboard-only
    // user trying to Tab from the mode picker to a panel button
    // would land in slot-navigation instead. Leave Tab alone when
    // focus is on a button/link/[tabindex]; the calc display
    // itself isn't focusable, so legitimate slot-navigation always
    // arrives via document.body or a non-focusable target.
    if(k === 'Tab'){
      if(e.target && e.target.matches &&
         e.target.matches('button, a, [tabindex]')) return;
      if(e.shiftKey){ calcInputLeft(); } else { calcInputRight(); }
      _afterInput(); consume(); return;
    }
  });
}

/** Renders the v15 BASIC keypad as an HTML string. The outer

function _calcRenderCalculateV2(){
  const expr = typeof calcRenderCurrent === 'function' ? calcRenderCurrent() : '';
  const angleMode  = CALC_STATE.angle === 'rad' ? 'rad' : 'deg';
  CALC_STATE.calcView = 'basic'; // Old ADV snapshots open the usable keypad.

  const calcView = 'basic';

  // result) takes precedence: blank slate, no history scrollback,
  // no big-result. Cleared on next forward-input / CLEAR / EXE.
  const fresh = _calcResultFresh && CALC_STATE.history.length > 0;

  // Header — v15 chrome:

  // Action row: cursor/commit, input editing, history, memory, undo and copy.
  const actionRow = `
    <div class="calc-v2-action">
      <div class="calc-v2-dpad">
        <button class="ck ck-nav calc-v2-dbtn calc-v2-dbtn--up"    data-act="up"    type="button"><span class="ms">keyboard_arrow_up</span></button>
        <button class="ck ck-nav calc-v2-dbtn calc-v2-dbtn--left"  data-act="left"  type="button"><span class="ms">keyboard_arrow_left</span></button>
        <button class="ck calc-v2-dbtn calc-v2-dbtn--ok"              data-act="v2-ok" type="button">OK</button>
        <button class="ck ck-nav calc-v2-dbtn calc-v2-dbtn--right" data-act="right" type="button"><span class="ms">keyboard_arrow_right</span></button>
        <button class="ck ck-nav calc-v2-dbtn calc-v2-dbtn--down"  data-act="down"  type="button"><span class="ms">keyboard_arrow_down</span></button>
      </div>
      <div class="calc-v2-stack">
        <button class="ck calc-v2-act calc-v2-act--ac"  data-act="ac"  type="button">AC</button>
        <button class="ck calc-v2-act calc-v2-act--del" data-act="del" type="button">DEL</button>
      </div>
      <div class="calc-v2-stack">
        <button class="ck calc-v2-act calc-v2-act--ghost${CALC_STATE.activePanel==='history'?' on':''}" data-act="v2-history" type="button" aria-pressed="${CALC_STATE.activePanel==='history'?'true':'false'}">HISTORY</button>
        <button class="ck calc-v2-act calc-v2-act--ghost${CALC_STATE.activePanel==='vars'?' on':''}" data-act="v2-vars"    type="button" aria-pressed="${CALC_STATE.activePanel==='vars'?'true':'false'}">VARS</button>
      </div>
      <div class="calc-v2-stack">
        <button class="ck calc-v2-act calc-v2-act--ghost" data-act="v2-undo" type="button">UNDO</button>
        <button class="ck calc-v2-act calc-v2-act--ghost" data-act="v2-redo" type="button">REDO</button>
      </div>
      <div class="calc-v2-stack">
        <button class="ck calc-v2-act calc-v2-act--ghost" data-act="v2-copy"  type="button">COPY</button>
        <button class="ck calc-v2-act calc-v2-act--ghost" data-act="v2-clear" type="button">CLEAR</button>
      </div>
    </div>`;

  // Math zone (Zone 4): 3 rows × 6 cols. SHIFT-secondary labels
  // ride above each button as overlay <span class="calc-v2-shift-lbl">.
  // Buttons reuse existing data-fn / data-tmpl / data-ins so
  // _calcWireKeypad picks them up unchanged.
  //
  // Drawn radicals: the √▢ and ⁿ√▢ buttons render via inline SVG
  // path per the spec. Other buttons use HTML <sup>/<sub> for
  // legibility — Unicode-based glyphs render unevenly across
  // platforms, but sup/sub on a clean monospaced span is safe.
  const sqrtSvg = `
    <svg class="calc-v2-rad" viewBox="0 0 60 32" aria-hidden="true">
      <path d="M 6 18 L 11 22 L 16 28 L 22 6 L 56 6 L 56 12"
            fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"/>
      <rect class="calc-v2-ph" x="26" y="10" width="22" height="14"/>
    </svg>`;
  const nrootSvg = `
    <svg class="calc-v2-rad" viewBox="0 0 60 32" aria-hidden="true">
      <rect class="calc-v2-ph" x="2" y="3" width="9" height="9"/>
      <path d="M 12 18 L 17 22 L 22 28 L 28 6 L 56 6 L 56 12"
            fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linejoin="round" stroke-linecap="round"/>
      <rect class="calc-v2-ph" x="32" y="10" width="22" height="14"/>
    </svg>`;

  // Math zone button cells. shiftLbl: empty string for buttons
  // with no SHIFT-secondary (renders the band as a 22px gap above
  // the button so the math row stays vertically aligned).
  const mathCells = [
    // Row M1
    [
      { tmpl:'square', shiftTmpl:'cube', shiftLbl:'x³',     html:'<span class="calc-v2-fn-it">x</span><sup>2</sup>' },
      { tmpl:'pow', shiftTmpl:'nroot', shiftLbl:'<i>y</i>√<i>x</i>', html:'<span class="calc-v2-fn-it">x</span><sup><span class="calc-v2-fn-it">y</span></sup>' },
      { tmpl:'sqrt', shiftTmpl:'cbrt', shiftLbl:'<sup>3</sup>√▫',    html: sqrtSvg },
      { tmpl:'nroot', shiftFn:'log10', shiftLbl:'log<sub>10</sub>', html: nrootSvg },
      { tmpl:'log', shiftTmpl:'pow10', shiftLbl:'10<sup>x</sup>',    html:'<span class="calc-v2-fn">log</span><sub>▫</sub>(▫)' },
      { shiftFn:'exp', fn:'ln',      shiftLbl:'e<sup>x</sup>',    html:'<span class="calc-v2-fn">ln</span>(▫)' },
    ],
    // Row M2
    [
      { shiftFn:'asin', fn:'sin',     shiftLbl:'sin<sup>−1</sup>', html:'<span class="calc-v2-fn">sin</span>' },
      { shiftFn:'acos', fn:'cos',     shiftLbl:'cos<sup>−1</sup>', html:'<span class="calc-v2-fn">cos</span>' },
      { shiftFn:'atan', fn:'tan',     shiftLbl:'tan<sup>−1</sup>', html:'<span class="calc-v2-fn">tan</span>' },
      { ins:'pi',     shiftLbl:'',                 html:'π' },
      { ins:'e',      shiftLbl:'',                 html:'<span class="calc-v2-fn-it">e</span>' },
      { ins:'Ans',    shiftLbl:'',                 html:'<span class="calc-v2-fn">Ans</span>' },
    ],
    // Row M3
    [
      /* Mixed-number button: italic `a` next to a stacked `b/c`
       * fraction. Reuses the same .ct-mixed / .ct-frac markup the
       * display strip emits when this template is inserted, so
       * the button label visually previews the insertion result.
       * Replaces the previous <sup>b</sup>⁄<sub>c</sub> approximation
       * (fix/calc-fraction-button-visual-cleanup). */
      { tmpl:'mixed', shiftAct:'v2-dc', shiftLbl:'d/c',              html:'<span class="ct-mixed"><span class="ct-w calc-v2-fn-it">a</span><span class="ct-frac"><span class="ct-num calc-v2-fn-it">b</span><span class="ct-bar"></span><span class="ct-den calc-v2-fn-it">c</span></span></span>' },
      /* Simple fraction button: real stacked .ct-frac structure
       * (num / bar / den) instead of the cheap "▫⁄▫" baseline-
       * aligned Unicode triplet. The button now visually
       * previews what gets inserted. */
      { tmpl:'frac', shiftTmpl:'reciprocal', shiftLbl:'<i>x</i><sup>−1</sup>', html:'<span class="ct-frac"><span class="ct-num">▫</span><span class="ct-bar"></span><span class="ct-den">▫</span></span>' },
      { ins:'(',      shiftLbl:'',                 html:'(' },
      { ins:')',      shiftLbl:'',                 html:')' },
      { act:'v2-dms', shiftLbl:'toggle',           html:'<span class="calc-v2-fn">DMS</span>' },
      { act:'v2-pm',  shiftLbl:'|<i>x</i>|',       html:'±' },
    ],
  ];

  /* feat/calc-format-dms-render: DMS .on state reflects whether
   * the LAST history entry is currently in DMS display. Computed
   * once per render; the DMS handler flips entry.dmsActive on
   * the last entry, so re-render after the click flips the
   * .on class along with the number itself. */
  const _lastEntry = (CALC_STATE.history && CALC_STATE.history.length)
    ? CALC_STATE.history[CALC_STATE.history.length - 1] : null;
  const _dmsOn = !!(_lastEntry && _lastEntry.dmsActive);

  const mathRowsHtml = mathCells.map(row => {
    const labels = row.map(c => `<span class="calc-v2-shift-lbl">${c.shiftLbl||''}</span>`).join('');
    const buttons = row.map(c => {
      let dataset = c.fn   ? `data-fn="${_escCalc(c.fn)}"`
                    : c.tmpl ? `data-tmpl="${_escCalc(c.tmpl)}"`
                    : c.ins  ? `data-ins="${_escCalc(c.ins)}"`
                    : c.act  ? `data-act="${_escCalc(c.act)}"`
                    : '';
      if(c.shiftFn) dataset += ` data-shift-fn="${c.shiftFn}"`;
      if(c.shiftTmpl) dataset += ` data-shift-tmpl="${c.shiftTmpl}"`;
      if(c.shiftAct) dataset += ` data-shift-act="${c.shiftAct}"`;
      const onCls = (c.act === 'v2-dms' && _dmsOn) ? ' on' : '';
      const ariaPressed = (c.act === 'v2-dms') ? ` aria-pressed="${_dmsOn ? 'true' : 'false'}"` : '';
      return `<button class="ck calc-v2-mathkey${onCls}" type="button" ${dataset}${ariaPressed}>${c.html}</button>`;
    }).join('');
    return `
      <div class="calc-v2-mathrow">
        <div class="calc-v2-shift-band">${labels}</div>
        <div class="calc-v2-mathkeys">${buttons}</div>
      </div>`;
  }).join('');

  // Digits, operators, scientific notation, postfix percent and per-answer FORMAT.
  const numpad = `
    <div class="calc-v2-numpad">
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="7" type="button">7</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="8" type="button">8</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="9" type="button">9</button>
      <button class="ck ck-op   calc-v2-numkey calc-v2-numkey--op"    data-op="/"  type="button">÷</button>
      <button class="ck calc-v2-numkey calc-v2-numkey--mod"   data-act="v2-e10" type="button">×10<sup>n</sup></button>

      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="4" type="button">4</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="5" type="button">5</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="6" type="button">6</button>
      <button class="ck ck-op   calc-v2-numkey calc-v2-numkey--op"    data-op="*"  type="button">×</button>
      <button class="ck ck-op   calc-v2-numkey calc-v2-numkey--mod"   data-op="%"  type="button">%</button>

      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="1" type="button">1</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="2" type="button">2</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="3" type="button">3</button>
      <button class="ck ck-op   calc-v2-numkey calc-v2-numkey--op"    data-op="-"  type="button">−</button>
      ${(() => {
        // FORMAT button .on reflects the last history entry's
        // per-result format (fix/calc-ac-clean-slate-and-format-
        // per-result). Empty history → button off. Non-decimal
        // last.format → button on. IIFE so the condition reads
        // once and feeds both class and aria-pressed without
        // duplicating the lookup.
        const _lastFmt = (CALC_STATE.history && CALC_STATE.history.length)
          ? CALC_STATE.history[CALC_STATE.history.length - 1].format
          : null;
        const _fmtOn = !!(_lastFmt && _lastFmt !== 'decimal');
        return `<button class="ck calc-v2-numkey calc-v2-numkey--format${_fmtOn ? ' on' : ''}" data-act="v2-format" type="button" aria-pressed="${_fmtOn ? 'true' : 'false'}">FORMAT</button>`;
      })()}

      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="0" type="button">0</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="." type="button">.</button>
      <button class="ck ck-num  calc-v2-numkey calc-v2-numkey--digit" data-ins="," type="button">,</button>
      <button class="ck ck-op   calc-v2-numkey calc-v2-numkey--op"    data-op="+"  type="button">+</button>
      <button class="ck ck-exe  calc-v2-numkey calc-v2-numkey--exe"   data-act="exe" type="button"><span class="calc-v2-exe-eq">=</span><span class="calc-v2-exe-l">EXE</span></button>
    </div>`;

  // The single active panel replaces the keypad until closed.
  let keypadBody;
  if(CALC_STATE.activePanel === 'history'){
    keypadBody = _calcRenderHistoryPanel(CALC_STATE);
  } else if(CALC_STATE.activePanel === 'catalog' && typeof _calcRenderCatalogPanel === 'function'){
    keypadBody = _calcRenderCatalogPanel(CALC_STATE);

  } else if(CALC_STATE.activePanel === 'vars'){
    keypadBody = _calcRenderVarsPanel(CALC_STATE);
  } else if(CALC_STATE.activePanel === 'setup'){
    keypadBody = _calcRenderSetupPanel(CALC_STATE);
  } else if(CALC_STATE.activePanel === 'help'){
    keypadBody = _calcRenderHelpPanel(CALC_STATE);

  } else {
    keypadBody = `
    ${utilityRow}
    ${actionRow}
    <div class="calc-v2-math">${mathRowsHtml}</div>
    ${numpad}`;
  }

  return `
    <div class="calc-wrap calc-calculate calc-v2 calc-v2--${calcView}${shiftCls}${fsCls}">
      ${header}
      <div class="calc-display calc-v2-display${fresh?' calc-display--fresh':''}">${displayHtml}${_calcInputError ? `<div class="calc-input-error" role="status" aria-live="polite">${_escCalc(_calcInputError)}</div>` : ''}</div>
      <div class="calc-keypad calc-v2-keypad">${keypadBody}</div>
    </div>`;
}

/** Renders the HISTORY panel body (feat/calc-history-panel).
 *  Returned as the keypadBody when CALC_STATE.activePanel==='history'.
 *  Header + display strip render above as usual.
 *
 *  Layout: panel header (title + Clear + ×) above a scrollable
 *  list of entries. Newest entry first. Tapping a row routes
 *  through 'v2-history-recall' → _calcRecallHistory → closes
 *  the panel.
 *
 *  data-history-idx carries the ORIGINAL array index (not the
 *  reversed iteration index) so the dispatcher can read
 *  CALC_STATE.history[idx] directly. _escCalc lives in calc-ui.js
 *  (loaded earlier in the bundle); used to escape user input
 *  before interpolating into HTML. */
function _calcRenderHistoryPanel(S){
  const hist = Array.isArray(S.history) ? S.history : [];
  let listBody;
  if(hist.length === 0){
    listBody = '<div class="calc-v2-history-empty">No calculations yet</div>';
  } else {
    let rows = '';
    // Iterate newest-first while preserving the original array
    // index in data-history-idx for the recall dispatcher.
    for(let i = hist.length - 1; i >= 0; i--){
      const entry = hist[i];
      const exprStr  = (entry && typeof entry.input === 'string')   ? entry.input   : '';
      // feat/calc-format-dms-render: route through the canonical
      // formatter so HISTORY rows reflect the same FORMAT/DMS
      // state as the inline display strip.
      const valueStr = (typeof _calcFormatDisplay === 'function') ? _calcFormatDisplay(entry)
                     : ((entry && typeof entry.decimal === 'string') ? entry.decimal : '');
      // Glyphify the input through the same display formatter
      // the inline scrollback uses so × / ÷ / − etc. read
      // consistently between the panel and the display strip.
      const exprDisplay = (typeof calcDisplayGlyphify === 'function')
        ? calcDisplayGlyphify(exprStr)
        : exprStr;
      rows += `
        <button type="button" class="ck calc-v2-history-row" data-act="v2-history-recall" data-history-idx="${i}">
          <span class="calc-v2-history-expr">${_escCalc(exprDisplay)}</span>
          <span class="calc-v2-history-arrow" aria-hidden="true">→</span>
          <span class="calc-v2-history-val">${_escCalc(valueStr)}</span>
        </button>`;
    }
    listBody = rows;
  }
  /* Note: Clear and × buttons carry .ck so the existing keypad
   * delegation picks them up (they're inside .calc-keypad).
   * data-act values 'v2-history-clear' and 'v2-history' are
   * handled by _calcV2HandleAct above. */
  return `
    <div class="calc-v2-panel calc-v2-history-panel">
      <div class="calc-v2-panel-hdr">
        <span class="calc-v2-panel-title">History</span>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-panel-clear" data-act="v2-history-clear">Clear</button>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-panel-close" data-act="v2-history" aria-label="Close history panel">×</button>
      </div>
      <div class="calc-v2-history-list">${listBody}</div>
    </div>`;
}

/** Renders the VARS panel body (CALC_STATE.activePanel === 'vars').
 *
 *  The engine already resolves A–F / x / y / z / M / Ans from CALC_STATE.vars
 *  when evaluating (calc-core.js) — this panel is the missing UI over storage
 *  that was already wired end-to-end.
 *
 *  Per row: the name, its current value, STO (store the value on screen into
 *  this variable) and RCL (insert the variable into the expression, where it
 *  then evaluates). Ans is shown read-only — the engine writes it on every EXE,
 *  so letting STO overwrite it would just be undone by the next calculation.
 *
 *  The memory row (M+ / M− / MC) operates on the M slot, which is an ordinary
 *  variable, so M is recallable into expressions like any other. */
function _calcRenderVarsPanel(S){
  const vars = (S && S.vars) ? S.vars : {};
  const NAMES = ['A','B','C','D','E','F','x','y','z','M'];
  const fmt = v => {
    if(typeof v !== 'number' || !isFinite(v)) return String(v);
    // Match the display's number formatting where we can; fall back to a
    // short, non-exponential form for readable panel rows.
    return (typeof calcFormatNumber === 'function') ? calcFormatNumber(v) : String(v);
  };
  let rows = '';
  for(const name of NAMES){
    const val = _calcHasOwn(vars, name) ? vars[name] : 0;
    rows += `
      <div class="calc-v2-var-row">
        <span class="calc-v2-var-name">${_escCalc(name)}</span>
        <span class="calc-v2-var-val" title="${_escCalc(String(val))}">${_escCalc(fmt(val))}</span>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-var-btn"
                data-act="v2-var-sto" data-var="${_escCalc(name)}"
                aria-label="Store the displayed value into ${_escCalc(name)}">STO</button>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-var-btn"
                data-act="v2-var-rcl" data-var="${_escCalc(name)}"
                aria-label="Recall ${_escCalc(name)} into the expression">RCL</button>
      </div>`;
  }
  const ansVal = _calcHasOwn(vars, 'Ans') ? vars.Ans : 0;
  return `
    <div class="calc-v2-panel calc-v2-vars-panel">
      <div class="calc-v2-panel-hdr">
        <span class="calc-v2-panel-title">Variables</span>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-panel-close" data-act="v2-vars" aria-label="Close variables panel">×</button>
      </div>
      <div class="calc-v2-vars-body">
        <div class="calc-v2-var-mem">
          <span class="calc-v2-var-memlab">Memory (M)</span>
          <button type="button" class="ck calc-v2-act calc-v2-var-btn" data-act="v2-mem-add" aria-label="Add the displayed value to memory">M+</button>
          <button type="button" class="ck calc-v2-act calc-v2-var-btn" data-act="v2-mem-sub" aria-label="Subtract the displayed value from memory">M−</button>
          <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-var-btn" data-act="v2-mem-clear" aria-label="Clear memory">MC</button>
        </div>
        <div class="calc-v2-var-list">${rows}</div>
        <div class="calc-v2-var-row calc-v2-var-row--ro">
          <span class="calc-v2-var-name">Ans</span>
          <span class="calc-v2-var-val">${_escCalc(fmt(ansVal))}</span>
          <span class="calc-v2-var-note">set by EXE</span>
        </div>
        <p class="calc-v2-var-hint">STO stores the value on screen. RCL inserts the variable into your expression — it evaluates like a number.</p>
      </div>
    </div>`;
}

/** SETUP controls the angle unit. Per-answer representation uses FORMAT. */
function _calcRenderSetupPanel(S){
  const deg  = S.angle === 'deg';
  const seg = (act, on, label, aria) =>
    `<button type="button" class="ck calc-v2-seg-btn${on ? ' on' : ''}" data-act="${act}"
             aria-pressed="${on ? 'true' : 'false'}" aria-label="${_escCalc(aria)}">${_escCalc(label)}</button>`;
  return `
    <div class="calc-v2-panel calc-v2-setup-panel">
      <div class="calc-v2-panel-hdr">
        <span class="calc-v2-panel-title">Setup</span>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-panel-close" data-act="v2-setup" aria-label="Close setup panel">×</button>
      </div>
      <div class="calc-v2-setup-body">
        <div class="calc-v2-setup-row">
          <div class="calc-v2-setup-label">Angle unit
            <span class="calc-v2-setup-sub">Used by sin / cos / tan and their inverses</span></div>
          <div class="calc-v2-seg">
            ${seg('angle-deg', deg, 'DEG', 'Use degrees')}
            ${seg('angle-rad', !deg, 'RAD', 'Use radians')}
          </div>
        </div>
        <p class="calc-v2-setup-hint">Per-answer formatting (fraction / mixed) stays on the FORMAT key, and DMS on the DMS key — those apply to one result at a time.</p>
      </div>
    </div>`;
}

/** Renders the HELP panel body (CALC_STATE.activePanel === 'help').
 *  Static reference — no interactivity beyond closing. Covers the things that
 *  are not self-evident from the key faces: the one-shot SHIFT layer, how
 *  template entry and the cursor work, and what FORMAT / DMS / COPY do. */
function _calcRenderHelpPanel(/* S */){
  const row = (k, d) => `<div class="calc-v2-help-row"><span class="calc-v2-help-key">${k}</span><span class="calc-v2-help-desc">${d}</span></div>`;
  return `
    <div class="calc-v2-panel calc-v2-help-panel">
      <div class="calc-v2-panel-hdr">
        <span class="calc-v2-panel-title">Help</span>
        <button type="button" class="ck calc-v2-act calc-v2-act--ghost calc-v2-panel-close" data-act="v2-help" aria-label="Close help panel">×</button>
      </div>
      <div class="calc-v2-help-body">
        <div class="calc-v2-help-sec">Keys</div>
        ${row('SHIFT', 'Arms the amber second function for ONE key press, then clears itself. The second function is printed above each key.')}
        ${row('EXE / OK', 'Evaluates. Pressing an operator straight after a result continues from that result.')}
        ${row('AC / DEL', 'AC clears what you are typing; DEL deletes one item. Neither touches the history list.')}
        ${row('UNDO / REDO', 'Steps your typing back and forward. Resets when you press EXE or AC.')}
        ${row('CLEAR', 'Empties the whole history list, after a confirmation.')}
        <div class="calc-v2-help-sec">Entering maths</div>
        ${row('Templates', 'Keys with outlined boxes (fractions, roots, powers, logs) insert a shape. Use ‹ › to move between the boxes and type into each.')}
        ${row('×10<sup>n</sup>', 'Scientific notation: 2 ×10ⁿ 8 is 2×10⁸. A negative exponent needs no brackets.')}
        ${row('±', 'Wraps what follows in a negation. SHIFT gives |x| (absolute value).')}
        ${row('DMS', 'Inserts ° then ′ then ″ as you tap it, for angles like 45°30′15″. SHIFT+DMS switches the ANSWER between decimal and DMS.')}
        <div class="calc-v2-help-sec">Answers</div>
        ${row('FORMAT', 'Cycles the last answer: decimal → fraction → mixed. It applies to that one answer.')}
        ${row('COPY', 'Copies the expression and its result as text, exactly as shown.')}
        ${row('VARS', 'STO puts the value on screen into A–F, x, y, z or M. RCL types that variable into your expression.')}
        ${row('CATALOG', 'Searchable list of every function, if you have forgotten which key it is on.')}
      </div>
    </div>`;
}

/** Binds a panel-root click listener that routes any v2 button
 *  with a `data-act` attribute through _calcV2HandleAct. The
 *  keypad-scoped delegation in _calcWireKeypad only sees
 *  .calc-keypad descendants, but the v2 redesign places the
 *  segmented controls (DEG/RAD) in the header and the
 *  utility / action-row controls outside .calc-keypad. This wires
 *  them.
 *
 *  Idempotency: stamps `_v2wired` on the panel element itself
 *  after the first attach. Because the listener is bound to that
 *  same panel element (not a child), calcRenderUI's
 *  innerHTML-replace doesn't affect either the stamp or the
 *  listener — both persist for the lifetime of the panel.
 *
 *  Scope: only attaches handlers for buttons that emit a
 *  data-act value starting with one of the v2 namespaces (angle-,
 *  view-, v2-). All other clicks are left to the existing
 *  keypad delegation (which still owns digits/operators/templates/
 *  shift/ac/del/exe). */
function _calcWireV2(){
  const panel = document.getElementById('calc-p');
  if(!panel || panel._v2wired) return;
  panel._v2wired = true;
  panel.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    // .calc-keypad descendants are handled by _calcWireKeypad —
    // skip them here so we don't double-fire (the keypad listener
    // also routes through _calcV2HandleAct via the dispatcher
    // hook in _calcWireKeypad's pre-switch block).
    if(btn.closest('.calc-keypad')) return;
    const act = btn.dataset.act;
    if(typeof act !== 'string') return;
    // Only own the v2 namespace; let any future legacy-style act
    // outside the keypad (none today) fall through.
    if(act.indexOf('v2-') !== 0
       && act.indexOf('angle-') !== 0
       && act.indexOf('view-') !== 0) return;
    _calcV2HandleAct(act, btn);
  });
}

/* ── Clipboard (COPY button) ──────────────────────────────────────
   Tries the async Clipboard API first — it works in SECURE contexts
   (https or localhost, e.g. the studio's http-server on :8765). When
   the API is missing (the file:// case — navigator.clipboard is
   undefined there) it falls back to a temporary-textarea +
   execCommand('copy'). Returns Promise<boolean> so the caller can
   toast success/failure. */
function _calcCopyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text)
      .then(() => true)
      .catch(() => _calcExecCopyFallback(text));
  }
  return Promise.resolve(_calcExecCopyFallback(text));
}
function _calcExecCopyFallback(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch(_){ return false; }
}

/** The numeric value the user is looking at, for STO / M+ / M−.
 *
 *  Follows the SAME precedence COPY uses so "store what's on screen" means the
 *  same thing in both places: a just-evaluated result while it is fresh,
 *  otherwise the live expression (evaluated on the spot), otherwise the last
 *  result still in the scrollback. Returns null when there is nothing usable —
 *  including when the live expression doesn't evaluate — so callers can say so
 *  instead of storing NaN. */
function _calcV2CurrentValue(){
  const hist = Array.isArray(CALC_STATE.history) ? CALC_STATE.history : [];
  const fresh = (typeof _calcResultFresh !== 'undefined' && _calcResultFresh) && hist.length > 0;
  const numOf = e => {
    const v = e && typeof e.value === 'number' ? e.value
            : (e && e.decimal != null ? Number(e.decimal) : NaN);
    return Number.isFinite(v) ? v : null;
  };
  if(fresh) return numOf(hist[hist.length - 1]);
  if(CALC_INPUT.atoms && CALC_INPUT.atoms.length
     && typeof calcSerialize === 'function' && typeof calcEvaluate === 'function'){
    try{
      const r = calcEvaluate(calcSerialize(CALC_INPUT.atoms));
      if(r && r.ok && Number.isFinite(r.value)) return r.value;
    }catch(_){ /* fall through to the scrollback */ }
    return null;              // there IS an expression, it just doesn't evaluate
  }
  if(hist.length) return numOf(hist[hist.length - 1]);
  return null;
}

function _calcV2HandleAct(act, btn){
  switch(act){
    case 'angle-deg':
      if(CALC_STATE.angle !== 'deg'){
        CALC_STATE.angle = 'deg';
        if(typeof calcRenderUI === 'function') calcRenderUI();
        if(typeof _calcUpdatePreview === 'function') _calcUpdatePreview();
        if(typeof _calcAutosave === 'function') _calcAutosave();
      }
      return true;
    case 'angle-rad':
      if(CALC_STATE.angle !== 'rad'){
        CALC_STATE.angle = 'rad';
        if(typeof calcRenderUI === 'function') calcRenderUI();
        if(typeof _calcUpdatePreview === 'function') _calcUpdatePreview();
        if(typeof _calcAutosave === 'function') _calcAutosave();
      }
      return true;
    case 'view-basic':
      if(CALC_STATE.calcView !== 'basic'){
        CALC_STATE.calcView = 'basic';
        if(typeof calcRenderUI === 'function') calcRenderUI();
        if(typeof _calcAutosave === 'function') _calcAutosave();
      }
      return true;
    case 'view-adv':
      CALC_STATE.calcView = 'basic';
      calcRenderUI();
      return true;
    case 'v2-copy': {
      // Copy "the whole thing" — expression + result — as plain text.
      // Reuses the SAME display serializers the history rows use
      // (calcDisplayGlyphify + _calcFormatDisplay), so the clipboard
      // text matches exactly what's on screen, including the entry's
      // current FORMAT (fraction/mixed/…) and DMS state.
      // Format a history entry as "expr = result".
      const _copyHistText = (e) => {
        const expr = (typeof calcDisplayGlyphify === 'function' && typeof e.input === 'string')
          ? calcDisplayGlyphify(e.input) : (e.input || '');
        const val = (typeof _calcFormatDisplay === 'function')
          ? _calcFormatDisplay(e)
          : (e.decimal != null ? String(e.decimal) : String(e.value));
        return expr + ' = ' + val;
      };
      const _hist = CALC_STATE.history;
      // Mirror the display's fresh-result rule (calc-ui.js): the big result
      // block shows history[last] only while _calcResultFresh holds; once the
      // user starts a new expression the display switches to CALC_INPUT. COPY
      // follows the same rule so it copies what's actually on screen — not a
      // stale prior result while the user is mid-typing a new entry.
      const _fresh = (typeof _calcResultFresh !== 'undefined' && _calcResultFresh) && _hist.length > 0;
      let text = '';
      if(_fresh){
        // Showing the just-evaluated result → "expr = result".
        text = _copyHistText(_hist[_hist.length - 1]);
      } else if(CALC_INPUT.atoms && CALC_INPUT.atoms.length && typeof calcSerializeDisplay === 'function'){
        // Entering an expression → copy the expression so far.
        const expr = calcSerializeDisplay(CALC_INPUT.atoms);
        text = (typeof calcDisplayGlyphify === 'function') ? calcDisplayGlyphify(expr) : expr;
      } else if(_hist.length > 0){
        // No live input, but a prior result is still in the scrollback.
        text = _copyHistText(_hist[_hist.length - 1]);
      }
      if(!text){
        if(typeof showToast === 'function') showToast('Nothing to copy');
        return true;
      }
      _calcCopyToClipboard(text).then(ok => {
        if(typeof showToast === 'function') showToast(ok ? ('Copied: ' + text) : 'Copy failed');
      });
      return true;
    }
    case 'v2-dc': {
      // d/c converts the last answer between mixed and improper fraction.
      const last = CALC_STATE.history[CALC_STATE.history.length - 1];
      if(last){
        last.format = last.format === 'fraction' ? 'mixed' : 'fraction';
        last.dmsActive = false;
        calcRenderUI(); _calcAutosave();
      }
      return true;
    }
    case 'v2-format': {
      /* feat/calc-format-dms-render → fix/calc-ac-clean-slate-
       * and-format-per-result: PER-RESULT FORMAT cycle.
       * Cycle: decimal → fraction → mixed → decimal.
       *
       * Mutates only the LAST history entry's .format field.
       * New calculations push entries without .format and
       * render as decimal (entry.format || 'decimal' fallback
       * in _calcFormatDisplay). Cycling FORMAT no longer
       * cross-contaminates other history rows or future calcs
       * — earlier sticky-FORMAT behavior reversed to honor
       * PATCH-calc-ux-redesign-phase1.md line 179.
       *
       * Empty history → silent no-op (FORMAT requires a result
       * to format). Mirrors the v2-dms SHIFT-toggle pattern. */
      if(CALC_STATE.history.length === 0) return true;
      const last = CALC_STATE.history[CALC_STATE.history.length - 1];
      const order = ['decimal','fraction','mixed'];
      const cur = order.indexOf(last.format === 'improper' ? 'fraction' : (last.format || 'decimal'));
      last.dmsActive = false;
      last.format = order[(cur + 1) % order.length];
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-dms': {
      /* feat/calc-dms-input: DMS button has two behaviors.
       *
       * SHIFT+DMS: per-result format toggle (the original
       * behavior from feat/calc-format-dms-render). Flips
       * last.dmsActive; the renderer at _calcFormatDisplay
       * reads the flag and formats via _calcFormatDMS. New
       * calculations don't inherit. Empty history silently
       * no-ops. This is the FIRST live SHIFT-secondary
       * dispatch in the codebase — the shift-active visual
       * class on the wrap was previously decorative only.
       * Reads CALC_STATE.shift directly — the keypad click
       * handler in calc-ui.js fires _maybeClearShift only
       * AFTER _calcV2HandleAct returns, so the shift state
       * is still live here.
       *
       * Plain DMS tap: context-aware character insertion.
       * Walks back from cursor through digits/dots in the
       * current number cluster looking for the most recent
       * DMS symbol; inserts the next in sequence:
       *   none → °   |   ° → ′   |   ′ → ″   |   ″ → no-op
       * Uses the input atom model directly — no separate
       * state machine, no tap counter. The walk-back stops
       * at any non-digit/dot atom, so a fresh number cluster
       * starts a fresh DMS sequence. */
      if(CALC_STATE.shift){
        const last = CALC_STATE.history[CALC_STATE.history.length - 1];
        if(!last) return true;
        last.dmsActive = !last.dmsActive;
        if(typeof calcRenderUI === 'function') calcRenderUI();
        if(typeof _calcAutosave === 'function') _calcAutosave();
        return true;
      }
      // Plain tap — smart DMS character insertion.
      // Walk back from cursor through the current number cluster.
      // Track BOTH the most recent DMS marker AND whether a
      // numeric digit was seen between the cursor and that marker
      // (or before any marker for the first ° insertion). The
      // numeric requirement prevents malformed literals like
      // `64°′` — the parser needs a number between consecutive
      // markers (CR PR #123). ASCII ' / " are normalized to their
      // Unicode equivalents so users who typed via physical
      // keyboard continue the DMS sequence correctly.
      const arr = _calcAtomsAt(CALC_INPUT.cursor.path);
      const pos = CALC_INPUT.cursor.pos;
      const _DMS_NORMALIZE = { '°':'°', '′':'′', "'":'′', '″':'″', '"':'″' };
      let lastDms = null;
      let sawNumeric = false;
      for(let i = pos - 1; i >= 0; i--){
        const a = arr[i];
        if(typeof a !== 'string') break;
        if(_DMS_NORMALIZE[a]){ lastDms = _DMS_NORMALIZE[a]; break; }
        if(/[0-9.]/.test(a)){ sawNumeric = true; continue; }
        break;
      }
      // Only advance when a numeric digit sits between cursor and
      // the last marker (or before the cluster for the first °).
      // If sawNumeric is false, the user just tapped DMS twice
      // without typing — no-op rather than producing `64°′`.
      let next = null;
      if(sawNumeric){
        if(lastDms === null)     next = '°';
        else if(lastDms === '°') next = '′';
        else if(lastDms === '′') next = '″';
        // lastDms === '″' → end of DMS sequence, no-op.
      }
      if(next){
        calcInputInsertString(next);
        if(typeof _afterInput === 'function') _afterInput(true);
      }
      return true;
    }
    case 'v2-history': {
      /* feat/calc-history-panel: toggle the history panel.
       * Mutually exclusive with calcView='adv' — entering the
       * panel forces calcView back to 'basic' so the body-swap
       * branches in _calcRenderCalculateV2 can't both fire. */
      if(CALC_STATE.activePanel === 'history'){
        CALC_STATE.activePanel = null;
      } else {
        CALC_STATE.activePanel = 'history';
        if(CALC_STATE.calcView === 'adv') CALC_STATE.calcView = 'basic';
      }
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-tools':
      CALC_STATE.activePanel = null;
      calcRenderUI();
      return true;
    case 'v2-history-clear': {
      // Reuses the existing calcClearHistory which already
      // preserves CALC_STATE.vars.Ans (calc-ui.js intentional).
      if(typeof calcClearHistory === 'function') calcClearHistory();
      // calcClearHistory already calls calcRenderUI internally,
      // but it doesn't autosave the cleared state — do it here
      // so closing the calc widget right after Clear keeps the
      // empty history.
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-history-recall': {
      /* Tap-an-entry handler. The button carries data-history-idx
       * pointing at the original (un-reversed) array index, so
       * CALC_STATE.history[idx] is the recalled entry. Closing
       * the panel after recall lands the teacher back on the
       * keypad with the expression in the live input — ready
       * to edit or re-EXE. */
      const raw = btn && btn.dataset ? btn.dataset.historyIdx : null;
      const idx = parseInt(raw, 10);
      if(!Number.isFinite(idx) || idx < 0 || idx >= CALC_STATE.history.length) return true;
      if(typeof _calcRecallHistory === 'function'){
        _calcRecallHistory(CALC_STATE.history[idx]);
      }
      CALC_STATE.activePanel = null;
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-catalog': {
      /* feat/calc-catalog-panel: toggle the catalog panel.
       * Mirrors v2-history's mutual-exclusion logic with ADV
       * view. Reset the search query on close so re-opening
       * starts with a fresh empty filter. */
      if(CALC_STATE.activePanel === 'catalog'){
        CALC_STATE.activePanel = null;
        if(typeof _calcCatalogSetQuery === 'function') _calcCatalogSetQuery('');
      } else {
        CALC_STATE.activePanel = 'catalog';
        if(CALC_STATE.calcView === 'adv') CALC_STATE.calcView = 'basic';
      }
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-catalog-select': {
      /* Tap an entry — read data-catalog-id, route through
       * _calcCatalogHandleSelect which dispatches the right
       * insert helper, calls _afterInput(true), closes the
       * panel, and triggers a render. */
      const id = btn && btn.dataset ? btn.dataset.catalogId : null;
      if(typeof id === 'string' && id && typeof _calcCatalogHandleSelect === 'function'){
        _calcCatalogHandleSelect(id);
      }
      return true;
    }
    case 'v2-e10':
      /* ×10ⁿ — scientific-notation entry, inserted as the explicit '×10^'.
       *
       * NOT a bare 'E'. The tokenizer does read 3E8 as 3×10⁸, but 'E' is also
       * one of CALC_STATE.vars, so an exponent marker not immediately followed
       * by digits degrades into the variable: '5E' evaluates to 0 SILENTLY
       * (5 × E, E=0) — measured. '×10^' cannot collide, reads the way it is
       * written, takes a negative exponent without parentheses (2×10^-3 →
       * 0.002), and fails loudly ('Bad operator') if left incomplete. */
      if(typeof calcInputInsertString === 'function'){
        calcInputInsertString('×10^');
        if(typeof _afterInput === 'function') _afterInput(true);
      }
      return true;
    case 'v2-pm': {
      /* ± with a SHIFT secondary of |x| (spec Row M3 Col 6).
       *   SHIFT+± → wrap in abs(): the engine has abs (calc-core.js).
       *   plain ± → negate. There is no unary-minus atom, so this brackets
       *   the expression as -(…) which the tokenizer already parses, instead
       *   of inserting a bare '-' that would read as subtraction. */
      if(typeof calcInputInsertString !== 'function') return true;
      if(CALC_STATE.shift){
        calcInputInsertString('abs(');
      } else {
        calcInputInsertString('-(');
      }
      if(typeof _afterInput === 'function') _afterInput(true);
      return true;
    }
    case 'v2-undo':
    case 'v2-redo': {
      /* Input-level undo/redo (calc-undo.js). Operates on CALC_INPUT only —
       * never on evaluated history — and both stacks reset at EXE/AC. */
      const moved = (act === 'v2-undo')
        ? (typeof calcUndo === 'function' && calcUndo())
        : (typeof calcRedo === 'function' && calcRedo());
      if(!moved){
        if(typeof showToast === 'function') showToast(act === 'v2-undo' ? 'Nothing to undo' : 'Nothing to redo');
        return true;
      }
      /* Restoring input means the big fresh-result block is no longer what the
       * user is looking at — demote it exactly as typing would. */
      if(typeof _calcResultFresh !== 'undefined') _calcResultFresh = false;
      if(typeof _calcDisplayCleared !== 'undefined') _calcDisplayCleared = false;
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcUpdatePreview === 'function') _calcUpdatePreview();
      return true;
    }
    case 'v2-clear': {
      /* CLEAR = wipe the whole history list, behind a confirm. Distinct from
       * AC (which clears only the live input) and from the HISTORY panel's own
       * Clear button — this one is reachable from the action row without
       * opening the panel. Same confirm-guard shape as resetSession. */
      if(!Array.isArray(CALC_STATE.history) || CALC_STATE.history.length === 0){
        if(typeof showToast === 'function') showToast('No history to clear');
        return true;
      }
      const n = CALC_STATE.history.length;
      if(typeof confirm === 'function' &&
         !confirm('Clear all ' + n + ' calculation' + (n === 1 ? '' : 's') + ' from history? This cannot be undone.')) return true;
      /* Route through the single choke point rather than emptying the array
       * here. calcClearHistory (calc-ui.js) also resets _calcHistIdx and
       * disarms _calcAnsChainArmed — clearing inline left a browsed history
       * index dangling past the end of the now-empty array, and let a still-
       * armed Ans chain auto-insert Ans against an empty history on the next
       * operator press. */
      if(typeof calcClearHistory === 'function'){
        calcClearHistory();
      } else {
        CALC_STATE.history.length = 0;
        if(typeof calcRenderUI === 'function') calcRenderUI();
      }
      if(typeof _calcAutosave === 'function') _calcAutosave();
      if(typeof showToast === 'function') showToast('History cleared');
      return true;
    }
    case 'v2-home':
      /* The HOME pill duplicates the header's apps icon, which already calls
       * calcGoHome() (calc-ui.js). Route to the same function rather than
       * reimplementing the mode-picker transition. */
      if(typeof calcGoHome === 'function') calcGoHome();
      return true;
    case 'v2-ok':
      /* D-pad centre. There is no selection model in the expression editor —
       * the arrows move a cursor, they don't select — so OK's only sensible
       * meaning is "commit", the same as EXE. Routed to the keypad's own EXE
       * path so ans-chaining, history push and the undo reset all behave
       * identically to pressing EXE. */
      if(typeof _calcExecute === 'function'){
        _calcExecute();
        if(typeof calcUndoReset === 'function') calcUndoReset();
      }
      return true;
    case 'v2-var-sto':
    case 'v2-mem-add':
    case 'v2-mem-sub': {
      /* STO / M+ / M− all need "the value currently on screen". */
      const v = _calcV2CurrentValue();
      if(v === null){
        if(typeof showToast === 'function') showToast('Nothing to store');
        return true;
      }
      let name = 'M';
      if(act === 'v2-var-sto'){
        name = btn && btn.dataset ? btn.dataset.var : '';
        // Only ever write a slot that already exists — never widen the var set
        // from a DOM attribute.
        if(!name || !_calcHasOwn(CALC_STATE.vars, name) || name === 'Ans'){
          if(typeof showToast === 'function') showToast('Unknown variable');
          return true;
        }
        CALC_STATE.vars[name] = v;
      } else {
        const cur = Number(CALC_STATE.vars.M) || 0;
        CALC_STATE.vars.M = (act === 'v2-mem-add') ? cur + v : cur - v;
        name = 'M';
      }
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      if(typeof showToast === 'function'){
        showToast(act === 'v2-var-sto' ? (name + ' = ' + CALC_STATE.vars[name])
                                       : ('M = ' + CALC_STATE.vars.M));
      }
      return true;
    }
    case 'v2-mem-clear':
      CALC_STATE.vars.M = 0;
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      if(typeof showToast === 'function') showToast('Memory cleared');
      return true;
    case 'v2-var-rcl': {
      /* RCL types the variable into the expression. The engine resolves it at
       * evaluation time (calc-core.js), so this is a real recall, not a paste
       * of the current value — edit the variable later and the expression
       * re-evaluates with the new value. Closes the panel so the user is
       * looking at what they just changed. */
      const name = btn && btn.dataset ? btn.dataset.var : '';
      if(!name || !_calcHasOwn(CALC_STATE.vars, name)){
        if(typeof showToast === 'function') showToast('Unknown variable');
        return true;
      }
      if(typeof calcInputInsertString === 'function') calcInputInsertString(name);
      CALC_STATE.activePanel = null;
      if(typeof _afterInput === 'function') _afterInput(true);
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    case 'v2-setup':
    case 'v2-help':
    case 'v2-vars': {
      /* Panel toggles — same shape as v2-history / v2-tools, including the
       * mutual exclusion with calcView='adv'. */
      const want = act.slice(3);            // 'setup' | 'help' | 'vars'
      if(CALC_STATE.activePanel === want){
        CALC_STATE.activePanel = null;
      } else {
        CALC_STATE.activePanel = want;
        if(CALC_STATE.calcView === 'adv') CALC_STATE.calcView = 'basic';
      }
      if(typeof calcRenderUI === 'function') calcRenderUI();
      if(typeof _calcAutosave === 'function') _calcAutosave();
      return true;
    }
    default:
      // Unknown actions stay observable during development.
      if(typeof act === 'string' && act.indexOf('v2-') === 0){
        // eslint-disable-next-line no-console
        console.warn('[calc-v2] unknown action:', act);
        return true;
      }
      return false;
  }
}

/* features/calc/calc-catalog.js — Searchable function browser
 * surfaced through the CATALOG button in the v15 toolbar.

 * Purpose: lets teachers find parser-supported functions and
 * templates that aren't on the v15 BASIC keypad (asin/acos/atan,

 * panel (PR #115):
