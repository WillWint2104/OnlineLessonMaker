/* ==== src/styles/tokens.css ==== */
/* styles/tokens.css — Design tokens, CSS custom properties, box-sizing reset, html/body base */

/* ═══ TOKENS ════════════════════════════════ */
:root{
  --p:#beffdc;--op:#1a4d35;--p2:#abebc9;--p3:#70ad8e;
  --err:#ff716c;--gold:#ffd97d;--info:#79e6ff;
  --s1:#0d0f0d;--s2:#121412;--s3:#181a18;--s4:#1e201e;--s5:#242624;--s6:#2a2d2a;
  --fg:#faf9f5;--fg2:#ababa8;--fg3:#949693;--ov:#474846;
  --wb-bg:#ffffff;--wb-major:rgba(0,0,0,0.10);--wb-minor:rgba(0,0,0,0.05);
  --wb-sz:52px;--wb-border:rgba(190,255,220,0.22);--wb-wm:0.035;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}

/* ==== src/styles/base.css ==== */
/* styles/base.css — Body, form elements, navigation, buttons, pills, builder layout, sidebar, context bar, cards, components */
body{background:var(--s1);color:var(--fg);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;}
button,select,input,textarea{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;}
button{cursor:pointer;border:none;background:none;}
button:active{transform:scale(.95);}
input,textarea,select{color:var(--fg);background:var(--s2);border:1px solid rgba(71,72,70,.35);border-radius:8px;padding:8px 11px;outline:none;font-size:13px;}
input:focus,textarea:focus,select:focus{border-color:rgba(190,255,220,.4);}
input::placeholder,textarea::placeholder{color:var(--fg3);}
.hf{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;}
.ms{font-family:'Material Symbols Outlined';font-style:normal;font-weight:normal;line-height:1;display:inline-flex;align-items:center;user-select:none;vertical-align:middle;}
.ver{display:none;position:fixed;bottom:8px;right:12px;z-index:999;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);background:var(--s2);border:1px solid var(--ov);border-radius:999px;padding:3px 9px;pointer-events:none;}
/* screens */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--s1);opacity:0;pointer-events:none;transition:opacity .26s;}
.scr.on{opacity:1;pointer-events:all;}
.scroll{overflow-y:auto;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:rgba(190,255,220,.1);border-radius:4px;}
/* top-nav */
.top-nav{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;gap:10px;background:rgba(13,15,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(190,255,220,.08);position:relative;z-index:50;flex-shrink:0;}
.nav-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;}
.bl{height:23px;width:23px;object-fit:contain;}
.nav-title{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--fg);}
.nav-sub{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);}
.nav-links{display:flex;gap:2px;}
.nl{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg2);transition:all .15s;border:1px solid transparent;cursor:pointer;}
.nl:hover{color:var(--p);background:rgba(190,255,220,.05);}
.nl.on{color:var(--p);background:rgba(190,255,220,.09);border-color:rgba(190,255,220,.17);}
.nav-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.av{width:25px;height:25px;border-radius:50%;background:rgba(190,255,220,.08);border:1px solid rgba(190,255,220,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--p);font-size:12px;}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:all .15s;border:none;cursor:pointer;}
.btn:active{transform:scale(.95);}
.btn-p{background:var(--p);color:var(--op);}
.btn-p:hover{box-shadow:0 0 15px rgba(190,255,220,.26);}
.btn-g{background:rgba(26,28,26,.88);color:var(--fg2);border:1px solid rgba(71,72,70,.4);}
.btn-g:hover{color:var(--p);border-color:rgba(190,255,220,.22);}
.btn-e{background:rgba(255,113,108,.11);color:var(--err);border:1px solid rgba(255,113,108,.25);}
.btn-e:hover{background:rgba(255,113,108,.18);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-ghost{background:rgba(190,255,220,.07);color:var(--p);border:1px solid rgba(190,255,220,.18);}
.btn-ghost:hover{background:rgba(190,255,220,.13);}
.btn-silk{background:linear-gradient(135deg,var(--p),var(--p3));color:var(--op);}
.btn-silk:hover{box-shadow:0 0 18px rgba(190,255,220,.22);}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(22,24,22,.92);border:1px solid rgba(190,255,220,.11);font-size:8px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--p);}
.rbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,113,108,.1);border:1px solid rgba(255,113,108,.25);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--err);}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--err);animation:rp 1.2s ease-in-out infinite;flex-shrink:0;}
/* builder */
.bl-layout{display:flex;flex:1;min-height:0;overflow:hidden;}
.sidebar{width:200px;flex-shrink:0;background:var(--s2);border-right:1px solid rgba(190,255,220,.06);display:flex;flex-direction:column;padding:11px 9px;overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(190,255,220,.09);border-radius:4px;}
.sb-lbl{font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--fg3);padding:10px 7px 5px;}
.sbi{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--fg2);cursor:pointer;transition:all .13s;border:1px solid transparent;margin-bottom:1px;}
.sbi:hover{color:var(--fg);background:rgba(190,255,220,.05);}
.sbi.on{color:var(--p);background:rgba(190,255,220,.08);border-color:rgba(190,255,220,.13);}
.sbi.dim{opacity:.28;pointer-events:none;}
.sb-badge{font-size:7px;font-weight:700;padding:2px 5px;border-radius:999px;background:rgba(71,72,70,.5);color:var(--fg3);margin-left:auto;}
.sbi .ms{font-size:14px;}
/* context bar */
.ctx-bar{padding:12px 18px 0;border-bottom:1px solid rgba(71,72,70,.2);background:var(--s2);flex-shrink:0;}
.ctx-bar-lbl{font-size:8px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--fg3);margin-bottom:9px;}
.ctx-tiles{display:flex;gap:5px;overflow-x:auto;padding-bottom:0;align-items:flex-end;}
.ctx-tiles::-webkit-scrollbar{height:2px;}
.ctx-tiles::-webkit-scrollbar-thumb{background:rgba(190,255,220,.1);border-radius:4px;}
.ctx-tile{display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;flex-shrink:0;position:relative;}
.ctx-thumb{width:76px;height:44px;border-radius:8px 8px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid rgba(71,72,70,.28);border-bottom:none;background:var(--s3);transition:all .14s;overflow:hidden;}
.ctx-thumb:hover{border-color:rgba(190,255,220,.28);background:var(--s4);}
.ctx-tile.sel .ctx-thumb{background:var(--s1);border-color:var(--p);border-bottom:1.5px solid var(--s1);}
.ctx-tile-icon{font-size:14px!important;}
.ctx-tile-name{font-size:7px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);}
.ctx-tile.sel .ctx-tile-name{color:var(--p);}
.ctx-tile.intro-tile.sel .ctx-thumb{border-color:var(--p);}
.ctx-tile.lesson-tile.sel .ctx-thumb{border-color:var(--info);}
.ctx-tile.lesson-tile.sel .ctx-tile-name{color:var(--info);}
.ctx-tile.outro-tile.sel .ctx-thumb{border-color:var(--p2);}
.ctx-tile.outro-tile.sel .ctx-tile-name{color:var(--p2);}
.ctx-strip{height:2.5px;width:100%;background:transparent;border-radius:999px 999px 0 0;}
.ctx-tile.sel.intro-tile .ctx-strip{background:var(--p);}
.ctx-tile.sel.lesson-tile .ctx-strip{background:var(--info);}
.ctx-tile.sel.outro-tile .ctx-strip{background:var(--p2);}
.ctx-add-btn{width:40px;height:44px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(190,255,220,.17);border-bottom:none;background:transparent;color:rgba(190,255,220,.28);transition:all .14s;font-size:14px;cursor:pointer;}
.ctx-add-btn:hover{border-color:var(--p);color:var(--p);}
/* context panels */
.ctx-panel-wrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--s1);}
.ctx-panel{display:none;flex:1;overflow-y:auto;padding:18px 20px;}
.ctx-panel.on{display:flex;flex-direction:column;gap:12px;animation:pfade .2s ease-out both;}
.ctx-panel::-webkit-scrollbar{width:4px;}
.ctx-panel::-webkit-scrollbar-thumb{background:rgba(190,255,220,.09);border-radius:4px;}
.ctx-actions{flex-shrink:0;padding:10px 20px;border-top:1px solid rgba(71,72,70,.18);background:var(--s2);display:flex;align-items:center;gap:7px;}
/* cards */
.card{background:var(--s3);border-radius:11px;border:1px solid rgba(71,72,70,.26);padding:14px;}
.clbl{font-size:9px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--p2);margin-bottom:7px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.tc{background:var(--s4);border-radius:9px;border:1px solid rgba(71,72,70,.22);padding:12px;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:6px;}
.tc:hover{border-color:rgba(190,255,220,.16);}
.tc.on{border-color:rgba(190,255,220,.25);background:rgba(190,255,220,.025);}
.tc-row{display:flex;justify-content:space-between;align-items:flex-start;}
.tc-ico{width:28px;height:28px;border-radius:7px;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--p);font-size:14px;}
.sw{width:28px;height:16px;border-radius:999px;background:var(--s5);position:relative;flex-shrink:0;transition:background .17s;}
.sw.on{background:var(--p);}
.sw-t{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .17s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
.sw.on .sw-t{transform:translateX(12px);}
.tc-n{font-weight:700;font-size:11px;color:var(--fg);}
.tc-d{font-size:10px;color:var(--fg2);line-height:1.38;}
.qbi{background:var(--s4);border-radius:7px;border:1px solid rgba(71,72,70,.2);padding:8px 10px;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.qbn{width:17px;height:17px;border-radius:4px;background:rgba(190,255,220,.09);border:1px solid rgba(190,255,220,.15);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--p);flex-shrink:0;}
.qbt{flex:1;font-size:11px;color:var(--fg2);}
.qbtype{font-size:7px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;background:rgba(190,255,220,.08);color:var(--p);flex-shrink:0;}
.qb-del{color:var(--fg3);font-size:11px;cursor:pointer;transition:color .12s;}
.qb-del:hover{color:var(--err);}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:rgba(190,255,220,.07);border:1px solid rgba(190,255,220,.12);font-size:10px;font-weight:600;color:var(--p);cursor:pointer;}
.chip:hover{background:rgba(190,255,220,.13);}
.qt-pill{padding:5px 10px;border-radius:6px;font-size:10px;font-weight:700;background:var(--s4);color:var(--fg2);border:1px solid rgba(71,72,70,.22);cursor:pointer;transition:all .12s;}
.qt-pill.on{background:rgba(190,255,220,.09);color:var(--p);border-color:rgba(190,255,220,.22);}

/* ==== src/styles/calculator.css ==== */
/* styles/calculator.css — ClassWiz-inspired HGL calculator widget
   Target: #calc-p widget panel. Much larger than legacy 240px panel;
   default 420px, scales up to 720px in fullscreen recording mode. */

/* Override the legacy #calc-p sizing when new UI is mounted.
 * border:none here because the .wp's 1px green-tinted border was
 * still being drawn even though its background was transparent —
 * reading as a faint halo around the true .calc-wrap edge and
 * letting the lesson-canvas cream bleed through the gap between
 * the two frames. With calc-wrap carrying its own visible frame,
 * the .wp's border has no job on this widget. */
#calc-p:has(.calc-wrap){
  /* Panel width locked to .calc-v2 width (520). Do not change
   * without addressing both the transparent-bg bleed and the
   * cqi feedback loop in .calc-display. Transform-scale is
   * planned as a follow-up; until then, calc resize is disabled
   * in non-fullscreen. See PR fix/calc-lock-size.
   *
   * History: fix/calc-container-fit briefly switched this to
   * `min-width: 520px` to allow resize, but #calc-p has
   * background:transparent !important + container-type:inline-
   * size, which made the lesson canvas bleed through the right
   * gap and fed the .calc-display cqi clamp — the display
   * height tracked panel width and clipped its content. */
  width: 520px;
  max-width: 520px;
  padding: 0 !important;
  background: transparent !important;
  border: none !important;
  /* display: flex is scoped below to .on so removing the open class
   * still falls back to .wp's default display:none. Without that
   * gate, the high-specificity #calc-p:has(...) rule kept the panel
   * visible after togCalc() removed .on — clicking X looked like
   * a no-op, and a follow-up click re-toggled .on back ON, force-
   * resetting CALC_STATE.mode to 'home' (per togCalc) so the calc
   * appeared to "navigate" to the mode-selection screen on every
   * close attempt. The .on gate restores normal hide-on-close
   * behavior. */
}
#calc-p.on:has(.calc-wrap){
  /* Flex column so .calc-wrap can claim "remaining height under
   * the .wp-drag bar" via flex:1. Only applied when the panel is
   * open — see comment on the parent rule above for why. */
  display: flex;
  flex-direction: column;
}
/* Make .calc-wrap fill the panel so the corner resize handle (shared
 * widget-shell affordance) doesn't reveal the panel's transparent
 * background — which would otherwise show the lesson canvas
 * (whiteboard cream) bleeding through below the calculator content
 * as a "draggable white area" after a resize drag. flex:1 +
 * min-height:0 lets the wrap grow alongside the panel without
 * overflowing past it. .calc-resize stays absolutely positioned
 * so the corner handle remains hit-targetable; the .wp-drag bar
 * keeps its natural 22 px height as the column's first child. */
#calc-p:has(.calc-wrap) > .calc-wrap{
  flex: 1;
  min-height: 0;
}

.calc-wrap{
  display:flex; flex-direction:column;
  background: var(--s2);
  border: 1px solid rgba(190,255,220,.18);
  /* Top corners square — the .wp-drag green bar sits above this
   * element and owns the widget's top radius (inherited from .wp's
   * 11px). Flat top lets .calc-wrap meet the drag bar's flat bottom
   * edge flush, with no corner crescent where lesson-canvas cream
   * could bleed through. Bottom corners match .wp's 11px so the
   * widget clips cleanly within the parent's rounded clip rather
   * than poking past it. Previously 12px all round produced both
   * bleed paths — at the top corners (rounded inward from the
   * flat-bottomed drag bar) and at the bottom corners (calc-wrap's
   * 12px arc vs .wp's 11px clip leaving a 1px crescent). That was
   * the "weird white back container" follow-up flagged after PR-6
   * merged. */
  border-radius: 0 0 11px 11px;
  box-shadow: 0 8px 30px rgba(0,0,0,.6);
  overflow: hidden;
  font-family: 'Plus Jakarta Sans', ui-sans-serif,system-ui,sans-serif;
}

/* ── FULLSCREEN RECORDING MODE ─────────────────────────────────
 * PR-4 (feedback #12): "Enlarged mode should not just be a scaled
 * version of the smaller widget. It should use a defined expanded
 * layout with fixed dimensions, consistent padding, and correct
 * internal spacing." The outer panel is already a defined box
 * (position:fixed; inset:5vh 5vw; max-width:1200px); the internal
 * sizing used to rely on the compact layout's clamp(... cqi ...)
 * rules scaling up with container width. That was the "scaled feel"
 * the feedback flagged — paddings, icon sizes, badge paddings all
 * grew proportionally instead of hitting defined values.
 *
 * Fix: override every cqi-based sizing rule that matters at
 * fullscreen with explicit pixel values. Buttons, display, history,
 * header icons, and the Home tile grid all get defined dimensions
 * scoped to .calc-fs (compact mode is unchanged — these overrides
 * only apply when CALC_STATE.fullscreen is true). Home also swaps
 * to a 4-column tile grid so the selector feels purposeful at
 * large sizes instead of stretched 2-column cells.
 */
#calc-p.calc-fs-wrap{
  position: fixed !important;
  inset: 5vh 5vw !important;
  width: 90vw !important;
  height: 90vh !important;
  max-width: 1200px;
  max-height: 860px;
  margin: 0 auto;
  z-index: 500 !important;
}

/* Base font anchor — everything below is px so the cqi inheritance
 * in the compact rules is overridden, not amplified. */
.calc-fs{ font-size: 15px; }

/* Header: fixed padding + icon sizing at fullscreen. Compact uses
 * clamp(5px, 2cqi, 11px) padding which already capped near these
 * values; making it defined px at fullscreen just removes the
 * subtle wobble when the panel is drag-resized within the fullscreen
 * wrapper (teachers wouldn't, but it removes the cqi pathway). */
.calc-fs .calc-hdr{ padding: 10px 14px; gap: 10px; }
.calc-fs .calc-home-btn,
.calc-fs .calc-fs-btn,
.calc-fs .calc-x,
.calc-fs .calc-clear-btn{ width: 34px; height: 34px; border-radius: 8px; }
.calc-fs .calc-home-btn .ms,
.calc-fs .calc-fs-btn .ms,
.calc-fs .calc-x .ms,
.calc-fs .calc-clear-btn .ms{ font-size: 18px; }
.calc-fs .calc-brand{ font-size: 18px; }
.calc-fs .calc-badge{ font-size: 11px; padding: 3px 8px; }

/* Display + history: generous fixed spacing so the big-text
 * recording mode reads clearly from across a room. */
/* Explicit `height` here is required because the base .calc-display
 * rule now uses `height: clamp(...)` (not min-height); a min-height-
 * only override at fullscreen would be silently shadowed. Keeping
 * min-height alongside as a defensive floor in case another rule
 * ever resets height back to auto. Fullscreen gets a taller fixed
 * slot than the compact 280 px max so the larger fonts + padding
 * have room to breathe with the same panel-stability guarantee. */
.calc-fs .calc-display{ height: 320px; min-height: 260px; padding: 16px 20px; gap: 14px; }
.calc-fs .calc-input{ font-size: 32px; line-height: 1.3; }
.calc-fs .calc-preview{ font-size: 18px; }
.calc-fs .calc-history{ gap: 6px; }
.calc-fs .calc-hist-row{ font-size: 15px; padding: 6px 10px; gap: 14px; }
.calc-fs .calc-hist-empty{ font-size: 14px; padding: 20px; }

/* Keypad: every button gets the same defined dimensions so the
 * grid feels deliberately large rather than "whatever cqi worked
 * out to". 46px tall matches the Round-B cqi max for compact mode
 * but applied consistently rather than scaling from content. */
.calc-fs .calc-keypad{ padding: 14px; gap: 8px; }
.calc-fs .calc-keyrow{ gap: 8px; }
.calc-fs .ck{
  font-size: 18px;
  min-height: 46px;
  padding: 10px 12px;
  border-radius: 8px;
}

/* Home at fullscreen — 4x2 grid (was 2x4 in compact) with larger
 * tiles. This is the concrete "defined layout swap" item #12 asked
 * for: not a scale of the compact version but a differently-shaped
 * mode selector tuned for the fullscreen footprint. */
.calc-fs.calc-home .calc-tile-grid,
.calc-fs .calc-home .calc-tile-grid{
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 0 24px 24px;
}
.calc-fs .calc-tile{ padding: 28px 10px; gap: 10px; font-size: 13px; }
.calc-fs .calc-tile-icon{ font-size: 42px; }
.calc-fs .calc-tile-label{ font-size: 14px; }
.calc-fs .calc-home-title{ padding: 22px 24px 16px; font-size: 13px; }

/* ── HEADER ─────────────────────────────────────────────────── */
.calc-hdr{
  display:flex; align-items:center;
  gap:clamp(4px, 2cqi, 10px);
  padding: clamp(5px, 2cqi, 11px) clamp(7px, 2.5cqi, 14px);
  background: var(--s3);
  border-bottom: 1px solid rgba(71,72,70,.3);
}
.calc-home-btn, .calc-fs-btn, .calc-x, .calc-clear-btn{
  width: clamp(22px, 7cqi, 34px);
  height: clamp(22px, 7cqi, 34px);
  padding: 0;
  border: 1px solid rgba(71,72,70,.4);
  border-radius: clamp(4px, 1.5cqi, 8px);
  background: var(--s4); color: var(--fg2);
  cursor: pointer; display: inline-flex; align-items:center; justify-content:center;
  transition: all .12s;
}
.calc-home-btn:hover, .calc-fs-btn:hover, .calc-clear-btn:hover{ color: var(--p); border-color: rgba(190,255,220,.3); }
.calc-x:hover{ color: var(--err); border-color: rgba(255,113,108,.35); }
.calc-home-btn .ms, .calc-fs-btn .ms, .calc-x .ms, .calc-clear-btn .ms{
  font-size: clamp(12px, 4cqi, 18px);
}
.calc-brand{
  flex:1; font-weight: 800;
  font-size: clamp(11px, 4cqi, 18px);
  color: var(--fg); letter-spacing: -.01em;
}
.calc-badge{
  font-size: clamp(8px, 2.8cqi, 11px);
  font-weight: 700; letter-spacing: .1em;
  padding: clamp(1px, .6cqi, 3px) clamp(4px, 1.8cqi, 8px);
  border-radius: 4px;
  background: rgba(190,255,220,.1); color: var(--p);
}

/* ── HOME TILE GRID ─────────────────────────────────────────── */
.calc-home-title{
  padding: 14px 16px 10px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg3);
}
.calc-tile-grid{
  display:grid; grid-template-columns: repeat(2, 1fr);
  gap: 8px; padding: 0 12px 14px;
}
.calc-tile{
  position: relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 6px; padding: 18px 8px;
  background: var(--s3);
  border: 1px solid rgba(71,72,70,.35);
  border-radius: 8px;
  color: var(--fg); cursor: pointer;
  transition: all .14s;
  font-family: inherit; font-size: 11px;
}
.calc-tile:hover:not(.dim){
  background: rgba(190,255,220,.06);
  border-color: rgba(190,255,220,.25);
  transform: translateY(-1px);
}
.calc-tile.dim{ opacity: .4; cursor: default; }
.calc-tile-icon{ font-size: 28px; color: var(--p); }
.calc-tile.dim .calc-tile-icon{ color: var(--fg3); }
.calc-tile-label{ font-weight: 700; font-size: 11px; }
.calc-tile-soon{
  position: absolute; top: 4px; right: 5px;
  font-size: 7px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase;
  padding: 2px 5px; border-radius: 3px;
  background: rgba(71,72,70,.6); color: var(--fg3);
}

/* ── DISPLAY ──────────────────────────────────────────────────
 * Round-B round-2: display area now scales with panel width via
 * container-query units. When the teacher drags the calc larger,
 * the input line grows proportionally instead of sitting as small
 * text in a wide empty box. */
.calc-display{
  background: #0a0b0a;
  border-bottom: 1px solid rgba(71,72,70,.3);
  padding: clamp(6px, 2cqi, 12px) clamp(8px, 3cqi, 18px) clamp(8px, 2.5cqi, 14px);
  /* Fixed height range that pre-allocates room for the fresh-result
   * block (.calc-result-large adds ~90 px when set). With min-height
   * alone the display grew to fit content, so the panel itself
   * grew/shrank between fresh and non-fresh states (panel height is
   * content-driven by design — see widgetShellConfig.js comment on
   * defaultH being dropped). Locking the display to a clamp range
   * keeps the panel size stable across:
   *   • typing (input wraps within this slot, panel doesn't grow)
   *   • Enter (result-large fits in the pre-allocated space)
   *   • next-input (input row reappears in the same slot)
   * justify-content:flex-end anchors content to the bottom so the
   * empty space when not-fresh sits cleanly above. */
  height: clamp(220px, 50cqi, 280px);
  /* Clip internal overflow. With a fixed height + justify-content:
   * flex-end, a content total greater than the display height
   * (e.g. fresh-result block + a many-rows history + a wrapped
   * input) would spill UPWARD past the display's top edge and
   * cover the .calc-hdr above it. The .calc-history child has its
   * own max-height + overflow-y:auto so long history scrolls
   * within itself; this rule contains anything else that exceeds. */
  overflow: hidden;
  display:flex; flex-direction:column; justify-content:flex-end;
  font-family: 'Plus Jakarta Sans', ui-sans-serif,system-ui,sans-serif;
}
.calc-history{
  display:flex; flex-direction:column; gap: 2px;
  max-height: 90px; overflow-y: auto;
  margin-bottom: 6px;
}
.calc-history::-webkit-scrollbar{ width: 3px; }
.calc-history::-webkit-scrollbar-thumb{ background: rgba(190,255,220,.15); border-radius: 3px; }
.calc-hist-row{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size: 11px; color: var(--fg2);
  padding: 2px 0;
  border-bottom: 1px dashed rgba(71,72,70,.25);
}
.calc-hist-in{ flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calc-hist-out{ color: var(--p); font-weight: 700; padding-left: 10px; }
.calc-hist-empty{
  font-size: 10px; color: var(--fg3);
  padding: 12px 6px; text-align: center; font-style: italic;
}
/* Fresh-result layout — when calc-ui.js sets _calcResultFresh after
 * EXE, the display gains the .calc-display--fresh modifier and a
 * .calc-result-large block at the bottom holds the just-evaluated
 * result at recording-readable size (52 px value) until the user
 * begins their next expression. The history list above is pushed to
 * the top via margin-bottom:auto so the display reads:
 *   [older history rows ........]   ← top, small 11 px
 *   [empty input row ............]
 *   [calc-result-large ..........]  ← bottom, prominent
 */
.calc-display--fresh .calc-history{ margin-bottom: auto; }
.calc-result-large{
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 4px;
  padding: 8px 4px 2px;
  border-top: 1px solid rgba(190,255,220,.08);
  margin-top: 6px;
}
.calc-result-expr{
  font-size: clamp(13px, 4cqi, 18px);
  color: var(--fg2);
  font-weight: 500;
  text-align: right;
  word-break: break-all;
  line-height: 1.25;
  max-width: 100%;
}
.calc-result-value{
  font-size: clamp(34px, 12cqi, 52px);
  line-height: 1.05;
  color: var(--p);
  font-weight: 700;
  text-align: right;
  word-break: break-all;
  max-width: 100%;
}

.calc-input-row{ display:flex; flex-direction:column; gap: 3px; }
.calc-input{
  font-size: clamp(18px, 6cqi, 34px);
  font-weight: 600; color: var(--fg);
  line-height: 1.2;
  min-height: clamp(28px, 8cqi, 48px);
  overflow-wrap: break-word;
}
.calc-preview{
  font-size: clamp(11px, 3.5cqi, 18px);
  color: var(--p); text-align: right;
  min-height: clamp(14px, 4cqi, 22px);
}

/* ── CARET ──────────────────────────────────────────────────── */
.ct-caret{
  display: inline-block; width: 2px; height: 1.1em;
  background: var(--p); margin: 0 1px;
  vertical-align: text-bottom;
  animation: ct-blink 1s step-end infinite;
}
@keyframes ct-blink{ 50% { opacity: 0; } }

/* ── TEMPLATES (natural display) ────────────────────────────── */
.ct-frac{
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle;
  margin: 0 2px; font-size: .9em;
}
.ct-num, .ct-den{ padding: 0 3px; min-width: 10px; }
.ct-bar{ width: 100%; height: 1px; background: currentcolor; margin: 1px 0; }
/* fix/calc-mixed-baseline-alignment: two coupled fixes to make
 * mixed-number rendering align with adjacent .ct-frac in the
 * display strip.
 * 1. vertical-align: middle — .ct-frac (above) declares this;
 *    .ct-mixed was missing it, defaulting to inline-flex's
 *    baseline-of-last-child behavior, which floated the mixed
 *    structure higher than adjacent simple fractions.
 * 2. .ct-w font-size 1em → 0.9em — whole-number digit now
 *    renders at the same scale as nested fraction digits (and
 *    as adjacent standalone fractions). Matches TI-calculator
 *    notation convention.
 * Button-label .ct-mixed is scoped-overridden by
 * .calc-v2-mathkey .ct-mixed (calculator-v2.css) at higher
 * specificity — unaffected by these base-rule changes. */
.ct-mixed{
  display: inline-flex; align-items: center; gap: 3px;
  vertical-align: middle;
}
.ct-mixed .ct-w{ font-size: 0.9em; }
/* fix/calc-power-superscript-rendering: parent changed from
 * inline-flex to inline-block. inline-flex made <sup> children
 * flex items, which silently ignore vertical-align: super; the
 * exponent rendered at baseline. inline-block restores normal
 * inline flow where the default <sup> vertical-align works. */
.ct-pow{ display: inline-block; }
.ct-pow .ct-exp{ font-size: .7em; margin-left: 1px; }
.ct-sqrt{ display: inline-flex; align-items: center; }
.ct-radsym{ font-size: 1.1em; }
.ct-rad{
  border-top: 1px solid currentcolor;
  padding: 0 3px 0 2px; margin-left: -2px;
}
.ct-nroot{ display: inline-flex; align-items: flex-start; }
.ct-nroot .ct-deg{ font-size: .6em; margin-right: -3px; position: relative; top: 0; }
.ct-abs{ display: inline; }
/* fix/calc-power-superscript-rendering: parent changed from
 * inline-flex to inline-block for the same reason as .ct-pow —
 * the <sub class="ct-base"> for log's subscripted base needs
 * normal inline flow so vertical-align: sub takes effect.
 * Without this, log₂(8) rendered as "log2(8)" with the base at
 * baseline. */
.ct-log{ display: inline-block; }
.ct-log .ct-base{ font-size: .7em; margin: 0 1px; vertical-align: sub; }
.ct-paren{ color: var(--fg2); }
.ct-empty{
  /* Legibility sweep (fix/calc-legibility-sweep): min-width
   * 8 → 12 so the unfocused box reads as a substantial slot;
   * font-size 0.85em → 1em so the placeholder matches the
   * surrounding glyph scale instead of looking like a half-size
   * stub next to typed characters. */
  display: inline-block; min-width: 12px; padding: 0 2px;
  color: rgba(190,255,220,.35); font-size: 1em;
}
/* Focused empty slot — accent border + subtle fill so the user
 * can see which placeholder square the cursor is in. Populated
 * slots continue to rely on the .ct-caret blink for focus signal;
 * the focused class only fires when atoms.length === 0 (see the
 * empty-slot branch in calcRender). */
.ct-empty.is-focused{
  color: var(--p);
  background: rgba(190,255,220,.08);
  border: 1px solid var(--p);
  border-radius: 3px;
  /* Legibility sweep: padding 0 4 → 0 5 to compensate for the
   * larger base so the focused indicator stays visually
   * proportional with the new 12px min-width / 1em base. */
  padding: 0 5px;
}

/* ── KEYPAD ───────────────────────────────────────────────────
 * Round-B round-2: button grid scales proportionally with panel.
 * On a small panel keys stay tap-friendly (min 30px), on a large
 * panel they grow to keep the key grid readable (max 52px). */
.calc-keypad{
  padding: clamp(6px, 2cqi, 12px);
  display: flex; flex-direction: column;
  gap: clamp(3px, 1.2cqi, 7px);
  background: var(--s2);
}
.calc-keyrow{
  display: flex;
  gap: clamp(3px, 1cqi, 6px);
}
.calc-keyrow > .ck{ flex: 1; }
.ck{
  min-height: clamp(30px, 8cqi, 52px);
  padding: clamp(4px, 1.5cqi, 9px) clamp(3px, 1cqi, 6px);
  background: var(--s3); color: var(--fg);
  border: 1px solid rgba(71,72,70,.3);
  border-radius: clamp(4px, 1.5cqi, 8px);
  cursor: pointer;
  font-family: inherit;
  font-size: clamp(10px, 3.2cqi, 16px);
  font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
  /* Scope transition to color-only properties. `transition: all .1s`
   * previously animated the :active translateY(1px) press-down
   * (felt sluggish — "the button activated before I fully clicked")
   * and the .ck-exe:hover box-shadow glow fading in/out across the
   * panel re-render that follows EXE. Transform and box-shadow now
   * snap instantly; color shifts on hover still animate smoothly. */
  transition: background-color .1s, border-color .1s, color .1s;
}
.ck:hover{
  background: rgba(190,255,220,.06);
  border-color: rgba(190,255,220,.25);
}
.ck:active{ transform: translateY(1px); }
.ck .ms{ font-size: 14px; }
.ck .ck-l{ font-size: 10px; font-weight: 700; letter-spacing: .05em; }
.ck .ck-bar{ display:inline-block; width:10px; height:1px; background:currentcolor; margin:1px 2px; }

/* Modifier latches */
.ck-mod.on{
  background: var(--gold); color: #0d0f0d;
  border-color: var(--gold);
}
/* Nav keys */
.ck-nav{ background: var(--s4); }
/* Function keys */
.ck-fn{ background: rgba(121,230,255,.08); color: var(--info); border-color: rgba(121,230,255,.2); }
.ck-fn:hover{ background: rgba(121,230,255,.13); }
/* Template keys */
.ck-tmpl{ background: rgba(190,255,220,.08); color: var(--p); border-color: rgba(190,255,220,.2); }
.ck-tmpl:hover{ background: rgba(190,255,220,.13); }
/* Number keys */
.ck-num{ background: var(--s5); font-size: 14px; font-weight: 700; }
/* Operator keys */
.ck-op{ background: rgba(255,217,125,.08); color: var(--gold); border-color: rgba(255,217,125,.25); font-weight: 800; }
.ck-op:hover{ background: rgba(255,217,125,.15); }
/* Variable keys */
.ck-var{ background: rgba(171,235,201,.08); color: var(--p2); font-weight: 700; }
/* Constants */
.ck-const{ background: rgba(190,255,220,.06); color: var(--p); font-style: italic; }
/* Clear keys */
.ck-clr{ background: rgba(255,113,108,.09); color: var(--err); border-color: rgba(255,113,108,.25); }
.ck-clr:hover{ background: rgba(255,113,108,.14); }
/* Toggle keys */
.ck-toggle{ background: var(--s4); font-size: 10px; font-weight: 700; letter-spacing: .05em; }
.ck-conv{ background: rgba(121,230,255,.08); color: var(--info); font-size: 10px; }
/* Execute key */
.ck-exe{
  background: var(--p); color: var(--op);
  border-color: var(--p); font-weight: 900;
}
.ck-exe:hover{ box-shadow: 0 0 14px rgba(190,255,220,.3); }

/* ==== src/styles/calculator-v2.css ==== */
/* ──────────────────────────────────────────────────────────────
   Calc redesign v15 — Phase 1
   --------------------------------------------------------------
   Layered on top of calculator.css. Activates when the calc panel
   is rendered as `.calc-wrap.calc-v2` (i.e. CALC_STATE.calcView ===
   'basic' inside mode === 'calculate'). Uses .calc-v2-* classes
   to avoid colliding with the legacy keypad's .ck rules. Buttons
   keep their .ck class for event-delegation compatibility — only
   the visual rules differ.
   ──────────────────────────────────────────────────────────────── */

/* Neutralize legacy .ck min-height clamp for the v2 scope. v2
 * selectors below own their own heights explicitly. Replaces
 * the min-height parts of four ad-hoc neutralizations
 * previously scattered across this file (D-pad, panel-hdr,
 * history rows, catalog rows).
 *
 * .ck padding is NOT globally neutralized — selectors that
 * declare their own padding (.calc-v2-act, .calc-v2-mathkey,
 * .calc-v2-history-row, .calc-v2-catalog-row) would lose via
 * specificity (per-selector 0,1,0 vs scoped-.ck 0,2,0). The
 * per-selector ad-hoc padding declarations remain affirmative
 * (.calc-v2-dpad .ck padding: 0 for D-pad geometry,
 * .calc-v2-panel-hdr .ck padding: 4px 10px for panel headers).
 * See fix/calc-legibility-sweep. */
.calc-v2 .ck { min-height: 0; }

.calc-v2 {
  /* v15 color tokens. Local to .calc-v2 — these don't bleed into
   * the rest of the app. */
  --calc-amber-text: #f0c040;
  --calc-amber-text-light: #fad97a;
  --calc-amber-outline: #d4a020;
  --calc-amber-bg-dark: #2e2614;
  --calc-amber-active-fill: #f0c040;
  --calc-amber-active-text: #0d0f0d;
  --calc-shift-cream: #fff4d6;
  --calc-shift-bg: #2e2614;
  --calc-shift-placeholder-bg: #3d2e10;
  --calc-placeholder-bg: #1a3528;
  --calc-red-text: #ffb8b8;
  --calc-red-bg-ac: #3a2424;
  --calc-red-bg-del: #2e2424;
  --calc-op-bg: #1e3a2a;
  --calc-op-border: #2a4d3a;
  --calc-key-border: #3a3d3a;
  --calc-display-bg: #0d0f0d;

  /* v15 layout: 520×800 with 88% scale-down option for low-res
   * recording canvases. Width/height live on the wrap so the
   * calc-p panel's free-drag/resize anchors stay at outer .wp. */
  width: 520px;
  /* The legacy panel is height:auto; let v2 follow the same
   * pattern but cap at 800px so a 520-wide rectangle settles into
   * the v15 proportions without overflowing taller laptops. */
  max-height: 800px;
  background: var(--s5, #242624);
  /* Top corners square to meet flat-bottom drag bar; bottom
   * corners 11px to match #calc-p clip. See calculator.css:62
   * for the legacy contract this honors — v15 redesign
   * regressed it, this restores it. */
  border-radius: 0 0 11px 11px;
  padding: 8px 10px 10px;
  box-sizing: border-box;
  /* All v2 typography overrides scope from here. */
  font-family: Manrope, ui-sans-serif,system-ui,sans-serif;
}
.calc-v2.calc-fs {
  /* Fullscreen recording mode: existing path adds .calc-fs and an
   * outer scale transform via the wrapper. v2's intrinsic 520
   * scales naturally — no extra rules needed. */
  width: 520px;
}

/* ── Header (Zone 0) ──────────────────────────────────────────── */
.calc-v2-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 4px;
  margin-bottom: 6px;
}
.calc-v2-hdr-l { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.calc-v2-hdr-r { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; }
.calc-v2-brand {
  font-size: 11px; font-weight: 800; letter-spacing: 0.16em;
  color: var(--fg2);
  text-transform: uppercase;
}
.calc-v2-home {
  /* Reuse existing .calc-home-btn but tighten for v2 spacing. */
  width: 24px; height: 24px;
}

.calc-v2-seg {
  display: inline-flex;
  border: 1px solid var(--calc-key-border);
  border-radius: 999px;
  overflow: hidden;
  background: transparent;
}
.calc-v2-seg-btn {
  background: transparent;
  border: none;
  color: var(--fg3);
  padding: 4px 14px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background-color .12s, color .12s, border-color .12s;
  font-family: inherit;
}
.calc-v2-seg-btn:hover { color: var(--fg2); }
.calc-v2-seg-btn.on {
  /* Active segment: accent border + accent text + faint accent
   * fill. Matches the v15 mockup where DEG/BASIC read clearly as
   * the active option in their group. */
  background: rgba(190, 255, 220, 0.12);
  color: var(--accent, #beffdc);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* ── Display (Zone 1) ─────────────────────────────────────────── */
.calc-v2-display {
  background: var(--calc-display-bg);
  border: 1px solid var(--calc-op-border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  /* min-height removed — superseded by :not(.calc-fs) .calc-display
   * height: 160 below. See fix/calc-lock-size for why fixed pixel
   * sizing replaced the original cqi loop. */
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.calc-v2-format-badge {
  font-size: 12px;
  color: var(--calc-amber-text-light);
  font-weight: 600;
  margin-left: 6px;
  letter-spacing: 0.04em;
}

/* ── cqi-loop overrides (fix/calc-lock-size) ──────────────────
 * Fixed pixel overrides break the cqi feedback loop from
 * calculator.css:252-278 and calculator.css:317-348. Calc is
 * locked at 520px panel width (see calculator.css:13-26), so
 * cqi-driven sizing has no purpose here and was causing the
 * display strip to squish when the panel briefly grew past
 * 520. Values pinned to v15 spec (docs/calc-redesign/PATCH-
 * calc-ux-redesign-phase1.md, "Zone 1 — Display"). */
/* :not(.calc-fs) scopes these to non-fullscreen only. CR feedback:
 * the v2 stylesheet loads after calculator.css, so an unscoped
 * `.calc-v2 .calc-display` would tie on specificity with the
 * legacy `.calc-fs .calc-display { height: 320px }` and win on
 * cascade order, collapsing the fullscreen display back to
 * compact sizing. The fullscreen path has its own pixel-fixed
 * overrides at calculator.css:137 — we don't want to fight them. */
.calc-v2:not(.calc-fs) .calc-display {
  /* Legibility sweep: 130 → 160. Absorbs ~30px reclaimed from
   * toolbar + D-pad + numpad compression. Gives the active
   * input + result rows real vertical breathing room at
   * recording resolution. */
  height: 160px;
}
.calc-v2:not(.calc-fs) .calc-input {
  /* Spec: active input 19-20px ui-monospace,monospace, white. */
  font-size: 19px;
  min-height: 28px;
}
.calc-v2:not(.calc-fs) .calc-preview {
  /* Spec: history rows 13px ui-monospace,monospace, gray. */
  font-size: 13px;
  min-height: 16px;
}
.calc-v2:not(.calc-fs) .calc-result-value {
  /* Legibility sweep: result line 32 → 34. Display strip grew
   * to 160 to host this. */
  font-size: 34px;
}
.calc-v2:not(.calc-fs) .calc-result-expr {
  font-size: 13px;
}
.calc-v2:not(.calc-fs) .calc-hist-row {
  /* Per-row history font also clamp-driven in legacy. Lock
   * to spec's 13px ui-monospace,monospace. */
  font-size: 13px;
}

/* ── Utility row (Zone 2) ─────────────────────────────────────── */
.calc-v2-utility {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.calc-v2-pill {
  flex: 1;
  /* Legibility sweep: pills compressed 30→24, font 10→11.
   * SHIFT/SETUP/CATALOG/TOOLS/HOME/HELP are infrequent toggles
   * — reclaim vertical for the display strip below. */
  height: 24px;
  border-radius: 16px;
  border: 1px solid var(--calc-key-border);
  background: transparent;
  color: var(--accent, #beffdc);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em;
  cursor: pointer;
  font-family: inherit;
  transition: background-color .12s, color .12s, border-color .12s;
}
.calc-v2-pill:hover {
  background: rgba(190, 255, 220, 0.06);
  border-color: rgba(190, 255, 220, 0.4);
}
.calc-v2-pill--shift {
  background: var(--calc-amber-bg-dark);
  border-color: var(--calc-amber-outline);
  color: var(--calc-amber-text);
}
.calc-v2-pill--shift:hover {
  background: rgba(208, 160, 32, 0.18);
}
.calc-v2-pill--shift.on {
  background: var(--calc-amber-active-fill);
  color: var(--calc-amber-active-text);
}

/* ── Action row (Zone 3) ──────────────────────────────────────── */
.calc-v2-action {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: stretch;
}
.calc-v2-dpad {
  display: grid;
  grid-template-columns: 28px 28px 28px;
  /* Middle row stays slightly taller (24) than outer (22) so the
   * OK cell at 28w×24h still reads as a near-circle under
   * border-radius:999px. Legibility sweep: row heights
   * 26/28/26 → 22/24/22 to reclaim 12px for the display strip. */
  grid-template-rows: 22px 24px 22px;
  gap: 2px;
  /* max-content matches the column sum (88px) instead of the
   * legacy hardcoded 92px, which left 4px unaccounted. */
  width: max-content;
  flex-shrink: 0;
}
/* .ck is required on every D-pad button for _calcWireKeypad's
 * event delegation, but its legacy sizing (min-height clamp,
 * padding) is sized for the main keypad and overflows the
 * D-pad's tight grid cells — caused OK to collide with the
 * up/down arrows. This decouples sizing from routing for the
 * D-pad scope only. See PR fix/calc-dpad-collision. */
/* D-pad cells are 28×22 grid cells — the .ck legacy padding
 * (clamp 4-9px / 3-6px ≈ 8/5 at 520-wide) would overflow.
 * Affirmative zero. min-height is handled by the .calc-v2 .ck
 * root rule. */
.calc-v2-dpad .ck { padding: 0; }
.calc-v2-dbtn {
  background: transparent;
  border: 1px solid var(--calc-key-border);
  border-radius: 6px;
  color: var(--fg2);
  cursor: pointer;
  font-size: 10px; font-weight: 700;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  transition: background-color .12s, border-color .12s;
}
.calc-v2-dbtn:hover {
  background: rgba(190, 255, 220, 0.05);
  border-color: rgba(190, 255, 220, 0.3);
}
.calc-v2-dbtn--up    { grid-column: 2; grid-row: 1; }
.calc-v2-dbtn--left  { grid-column: 1; grid-row: 2; }
.calc-v2-dbtn--ok    { grid-column: 2; grid-row: 2; border-color: var(--accent); color: var(--accent); border-radius: 999px; }
.calc-v2-dbtn--right { grid-column: 3; grid-row: 2; }
.calc-v2-dbtn--down  { grid-column: 2; grid-row: 3; }
.calc-v2-dbtn .ms { font-size: 14px; line-height: 1; }

.calc-v2-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.calc-v2-act {
  flex: 1;
  border-radius: 6px;
  border: 1px solid var(--calc-key-border);
  background: transparent;
  color: var(--fg2);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  font-family: inherit;
  padding: 4px 6px;
  transition: background-color .12s, border-color .12s, color .12s;
}
.calc-v2-act:hover {
  background: rgba(190, 255, 220, 0.05);
  color: var(--accent);
}
.calc-v2-act--ghost { color: var(--accent); }
.calc-v2-act--ac {
  color: var(--calc-red-text);
  background: var(--calc-red-bg-ac);
  border-color: rgba(255, 184, 184, 0.18);
}
.calc-v2-act--ac:hover { background: rgba(255, 184, 184, 0.12); }
.calc-v2-act--del {
  color: var(--calc-red-text);
  background: var(--calc-red-bg-del);
  border-color: rgba(255, 184, 184, 0.14);
}
.calc-v2-act--del:hover { background: rgba(255, 184, 184, 0.08); }

/* ── Math zone (Zone 4) ───────────────────────────────────────── */
.calc-v2-math {
  display: flex;
  flex-direction: column;
  /* Legibility sweep: inter-row gap 6 → 4 to compensate for
   * the taller shift-band (14 → 18). Net math zone height
   * grows only slightly. */
  gap: 4px;
  margin-bottom: 8px;
}
.calc-v2-mathrow { display: flex; flex-direction: column; gap: 2px; }
.calc-v2-shift-band {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  /* Legibility sweep: band 14 → 18 to host the larger label
   * + sup/sub without clipping. */
  height: 18px;
}
.calc-v2-shift-lbl {
  /* Legibility sweep: label 11 → 13 so sup/sub at 0.8em no
   * longer drop below 10px (was 8.25px at 11×0.75). */
  font-size: 13px;
  font-weight: 500;
  font-style: italic;
  color: var(--calc-amber-text-light);
  text-align: center;
  line-height: 1;
}
/* Sup/sub in shift labels use explicit position offsets rather
 * than browser-default vertical-align: super/sub. At the 18px
 * band height + 13px label font-size (post-legibility-sweep
 * PR #122), the default super positioning floats the sup too
 * far above the rest of the label content — the user-reported
 * "superscript went too high" regression. position:relative
 * with controlled top offsets keeps the offset tight and
 * consistent regardless of band height; future band-height
 * changes won't reintroduce the regression.
 * See fix/calc-shift-band-sup-sub-positioning. */
.calc-v2-shift-lbl sup, .calc-v2-shift-lbl sub {
  font-size: 0.8em;
  position: relative;
  vertical-align: baseline;
}
.calc-v2-shift-lbl sup { top: -0.35em; }
.calc-v2-shift-lbl sub { top:  0.25em; }
.calc-v2-shift-lbl i { font-style: italic; }

.calc-v2-mathkeys {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}
.calc-v2-mathkey {
  height: 44px;
  background: #242624;
  border: 1px solid #2a2d2a;
  border-radius: 9px;
  color: var(--accent, #beffdc);
  /* Legibility sweep: primary math label 14 → 17. Brings the
   * most-used identifiers (sin/cos/tan, x²/xy, etc.) up to
   * near-numpad-digit weight so they read clearly at recording
   * resolution. */
  font-size: 17px; font-weight: 600;
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  transition: background-color .12s, border-color .12s, color .12s;
}
.calc-v2-mathkey:hover {
  background: #2a2d2a;
  border-color: rgba(190, 255, 220, 0.35);
}
/* Math typography rules (ISO 80000-2): function names UPRIGHT,
 * variables ITALIC. .calc-v2-fn is always upright; .calc-v2-fn-it
 * forces italic for variable letters. */
.calc-v2-mathkey .calc-v2-fn { font-style: normal; font-family: Manrope, ui-sans-serif,system-ui,sans-serif; font-weight: 600; }
.calc-v2-mathkey .calc-v2-fn-it { font-style: italic; font-family: 'Times New Roman', Times, serif; }
/* fix/calc-power-superscript-rendering: .calc-v2-mathkey is
 * `display: flex` (required for SVG icon centering on sqrt /
 * nroot buttons), so vertical-align on <sup>/<sub> children is
 * silently ignored — they render at the cross-axis center
 * alongside the rest of the label. Use flex-aware positioning
 * via align-self + a small negative margin so the sup rides at
 * the top of the cell and the sub sits at the bottom, producing
 * the visual superscript/subscript effect without dropping flex
 * layout. Used by x² / xʸ button labels (sup) and the mixed
 * a^b/c button (sup + sub). */
/* Mathkey sup/sub use explicit position offsets — same pattern
 * as .calc-v2-shift-lbl sup/sub (fix/calc-shift-band-sup-sub-
 * positioning). PR #125's flex-positioning approach
 * (align-self: flex-start/-end + line-height: 0 + negative
 * margins) collapsed the flex item's vertical extent to 0,
 * causing the glyph to render OUTSIDE button bounds — user-
 * reported "x with 2 floating above the button" / "log with ▫
 * floating below" regression. The position-relative + top-
 * offset approach decouples positioning from flex container
 * behavior and produces a controlled, predictable
 * superscript/subscript visual inside the button cell.
 * See fix/calc-mathkey-sup-sub-positioning. */
.calc-v2-mathkey sup, .calc-v2-mathkey sub {
  font-size: 0.7em;
  position: relative;
  vertical-align: baseline;
}
.calc-v2-mathkey sup { top: -0.4em; }
.calc-v2-mathkey sub { top:  0.3em; }
/* fix/calc-fraction-button-visual-cleanup: when .ct-frac /
 * .ct-mixed render inside a math button label (not the display
 * strip), keep them at the button-label scale. The base
 * .ct-frac uses font-size: 0.9em for inline-fraction context
 * inside a typed expression — applied to the button's 17px
 * label, that compounds to ~15px and the placeholders shrink
 * away. Display strip context still inherits 0.9em (no
 * .calc-v2-mathkey ancestor → this rule doesn't match). */
.calc-v2-mathkey .ct-frac  { font-size: 1em; }
.calc-v2-mathkey .ct-mixed { font-size: 1em; gap: 2px; }
.calc-v2-mathkey .calc-v2-rad {
  width: 38px; height: 22px;
  color: var(--accent);
}
.calc-v2-mathkey .calc-v2-ph {
  fill: var(--calc-placeholder-bg);
  stroke: var(--accent);
  stroke-width: 0.8;
  opacity: 0.85;
}

/* ── Numpad (Zone 5) ──────────────────────────────────────────── */
.calc-v2-numpad {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.calc-v2-numkey {
  /* Legibility sweep: numpad key height 44 → 40. Digits at
   * 18px fit cleanly in a 40px cell; reclaim 16px across 4
   * rows for the display strip. */
  height: 40px;
  background: #2a2d2a;
  border: 1px solid #2a2d2a;
  border-radius: 9px;
  color: #fff;
  font-size: 18px; font-weight: 600;
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background-color .12s, border-color .12s;
}
.calc-v2-numkey:hover {
  background: #34373a;
  border-color: rgba(190, 255, 220, 0.25);
}
.calc-v2-numkey--digit { /* default */ }
.calc-v2-numkey--op {
  background: var(--calc-op-bg);
  border-color: var(--calc-op-border);
  color: var(--accent);
}
.calc-v2-numkey--op:hover {
  background: #244a36;
  border-color: rgba(190, 255, 220, 0.5);
}
.calc-v2-numkey--mod {
  background: #242624;
  color: var(--accent);
  font-size: 13px;
}
.calc-v2-numkey--mod:hover { background: #2a2d2a; }
.calc-v2-numkey--mod sup { font-size: 0.7em; vertical-align: super; line-height: 0; }
.calc-v2-numkey--format {
  background: transparent;
  border: 1.4px solid var(--accent);
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  font-family: Manrope, ui-sans-serif,system-ui,sans-serif;
}
.calc-v2-numkey--format:hover {
  background: rgba(190, 255, 220, 0.08);
}
/* feat/calc-format-dms-render: .on visual when formatMode is
 * non-decimal (sticky FORMAT cycle). Solid accent fill mirrors
 * the .calc-v2-pill--shift.on pattern used by the SHIFT pill. */
.calc-v2-numkey--format.on {
  background: var(--accent, #beffdc);
  color: #0d0f0d;
  border-color: var(--accent, #beffdc);
}
.calc-v2-numkey--format.on:hover {
  filter: brightness(1.05);
}
/* DMS button .on — last history entry is currently displayed in
 * degrees-minutes-seconds form. Same pattern as FORMAT but
 * scoped to .calc-v2-mathkey since DMS lives in the math row. */
.calc-v2-mathkey.on {
  background: var(--accent, #beffdc);
  color: #0d0f0d;
  border-color: var(--accent, #beffdc);
}
.calc-v2-mathkey.on .calc-v2-fn,
.calc-v2-mathkey.on .calc-v2-fn-it {
  color: #0d0f0d;
}
.calc-v2-numkey--exe {
  background: linear-gradient(180deg, #beffdc 0%, #9be8be 100%);
  color: #0d0f0d;
  border-color: var(--accent);
  font-weight: 800;
  display: flex; flex-direction: column; gap: 2px;
}
.calc-v2-numkey--exe:hover { filter: brightness(1.05); }
.calc-v2-exe-eq { font-size: 18px; line-height: 1; }
.calc-v2-exe-l  { font-size: 9px; letter-spacing: 0.1em; }

/* ── SHIFT-active modal styling ───────────────────────────────── */
.calc-v2.shift-active .calc-v2-mathkey {
  background: var(--calc-shift-bg);
  border-color: var(--calc-amber-outline);
  color: var(--calc-shift-cream);
}
.calc-v2.shift-active .calc-v2-mathkey .calc-v2-fn,
.calc-v2.shift-active .calc-v2-mathkey .calc-v2-fn-it {
  color: var(--calc-shift-cream);
}
.calc-v2.shift-active .calc-v2-mathkey .calc-v2-rad {
  color: var(--calc-shift-cream);
}
.calc-v2.shift-active .calc-v2-mathkey .calc-v2-ph {
  fill: var(--calc-shift-placeholder-bg);
  stroke: var(--calc-amber-text-light);
}
.calc-v2.shift-active .calc-v2-shift-lbl {
  /* Brighten labels when SHIFT is armed so the secondary path
   * reads as the active one. */
  color: var(--calc-amber-text);
}

/* ── ADV placeholder (Step 5) ─────────────────────────────────── */
.calc-v2-adv-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
  color: var(--fg3);
}
.calc-v2-adv-msg {
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.04em;
}

/* ── Panel-overlay pattern (feat/calc-history-panel) ──────────
 * Body-swap surface that replaces the keypad zone when
 * CALC_STATE.activePanel is non-null. The HISTORY panel is the
 * first surface; future Phase 2 panels (SETUP / CATALOG / TOOLS
 * / HELP / VARS) reuse .calc-v2-panel + .calc-v2-panel-hdr +
 * the close-button convention. The .calc-v2-panel sits inside
 * .calc-v2-keypad which already has flex column + bottom-padding,
 * so the panel just claims that space via flex:1. */
.calc-v2-panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;          /* allow inner scroll containers to size */
  width: 100%;
  gap: 8px;
}
.calc-v2-panel-hdr {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--calc-key-border);
  flex-shrink: 0;
}
.calc-v2-panel-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--fg);
  margin-right: auto;
  text-transform: uppercase;
}
/* Clear / × buttons inherit .calc-v2-act styling but tighten
 * vertically inside the panel header so they match the title's
 * line height. Reuse the legacy .ck min-height neutralization
 * pattern from the D-pad fix to keep the pills compact. */
/* Panel header buttons (Clear / × close) — affirmative wider
 * horizontal padding so they read as compact pills next to the
 * panel title. min-height is handled by .calc-v2 .ck. */
.calc-v2-panel-hdr .ck { padding: 4px 10px; }
.calc-v2-panel-clear { font-size: 10px; }
/* Legibility sweep: × close font 14 → 13 so it visually aligns
 * with the panel title's 13px (was reading oversized).
 *
 * Padding intentionally NOT declared here — `.calc-v2-panel-hdr
 * .ck` at specificity 0,2,0 beats this rule's 0,1,0 and supplies
 * `padding: 4px 10px`. A prior `padding: 0 10px` on this rule
 * was silently dead via the same specificity loss (CR PR #121). */
.calc-v2-panel-close { font-size: 13px; line-height: 1; }

/* HISTORY panel — the first wired panel surface. */
.calc-v2-history-panel {
  /* No additional rules today; .calc-v2-panel covers layout.
   * Selector kept as a hook for future history-only tweaks. */
}
.calc-v2-history-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
  /* A subtle inner padding so the rows don't touch the panel
   * border on the right where the scrollbar appears. */
  padding-right: 2px;
}
.calc-v2-history-empty {
  text-align: center;
  color: var(--fg3, #888);
  padding: 24px 0;
  font-size: 13px;
  font-weight: 600;
}
.calc-v2-history-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border: 1px solid var(--calc-key-border);
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;
  font-size: 12px;
  cursor: pointer;
  text-align: left;
  /* min-height handled by .calc-v2 .ck root rule. */
  transition: background-color .12s, border-color .12s;
}
.calc-v2-history-row:hover {
  background: rgba(190, 255, 220, 0.06);
  border-color: rgba(190, 255, 220, 0.4);
}
.calc-v2-history-expr {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--fg);
}
.calc-v2-history-arrow {
  color: var(--fg3, #888);
  flex-shrink: 0;
}
.calc-v2-history-val {
  flex-shrink: 0;
  color: var(--accent, #beffdc);
  font-weight: 600;
  max-width: 40%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* CATALOG panel (feat/calc-catalog-panel) — reuses
 * .calc-v2-panel + .calc-v2-panel-hdr from the HISTORY panel.
 * Adds search input + 3-column row grid (label / syntax /
 * category badge). */
.calc-v2-catalog-search {
  width: 100%;
  padding: 6px 10px;
  margin-bottom: 6px;
  border: 1px solid var(--calc-key-border);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--fg);
  font-family: inherit;
  font-size: 12px;
  box-sizing: border-box;
  flex-shrink: 0;
}
.calc-v2-catalog-search:focus {
  outline: none;
  border-color: var(--accent, #beffdc);
  background: rgba(190, 255, 220, 0.05);
}
.calc-v2-catalog-search::placeholder {
  color: var(--fg3, #888);
}
.calc-v2-catalog-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 2px;
}
.calc-v2-catalog-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid var(--calc-key-border);
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  text-align: left;
  /* min-height handled by .calc-v2 .ck root rule. */
  transition: background-color .12s, border-color .12s;
}
.calc-v2-catalog-row:hover {
  background: rgba(190, 255, 220, 0.06);
  border-color: rgba(190, 255, 220, 0.4);
}
.calc-v2-catalog-label {
  color: var(--fg);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.calc-v2-catalog-syntax {
  font-family: 'JetBrains Mono', Menlo, ui-monospace,monospace;

/* features/calc/calc-core.js — Expression evaluator for HGL calculator
   Lightweight shunting-yard + RPN evaluator supporting:
     - binary ops: + - * / ^; postfix percentage: %
     - unary prefix: -
     - functions: sin cos tan asin acos atan sinh cosh tanh log ln exp sqrt

     - factorial postfix: !

   Results are returned as { ok, value, decimal, error }.
   `decimal` is a human-friendly string (9 sig figs, strips trailing zeros).

/** Own-property check — prevents inherited prototype names like 'constructor',
 *  'toString', 'hasOwnProperty' from being treated as valid calculator names. */
const _calcHasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);

/** Global calculator state. */
const CALC_STATE = {
  // PR-4 (feedback #8): 'home' is the landing mode. togCalc force-
  // resets this on every open, so the value here only matters for
  // the brief window between module load and first togCalc call;
  // keeping it on 'home' means a stray pre-open calcRenderUI (tests,
  // a future HUD widget) renders the mode selector rather than a
  // blank Calculate with no persisted history.
  mode:      'home',             // active mode key
  history:   [],                 // [{input, value, decimal}]
  current:   '',                 // live input expression (flattened string)
  shift:     false,              // SHIFT modifier latch
  alpha:     false,              // ALPHA modifier latch

  fractions: true,               // MathI/MathO output (true) vs MathI/DecimalO (false)
